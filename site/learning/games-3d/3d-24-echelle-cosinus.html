/** Les montants et barreaux de l'échelle, pour la longueur L courante. */
function construireEchelle() {
  while (echelle.children.length) { const c = echelle.children.pop(); if (c.geometry) c.geometry.dispose(); }
  if (!boisEchelle) { boisEchelle = M.pbr('brown_planks_09', { couleur: 0xd9a86c, repetition: 1, rugosite: 0.75 }); caoutchouc = M.mat(0x1d1d1d, { rugosite: 0.9 }); }
  const bois = boisEchelle; const caout = caoutchouc;
  const montant = (z) => { const m = new THREE.Mesh(M.preparerAo(new THREE.BoxGeometry(0.09, L, 0.045)), bois); m.position.set(0, L / 2, z); m.castShadow = true; m.receiveShadow = true; echelle.add(m); };
  montant(-0.24); montant(0.24);
  const n = Math.round(L / 0.3);
  for (let i = 1; i < n; i += 1) { const b = new THREE.Mesh(M.preparerAo(new THREE.CylinderGeometry(0.018, 0.018, 0.48, 10)), bois); b.rotation.x = Math.PI / 2; b.position.set(0, i * L / n, 0); b.castShadow = true; echelle.add(b); }
  for (const z of [-0.24, 0.24]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.07), caout); p.position.set(0, 0.03, z); p.castShadow = true; echelle.add(p); const h = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.05, 0.06), caout); h.position.set(0, L - 0.03, z); echelle.add(h); }

function basculerCote(actif) {

function placer() {

function majPanneau() {

function demarrer(mode, api) {

    { type: 'verifier', texte: 'Règle l\'échelle de 5 m pour atteindre au moins 4,5 m de haut.', bouton: 'C\'est réglé', avant: cinq, verifier: () => hauteur() >= 4.5, indice: 'Plus le pied est proche du mur, plus l\'échelle monte. Il faut d ≤ 2,18 m.', explication: 'h ≥ 4,5 impose d² ≤ 25 − 20,25 = 4,75, donc d ≤ 2,18 m environ.' },
    { type: 'qcm', texte: 'Le pied est à 4 m du mur : cos α = 4 ÷ 5 = 0,8. Quel est l\'angle α ?', choix: ['Environ 37°', 'Environ 53°', '80°', '45°'], reponse: 0, explication: 'α = cos⁻¹(0,8) ≈ 36,9°. La touche cos⁻¹ (ou arccos) de la calculatrice donne l\'angle à partir du cosinus.' },
    { type: 'toucher', texte: 'Touche le <b>côté adjacent</b> à l\'angle α.', cible: 'Côté adjacent', explication: 'Le côté adjacent touche l\'angle α sans être l\'hypoténuse : ici, le sol entre le pied et le mur.' },
    { type: 'qcm', texte: 'Le pied est à 2 m du mur et L = 5 m : cos α = 2 ÷ 5 = 0,4. L\'angle α vaut environ…', choix: ['66°', '24°', '40°', '50°'], reponse: 0, explication: 'cos⁻¹(0,4) ≈ 66,4°. Plus le pied est proche du mur, plus le cosinus est petit et plus l\'angle est grand : l\'échelle est plus raide.' },
    { type: 'verifier', texte: 'Règle l\'échelle de 5 m à l\'angle de sécurité des pompiers : 75°, à 2° près.', bouton: 'C\'est réglé', avant: cinq, verifier: () => Math.abs(angle() - 75) <= 2, indice: 'cos 75° ≈ 0,26, donc d ≈ 0,26 × 5 ≈ 1,3 m. Le curseur « Angle α » fait le calcul pour toi.', explication: 'd = L × cos 75° ≈ 5 × 0,259 ≈ 1,3 m. C\'est la règle du quart : le pied à environ un quart de la hauteur atteinte (ici h ≈ 4,8 m, un quart ≈ 1,2 m).' },
