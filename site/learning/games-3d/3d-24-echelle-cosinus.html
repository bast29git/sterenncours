/* Yann parle : bulle au-dessus de sa tête, voix d'Opale. */
function parler(texte, secondes) { if (peintre) peintre.dire(couper(texte, 30), secondes || 4); else shell.say(texte, 'concentre'); }
/* Coupe une phrase en lignes d'au plus n caractères, pour la bulle. */
function couper(texte, n) { const mots = String(texte).split(' '); const lignes = ['']; mots.forEach((m) => { if ((lignes[lignes.length - 1] + ' ' + m).trim().length > n) lignes.push(m); else lignes[lignes.length - 1] = (lignes[lignes.length - 1] + ' ' + m).trim(); }); return lignes.join('\n'); }

/* ---------- La mission ---------- */
function lancerMission() {
  if (!mission || grimpe || (fenetreCourante >= 0 && !mission.estFinie())) return;
  essais = 0; fenetreCourante = -1;
  panneau.querySelector('#ec-mission-avant').hidden = true; panneau.querySelector('#ec-mission-pendant').hidden = false;
  if (etroit()) { ['ec-det-calc', 'ec-det-vues'].forEach((id) => { panneau.querySelector('#' + id).open = false; }); }
  mission.commencer(); mission.montrer();
  parler('Trois fenêtres à repeindre. Pose-moi l\'échelle devant chacune, entre 65° et 75°, et je monte.', 5);
  setTimeout(() => lancerFenetre(0), 2200);
}
function lancerFenetre(i) {

  FEN[f.id].cadre.emissive.set(0xF5A623); FEN[f.id].cadre.emissiveIntensity = 0.35;
  parler(f.texte, 6); M.son('cloche', { volume: 0.16, frequence: 988 });

/* Le bouton « Valider » : Yann accepte ou refuse, et dit pourquoi. */
function validerFenetre() {

  else if (Math.abs(zE - f.z) > 0.8) refus = `L'angle est bon, mais l'échelle n'est pas devant la fenêtre : glisse-la le long du mur, vers ${f1(f.z)} m.`;
  else if (h < f.hmin) refus = `Le haut n'est qu'à ${f2(h)} m, il en faut au moins ${f1(f.hmin)}. Une échelle plus longue, sans dépasser 75°.`;

  parler(`${Math.round(a)}° et ${f2(h)} m : c'est bien posé, je monte.`, 4);

}
/* La montée : Yann va au pied, grimpe le long de l'échelle, peint, redescend. */
function animerGrimpe(dt, t) {
  if (!grimpe) return; dt *= accel; const G = grimpe; const g = peintre.groupe; const m = peintre.membres;
  const pied = new THREE.Vector3(G.d + 0.32 * G.h / G.L, 0.32 * G.d / G.L, G.zE); // sur le premier barreau, un peu en avant de l'échelle
  if (G.phase === 0) {
    if (G.t === 0) { peintre.allerA([pied.x + 0.25, 0, G.zE + 0.1], 1.6); G.t = 0.001; }
    if (accel > 1) { g.position.set(pied.x + 0.25, 0, G.zE + 0.1); peintre.allerA([pied.x + 0.25, 0, G.zE + 0.1]); }
    const p = peintre.position(); if (Math.hypot(p.x - (pied.x + 0.25), p.z - (G.zE + 0.1)) < 0.12) { G.phase = 1; G.t = 0; g.rotation.y = -Math.PI / 2; }

  if (G.phase === 1) {
    G.t += dt / 3.2; const k = Math.min(1, G.t) * haut; g.position.copy(pos(k)); g.rotation.y = -Math.PI / 2;
    const ph = G.t * 14; m.jambeG.rotation.x = -0.7 + Math.sin(ph) * 0.45; m.jambeD.rotation.x = -0.7 - Math.sin(ph) * 0.45; m.brasG.rotation.x = -2.2 + Math.sin(ph) * 0.3; m.brasD.rotation.x = -2.2 - Math.sin(ph) * 0.3;
    if (Math.floor(ph / Math.PI) !== Math.floor((ph - dt * 14 / 3.2) / Math.PI)) M.son('pas', { volume: 0.08 });

  } else if (G.phase === 2) {
    G.t += dt / 2.6; g.position.copy(pos(haut)); m.jambeG.rotation.x = -0.7; m.jambeD.rotation.x = -0.7; m.brasG.rotation.x = -2.0;
    m.brasD.rotation.x = -2.6 + Math.sin(t * 9) * 0.35; m.brasD.rotation.z = -0.3 + Math.sin(t * 4.5) * 0.25;
    const f = FEN[FENETRES[G.fenetre].id]; f.volets.color.lerp(new THREE.Color(0x3b6e8f), Math.min(1, dt * 1.2)); f.cadre.color.lerp(new THREE.Color(0xf8f6f0), Math.min(1, dt * 1.2));

function finMission(reussie, secondes, score) {

  else { shell.say(`Trois fenêtres repeintes en ${mm} min ${ss}.`, 'fier'); setTimeout(() => shell.win({ score, stars: secondes <= 240 ? 3 : 2, title: `Trois fenêtres à repeindre : réussi en ${mm}:${ss}`, detail: { mission: 'Trois fenêtres à repeindre', secondes: Math.round(secondes) }, buddy: 'Trois fenêtres repeintes, l\'échelle toujours entre 65° et 75°.' }), 4200); }
}
function demarrer(mode, api) {
