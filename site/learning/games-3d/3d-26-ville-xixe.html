<script type="module">
import { creerMonde, THREE, textureTexte } from '../monde-base.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const LEGENDES = [
  { nom: 'Immeuble haussmannien', phrase: 'Cinq étages, balcons filants au deuxième et au cinquième, pierre de taille, toit de zinc : la ville nouvelle, régulière, monumentale.' },

  { nom: 'Foule', phrase: 'Le flâneur s\'y perd et l\'observe : elle fascine et menace, anonyme et vivante.' },

];
const leg = (nom) => LEGENDES.find((l) => l.nom === nom).phrase;
const TEXTES = {
  passant: {
    jour: ['À hauteur d\'homme, en plein jour : les pavés, les roues du fiacre qui frôlent, la foule qui bouscule, l\'odeur du gaz et du crottin. Le texte dit les sensations, au présent.', 'Énumération des sensations'],

    soir: ['D\'en haut, au couchant : la ville « s\'étire » et « respire », ses lumières s\'allument comme des yeux qui s\'ouvrent.', 'Personnification'],

/* Les cinq détails du regard du passant : un texte au présent, l'objet à toucher, un point où se tenir. */
const DETAILS = [

  { id: 'reverbere', cible: 'Réverbère à gaz', court: 'Un bec de gaz qui attend l\'allumeur', texte: 'Un bec de gaz attend l\'allumeur. Sa lanterne de verre s\'éclaire à peine : la nuit vient, et le boulevard va changer de visage.', rayon: 6, point: [6.2, 2.2, -16], poste: [7.9, -14.6] },
  { id: 'gare', cible: 'Gare', court: 'Une horloge sous une arche de fer et de verre', texte: 'Au bout du boulevard, une horloge sous une arche de fer et de verre. Derrière, les trains fument : la ville respire par là.', rayon: 22, point: [0, 2.8, -42.96], poste: [0.6, -36] },
];
const CRIS = ['Le Petit Journal ! Un sou !', 'Le grand magasin ouvre ses portes ! Lisez !', 'La nouvelle gare inaugurée ! Un sou !', 'Tous les feuilletons ! Dernière livraison !', 'Les nouvelles du soir ! Demandez le journal !'];
let regard = 'passant'; let position = 0; let heure = 0;
let M, panneau, fiacre, tram, chevaux = [], foule = null, lampes = {}, lumieresNuit = [], lumieresMagasin = [], fenetresAllumees, vitrines, archeGare, dome, hemi, contreJour, etoiles, fumee, zinc;

/* ---------- petits outils ---------- */
function uv(geo, su, sv) { const a = geo.attributes.uv; for (let i = 0; i < a.count; i += 1) a.setXY(i, a.getX(i) * su, a.getY(i) * sv); a.needsUpdate = true; return geo; }
const _m4 = new THREE.Matrix4(); const _p = new THREE.Vector3(); const _q = new THREE.Quaternion(); const _s = new THREE.Vector3(); const _e = new THREE.Euler();
function instancier(geo, materiau, n, nom) { const m = new THREE.InstancedMesh(geo, materiau, n); m.castShadow = true; m.receiveShadow = true; m.userData.n = 0; if (nom) M.legender(m, nom, leg(nom)); M.scene.add(m); return m; }
function poser(m, x, y, z, ry, sx, sy, sz) { _p.set(x, y, z); _e.set(0, ry || 0, 0); _q.setFromEuler(_e); const s0 = sx == null ? 1 : sx; _s.set(s0, sy == null ? s0 : sy, sz == null ? s0 : sz); _m4.compose(_p, _q, _s); m.setMatrixAt(m.userData.n, _m4); m.userData.n += 1; }
function finaliser(m) { m.count = m.userData.n; m.instanceMatrix.needsUpdate = true; return m; }
function canevas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return { c, x: c.getContext('2d'), t }; }
const hasard = (() => { let s = 7; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; })();
const lerp3 = (a, b, c, t) => (t < 0.5 ? new THREE.Color(a).lerp(new THREE.Color(b), t * 2) : new THREE.Color(b).lerp(new THREE.Color(c), (t - 0.5) * 2));
const lerp3n = (a, b, c, t) => (t < 0.5 ? a + (b - a) * t * 2 : b + (c - b) * (t - 0.5) * 2);

function init() {

    fond: null, hdri: '../assets/3d/env/sky_day_1k.hdr', environnement: 0.9, ciel: { haut: 0x3570c4, horizon: 0xdfe6ee, bas: 0x7d8690 },

}

/* ---------- chaussée pavée, trottoirs, bordures, rails, plaques ---------- */
function construireBoulevard() {
  const { mesh, mat, meshPBR, legender } = M; const LONG = 88;
  const chaussee = meshPBR(uv(new THREE.BoxGeometry(12, 0.1, LONG), 12 / 2.2, LONG / 2.2), 'cobblestone_floor_08', { repetition: 1, couleur: 0xb9b4aa, rugosite: 0.95 }, [0, 0.02, -2]); chaussee.castShadow = false; legender(chaussee, 'Boulevard', leg('Boulevard'));
  [-8.5, 8.5].forEach((x) => {
    const t = meshPBR(uv(new THREE.BoxGeometry(5, 0.18, LONG), 5 / 2.5, LONG / 2.5), 'asphalt_02', { repetition: 1, couleur: 0xa8a39a, rugosite: 1 }, [x, 0.09, -2]); t.castShadow = false; legender(t, 'Boulevard', leg('Boulevard'));
    const bordure = mesh(new THREE.BoxGeometry(0.3, 0.2, LONG), mat(0x8d8a82, { rugosite: 0.9 }), [x - Math.sign(x) * 2.5 + Math.sign(x) * 0.15, 0.1, -2]); bordure.castShadow = false;
  });
  // les rails du tramway, à gauche de la chaussée
  const rail = mat(0x6a6f76, { rugosite: 0.35, metal: 0.9 });
  [-3.72, -2.28].forEach((x) => mesh(new THREE.BoxGeometry(0.08, 0.04, LONG), rail, [x, 0.09, -2]).castShadow = false);
  for (let z = -24; z <= 24; z += 16) { const p = mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.04, 20), mat(0x3a3a3a, { metal: 0.6, rugosite: 0.5 }), [4.5, 0.09, z]); legender(p, 'Plaque d\'égout', leg('Plaque d\'égout')); }
  // passage clouté et caniveaux : quelques détails au sol
  for (let k = 0; k < 10; k += 1) mesh(new THREE.BoxGeometry(0.5, 0.012, 2.4), mat(0xe8e2d2, { rugosite: 0.9 }), [-5.4 + k * 1.2, 0.077, 10]).castShadow = false;
}

/* ---------- les immeubles haussmanniens : seize façades régulières, tout en maillages instanciés ---------- */
function construireImmeubles() {
  const { mesh, mat, meshPBR, pbr, legender, preparerAo } = M;
  const H = 18.2; const N = 8; const teintes = [0xe0d3b6, 0xd8c9a9, 0xe6dac1, 0xd2c3a2];
  const geoFacade = preparerAo(uv(new THREE.BoxGeometry(8, H, 9), 8 / 2.6, H / 2.6));
  const matsFacade = teintes.map((c) => pbr('plastered_wall_02', { repetition: 1, couleur: c, rugosite: 0.9 }));
  const corps = teintes.map((c, i) => instancier(geoFacade, matsFacade[i], 8, 'Immeuble haussmannien'));
  // le toit à la Mansart : un trapèze extrudé, en zinc
  const forme = new THREE.Shape(); forme.moveTo(-4.7, 0); forme.lineTo(4.7, 0); forme.lineTo(3.6, 2.2); forme.lineTo(-3.6, 2.2); forme.closePath();
  const geoToit = new THREE.ExtrudeGeometry(forme, { depth: 8, bevelEnabled: false }); geoToit.translate(0, 0, -4);
  const toits = instancier(geoToit, zinc, 2 * N, 'Immeuble haussmannien');
  const verre = new THREE.MeshPhysicalMaterial({ color: 0x1c2733, roughness: 0.08, metalness: 0.4, emissive: 0xffb75a, emissiveIntensity: 0 });
  const verreSombre = new THREE.MeshPhysicalMaterial({ color: 0x141b24, roughness: 0.1, metalness: 0.4 });
  fenetresAllumees = instancier(new THREE.PlaneGeometry(1.1, 2.1), verre, 2 * N * 20, 'Immeuble haussmannien');
  const fenetresSombres = instancier(new THREE.PlaneGeometry(1.1, 2.1), verreSombre, 2 * N * 20, 'Immeuble haussmannien');
  const pierre = mat(0xe9dfc8, { rugosite: 0.85 });
  const cadres = instancier(new THREE.BoxGeometry(0.12, 2.4, 1.4), pierre, 2 * N * 20, 'Immeuble haussmannien');
  const linteaux = instancier(new THREE.BoxGeometry(0.22, 0.18, 1.7), pierre, 2 * N * 20, 'Immeuble haussmannien');
  const dalles = instancier(new THREE.BoxGeometry(0.7, 0.14, 8), pierre, 2 * N * 2, 'Immeuble haussmannien');
  const corniches = instancier(new THREE.BoxGeometry(0.35, 0.3, 8.3), pierre, 2 * N * 2, 'Immeuble haussmannien');
  const fer = mat(0x1f2328, { rugosite: 0.5, metal: 0.6 });
  // la rambarde : une texture de fer forgé découpée
  const rb = canevas(1024, 128); rb.x.clearRect(0, 0, 1024, 128); rb.x.fillStyle = '#15171a'; rb.x.fillRect(0, 0, 1024, 8); rb.x.fillRect(0, 120, 1024, 8);
  for (let x = 8; x < 1024; x += 14) rb.x.fillRect(x, 0, 3, 128); rb.x.lineWidth = 3; rb.x.strokeStyle = '#15171a';
  for (let x = 0; x < 1024; x += 56) { rb.x.beginPath(); rb.x.arc(x + 28, 64, 22, 0, Math.PI * 2); rb.x.stroke(); rb.x.beginPath(); rb.x.arc(x + 28, 64, 10, 0, Math.PI * 2); rb.x.stroke(); }
  rb.t.needsUpdate = true; rb.t.wrapS = THREE.RepeatWrapping; rb.t.repeat.set(2, 1);
  const rambardes = instancier(new THREE.PlaneGeometry(8, 0.95), new THREE.MeshStandardMaterial({ map: rb.t, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.5, metalness: 0.6, color: 0xffffff }), 2 * N * 2, 'Immeuble haussmannien');
  rambardes.castShadow = false;
  const lucarnes = instancier(new THREE.BoxGeometry(0.9, 1.0, 1.0), mat(0x5a6470, { rugosite: 0.6, metal: 0.4 }), 2 * N * 2, 'Immeuble haussmannien');
  const brique = pbr('red_brick_03', { repetition: 1, couleur: 0xd9a98e, rugosite: 0.9 });
  const cheminees = instancier(preparerAo(uv(new THREE.BoxGeometry(0.7, 1.4, 1.0), 1, 1.4)), brique, 2 * N * 2, 'Immeuble haussmannien');
  const mitres = instancier(new THREE.CylinderGeometry(0.11, 0.14, 0.5, 10), mat(0xa65e3b, { rugosite: 0.9 }), 2 * N * 4, 'Immeuble haussmannien');
  const boutiques = instancier(preparerAo(uv(new THREE.BoxGeometry(0.35, 3.6, 8.2), 8.2 / 1.5, 3.6 / 1.5)), pbr('brown_planks_09', { repetition: 1, couleur: 0x3b2f27, rugosite: 0.7 }), 2 * N, 'Immeuble haussmannien');
  vitrines = instancier(new THREE.PlaneGeometry(2.4, 2.4), new THREE.MeshPhysicalMaterial({ color: 0x25333f, roughness: 0.05, metalness: 0.2, emissive: 0xffc27a, emissiveIntensity: 0 }), 2 * N * 2, 'Immeuble haussmannien');
  const portes = instancier(new THREE.PlaneGeometry(1.0, 2.6), mat(0x2a2017, { rugosite: 0.7 }), 2 * N, 'Immeuble haussmannien');
  const ENSEIGNES = ['BOULANGERIE', 'CAFÉ DE LA GARE', 'MODES', 'PHARMACIE', 'LIBRAIRIE', 'CHAPELIER', 'CRÉMERIE', 'TABAC'];
  const store = canevas(256, 128); for (let k = 0; k < 8; k += 1) { store.x.fillStyle = k % 2 ? '#f3ede0' : '#8a2b35'; store.x.fillRect(k * 32, 0, 32, 128); } store.t.needsUpdate = true; store.t.wrapS = THREE.RepeatWrapping; store.t.repeat.set(2, 1);
  const matStore = new THREE.MeshStandardMaterial({ map: store.t, roughness: 0.9, side: THREE.DoubleSide });
  let e = 0;
  for (let i = 0; i < N; i += 1) {
    for (const cote of [-1, 1]) {
      const zc = -28 + i * 8; const xc = cote * 15.5; const ry = -cote * Math.PI / 2; const idx = (i + (cote > 0 ? 1 : 0)) % 4;
      poser(corps[idx], xc, H / 2, zc); poser(toits, xc, H, zc);
      for (let k = 1; k <= 5; k += 1) {
        const yb = 4.2 + (k - 1) * 2.8; const yf = yb + 1.25;
        for (const dz of [-3, -1, 1, 3]) {

  for (const zz of [-20, -4, 12, 28]) for (const bx of [-8.2, 8.2]) if (Math.abs(x - bx) < 0.55 && Math.abs(z - zz) < 1.15) return true;

  if (Math.hypot(x - 8.5, z - 22) < 1.2) return true;

    aide: 'Flèches ou ZQSD pour marcher, Maj pour courir, glisse pour regarder. Échap : vue libre.',
    surPas: (dt) => { pasAcc += dt; if (pasAcc > 0.46) { pasAcc = 0; M.son('pas', { volume: 0.07 }); } },
    surChangement: (actif) => { document.body.classList.toggle('vi-marche', actif); const b = panneau && panneau.querySelector('#vi-marcher'); if (b) { b.setAttribute('aria-pressed', String(actif)); b.textContent = actif ? 'Vue libre (Échap)' : 'Marcher sur le trottoir'; } if (!actif) placerCamera(true); },
  });
  // pendant la marche, les flèches et ZQSD sont au marcheur : la coquille ne tourne pas la scène et ne change pas la qualité
  window.addEventListener('keydown', (e) => { if (!marche.estActif() || e.ctrlKey || e.metaKey || e.altKey) return; if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if (/^(Arrow(Up|Down|Left|Right)|[zqsdwaZQSDWA]|Shift)$/.test(e.key)) e.preventDefault(); if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); marche.desactiver(); } }, true);
}

/* ---------- la mission : cinq détails décrits au présent, à retrouver en marchant ---------- */
function construireMission() {
  mission = M.mission({
    titre: 'Le regard du passant', chrono: true, chronoCible: 240, gagner: false, cachee: true,
    intro: 'Mission : marche sur le trottoir et retrouve les cinq détails que le texte décrit. Touche chacun quand tu es tout près. La nuit tombe pendant que tu cherches.',
    objectifs: DETAILS.map((d) => ({ id: d.id, texte: d.court })),
    surFin: finMission,
  });
}
function lancerMission() {
  if (missionActive || !mission) return;
  trouve = {}; missionActive = true; lanceMission = true; journalLu = M.socle.journal.length;
  if (regard !== 'passant') changerRegard('passant');
  if (!marche.estActif()) marche.activer([7.4, 0, 26]);
  heure = 0.08; panneau.querySelector('#vi-heure').value = Math.round(heure * 100); appliquerHeure(); majTexte();
  mission.montrer(); mission.commencer(); majDetail();
  const b = panneau.querySelector('#vi-mission'); b.disabled = true; b.textContent = 'Mission en cours';
  if (window.matchMedia('(max-width: 720px)').matches) replier(true);
}
function majDetail() {
  const el = panneau.querySelector('#vi-detail'); const d = DETAILS.find((x) => !trouve[x.id]);
  if (!missionActive || !d) { el.hidden = true; return; }
  const k = DETAILS.indexOf(d) + 1; el.hidden = false; el.innerHTML = '<small>Détail ' + k + ' sur 5 : le texte dit</small>' + d.texte.replace(/</g, '&lt;');
}
function distanceA(d) {
  const c = M.camera.position; let best = Infinity;
  if (d.id === 'reverbere') { for (let zz = -24; zz <= 32; zz += 8) for (const lx of [-6.2, 6.2]) best = Math.min(best, Math.hypot(c.x - lx, c.z - zz)); return best; }
  if (d.id === 'colonne') return Math.min(Math.hypot(c.x - 8.5, c.z + 6), Math.hypot(c.x + 8.5, c.z - 14));
  if (d.id === 'gare') return Math.hypot(c.x, c.z + 43);
  if (d.id === 'enseigne') return Math.hypot(Math.max(0, c.x - 11), c.z - 38);
  return Math.hypot(c.x - d.point[0], c.z - d.point[2]);
}
function traiterToucher(nom) {
  const d = DETAILS.find((x) => !trouve[x.id]); if (!d) return;
  if (nom === d.cible) {
    const dist = distanceA(d);
    if (dist > d.rayon) { apiJeu.toast('C\'est bien ça, mais le passant regarde de près : approche-toi encore (' + Math.round(dist) + ' m).', 2600); M.son('tic', { volume: 0.12 }); return; }
    trouve[d.id] = true; mission.valider(d.id, 100); majDetail();
    const suivant = DETAILS.find((x) => !trouve[x.id]);
    if (suivant) apiJeu.say('Trouvé. Détail suivant : ' + suivant.texte, 'fier');
  } else if (DETAILS.some((x) => x.cible === nom)) { apiJeu.toast('Ça, c\'est : ' + nom + '. Le texte décrit autre chose, relis-le.', 2400); }
}
function finMission(reussie, secondes, score) {
  missionActive = false; majDetail();
  const mmss = String(Math.floor(secondes / 60)).padStart(2, '0') + ':' + String(Math.floor(secondes % 60)).padStart(2, '0');
  const etoiles = reussie ? (secondes <= 240 ? 3 : 2) : 1;
  [0, 900, 1800].forEach((ms) => setTimeout(() => M.son('cloche', { volume: 0.18, frequence: 660 }), ms));
  const b = panneau.querySelector('#vi-mission'); b.disabled = false; b.textContent = 'Rejouer la mission';
  if (modeJeu === 'detente') { apiJeu.win({ score, stars: etoiles, title: 'Le regard du passant : cinq détails en ' + mmss, detail: { mission: 'regard-du-passant', secondes: Math.round(secondes), trouves: Object.keys(trouve) }, buddy: 'Tu as regardé la ville comme le passant : de près, détail après détail, jusqu\'à la nuit.' }); }
  else { apiJeu.addScore(etoiles * 50); apiJeu.say('Mission réussie en ' + mmss + '. Les défis continuent : regarde la ville de nuit.', 'fier'); apiJeu.toast('Mission réussie en ' + mmss + '.', 3000); setTimeout(() => { if (!missionActive) mission.cacher(); }, 9000); }
}
function replier(oui) { panneau.classList.toggle('vi-replie', oui); const b = panneau.querySelector('.vi-pli'); b.textContent = oui ? 'Déplier' : 'Replier'; b.setAttribute('aria-expanded', String(!oui)); }

/* ---------- le panneau ---------- */
function construirePanneau() {
  panneau = M.panneau(`<div class="vi-tete"><h3>Le regard</h3><button class="vi-pli" type="button" aria-expanded="true">Replier</button></div>
    <p class="mb-carte vi-detail" id="vi-detail" hidden></p>
    <div class="vi-corps">
    <div class="mb-groupe" role="group" aria-label="Regard"><button class="mb-bouton" type="button" data-regard="passant" aria-pressed="true">Regard du passant</button><button class="mb-bouton" type="button" data-regard="panoramique" aria-pressed="false">Regard panoramique</button></div>
    <button class="mb-bouton" type="button" id="vi-marcher" aria-pressed="false">Marcher sur le trottoir</button>
    <button class="mb-bouton primaire" type="button" id="vi-mission">Mission : le regard du passant</button>
    <label>Avancer sur le boulevard <input class="mb-plage" id="vi-pos" type="range" min="0" max="100" step="1" value="0" aria-label="Position sur le boulevard"></label>
    <label>L'heure <span class="mb-val" id="vi-h">Midi</span><input class="mb-plage" id="vi-heure" type="range" min="0" max="100" step="1" value="0" aria-label="Heure de la journée, du midi à la nuit"></label>
    <p class="mb-carte" id="vi-texte"></p>
    <details class="vi-details"><summary>Les mots de la leçon</summary>
      <p><b>Personnification</b> : « la ville tend ses bras ». La ville agit comme une personne.</p>
      <p><b>Énumération</b> : toits, cheminées, dômes, clochers, fumées. Une liste qui donne l'ampleur.</p>
      <p><b>Contraste</b> : lumière des vitrines, ombre des ruelles. Deux images opposées côte à côte.</p>
    </details>
    </div>`);
  panneau.querySelectorAll('[data-regard]').forEach((b) => b.addEventListener('click', () => changerRegard(b.getAttribute('data-regard'))));
  panneau.querySelector('#vi-pos').addEventListener('input', (e) => { position = Number(e.target.value); placerCamera(false); });
  panneau.querySelector('#vi-heure').addEventListener('input', (e) => { heure = Number(e.target.value) / 100; appliquerHeure(); majTexte(); });
  panneau.querySelector('#vi-marcher').addEventListener('click', () => { if (marche.estActif()) marche.desactiver(); else { if (regard !== 'passant') changerRegard('passant'); marche.activer([7.4, 0, 26 - position * 0.56]); } });
  panneau.querySelector('#vi-mission').addEventListener('click', lancerMission);
  panneau.querySelector('.vi-pli').addEventListener('click', () => replier(!panneau.classList.contains('vi-replie')));
}
const moment = () => (heure < 0.45 ? 'jour' : heure < 0.7 ? 'soir' : 'nuit');
function majTexte() {
  const [t, figure] = TEXTES[regard][moment()];
  panneau.querySelector('#vi-texte').innerHTML = t.replace(/</g, '&lt;') + '<span class="vi-figure">Figure : ' + figure + '</span>';
  panneau.querySelector('#vi-h').textContent = heure < 0.25 ? 'Midi' : heure < 0.45 ? 'Après-midi' : heure < 0.7 ? 'Crépuscule' : 'Nuit';
}
function changerRegard(r) {
  regard = r; panneau.querySelectorAll('[data-regard]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-regard') === r)));
  if (r === 'panoramique' && marche && marche.estActif()) marche.desactiver();
  majTexte(); placerCamera(true);
  if (!missionActive) shell.say(TEXTES[regard][moment()][0], 'concentre');
}
function placerCamera(saut) {
  const z = 26 - position * 0.56;
  if (marche && marche.estActif()) { M.camera.position.z = z; return; }
  if (regard === 'passant') { M.camera.position.set(7.4, 1.7, z); M.controls.target.set(0, 1.6, z - 12); M.controls.minDistance = 1; M.controls.maxPolarAngle = Math.PI * 0.52; }
  else { M.camera.position.set(saut ? 16 : M.camera.position.x, 46, z + 24); M.controls.target.set(0, 0, z - 16); M.controls.minDistance = 8; M.controls.maxPolarAngle = Math.PI * 0.45; }
  M.controls.update();
}
/* ---------- l'heure : soleil, ciel, brouillard, becs de gaz, fenêtres ---------- */
function appliquerHeure() {
  const h = heure; const { scene, soleil } = M;
  const elev = h < 0.5 ? 62 - (62 - 6) * (h / 0.5) : 6 - 18 * ((h - 0.5) / 0.5); const a = elev * Math.PI / 180;
  if (h < 0.55) { soleil.position.set(Math.cos(a) * 60 * 0.55, Math.sin(a) * 60, Math.cos(a) * 60 * 0.83); soleil.color.copy(lerp3(0xfff3e0, 0xffb070, 0xff7a40, Math.min(1, h * 2))); soleil.intensity = h < 0.5 ? 1.8 - 1.0 * (h / 0.5) : 0.8 * (1 - (h - 0.5) / 0.05); }
  else { soleil.position.set(-30, 50, -20); soleil.color.set(0x9fb4ff); soleil.intensity = 0.32 * Math.min(1, (h - 0.55) / 0.3); }
  if (dome) { const u = dome.material.uniforms; u.haut.value.copy(lerp3(0x3570c4, 0x2a3f80, 0x04060e, h)); u.horizon.value.copy(lerp3(0xdfe6ee, 0xf0a060, 0x121828, h)); u.bas.value.copy(lerp3(0x7d8690, 0x4a3038, 0x05070a, h)); u.dirSoleil.value.copy(soleil.position).normalize(); u.avecSoleil.value = h < 0.55 ? 1 : 0; }
  if (scene.fog) scene.fog.color.copy(lerp3(0xdfe6ee, 0xe0a070, 0x0f1420, h));
  if (hemi) { hemi.intensity = lerp3n(0.75, 0.45, 0.12, h); hemi.color.copy(lerp3(0xdfe9ff, 0xffb08a, 0x1a2238, h)); }
  scene.environmentIntensity = lerp3n(0.9, 0.5, 0.12, h);
  lampes.lanterne.emissiveIntensity = lerp3n(0.15, 1.1, 2.6, h); lampes.flamme.emissiveIntensity = lerp3n(0, 2.0, 4.0, h);
  lumieresNuit.forEach((l) => { l.intensity = lerp3n(0, 2.5, 6, h); }); lumieresMagasin.forEach((l) => { l.intensity = lerp3n(0, 3, 7, h); });
  if (contreJour) contreJour.intensity = lerp3n(0.35, 0.18, 0.05, h);
  fenetresAllumees.material.emissiveIntensity = lerp3n(0, 0.5, 1.3, h); vitrines.material.emissiveIntensity = lerp3n(0, 0.9, 1.7, h); archeGare.material.emissiveIntensity = lerp3n(0, 0.4, 0.9, h);
  etoiles.material.opacity = Math.max(0, (h - 0.6) / 0.4) * 0.9;
}
/* ---------- la boucle ---------- */
function animer(dt, t) {
  fiacre.position.z -= dt * 3.2; if (fiacre.position.z < -40) fiacre.position.z = 36; fiacre.userData.roues.forEach((r) => { r.rotation.x -= dt * 3.2 / 0.7; });
  tram.position.z += dt * 2.4; if (tram.position.z > 40) tram.position.z = -42; tram.userData.roues.forEach((r) => { r.rotation.x += dt * 2.4 / 0.42; });
  chevaux.forEach((c, k) => { c.userData.pattes.forEach((p) => { p.rotation.x = Math.sin(t * 7 + p.userData.phase + k) * 0.4; }); c.position.y = 0.025 * Math.abs(Math.sin(t * 7 + k)); });
  placerFoule(dt, t);
  const v = fumee.userData.vit; const pa = fumee.geometry.attributes.position; const o = fumee.userData.origine;
  for (let i = 0; i < v.length; i += 1) { const s = v[i]; s.age += dt; if (s.age > s.vie) { s.age = 0; } const k = s.age; pa.setXYZ(i, o.x + s.vx * k + s.dx * k, o.y + s.vy * k, o.z + s.vz * k + s.dz * k); }
  pa.needsUpdate = true;
  if (heure > 0.3) lampes.flamme.emissiveIntensity = lerp3n(0, 2.0, 4.0, heure) * (0.9 + 0.1 * Math.sin(t * 9));
  animerPersonnages(dt, t); animerSons(dt, t);
  // la mission : les touchers lus dans le journal de la coquille, la nuit qui tombe au fil du chrono
  const journal = M.socle.journal;
  while (journalLu < journal.length) { const j = journal[journalLu]; journalLu += 1; if (j.type === 'legende' && missionActive && !mission.estFinie()) traiterToucher(j.nom); }
  if (missionActive && !mission.estFinie()) {
    const faits = Object.keys(trouve).length; const h = Math.min(1, Math.max(0.08, mission.ecoule() / 300, faits * 0.22));
    if (Math.abs(h - heure) > 0.004) { heure = h; panneau.querySelector('#vi-heure').value = Math.round(h * 100); appliquerHeure(); majTexte(); }
  }
}
/* Les rôles : passants qui marchent, marchand qui crie, cocher et conducteur qui suivent leur voiture. */
function animerPersonnages(dt, t) {
  passants.forEach((p) => p.pose());
  const ca = M.camera.position;
  // le marchand : un cri toutes les dix secondes environ, le bras levé
  criT -= dt; marchand.pose();
  if (criT <= 0) { criT = 8 + hasard() * 5; marchand.dire(CRIS[Math.floor(hasard() * CRIS.length)], 3.5); marchand.groupe.userData.bras = 1.4; if (Math.hypot(ca.x - 9.0, ca.z - 19.5) < 18) M.son('souffle', { volume: 0.05 }); }
  if (marchand.groupe.userData.bras > 0) { marchand.groupe.userData.bras -= dt; marchand.membres.brasD.rotation.x = -2.3; marchand.membres.brasD.rotation.z = -0.35; }
  // le cocher, assis, les rênes aux mains ; il prévient quand le fiacre frôle le marcheur
  cocher.groupe.position.set(fiacre.position.x, fiacre.position.y + 1.52, fiacre.position.z - 1.8); cocher.groupe.rotation.y = Math.PI; cocher.pose();
  cocher.membres.jambeG.rotation.x = -1.05; cocher.membres.jambeD.rotation.x = -1.05; cocher.membres.brasG.rotation.x = -0.95; cocher.membres.brasD.rotation.x = -0.85; cocher.membres.brasG.rotation.z = 0.15; cocher.membres.brasD.rotation.z = -0.15;
  const dFiacre = Math.hypot(ca.x - fiacre.position.x, ca.z - fiacre.position.z);
  if (marche.estActif() && dFiacre < 4.5 && !fiacre.userData.crie) { fiacre.userData.crie = true; cocher.dire('Gare devant !', 2); } else if (dFiacre > 12) fiacre.userData.crie = false;
  // le conducteur du tramway debout à l'avant, le voyageur sur la plate-forme arrière
  conducteur.groupe.position.set(tram.position.x + 0.4, tram.position.y + 0.84, tram.position.z + 3.6); conducteur.groupe.rotation.y = 0; conducteur.pose(); conducteur.membres.brasG.rotation.x = -0.8; conducteur.membres.brasD.rotation.x = -0.8;
  voyageur.groupe.position.set(tram.position.x - 0.5, tram.position.y + 0.84, tram.position.z - 3.6); voyageur.groupe.rotation.y = Math.PI; voyageur.pose(); voyageur.membres.brasG.rotation.x = -0.6; voyageur.membres.brasG.rotation.z = 0.5;
}
/* Les sons de la ville : sabots des chevaux selon la distance, eau de la fontaine en approchant. */
function animerSons(dt, t) {
  if (!ambiances.ville) return; const ca = M.camera.position;
  sabotsAcc += dt;
  if (sabotsAcc > 0.27) {
    sabotsAcc = 0; const dT = Math.hypot(ca.x - tram.position.x, ca.z - tram.position.z); const dF = Math.hypot(ca.x - fiacre.position.x, ca.z - fiacre.position.z); const d = Math.min(dT, dF);
    if (d < 26) { const v = (1 - d / 26); M.son('coup', { volume: 0.09 * v }); if (hasard() < 0.5) M.son('clic', { volume: 0.035 * v, frequence: 480 + hasard() * 120 }); }
  }
  eauT += dt;
  if (eauT > 0.4) { eauT = 0; const d = Math.hypot(ca.x - 8.5, ca.z - 22); ambiances.eau.volume(0.16 * Math.max(0, 1 - d / 12)); }
}
function demarrer(mode, api) {
  modeJeu = mode; apiJeu = api;
  if (!ambiances.ville) { ambiances.ville = M.ambiance({ type: 'ville', volume: 0.16 }); ambiances.eau = M.ambiance({ type: 'eau', volume: 0 }); }
  if (mode === 'detente') { api.say('Marche sur le trottoir, touche ce que tu vois, fais venir la nuit. La mission commence : cinq détails à retrouver.', 'joyeux'); setTimeout(() => { if (!missionActive && !lanceMission) lancerMission(); }, 1800); return; }
  if (mode !== 'cours') { api.say('Change de regard, avance sur le boulevard, fais venir la nuit, touche ce que tu vois. Chaque objet a sa phrase.', 'joyeux'); return; }
  api.defis([
    { type: 'verifier', texte: 'Passe au <b>regard du passant</b>, à hauteur d\'homme.', bouton: 'C\'est fait', verifier: () => regard === 'passant', indice: 'Le bouton « Regard du passant » dans le panneau.', explication: 'Le passant voit de près : détails, bruits, foule. C\'est le regard de Baudelaire dans « Le Spleen de Paris ».', avant: () => changerRegard('panoramique') },
    { type: 'qcm', texte: 'Le regard panoramique, c\'est…', choix: ['voir la ville d\'en haut, dans son ensemble, comme un tableau', 'voir un détail de très près', 'fermer les yeux et imaginer', 'lire un plan de métro'], reponse: 0, explication: 'Panoramique vient du grec « tout voir » : le narrateur domine la ville et l\'énumère, toits, dômes, fumées.' },
    { type: 'toucher', texte: 'Touche un <b>réverbère à gaz</b>.', cible: 'Réverbère à gaz', explication: 'L\'éclairage au gaz change la ville : la nuit devient un spectacle. Promesse de lumière, mais aussi vertige.' },
    { type: 'qcm', texte: '« La ville tend ses bras de fer vers le ciel » : quelle figure de style ?', choix: ['Une personnification', 'Une énumération', 'Une comparaison', 'Une hyperbole'], reponse: 0, explication: 'La ville agit comme une personne : elle « tend ses bras ». Une comparaison utiliserait « comme ».' },
    { type: 'toucher', texte: 'Touche l\'<b>usine</b>, derrière les immeubles de gauche (le regard panoramique aide).', cible: 'Usine', explication: 'Les usines et leurs cheminées entrent dans la ville au XIXᵉ : chez Zola ou Verhaeren, elles deviennent des monstres qui fument. La menace prend une forme.' },
    { type: 'verifier', texte: 'Fais venir la <b>nuit</b> avec le curseur de l\'heure.', bouton: 'C\'est fait', verifier: () => heure >= 0.7, indice: 'Le curseur « L\'heure », tout à droite.', explication: 'La nuit au gaz : chez Baudelaire (« Le Crépuscule du soir »), la ville s\'allume et s\'inquiète en même temps. Le contraste ombre et lumière structure le texte.' },
    { type: 'qcm', texte: 'Le flâneur, c\'est…', choix: ['celui qui marche sans but et observe la foule', 'le cocher du fiacre', 'le vendeur du grand magasin', 'le policier du boulevard'], reponse: 0, explication: 'Figure chère à Baudelaire : le poète se perd dans la foule pour la regarder. Le poème en prose est sa forme.' },
    { type: 'qcm', texte: '« Promesse et menace » : dans les textes du XIXᵉ, la ville est vue comme…', choix: ['à la fois attirante et dangereuse', 'seulement belle', 'seulement dangereuse', 'sans intérêt'], reponse: 0, explication: 'Lumière, réussite, liberté d\'un côté ; foule, misère, solitude de l\'autre. Le contraste structure ces textes.' },
    { type: 'toucher', texte: 'Touche le <b>grand magasin</b>, au bout du boulevard côté départ.', cible: 'Grand magasin', explication: 'Chez Zola, le grand magasin est un monstre qui dévore les petites boutiques : personnification et menace, encore.' },
  ], { rejouer: () => demarrer('cours', api) });
}
