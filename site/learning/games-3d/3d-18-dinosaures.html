/* ================= PLUMAGE (cœlurosaures) ================= */
function addPlumage(ud,L,d){ const mat=featherMat(new THREE.Color(d.col).multiplyScalar(1.05)); const matB=featherMat(new THREE.Color(d.colB||d.col).multiplyScalar(0.9)); const feathers=[];

  const coatN=REDUCED?(full?12:7):(full?30:18);
  for(let i=0;i<coatN;i++){ const t=i/(coatN-1); const p=lerpLine(back,t); const fl=(0.16+Math.random()*0.08)*L*(full?1:0.85); const wid=fl*0.55;
    [-1,1].forEach(side=>{ const f=mkFeather(fl,wid,(i+ (side>0?1:0))%3?mat:matB); f.position.set(p.x,p.y+0.03*L,side*0.06*L*(0.4+Math.random())); f.rotation.z=-1.0-Math.random()*0.35; f.rotation.x=side*0.5; f.rotation.y=(Math.random()-0.5)*0.7; addF(ud.body,f); }); }

    const pr=full?7:5; for(let i=0;i<pr;i++){ const tt=i/(pr-1); const fl=(0.22+tt*(full?0.22:0.12))*L; const f=mkFeather(fl,fl*0.4,mat); f.position.set(-0.03*L*i,-0.05*L*i,0); f.rotation.z=1.35+tt*0.55; f.rotation.x=Math.PI/2; f.rotation.y=side*0.1; addF(wing,f); } });
  // éventail de plumes caudales
  if(ud.tailTip){ const tn=full?11:6; for(let i=0;i<tn;i++){ const tt=i/(tn-1); const fl=(full?0.4:0.2)*L*(0.55+0.45*Math.sin(tt*Math.PI)); const f=mkFeather(fl,fl*0.42,i%2?mat:matB); f.position.set(-0.02*L,0,(tt-0.5)*0.16*L); f.rotation.z=1.5; f.rotation.x=Math.PI/2+(tt-0.5)*0.6; addF(ud.tailTip,f); } }

function lerpLine(line,t){ if(!line.length) return new THREE.Vector3(); if(line.length===1) return line[0].clone(); const f=t*(line.length-1); const i=Math.min(line.length-2,Math.floor(f)); return line[i].clone().lerp(line[i+1],f-i); }

const _texLoader=new THREE.TextureLoader(), _texCache={}, PBR2K='../assets/3d/pbr2k/'; let _maxAniso=8;
function loadGroundTex(url,srgb,rep){ const key=url+'@'+rep; if(_texCache[key]) return _texCache[key];
  const t=_texLoader.load(url,undefined,undefined,()=>{}); t.wrapS=t.wrapT=THREE.RepeatWrapping; if(rep) t.repeat.set(rep,rep);
  t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace; t.anisotropy=_maxAniso; _texCache[key]=t; return t; }
// applique diffuse(sRGB)+normal(GL)+roughness(+ao bakée) réels sur un matériau existant, sans le recréer
function applyGroundPBR(material,slug,res,opt={}){ const rep=opt.repeat||1, b=PBR2K+slug+'/'+slug+'_';
  material.map=loadGroundTex(b+'diff_'+res+'.jpg',true,rep);
  material.normalMap=loadGroundTex(b+'nor_gl_'+res+'.jpg',false,rep); material.normalScale=new THREE.Vector2(opt.normal||1,opt.normal||1);
  material.roughnessMap=loadGroundTex(b+'rough_'+res+'.jpg',false,rep); material.roughness=1.0;
  if(opt.ao){ material.aoMap=loadGroundTex(b+'ao_'+res+'.jpg',false,rep); material.aoMapIntensity=opt.aoInt!=null?opt.aoInt:1; }
  material.color.setHex(opt.tint!=null?opt.tint:0xffffff); material.needsUpdate=true; return material; }
// duplique le canal UV (uv → uv1) pour que l'aoMap fonctionne
function enableAOuv(geo){ if(geo.attributes.uv && !geo.attributes.uv1) geo.setAttribute('uv1', geo.attributes.uv); }
// choisit le terrain selon l'ère : sol forestier (terre+feuilles) sur les ères luxuriantes, terrain rocheux/aride au Trias
function setGroundEra(v){ if(!groundMat) return; const E=ERAS[v];
  if(E.veg==='lush'){ applyGroundPBR(groundMat,'forrest_ground_01','1k',{repeat:36,normal:1.15,ao:true,aoInt:0.9,tint:E.groundTint===0x8fac6e?0xbdc3a4:0xc9c9b2}); }
  else { applyGroundPBR(groundMat,'rocky_terrain','1k',{repeat:30,normal:1.0,ao:true,aoInt:0.9,tint:0xcaa877}); }
}
let groundMat;
function buildGround(){
  const geo=new THREE.PlaneGeometry(360,360,90,90); const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i); const r=Math.hypot(x,y);
    let h=Math.sin(x*0.05)*Math.cos(y*0.045)*1.1 + Math.sin(x*0.13+y*0.07)*0.5;
    if(r>60) h+=(r-60)*0.06; p.setZ(i,h); }
  geo.computeVertexNormals(); geo.rotateX(-Math.PI/2); enableAOuv(geo);
  groundMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,metalness:0,envMapIntensity:0.55});
  ground=new THREE.Mesh(geo,groundMat); ground.receiveShadow=true; scene.add(ground);
  setGroundEra(era);
}

function inst(geo,mat,count,cast){ const m=new THREE.InstancedMesh(geo,mat,count); m.castShadow=cast; m.receiveShadow=false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); return m; }
function buildVeg(){ clearVeg(); const E=ERAS[era]; const lush=E.veg==='lush';
  const dummy=new THREE.Object3D(); const rand=(min,max)=>min+Math.random()*(max-min);
  const place=(m,count,rMin,rMax,scMin,scMax,yBase)=>{ let idx=0; for(let i=0;i<count;i++){ const a=Math.random()*Math.PI*2, r=rand(rMin,rMax);
      const x=Math.sin(a)*r, z=Math.cos(a)*r; if(Math.hypot(x,z)<9) continue; const s=rand(scMin,scMax);
      dummy.position.set(x,yBase,z); dummy.rotation.set(0,Math.random()*Math.PI*2,0); dummy.scale.setScalar(s); dummy.updateMatrix(); m.setMatrixAt(idx++,dummy.matrix); }
    m.count=idx; m.instanceMatrix.needsUpdate=true; };

function placePair(a,b,count,rMin,rMax,scMin,scMax){ const dummy=new THREE.Object3D(); let idx=0;
  for(let i=0;i<count;i++){ const ang=Math.random()*Math.PI*2, r=rMin+Math.random()*(rMax-rMin); const x=Math.sin(ang)*r,z=Math.cos(ang)*r; if(Math.hypot(x,z)<10) continue;

    dummy.position.set(x,0,z); dummy.rotation.set(0,ry,0); dummy.scale.setScalar(s); dummy.updateMatrix();
    a.setMatrixAt(idx,dummy.matrix); b.setMatrixAt(idx,dummy.matrix); idx++; }
  a.count=b.count=idx; a.instanceMatrix.needsUpdate=b.instanceMatrix.needsUpdate=true; }

function initAudio(){ if(ac||shell.muted)return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function startAmbient(){ initAudio(); if(!ac||ac._amb||shell.muted)return; const g=ac.createGain(); g.gain.value=0; g.connect(ac.destination); g.gain.setTargetAtTime(0.045,ac.currentTime,2.5); ambGain=g;
  [55,58.7].forEach(f=>{ const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f; const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=170; const og=ac.createGain(); og.gain.value=0.5; o.connect(lp); lp.connect(og); og.connect(g); o.start(); });
  const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const d=buf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1); const src=ac.createBufferSource(); src.buffer=buf; src.loop=true; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=380; bp.Q.value=0.4; const ng=ac.createGain(); ng.gain.value=0.22; src.connect(bp); bp.connect(ng); ng.connect(g); src.start();
  ac._amb=true;
}
function roar(carnivore){ initAudio(); if(!ac||shell.muted)return; const now=ac.currentTime; const g=ac.createGain(); g.connect(ac.destination); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(carnivore?0.5:0.36,now+0.08); g.gain.exponentialRampToValueAtTime(0.0001,now+(carnivore?1.3:1.0));
  const o=ac.createOscillator(); o.type=carnivore?'sawtooth':'square'; o.frequency.setValueAtTime(carnivore?150:128,now); o.frequency.exponentialRampToValueAtTime(carnivore?46:70,now+(carnivore?1.1:0.85));
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(900,now); lp.frequency.exponentialRampToValueAtTime(300,now+1); lp.Q.value=6;
  const lfo=ac.createOscillator(); lfo.frequency.value=carnivore?27:17; const lg=ac.createGain(); lg.gain.value=carnivore?42:24; lfo.connect(lg); lg.connect(o.frequency); lfo.start(now); lfo.stop(now+1.4);
  o.connect(lp); lp.connect(g); o.start(now); o.stop(now+1.4);
  const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate); const dd=buf.getChannelData(0); for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1); const ns=ac.createBufferSource(); ns.buffer=buf; const nf=ac.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=520; const ng2=ac.createGain(); ng2.gain.setValueAtTime(carnivore?0.12:0.06,now); ng2.gain.exponentialRampToValueAtTime(0.0001,now+0.8); ns.connect(nf); nf.connect(ng2); ng2.connect(g); ns.start(now); ns.stop(now+0.9);
}
function rumble(){ initAudio(); if(!ac||shell.muted)return; const now=ac.currentTime; const g=ac.createGain(); g.connect(ac.destination); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime(0.6,now+0.12); g.gain.exponentialRampToValueAtTime(0.0001,now+3.6);
  const o=ac.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(72,now); o.frequency.exponentialRampToValueAtTime(20,now+3); o.connect(g); o.start(now); o.stop(now+3.7);

}

  Object.values(dinoMeshes).forEach(g=>{ if(!g.visible)return; const P=g.userData.parts; const sp=g.userData.species;
    if(P.bones) P.bones.position.set(0,P.body.position.y,0);
    if(g.userData.dying){ g.rotation.z=Math.min(Math.PI/2, g.rotation.z+0.02); g.position.y=Math.max(-sp.len*U*sp.scale*0.15, g.position.y-0.03); if(g.userData.label) g.userData.label.classList.remove('on'); return; }
    // respiration (idle) : léger gonflement du thorax
    if(P.chest && P.chest!==P.body){ const br=Math.sin(t*1.4+g.userData.phase)*0.02; P.chest.scale.set(1+br*0.6,1+br,1+br*0.9); }
    if(sp.fly){ if(g.userData.focused){ g.position.y+=Math.sin(t*2)*0.004; g.rotation.z=Math.sin(t*1.2)*0.05; }
      else { const R=sp.big?24:18; const a=t*0.3+g.userData.phase; g.position.set(Math.sin(a)*R, 9+Math.sin(t*1.6)*0.9, Math.cos(a)*R-2); g.rotation.y=-a+Math.PI/2; g.rotation.z=Math.sin(t*1.6)*0.12; }
      if(P.wings){ const f=Math.sin(t*(sp.big?2.6:4.5))*0.6; P.wings[0].rotation.z=f; P.wings[1].rotation.z=-f; } }
    else if(g.userData.focused){ // inspection : l'animal se fige et respire
      g.position.y=0; if(P.tail) P.tail.rotation.y=Math.sin(t*0.7)*0.12;
      P.legs.forEach(l=> l.p.rotation.z=Math.sin(t*0.5+l.ph)*0.03 );
      if(P.neck&&P.neck!==P.head){ P.neck.rotation.y=Math.sin(t*0.5)*0.14; P.neck.rotation.z=0; } }
    else if(!REDUCED){
      g.userData.phase+=dt*g.userData.speed; const c=g.userData.center, o=g.userData.orbit;
      const nx=c.x+Math.cos(g.userData.phase)*o, nz=c.y+Math.sin(g.userData.phase)*o;
      const dx=nx-g.position.x, dz=nz-g.position.z; if(dx*dx+dz*dz>1e-5) g.rotation.y=Math.atan2(dx,dz);
      g.position.x=nx; g.position.z=nz; g.userData.walk+=dt*g.userData.speed*7;
      const bob=Math.abs(Math.sin(g.userData.walk))*0.06*sp.len*U*sp.scale*0.3; g.position.y=bob;
      P.legs.forEach(l=> l.p.rotation.z=Math.sin(g.userData.walk+l.ph)*0.5 );
      if(P.tail) P.tail.rotation.y=Math.sin(t*1.1+g.userData.phase)*0.22;
      if(P.neck&&P.neck!==P.head){ g.userData.graze+=dt*0.4; const gr=(sp.diet==='Herbivore')?Math.max(0,Math.sin(g.userData.graze))*0.5:0; P.neck.rotation.z=-gr; P.neck.rotation.y=(sp.diet==='Carnivore')?Math.sin(t*0.6+g.userData.phase)*0.25:0; }
    } else { g.position.y=Math.sin(t*1.2+g.userData.phase)*0.1; if(P.tail) P.tail.rotation.y=Math.sin(t*0.9)*0.15; }
    updateLabel(g);
  });
  if(hovered&&dinoMeshes[hovered]&&!dinoMeshes[hovered].visible) hovered=null;
  controls.update(); composer.render();
}
</script>
