function canevas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return { c, x: c.getContext('2d'), t }; }
/* La carte de rugosité est déduite de la carte de jour : océans lisses (reflet du soleil), terres mates. */
function carteRugosite(image) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const x = c.getContext('2d'); x.drawImage(image, 0, 0, 1024, 512);
  const d = x.getImageData(0, 0, 1024, 512); const p = d.data;
  for (let i = 0; i < p.length; i += 4) { const r = p[i]; const g = p[i + 1]; const b = p[i + 2]; const ocean = b > r + 18 && b >= g - 4 && r < 120; const v = ocean ? 92 : (r + g + b > 600 ? 150 : 230); p[i] = p[i + 1] = p[i + 2] = v; }
  x.putImageData(d, 0, 0); const t = new THREE.CanvasTexture(c); return t;
}
