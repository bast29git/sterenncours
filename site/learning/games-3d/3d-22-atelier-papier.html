      <div class="mb-mesures"><span>En 10 heures</span><b id="pa-long">·</b><span>Feuilles de 50 cm</span><b id="pa-nf">·</b><span>Une équipe à la cuve</span><b>≈ 2 000 feuilles</b></div>
      <p class="mb-carte" id="pa-compare"></p>
    </div></details>
    <details><summary>Vues</summary><div class="mb-groupe">
      <button class="mb-bouton" id="pa-dessus" aria-pressed="false">Vue de dessus</button><button class="mb-bouton" id="pa-ensemble">Vue d'ensemble</button>
    </div></details>`);
  panneau.querySelectorAll('[data-etape]').forEach((b) => b.addEventListener('click', () => choisir(b.getAttribute('data-etape'))));
  panneau.querySelector('#pa-fs').addEventListener('input', (e) => { fibres = Number(e.target.value); majPate(); });
  panneau.querySelector('#pa-vs').addEventListener('input', (e) => { vitesse = Number(e.target.value); majMachine(); });
  panneau.querySelector('#pa-faire').addEventListener('click', fabriquer);
  panneau.querySelector('#pa-dessus').addEventListener('click', () => basculerDessus(!vueDessus));
  panneau.querySelector('#pa-ensemble').addEventListener('click', () => { basculerDessus(false); vise = { pos: new THREE.Vector3(1, 4.8, 12), cible: new THREE.Vector3(0.5, 1.2, 0) }; });
  majPate(); majMachine(); majPile();
  stationParLegende();
  M.renderer.domElement.addEventListener('pointerdown', () => { vise = null; });

  /* ---------- La boucle : feuilles qui ondulent, machine, vapeur, flammes, séquence ---------- */
  const tmp = new THREE.Vector3();
  M.boucle((dt, t) => {
    feuilles.forEach((fe, i) => { fe.rotation.y = 0.1 * Math.sin(t * 1.1 + i); });
    const w = vitesse * 0.42;
    roues.forEach((r) => { r.rotation.y += w * dt / Math.max(0.12, r.geometry.parameters.radiusTop); });
    bandeTex.offset.x -= vitesse * dt * 0.06;
    volant.rotation.z -= w * dt * 1.4;
    const th = volant.rotation.z; const px = 0.2 + 0.4 * Math.cos(th); const py = 1.1 + 0.4 * Math.sin(th); const Lb = 0.9;
    const cx = px + Math.sqrt(Math.max(0.01, Lb * Lb - (py - 1.1) * (py - 1.1)));
    manivelle.position.set(px, py, -1.62);
    crosse.position.set(cx, 1.1, -1.58); tige.position.set((cx + 2.1) / 2, 1.1, -1.58); tige.scale.y = Math.max(0.2, 2.1 - cx) / 0.9;
    bielle.position.set((px + cx) / 2, (py + 1.1) / 2, -1.58); bielle.rotation.z = Math.atan2(1.1 - py, cx - px);
    vapeur.forEach((v, i) => { const ph = ((t * (0.35 + vitesse * 0.03) + i * 0.33) % 2); v.position.set(2.2 + 0.12 * Math.sin(t + i), 1.45 + ph * 1.1, -1.5 - ph * 0.3); const s = 0.6 + ph * 0.9; v.scale.setScalar(s); v.material.opacity = 0.32 * (1 - ph / 2); });
    lanternes.forEach((l, i) => { const f = 1 + 0.12 * Math.sin(t * 9 + i * 2) + 0.06 * Math.sin(t * 23 + i); l.lum.intensity = l.base * f; l.flamme.material.emissiveIntensity = 3.2 * f; });
    if (moteurG) { moteurG.userData.foyer.material.emissiveIntensity = 2.2 + 0.5 * Math.sin(t * 6.3); moteurG.userData.feu.intensity = 5 + 1.5 * Math.sin(t * 6.3); }
    if (poussiere) { const p = poussiere.geometry.attributes.position; for (let i = 0; i < p.count; i += 1) { p.setY(i, p.getY(i) + Math.sin(t * 0.4 + i) * 0.0006); p.setX(i, p.getX(i) + Math.cos(t * 0.3 + i * 0.7) * 0.0005); } p.needsUpdate = true; }
    if (vise) { const k = 1 - Math.exp(-4.5 * dt); M.camera.position.lerp(vise.pos, k); M.controls.target.lerp(vise.cible, k); if (M.camera.position.distanceTo(vise.pos) < 0.02) vise = null; }
    if (sequence) avancerSequence(dt);
    void tmp;
  });
}

/* ---------- Choisir une station : par le panneau ou en touchant sa légende ---------- */
function stationParLegende() {
  M.renderer.domElement.addEventListener('pointerup', () => { setTimeout(() => { const b = document.querySelector('.ksh-legende'); if (!b || b.hidden) return; const nom = b.querySelector('b') && b.querySelector('b').textContent; const e = ETAPES.find((x) => x.nom === nom); if (e) choisir(e.id, true); }, 30); });
}
function choisir(id, sansCamera) {
  etape = id; const e = ETAPES.find((x) => x.id === id);
  panneau.querySelectorAll('[data-etape]').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-etape') === id)));
  panneau.querySelector('#pa-texte').textContent = e.texte;
  if (!sansCamera && !vueDessus) vise = { pos: new THREE.Vector3(e.x + 2.6, 3.0, 5.4), cible: new THREE.Vector3(e.x, 1.1, 0) };
  shell.say(e.texte, 'concentre');
}
function basculerDessus(actif) {
  vueDessus = actif; plafond.visible = !actif;
  panneau.querySelector('#pa-dessus').setAttribute('aria-pressed', String(actif));
  if (actif) vise = { pos: new THREE.Vector3(0.6, 17, 1.6), cible: new THREE.Vector3(0.5, 0, 0.2) };
  else if (!vise) vise = { pos: new THREE.Vector3(1, 4.8, 12), cible: new THREE.Vector3(0.5, 1.2, 0) };
}
function majPate() {
  const p = proportion();
  panneau.querySelector('#pa-f').textContent = fibres + ' g'; panneau.querySelector('#pa-f2').textContent = fibres + ' g'; panneau.querySelector('#pa-p').textContent = f1(p) + ' %';
  const avis = panneau.querySelector('#pa-avis'); avis.textContent = p < 1.5 ? 'Trop liquide : la feuille sera trouée.' : p > 2.6 ? 'Trop épais : la feuille sera grumeleuse.' : 'Bonne pâte : environ 2 % de fibres, la feuille sera régulière.';
  avis.style.borderLeft = '6px solid ' + (p < 1.5 || p > 2.6 ? '#E63329' : '#2AA98C');
  const pate = stations.cuve.userData.pate; pate.material.color.set(p < 1.5 ? 0xd3dbe4 : p > 2.6 ? 0xd6c5a2 : 0xe9e4d4); pate.material.roughness = p < 1.5 ? 0.15 : p > 2.6 ? 0.7 : 0.32;
}
function majMachine() {
  const longueur = vitesse * 60 * 10; const nf = longueur / 0.5;
  panneau.querySelector('#pa-v').textContent = vitesse + ' m/min'; panneau.querySelector('#pa-long').textContent = fEnt(longueur) + ' m'; panneau.querySelector('#pa-nf').textContent = fEnt(nf);
  panneau.querySelector('#pa-compare').textContent = vitesse + ' m par minute × 60 minutes × 10 heures = ' + fEnt(longueur) + ' m, soit ' + fEnt(nf) + ' feuilles de 50 cm : ' + (nf >= 2000 ? 'environ ' + f1(nf / 2000) + ' fois' : 'moins que') + ' la production d\'une équipe à la cuve (2 000 feuilles).';
}
function majPile() {
  const visibles = Math.min(pile.length, 6 + feuillesFaites);
  let y = 0.26; pile.forEach((c, i) => { c.visible = i < visibles; if (c.visible) { const h = c.geometry.parameters.height; c.position.y = y + h / 2; y += h; } });
  platine.userData.repos = y + 0.05; if (!sequence) { platine.position.y = platine.userData.repos; vis.position.y = platine.position.y + 1.0; }
  panneau.querySelector('#pa-n').textContent = String(feuillesFaites);
}

/* ---------- La séquence « fabriquer une feuille » : puiser, égoutter, coucher, presser, sécher ---------- */
const REPOS = new THREE.Vector3(-1, 0.99, 0); const CUVE_HAUT = new THREE.Vector3(-3.5, 1.75, 0); const CUVE_BAS = new THREE.Vector3(-3.5, 0.9, 0);
const GESTES = [
  { d: 1.3, nom: 'Puiser', vue: [-2.2, 2.6, 4.2, -2.5, 1.0, 0], f: (p) => { const q = lisse(p); formeG.position.lerpVectors(REPOS, CUVE_HAUT, q); formeG.rotation.z = 0.22 * (1 - q); } },
  { d: 1.0, nom: 'Plonger', f: (p) => { const q = Math.sin(p * Math.PI); formeG.position.lerpVectors(CUVE_HAUT, CUVE_BAS, q); if (p > 0.5) feuilleForme.visible = true; } },
  { d: 1.0, nom: 'Égoutter', f: (p) => { formeG.position.copy(CUVE_HAUT); formeG.rotation.z = 0.12 * Math.sin(p * Math.PI); gouttes.forEach((g, i) => { const ph = (p * 2.2 + i / 8) % 1; g.visible = true; g.position.set(-3.5 + (i - 3.5) * 0.14, 1.7 - ph * 0.8, 0.3 * Math.sin(i)); g.scale.setScalar(1); }); }, fin: () => { gouttes.forEach((g) => { g.visible = false; }); } },
  { d: 1.2, nom: 'Coucher', vue: [0.3, 2.4, 4.4, 0.3, 1.0, 0], f: (p) => { const q = lisse(p); formeG.position.lerpVectors(CUVE_HAUT, REPOS, q); formeG.rotation.z = 0.22 * q; if (p > 0.5) { feuilleForme.visible = false; feuilleTransit.visible = true; const r = (p - 0.5) * 2; const yFin = platine.userData.repos - 0.06; feuilleTransit.position.set(-1 + 2.5 * lisse(r), 1.05 + (yFin - 1.05) * lisse(r) + 0.45 * Math.sin(r * Math.PI), 0); } } },
  { d: 1.6, nom: 'Presser', f: (p) => { feuilleTransit.visible = false; const repos = platine.userData.repos; const q = Math.sin(p * Math.PI); platine.position.y = repos - 0.08 * q; vis.position.y = platine.position.y + 1.0; barreVis.rotation.y = p * Math.PI * 2; gouttes.forEach((g, i) => { const ph = (p * 2 + i / 8) % 1; g.visible = q > 0.3; g.position.set(1.5 + 0.56, 0.45 - ph * 0.3, 0.1 + (i - 3.5) * 0.09); }); }, fin: () => { gouttes.forEach((g) => { g.visible = false; }); } },
  { d: 1.0, nom: 'Sécher', vue: [4.5, 2.6, 4.6, 4, 1.6, 0], f: () => { const fe = feuilles.find((x) => !x.visible); if (fe) fe.visible = true; } },
];
function fabriquer() {
  if (sequence) return;
  sequence = { i: 0, t: 0 }; panneau.querySelector('#pa-faire').disabled = true; panneau.querySelector('#pa-faire').textContent = 'Fabrication en cours';
  choisirGeste(0);
}
function choisirGeste(i) {
  const g = GESTES[i]; panneau.querySelector('#pa-geste').textContent = g.nom;
  if (g.vue && !vueDessus) vise = { pos: new THREE.Vector3(g.vue[0], g.vue[1], g.vue[2]), cible: new THREE.Vector3(g.vue[3], g.vue[4], g.vue[5]) };
}
function avancerSequence(dt) {
  const g = GESTES[sequence.i]; sequence.t += dt; const p = Math.min(1, sequence.t / g.d);
  try { g.f(p); } catch (e) { /* un geste raté n'arrête pas la suite */ }
  panneau.querySelector('#pa-barre').style.width = Math.round((sequence.i + p) / GESTES.length * 100) + '%';
  if (p >= 1) {
    if (g.fin) g.fin();
    sequence.i += 1; sequence.t = 0;
    if (sequence.i >= GESTES.length) {
      sequence = null; feuillesFaites += 1; majPile();
      formeG.position.copy(REPOS); formeG.rotation.z = 0.22; feuilleForme.visible = false; feuilleTransit.visible = false;
      const b = panneau.querySelector('#pa-faire'); b.disabled = false; b.textContent = 'Fabriquer une feuille';
      panneau.querySelector('#pa-geste').textContent = 'Feuille au séchoir'; panneau.querySelector('#pa-barre').style.width = '100%';
      shell.say('Une feuille de plus au séchoir. Cinq gestes pour une feuille : la machine, elle, ne s\'arrête jamais.', 'fier');
    } else choisirGeste(sequence.i);
  }
}

function demarrer(mode, api) {
  if (mode !== 'cours') { api.say('Visite les six stations dans l\'ordre, fabrique une feuille, puis règle la pâte et la machine.', 'joyeux'); return; }
  const ouvrir = (id) => () => { const d = panneau.querySelector(id); if (d) d.open = true; };
  api.defis([
    { type: 'toucher', texte: 'Touche la <b>forme</b>, le tamis qui donne sa forme à la feuille.', cible: 'Forme (tamis)', explication: 'La forme retient les fibres et laisse passer l\'eau : c\'est elle qui fait la feuille, une à la fois.' },
    { type: 'verifier', texte: 'Prépare une pâte à environ 2 % de fibres : règle la masse de fibres pour 5 L d\'eau.', bouton: 'C\'est réglé', avant: ouvrir('#pa-det-pate'), verifier: () => proportion() >= 1.7 && proportion() <= 2.3, indice: '5 L d\'eau pèsent 5 000 g. 2 % de 5 000 g, c\'est 100 g.', explication: '100 g de fibres dans 5 000 g d\'eau : 100 ÷ 5 100 ≈ 2 %. La proportion se calcule avec la masse totale.' },
    { type: 'qcm', texte: '5 L d\'eau pèsent…', choix: ['5 kg', '500 g', '50 kg', '5 g'], reponse: 0, explication: 'La masse volumique de l\'eau est de 1 kg par litre : masse = 1 × 5 = 5 kg.' },
    { type: 'verifier', texte: 'Fabrique une feuille à la main : lance la fabrication et attends qu\'elle arrive au séchoir.', bouton: 'C\'est fait', verifier: () => feuillesFaites >= 1, indice: 'Le bouton « Fabriquer une feuille », en haut du panneau. Attends la fin des cinq gestes.', explication: 'Puiser, plonger, égoutter, coucher, presser, sécher : une feuille à la fois, et plusieurs jours de séchage. La machine enchaîne tout cela en continu.' },
    { type: 'qcm', texte: 'Le papier est fait de…', choix: ['fibres de cellulose : chiffons, puis bois', 'plastique', 'argile', 'sable fondu'], reponse: 0, explication: 'Les chiffons de lin et de coton d\'abord ; le bois à partir de 1850, quand la demande explose.' },
    { type: 'qcm', texte: 'Ce que change la machine à papier au XIXᵉ siècle :', choix: ['une bande continue, produite par une machine à vapeur, au lieu de feuilles faites une à une', 'la couleur du papier', 'le papier devient plus cher', 'on n\'utilise plus d\'eau'], reponse: 0, explication: 'La machine à papier continu (1799) puis la vapeur : production de masse, journaux à un sou, livres pour tous.' },
    { type: 'toucher', texte: 'Touche la <b>presse</b> qui chasse l\'eau des feuilles.', cible: 'Presse', explication: 'Sous la presse, l\'eau est expulsée et les fibres se soudent entre elles.' },
    { type: 'qcm', texte: 'La machine avance de 5 m de papier par minute. En une journée de 10 heures, elle produit…', choix: ['3 000 m', '300 m', '50 m', '30 000 m'], reponse: 0, avant: ouvrir('#pa-det-machine'), explication: '10 heures, c\'est 600 minutes. 5 × 600 = 3 000 m, soit 6 000 feuilles de 50 cm : trois fois plus qu\'une équipe à la cuve.' },
    { type: 'qcm', texte: 'Au XIXᵉ siècle, l\'usine et la machine à vapeur ont pour conséquence…', choix: ['des ouvriers regroupés dans des usines et des villes qui grandissent', 'moins de travail pour tout le monde', 'la disparition des villes', 'le retour aux ateliers familiaux'], reponse: 0, explication: 'La révolution industrielle regroupe le travail dans des usines : exode rural, croissance des villes, naissance du prolétariat.' },
  ], { rejouer: () => demarrer('cours', api) });
}
