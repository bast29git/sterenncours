  if (!peseeFaite || peseeFaite.plante !== c.plante || peseeFaite.total !== c.total || peseeFaite.pourcent !== c.pct) manques.push('la pesée avec les poids');
  if (!melange.etapes.includes('plante') || melange.plante !== c.plante || Math.abs(melange.masse - c.total * c.pct / 100) > 0.01) manques.push('la plante pesée dans le bol');
  if (!melange.etapes.includes('liquide') || melange.liquide !== c.liquide || melange.volume !== c.volume) manques.push('le liquide : ' + c.volume + ' mL d\'' + c.liquide);
  if (!melange.etapes.includes('remuer')) manques.push('remuer');
  if (manques.length) { erreurs += 1; majMelange(); M.son('coup', { volume: 0.2 }); const msg = 'Pas encore. Il manque ' + manques.join(', ') + '.'; if (apothicaire) apothicaire.dire(msg, 5); shell.say(msg, 'rassurant'); return false; }
  const pts = Math.max(50, 150 - 25 * erreurs); const i = numCommande; mission.valider('c' + (i + 1), pts);
  panneau.querySelector('#ap-commande').textContent = 'Client ' + (i + 1) + ' servi : ' + c.nom + ', ' + f1(c.total * c.pct / 100) + ' g de ' + c.plante + ' dans ' + c.volume + ' mL d\'' + c.liquide + ' (' + f1(LIQUIDES[c.liquide].rho * c.volume) + ' g).';
  apothicaire.dire('Voilà votre ' + c.nom + '.', 3);
  sortieClient(i, () => { if (i + 1 < COMMANDES.length && mission && !mission.estFinie()) entreeClient(i + 1); });
  return true;
}

/* ---------- Mise à jour des mesures : sirop, liquide, éprouvette, bol. `nouvellePesee` : la masse de plante a changé, les poids retournent dans la boîte. ---------- */
function maj(nouvellePesee) {
  panneau.querySelector('#ap-t').textContent = total + ' g'; panneau.querySelector('#ap-p').textContent = pourcent + ' %';
  panneau.querySelector('#ap-mp').textContent = f1(massePlante()) + ' g'; panneau.querySelector('#ap-ms').textContent = f1(total - massePlante()) + ' g';
  panneau.querySelector('#ap-v').textContent = volume + ' mL'; panneau.querySelector('#ap-ml').textContent = f1(masseLiquide()) + ' g';
  panneau.querySelector('#ap-calc').textContent = 'Plante : ' + total + ' × ' + pourcent + ' ÷ 100 = ' + f1(massePlante()) + ' g. Liquide : ' + f2(LIQUIDES[liquide].rho) + ' × ' + volume + ' = ' + f1(masseLiquide()) + ' g.';
  const liq = flacon.userData.liq; liq.scale.y = Math.max(0.02, volume / 250 * 1.1); liq.position.y = 0.07 + liq.scale.y / 2; liq.material.color.set(LIQUIDES[liquide].couleur); liq.material.transmission = liquide === 'eau' ? 0.6 : 0.3;
  contenuBol.scale.setScalar(0.6 + massePlante() / 150); tas.scale.set(0.5 + massePlante() / 120, 0.25 + massePlante() / 250, 0.5 + massePlante() / 120);
  if (!nouvellePesee) return;
  if (pesee) pesee = null; peseeFaite = null;
  if (melange.etapes.length && panneau.querySelector('#ap-bol')) { viderBol(); if (apothicaire) apothicaire.dire('Les réglages ont changé : je vide le bol, on recommence le mélange.', 4); }
  poidsMeshes.forEach(rangerPoids);
  equilibre = Math.min(0.2, 0.05 + massePlante() / 600);
  panneau.querySelector('#ap-pesee').textContent = 'À peser : ' + f1(massePlante()) + ' g de ' + PLANTES.find((p) => p.id === plante).nom.toLowerCase() + '. Pose les poids sur le plateau de droite jusqu\'à l\'équilibre.';
  panneau.querySelector('#ap-pesee').style.borderLeft = '6px solid #F5A623';
}
function rangerPoids(m) { if (m.parent !== boitePoids) boitePoids.add(m); m.position.copy(m.userData.repos); }
function peser() {
  if (pesee) return;
  const choix = decomposer(massePlante()); poidsMeshes.forEach(rangerPoids);
  pesee = { choix, i: 0, t: 0, angle: equilibre, poses: 0 };
  if (apothicaire) apothicaire.dire(f1(massePlante()) + ' g à peser : ' + choix.map((j) => f1(POIDS[j]) + ' g').join(' + ') + '. Du plus lourd au plus léger.', 5);
  panneau.querySelector('#ap-pesee').textContent = 'La plante fait pencher le plateau de gauche. Les poids arrivent un par un…';
}
function avancerPesee(dt) {
  pesee.t += dt;
  if (pesee.i < pesee.choix.length && pesee.t > 0.55) {
    pesee.t = 0; const m = poidsMeshes[pesee.choix[pesee.i]]; const k = pesee.i;
    const plateau = balance.userData.plateaux.droite; plateau.add(m);
    const dx = (k % 3 - 1) * 0.15; const dz = (Math.floor(k / 3) - 0.5) * 0.14;
    m.position.set(dx, -0.6875 + m.userData.h / 2, dz);
    pesee.poses += m.userData.masse; pesee.i += 1;
    pesee.angle = Math.min(0.2, 0.05 + Math.max(0, massePlante() - pesee.poses) / 600);
    const liste = pesee.choix.slice(0, pesee.i).map((j) => f1(POIDS[j]) + ' g').join(' + ');
    panneau.querySelector('#ap-pesee').textContent = 'Posés : ' + liste + ' = ' + f1(pesee.poses) + ' g.' + (pesee.i >= pesee.choix.length ? ' Le fléau est horizontal : équilibre.' : '');
  }
  if (pesee.i >= pesee.choix.length) { pesee.angle = 0; if (pesee.t > 0.8) { equilibre = 0; const ecart = Math.abs(pesee.poses - massePlante()) > 0.01; panneau.querySelector('#ap-pesee').textContent = 'Équilibre : ' + f1(massePlante()) + ' g ' + (ecart ? '≈' : '=') + ' ' + pesee.choix.map((j) => f1(POIDS[j]) + ' g').join(' + ') + (ecart ? ' (au demi-gramme près, le plus petit poids de la boîte).' : '.') + ' La masse de plante est pesée.'; panneau.querySelector('#ap-pesee').style.borderLeft = '6px solid #2AA98C'; pesee = null; peseeFaite = { plante, total, pourcent }; M.son('clic', { volume: 0.12 }); if (apothicaire) apothicaire.dire('Le fléau est droit : ' + f1(massePlante()) + ' g de plante, pesés juste.', 4); } }
}
/* ---------- Le bocal des densités : les couches se classent toutes seules ---------- */
function majBocal() {
  const ordre = Object.keys(LIQUIDES).filter((k) => dansBocal[k]).sort((a, b) => LIQUIDES[b].rho - LIQUIDES[a].rho);
  let y = 0.04; const h = 0.26;
  Object.keys(LIQUIDES).forEach((k) => { couches[k].visible = false; });
  ordre.forEach((k) => { const c = couches[k]; c.visible = true; c.scale.y = h; c.position.y = y + h / 2; y += h; });
  const zone = panneau.querySelector('#ap-couches');
  zone.innerHTML = ordre.length ? ordre.map((k) => `<span style="background:${LIQUIDES[k].css}"><span>${LIQUIDES[k].nom}</span><span>${f2(LIQUIDES[k].rho)} g/mL</span></span>`).join('') : '<span style="color:var(--fg-muted);justify-content:center">bocal vide</span>';
  const d = panneau.querySelector('#ap-dens');
  if (ordre.length === 0) d.textContent = 'Verse 60 mL de chaque liquide : le plus dense se place en bas.';
  else if (ordre.length === 1) d.textContent = 'Un seul liquide : ' + LIQUIDES[ordre[0]].nom + ', ' + f2(LIQUIDES[ordre[0]].rho) + ' g/mL. Ajoute-en un autre pour comparer.';
  else d.textContent = 'De bas en haut : ' + ordre.map((k) => LIQUIDES[k].nom + ' (' + f2(LIQUIDES[k].rho) + ')').join(', puis ') + '. Le liquide le plus dense est en bas, le moins dense flotte.';
}
/* ---------- Le fourneau : le sucre devient caramel, et ne redevient pas sucre ---------- */
function chaufferOuRemettre() {
  if (cuisson >= 1) { cuisson = 0; chauffe = null; majFour(); shell.say('Du sucre neuf dans la marmite. Le caramel, lui, ne redeviendra jamais du sucre.', 'concentre'); return; }
  if (chauffe) { chauffe = null; majFour(); return; }
  chauffe = { depuis: performance.now() }; majFour();
}
function majFour() {
  const b = panneau.querySelector('#ap-chauffer'); const etat = panneau.querySelector('#ap-etat'); const temp = panneau.querySelector('#ap-temp'); const texte = panneau.querySelector('#ap-four');
  const c = cuisson; const couleur = new THREE.Color(0xf7f3ea).lerp(new THREE.Color(0xe8c15a), Math.min(1, c * 2)).lerp(new THREE.Color(0x7a3a12), Math.max(0, c - 0.5) * 2);
  sucre.material.color.copy(couleur); sucre.material.roughness = c < 0.25 ? 0.9 : 0.15; sucre.material.clearcoat = c < 0.25 ? 0.05 : 0.8;
  temp.textContent = Math.round(20 + c * 165) + ' °C';
  if (c >= 1) { b.textContent = 'Remettre du sucre'; etat.textContent = 'Caramel'; texte.textContent = 'Transformation chimique : le sucre a disparu, le caramel et de la vapeur d\'eau sont apparus. Irréversible : refroidir ne redonne pas le sucre.'; texte.style.borderLeft = '6px solid #E63329'; }
  else if (c > 0.25) { b.textContent = chauffe ? 'Arrêter le feu' : 'Continuer à chauffer'; etat.textContent = 'Sucre fondu, qui brunit'; texte.textContent = 'À 160 °C environ, le sucre fond puis brunit : des molécules se cassent et se recombinent. De la vapeur d\'eau s\'échappe.'; texte.style.borderLeft = '6px solid #F5A623'; }
  else { b.textContent = chauffe ? 'Arrêter le feu' : 'Chauffer le sucre'; etat.textContent = c > 0 ? 'Sucre qui chauffe' : '100 g de sucre'; texte.textContent = 'Le sucre blanc va fondre, puis brunir : le caramel est une nouvelle substance.'; texte.style.borderLeft = '6px solid #2AA98C'; }
}

function demarrer(mode, api) {
  modeJeu = mode; apiJeu = api;
  if (apothicaire) { apothicaire.regarder(M.camera.position); setTimeout(() => apothicaire.dire('Bienvenue. Touche un bocal ou la balance : je t\'explique.', 5), 900); }
  if (mode !== 'cours') { api.say('Touche les bocaux, la balance, l\'éprouvette et le fourneau. Puis dose un sirop, pèse-le avec les poids, et verse les trois liquides dans le bocal. Le premier client arrive dans quelques secondes.', 'joyeux'); setTimeout(() => { if (!mission || mission.estFinie()) lancerMission(); }, 7000); return; }
  const ouvrir = (id) => () => { const d = panneau.querySelector(id); if (d) d.open = true; };
  api.defis([
    { type: 'verifier', texte: 'Prépare 200 g de sirop à 15 % de plante : règle la masse totale et le pourcentage.', bouton: 'C\'est réglé', verifier: () => total === 200 && pourcent === 15, indice: 'Curseur « Masse totale » sur 200 g, curseur « Part de plante » sur 15 %.', explication: 'La balance indique 30 g de plante : 200 × 15 ÷ 100 = 30.' },
    { type: 'qcm', texte: 'Dans 200 g de sirop à 15 % de plante, la masse de plante est…', choix: ['30 g', '15 g', '45 g', '185 g'], reponse: 0, explication: '15 % de 200 g : 200 × 15 ÷ 100 = 30 g. Le reste, 170 g, est le sirop.' },
    { type: 'verifier', texte: 'Pèse la plante avec les poids : lance la pesée et attends l\'équilibre.', bouton: 'C\'est pesé', verifier: () => equilibre === 0 && !pesee, indice: 'Le bouton « Peser avec les poids ». Les poids se posent un par un sur le plateau de droite.', explication: 'Une balance à plateaux compare deux masses : quand le fléau est horizontal, la plante pèse autant que les poids posés.' },
    { type: 'verifier', texte: 'Choisis le miel et règle 50 mL. Lis la masse.', bouton: 'C\'est fait', avant: ouvrir('#ap-det-liq'), verifier: () => liquide === 'miel' && volume === 50, indice: 'Bouton « miel », puis le curseur Volume sur 50 mL.', explication: 'Masse = 1,42 × 50 = 71 g. Le miel est plus dense que l\'eau : 50 mL pèsent plus de 50 g.' },
    { type: 'verifier', texte: 'Verse l\'eau, l\'huile et le miel dans le bocal des densités, et regarde l\'ordre des couches.', bouton: 'C\'est versé', avant: ouvrir('#ap-det-dens'), verifier: () => dansBocal.eau && dansBocal.huile && dansBocal.miel, indice: 'Les trois boutons du bocal des densités : eau, huile, miel.', explication: 'De bas en haut : miel (1,42 g/mL), eau (1,00 g/mL), huile (0,92 g/mL). Le plus dense descend, le moins dense flotte.' },
    { type: 'qcm', texte: 'Eau et huile dans le même bocal : qui est au-dessus ?', choix: ['L\'huile : moins dense (0,92 g/mL), elle flotte', 'L\'eau', 'Elles se mélangent', 'Ça dépend de la quantité'], reponse: 0, explication: 'Le liquide de plus faible masse volumique se place au-dessus. L\'huile, 0,92 g/mL, flotte sur l\'eau, 1,00 g/mL.' },
    { type: 'toucher', texte: 'Touche la <b>balance</b>.', cible: 'Balance', explication: 'La balance mesure une masse en grammes. Le volume, lui, se mesure à l\'éprouvette, en millilitres.' },
    { type: 'qcm', texte: 'Quel volume d\'huile (0,92 g/mL) faut-il verser pour obtenir 46 g ?', choix: ['50 mL', '42,3 mL', '46 mL', '500 mL'], reponse: 0, explication: 'V = m ÷ ρ = 46 ÷ 0,92 = 50 mL. Vérification dans l\'autre sens : 0,92 × 50 = 46 g.' },
    { type: 'qcm', texte: 'Chauffer du sucre jusqu\'au caramel, c\'est…', choix: ['une transformation chimique : de nouvelles substances apparaissent', 'un simple mélange', 'un changement d\'état, comme la fonte de la glace', 'une dissolution'], reponse: 0, avant: ouvrir('#ap-det-four'), explication: 'Le sucre disparaît, le caramel et de la vapeur d\'eau apparaissent : des réactifs sont consommés, des produits se forment. Et en récipient fermé, la masse totale se conserve (Lavoisier).' },
  ], { rejouer: () => demarrer('cours', api) });
}
