<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Opaline · Aurore boréale</title>
<link rel="icon" href="../assets/favicon-512.png" />
<link rel="stylesheet" href="../tokens.css" />
<script type="importmap">{ "imports": { "three": "/learning/vendor/three.module.js", "three/addons/": "/learning/vendor/jsm/" } }</script>
<script src="../konstrio.js"></script>
<script src="../shell.js"></script>
</head>
<body>
<script type="module">
import { creerMonde, THREE, latlon } from '../monde-base.js';

/* ====== Données de la leçon ====== */
const COULEURS = [
  { de: 80, a: 100, nom: 'violet et bleu', gaz: 'azote', hex: '#7b5cff' },
  { de: 100, a: 150, nom: 'vert', gaz: 'oxygène', hex: '#4dff8a' },
  { de: 150, a: 200, nom: 'vert pâle', gaz: 'oxygène', hex: '#9dffb0' },
  { de: 200, a: 320, nom: 'rouge', gaz: 'oxygène (très peu dense)', hex: '#ff4d5e' },
];
const LEGENDES = [
  { nom: 'Soleil', phrase: 'Il émet en permanence un vent de particules chargées.' },
  { nom: 'Vent solaire', phrase: 'Des particules chargées qui mettent un à trois jours pour atteindre la Terre.' },
  { nom: 'Champ magnétique', phrase: 'Il dévie les particules et les guide vers les pôles.' },
  { nom: 'Terre', phrase: 'Son champ magnétique la protège du vent solaire.' },
  { nom: 'Aurore', phrase: 'Les particules excitent les gaz de la haute atmosphère, qui émettent de la lumière.' },
  { nom: 'Observateur', phrase: 'Il voit l\'aurore surtout entre 60° et 75° de latitude.' },
];
let etat = { latitude: 48, altitude: 120, vent: 2, lignes: true };
let M, terre, soleil, champ, aurores = [], observateur, particules, ligneObs;

const shell = window.Konstrio.createGame({
  id: '3d-21-aurore-boreale', code: '3D·21', title: 'Aurore boréale', type: '3D', duree: '12 min',
  domain: { label: 'Physique · Lumière', color: '#8A4FD3' },
  intro: {
    greet: 'Le Soleil envoie un vent de particules. La Terre le dévie avec son champ magnétique. Près des pôles, le ciel s\'allume.',
    rule: 'Regarde comment le vent solaire suit le champ magnétique jusqu\'aux pôles, puis règle la latitude de l\'observateur et l\'altitude pour lire la couleur.',
    how: ['Glisse pour tourner la scène, molette ou deux doigts pour zoomer.', 'Touche le Soleil, le vent, le champ, l\'aurore : chaque objet a sa légende.', 'Dans le panneau, règle la latitude, l\'intensité du vent et l\'altitude.'],
    keys: 'Flèches : tourner · + et - : zoom · F : la fiche · Échap : pause.',
    objectif: 'Expliquer d\'où vient une aurore et pourquoi ses couleurs changent avec l\'altitude.',
    hint: 'La couleur dépend du gaz excité et de l\'altitude : vert vers 100 à 150 km, rouge au-dessus de 200 km.',
    why: 'La lumière du Soleil met huit minutes pour nous atteindre ; le vent solaire, lui, met un à trois jours.',
  },
  learned: ['Le vent solaire est fait de particules chargées venues du Soleil.', 'Le champ magnétique terrestre les dévie vers les pôles.', 'La couleur de l\'aurore dépend du gaz et de l\'altitude : vert (oxygène, 100 à 150 km), rouge (oxygène, au-dessus de 200 km), violet (azote, sous 100 km).'],
  onReady: init, onStart: demarrer,
});

function couleurAltitude(alt) { return COULEURS.find((c) => alt >= c.de && alt < c.a) || COULEURS[COULEURS.length - 1]; }

function init() {
  M = creerMonde(shell, { fond: 0x03050d, sol: false, ombres: false, ambiance: 0.35, soleil: { position: [-40, 8, 10], intensite: 2.2, couleur: 0xfff2d0 }, camera: { position: [0, 6, 16], cible: [0, 0, 0], min: 5, max: 60, polaire: Math.PI }, legendes: LEGENDES, libelle: 'La Terre, le Soleil et une aurore polaire' });
  const { scene, mesh, mat, legender } = M;

  // étoiles
  const pts = []; for (let i = 0; i < 1200; i += 1) { const v = new THREE.Vector3().randomDirection().multiplyScalar(180 + Math.random() * 40); pts.push(v.x, v.y, v.z); }
  const gs = new THREE.BufferGeometry(); gs.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const etoiles = new THREE.Points(gs, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 0.35, sizeAttenuation: true })); etoiles.raycast = () => {}; scene.add(etoiles);

  // Terre (texture si disponible)
  const R = 3;
  const matTerre = mat(0x3f6fb5, { rugosite: 0.8 });
  terre = mesh(new THREE.SphereGeometry(R, 64, 48), matTerre, [0, 0, 0]); terre.castShadow = false; terre.receiveShadow = false;
  new THREE.TextureLoader().load('../assets/3d/planets/2k_earth_daymap.jpg', (t) => { t.colorSpace = THREE.SRGBColorSpace; matTerre.map = t; matTerre.color.set(0xffffff); matTerre.needsUpdate = true; }, undefined, () => {});
  terre.rotation.y = -Math.PI / 2;
  legender(terre, 'Terre', LEGENDES[3].phrase);
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.04, 48, 36), new THREE.MeshBasicMaterial({ color: 0x6fb3ff, transparent: true, opacity: 0.08, side: THREE.BackSide, depthWrite: false })); atmo.raycast = () => {}; scene.add(atmo);

  // Soleil
  soleil = mesh(new THREE.SphereGeometry(4, 40, 30), new THREE.MeshBasicMaterial({ color: 0xffd36a }), [-46, 6, 10]);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(5.6, 32, 24), new THREE.MeshBasicMaterial({ color: 0xffb347, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false })); halo.position.copy(soleil.position); halo.raycast = () => {}; scene.add(halo);
  legender(soleil, 'Soleil', LEGENDES[0].phrase);

  // Champ magnétique : lignes d'un dipôle dans six plans méridiens
  champ = new THREE.Group(); scene.add(champ);
  const matLigne = new THREE.LineBasicMaterial({ color: 0x5fd4ff, transparent: true, opacity: 0.55 });
  const courbes = [];
  for (let k = 0; k < 6; k += 1) {
    const phi = k * Math.PI / 6;
    for (const L of [1.5, 2.1, 2.9, 4.0]) {
      for (const signe of [1, -1]) {
        const p = [];
        for (let lam = -80; lam <= 80; lam += 4) {
          const l = lam * Math.PI / 180; const r = L * R * Math.cos(l) * Math.cos(l); if (r < R * 1.01) continue;
          const x = r * Math.cos(l) * signe; const y = r * Math.sin(l);
          p.push(new THREE.Vector3(x * Math.cos(phi), y, x * Math.sin(phi)));
        }
        if (p.length < 3) continue;
        const g = new THREE.BufferGeometry().setFromPoints(p); const ligne = new THREE.Line(g, matLigne); champ.add(ligne);
        courbes.push(new THREE.CatmullRomCurve3(p));
      }
    }
  }
  // un tube invisible mais touchable au-dessus de l'équateur pour la légende du champ
  const touche = new THREE.Mesh(new THREE.TorusGeometry(R * 2.2, 0.35, 8, 48), new THREE.MeshBasicMaterial({ visible: false })); touche.rotation.x = Math.PI / 2; champ.add(touche);
  champ.traverse((o) => { o.userData.legende = { nom: 'Champ magnétique', phrase: LEGENDES[2].phrase }; });

  // Aurores : un rideau autour de chaque pôle, couleur selon l'altitude (exagérée ×8 pour être visible)
  const matAurore = (signe) => new THREE.ShaderMaterial({
    uniforms: { temps: { value: 0 }, intensite: { value: 0.6 }, bas: { value: new THREE.Color('#7b5cff') }, milieu: { value: new THREE.Color('#4dff8a') }, haut: { value: new THREE.Color('#ff4d5e') } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `varying vec2 vUv; uniform float temps; uniform float intensite; uniform vec3 bas; uniform vec3 milieu; uniform vec3 haut;
      void main(){ float a = vUv.y; vec3 c = a < 0.35 ? mix(bas, milieu, a / 0.35) : (a < 0.7 ? milieu : mix(milieu, haut, (a - 0.7) / 0.3));
        float rideau = 0.55 + 0.45 * sin(vUv.x * 40.0 + temps * 0.8) * sin(vUv.x * 13.0 - temps * 0.5);
        float fondu = smoothstep(0.0, 0.12, a) * (1.0 - smoothstep(0.55, 1.0, a));
        gl_FragColor = vec4(c, rideau * fondu * intensite); }`,
    transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  for (const signe of [1, -1]) {
    const lat = 68 * Math.PI / 180; const rayon = R * Math.cos(lat) * 1.02; const y0 = R * Math.sin(lat) * signe;
    const geo = new THREE.CylinderGeometry(rayon * 0.92, rayon, 1.6, 96, 1, true);
    const m = new THREE.Mesh(geo, matAurore(signe)); m.position.y = y0 + 0.8 * signe; if (signe < 0) m.rotation.x = Math.PI;
    m.userData.legende = { nom: 'Aurore', phrase: LEGENDES[4].phrase }; scene.add(m); aurores.push(m);
  }

  // Vent solaire : particules, en ligne droite puis le long d'une ligne de champ
  const N = 420; const pos = new Float32Array(N * 3); const part = [];
  for (let i = 0; i < N; i += 1) part.push(nouvelleParticule(courbes, true));
  const gp = new THREE.BufferGeometry(); gp.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  particules = new THREE.Points(gp, new THREE.PointsMaterial({ color: 0xfff0a0, size: 0.16, transparent: true, opacity: 0.9 }));
  particules.userData.legende = { nom: 'Vent solaire', phrase: LEGENDES[1].phrase }; scene.add(particules);
  const zoneVent = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 30, 12, 1, true), new THREE.MeshBasicMaterial({ visible: false })); zoneVent.rotation.z = Math.PI / 2; zoneVent.position.set(-24, 3, 5); zoneVent.userData.legende = particules.userData.legende; scene.add(zoneVent);

  // observateur
  observateur = mesh(new THREE.ConeGeometry(0.14, 0.4, 12), mat(0xffffff, { emissif: 0xffffff, intensite: 0.5 }));
  legender(observateur, 'Observateur', LEGENDES[5].phrase);
  ligneObs = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 1, 0)]), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 })); ligneObs.raycast = () => {}; scene.add(ligneObs);
  placerObservateur();

  panneaux();
  M.boucle((dt, t) => {
    aurores.forEach((a) => { a.material.uniforms.temps.value = t; a.material.uniforms.intensite.value = 0.25 + 0.3 * etat.vent; });
    terre.rotation.y += dt * 0.02; halo.scale.setScalar(1 + 0.03 * Math.sin(t * 2));
    const arr = particules.geometry.attributes.position.array; const vitesse = 6 + etat.vent * 3;
    for (let i = 0; i < part.length; i += 1) {
      const p = part[i];
      if (p.phase === 0) { p.x += dt * vitesse; if (p.x > -R * 2.6) { if (Math.random() < 0.7) { p.phase = 1; p.t = 0; p.courbe = courbes[Math.floor(Math.random() * courbes.length)]; p.sens = Math.random() < 0.5 ? 1 : -1; } else { p.phase = 2; } } arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; }
      else if (p.phase === 1) { p.t += dt * 0.35 * (1 + etat.vent * 0.2); const u = p.sens > 0 ? Math.min(1, p.t) : Math.max(0, 1 - p.t); const v = p.courbe.getPoint(u); arr[i * 3] = v.x; arr[i * 3 + 1] = v.y; arr[i * 3 + 2] = v.z; if (p.t >= 1) Object.assign(p, nouvelleParticule(courbes)); }
      else { p.x += dt * vitesse; arr[i * 3] = p.x; arr[i * 3 + 1] = p.y + (p.y > 0 ? 1 : -1) * dt * 2; arr[i * 3 + 2] = p.z; p.y = arr[i * 3 + 1]; if (p.x > 30) Object.assign(p, nouvelleParticule(courbes)); }
    }
    particules.geometry.attributes.position.needsUpdate = true;
  });
}
function nouvelleParticule(courbes, partout) {
  return { phase: 0, x: partout ? -40 + Math.random() * 30 : -40 - Math.random() * 6, y: (Math.random() - 0.5) * 7, z: (Math.random() - 0.5) * 7 + 2, t: 0, courbe: null, sens: 1 };
}
function placerObservateur() {
  const p = latlon(etat.latitude, -10, 3.05); observateur.position.copy(p); observateur.lookAt(p.clone().multiplyScalar(2)); observateur.rotateX(Math.PI / 2);
  ligneObs.geometry.setFromPoints([p, p.clone().multiplyScalar(1.5)]);
}
function visible() { return etat.latitude >= 60 && etat.latitude <= 78; }

function panneaux() {
  const c = couleurAltitude(etat.altitude);
  const p = M.panneau(`<h3>Réglages</h3>
    <label>Latitude de l'observateur <span class="mb-val" id="au-lat">${etat.latitude}°</span><input class="mb-plage" id="au-lats" type="range" min="0" max="90" step="1" value="${etat.latitude}" aria-label="Latitude"></label>
    <p id="au-vis" class="mb-carte"></p>
    <label>Intensité du vent solaire <span class="mb-val" id="au-vent">${['', 'faible', 'moyenne', 'forte'][etat.vent]}</span><input class="mb-plage" id="au-vents" type="range" min="1" max="3" step="1" value="${etat.vent}" aria-label="Intensité du vent solaire"></label>
    <button class="mb-bouton" id="au-lignes" aria-pressed="true">Lignes du champ magnétique</button>
    <h3>Altitude et couleur</h3>
    <label>Altitude <span class="mb-val" id="au-alt">${etat.altitude} km</span><input class="mb-plage" id="au-alts" type="range" min="80" max="320" step="5" value="${etat.altitude}" aria-label="Altitude"></label>
    <p class="mb-carte" id="au-coul"></p>
    <div class="mb-mesures"><span>Lumière Soleil → Terre</span><b>8 min</b><span>Vent solaire Soleil → Terre</span><b>1 à 3 jours</b><span>Distance</span><b>150 millions de km</b></div>`);
  const maj = () => {
    p.querySelector('#au-lat').textContent = etat.latitude + '°';
    p.querySelector('#au-vis').textContent = visible() ? 'À ' + etat.latitude + '° de latitude, l\'aurore est visible : c\'est la zone des ovales auroraux.' : (etat.latitude > 78 ? 'Au pôle même, l\'aurore est plus rare : l\'ovale passe autour, pas au-dessus.' : 'À ' + etat.latitude + '°, l\'aurore n\'est visible que lors des tempêtes solaires les plus fortes.');
    const cc = couleurAltitude(etat.altitude); const zone = p.querySelector('#au-coul'); zone.textContent = 'À ' + etat.altitude + ' km : lumière ' + cc.nom + ', émise par l\'' + cc.gaz + '.'; zone.style.borderLeft = '6px solid ' + cc.hex;
    p.querySelector('#au-alt').textContent = etat.altitude + ' km';
    p.querySelector('#au-vent').textContent = ['', 'faible', 'moyenne', 'forte'][etat.vent];
  };
  p.querySelector('#au-lats').addEventListener('input', (e) => { etat.latitude = Number(e.target.value); placerObservateur(); maj(); });
  p.querySelector('#au-vents').addEventListener('input', (e) => { etat.vent = Number(e.target.value); maj(); });
  p.querySelector('#au-alts').addEventListener('input', (e) => { etat.altitude = Number(e.target.value); maj(); });
  p.querySelector('#au-lignes').addEventListener('click', (e) => { etat.lignes = !etat.lignes; champ.visible = etat.lignes; e.currentTarget.setAttribute('aria-pressed', String(etat.lignes)); });
  maj();
}

function demarrer(mode, api) {
  if (mode !== 'cours') { api.say('Explore : touche le Soleil, le vent, le champ magnétique, l\'aurore. Le panneau règle la latitude et l\'altitude.', 'joyeux'); return; }
  api.defis([
    { type: 'qcm', texte: 'D\'où viennent les particules qui font l\'aurore ?', choix: ['Du Soleil : le vent solaire', 'De la Lune', 'Du centre de la Terre', 'Des nuages'], reponse: 0, explication: 'Le Soleil émet un vent de particules chargées, qui met un à trois jours pour arriver.' },
    { type: 'toucher', texte: 'Touche le <b>champ magnétique</b> de la Terre (les lignes bleues).', cible: 'Champ magnétique', explication: 'Le champ magnétique dévie les particules et les guide vers les deux pôles.' },
    { type: 'verifier', texte: 'Place l\'observateur là où l\'aurore est visible : latitude entre 60° et 78°.', bouton: 'C\'est réglé', verifier: () => visible(), indice: 'Utilise le curseur de latitude. La zone des aurores commence vers 60°.', explication: 'Les aurores dessinent un ovale autour de chaque pôle magnétique, vers 60° à 75° de latitude.' },
    { type: 'qcm', texte: 'Quelle couleur apparaît au-dessus de 200 km d\'altitude ?', choix: ['Rouge', 'Vert', 'Bleu', 'Jaune'], reponse: 0, explication: 'Très haut, l\'oxygène est rare et émet une lumière rouge. Le vert, le plus fréquent, vient de l\'oxygène entre 100 et 150 km.' },
    { type: 'verifier', texte: 'Règle l\'altitude dans la zone verte, entre 100 et 150 km.', bouton: 'C\'est réglé', verifier: () => etat.altitude >= 100 && etat.altitude < 150, indice: 'Le curseur Altitude, dans le panneau. Lis la couleur annoncée.', explication: 'Entre 100 et 150 km, l\'oxygène excité émet du vert : la couleur la plus courante des aurores.' },
    { type: 'qcm', texte: 'Pourquoi les aurores se forment-elles près des pôles ?', choix: ['Les lignes du champ magnétique y plongent vers le sol', 'Il y fait plus froid', 'Le Soleil y est plus proche', 'La Terre y tourne plus vite'], reponse: 0, explication: 'Les particules suivent les lignes du champ. Près des pôles, ces lignes entrent dans l\'atmosphère : les particules y rencontrent les gaz.' },
    { type: 'qcm', texte: 'La lumière du Soleil met combien de temps pour arriver sur Terre ? (300 000 km/s, 150 millions de km)', choix: ['Environ 8 minutes', 'Environ 8 secondes', 'Environ 8 heures', 'Environ 8 jours'], reponse: 0, explication: '150 000 000 ÷ 300 000 = 500 secondes, soit un peu plus de 8 minutes. Le vent solaire, bien plus lent, met un à trois jours.' },
  ], { rejouer: () => demarrer('cours', api) });
}
</script>
</body>
</html>
