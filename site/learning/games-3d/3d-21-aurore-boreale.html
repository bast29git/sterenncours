<script type="module">
import { creerMonde, THREE, latlon } from '../monde-base.js';

/*
   Monde 21 : l'aurore boréale.
   La Terre (jour, lumières de nuit, nuages, halo d'atmosphère), le Soleil et son vent de particules, le champ
   magnétique en lignes de dipôle, et deux ovales d'aurores faits de trois rideaux chacun : ondulation, rayons
   verticaux, couleur selon l'altitude (violet sous 100 km, vert de 100 à 150, vert pâle, rouge au-dessus de 200).
   Nolwenn, l'observatrice, se tient au sol avec sa lampe frontale : la vue « depuis le sol » bascule le monde
   pour poser la caméra sur la Terre, à sa latitude, le regard vers le ciel.
   La mission « La chasse aux aurores » : régler latitude, vent et altitude pour voir une aurore verte, puis rouge,
   puis violette ; chaque réglage est vérifié et tenu une seconde avant d'être validé.
   Les altitudes sont exagérées (×8) pour rester visibles à l'échelle du globe.
*/
/* ====== Données de la leçon ====== */
const COULEURS = [
  { de: 80, a: 100, nom: 'violet et bleu', gaz: 'azote', hex: '#7b5cff' },
  { de: 100, a: 150, nom: 'vert', gaz: 'oxygène', hex: '#4dff8a' },
  { de: 150, a: 200, nom: 'vert pâle', gaz: 'oxygène', hex: '#9dffb0' },
  { de: 200, a: 320, nom: 'rouge', gaz: 'oxygène (très peu dense)', hex: '#ff4d5e' },
];
const LEGENDES = [
  { nom: 'Soleil', phrase: 'Il émet en permanence un vent de particules chargées.' },
  { nom: 'Vent solaire', phrase: 'Des particules chargées qui mettent un à trois jours pour atteindre la Terre.' },
  { nom: 'Champ magnétique', phrase: 'Il dévie les particules et les guide vers les pôles.' },
  { nom: 'Terre', phrase: 'Son champ magnétique la protège du vent solaire.' },
  { nom: 'Aurore', phrase: 'Les particules excitent les gaz de la haute atmosphère, qui émettent de la lumière.' },
  { nom: 'Observateur', phrase: 'Il voit l\'aurore surtout entre 60° et 75° de latitude.' },
  { nom: 'Lampe frontale', phrase: 'Rouge ou faible, pour garder les yeux habitués au noir : l\'aurore se voit mieux.' },
];
/* Les trois aurores de la chasse : ce qu'il faut régler, et ce qu'on dit quand c'est réussi. */
const CHASSE = [
  { id: 'verte', nom: 'Aurore verte', hex: '#2AA98C', regle: 'latitude entre 60° et 78°, altitude entre 100 et 150 km, n\'importe quel vent', altMin: 100, altMax: 149, ventMin: 1, latMin: 60, latMax: 78, bravo: 'Vert : l\'oxygène entre 100 et 150 km. La couleur la plus courante des aurores.' },
  { id: 'rouge', nom: 'Aurore rouge', hex: '#E63329', regle: 'latitude entre 60° et 78°, altitude de 200 km ou plus, vent moyen ou fort', altMin: 200, altMax: 320, ventMin: 2, latMin: 60, latMax: 78, bravo: 'Rouge : l\'oxygène très haut, au-dessus de 200 km, quand le vent solaire est assez fort.' },
  { id: 'violette', nom: 'Aurore violette', hex: '#8A4FD3', regle: 'latitude entre 60° et 78°, altitude sous 100 km, vent fort', altMin: 80, altMax: 99, ventMin: 3, latMin: 60, latMax: 78, bravo: 'Violet : l\'azote, sous 100 km. Seules les particules les plus rapides descendent si bas : il faut un vent fort.' },
];
let etat = { latitude: 48, altitude: 120, vent: 2, lignes: true };
let M, monde, terre, soleil, champ, aurores = [], auroresSol = [], cielSol = null, observateur, particules, ligneObs, neige, lumAurore, lampe, faisceau, panneau = null;
let mission = null, chasseCourante = -1, tenuDepuis = 0, vueSol = false, marche = null, optMarche = null, qCible = new THREE.Quaternion(), modeJeu = 'detente', ambVent = null, crepite = 0, accel = 1;

const shell = window.Konstrio.createGame({
  id: '3d-21-aurore-boreale', code: '3D·21', title: 'Aurore boréale', type: '3D', duree: '12 min',
  domain: { label: 'Physique · Lumière', color: '#8A4FD3' },
  intro: {
    greet: 'Le Soleil envoie un vent de particules. La Terre le dévie avec son champ magnétique. Près des pôles, le ciel s\'allume.',
    rule: 'Regarde comment le vent solaire suit le champ magnétique jusqu\'aux pôles, puis règle la latitude de l\'observatrice, le vent et l\'altitude pour lire la couleur. La mission : voir une aurore verte, puis rouge, puis violette.',
    how: ['Glisse pour tourner la scène, molette ou deux doigts pour zoomer. « Depuis le sol » te pose à côté de Nolwenn, le regard vers le ciel : glisse pour regarder autour.', 'Touche le Soleil, le vent, le champ, l\'aurore : chaque objet a sa légende.', 'Dans le panneau, règle la latitude, l\'intensité du vent et l\'altitude : le rideau change de couleur.', 'La chasse aux aurores : trois couleurs à obtenir, chacune avec ses réglages. Le panneau dit ce qui manque.'],
    keys: 'Flèches : tourner · + et - : zoom · F : la fiche · Échap : pause.',
    objectif: 'Expliquer d\'où vient une aurore et pourquoi ses couleurs changent avec l\'altitude.',
    hint: 'La couleur dépend du gaz excité et de l\'altitude : vert vers 100 à 150 km, rouge au-dessus de 200 km.',
    why: 'La lumière du Soleil met huit minutes pour nous atteindre ; le vent solaire, lui, met un à trois jours.',
  },
  learned: ['Le vent solaire est fait de particules chargées venues du Soleil.', 'Le champ magnétique terrestre les dévie vers les pôles.', 'La couleur de l\'aurore dépend du gaz et de l\'altitude : vert (oxygène, 100 à 150 km), rouge (oxygène, au-dessus de 200 km), violet (azote, sous 100 km).'],
  onReady: init, onStart: demarrer,
});

function couleurAltitude(alt) { return COULEURS.find((c) => alt >= c.de && alt < c.a) || COULEURS[COULEURS.length - 1]; }
const R = 3; const U = { dirSoleilVue: { value: new THREE.Vector3(0, 0, 1) } };
const etroit = () => window.matchMedia('(max-width: 720px)').matches;
const dirObservateur = () => latlon(etat.latitude, -10, 1).normalize();

function textureHalo() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128); g.addColorStop(0, 'rgba(255,250,235,1)'); g.addColorStop(0.2, 'rgba(255,235,190,0.9)'); g.addColorStop(0.45, 'rgba(255,190,110,0.3)'); g.addColorStop(1, 'rgba(255,170,80,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
/* Le rideau d'aurore : un cylindre ouvert, ondulé par le sommet, coloré par l'altitude et strié de rayons verticaux. */
function matAurore(graine, force) {
  return new THREE.ShaderMaterial({
    uniforms: { temps: { value: 0 }, intensite: { value: 0.6 }, altChoisie: { value: 120 }, vent: { value: 2 }, graine: { value: graine }, force: { value: force } },
    vertexShader: `varying vec2 vUv; uniform float temps; uniform float graine;
      void main(){ vUv = uv; vec3 p = position; float ang = atan(p.z, p.x);
        float w = sin(ang * 5.0 + temps * 0.35 + graine) * 0.05 + sin(ang * 11.0 - temps * 0.5 + graine * 1.7) * 0.025 + sin(ang * 23.0 + temps * 0.21) * 0.012;
        float k = 1.0 - uv.y * 0.55; vec2 rad = normalize(p.xz); p.xz += rad * w * k;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0); }`,
    fragmentShader: `varying vec2 vUv; uniform float temps; uniform float intensite; uniform float altChoisie; uniform float vent; uniform float graine; uniform float force;
      void main(){
        float ang = vUv.x * 6.2831853; float alt = 80.0 + vUv.y * 240.0;
        float r1 = 0.5 + 0.5 * sin(ang * 46.0 + temps * 0.7 + graine + 2.0 * sin(ang * 6.0 - temps * 0.23));
        float r2 = 0.5 + 0.5 * sin(ang * 19.0 - temps * 0.45 + graine * 2.0);
        float r3 = 0.65 + 0.35 * sin(ang * 9.0 + temps * 0.17 + graine);
        float rayons = (0.35 + 0.65 * r1 * r1) * (0.5 + 0.5 * r2) * r3;
        float voile = 0.55 + 0.45 * r3; // une nappe douce derrière les rayons
        float violet = exp(-pow((alt - 92.0) / 14.0, 2.0)) * (vent >= 2.5 ? 1.0 : 0.12);
        float vert = exp(-pow((alt - 122.0) / 28.0, 2.0));
        float pale = exp(-pow((alt - 175.0) / 30.0, 2.0)) * 0.5;
        float rouge = smoothstep(190.0, 230.0, alt) * exp(-pow((alt - 255.0) / 60.0, 2.0)) * (vent >= 1.5 ? 1.0 : 0.2);
        float choisie = exp(-pow((alt - altChoisie) / 28.0, 2.0));
        vec3 c = vec3(0.55, 0.3, 1.0) * violet * (0.45 + 1.4 * choisie) + vec3(0.25, 1.0, 0.45) * vert * (0.55 + 1.2 * choisie) + vec3(0.6, 1.0, 0.7) * pale * (0.45 + choisie) + vec3(1.0, 0.25, 0.3) * rouge * (0.45 + 1.5 * choisie);
        float fondu = smoothstep(0.0, 0.05, vUv.y) * (1.0 - smoothstep(0.55, 1.0, vUv.y));
        float a = (violet + vert + pale + rouge) * 0.8;
        float lum = (0.45 * voile + 0.9 * rayons) * intensite * force;
        gl_FragColor = vec4(c * lum * 1.35, clamp(a * lum * fondu, 0.0, 1.0)); }`,
    transparent: true, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending,
  });
}

function init() {
  const mobile = window.matchMedia('(max-width: 640px), (pointer: coarse)').matches;
  M = creerMonde(shell, {
    fond: 0x02040c, hdri: false, sol: false, ombres: false, ambiance: 0.3,
    soleil: { position: [-40, 8, 10], intensite: 2.2, couleur: 0xfff2d0 },
    camera: { position: [0, 6, 16], cible: [0, 0, 0], min: 0.01, max: 60, polaire: Math.PI, near: 0.02 },
    rendu: { bloom: { force: 0.75, rayon: 0.65, seuil: 0.8 } },
    legendes: LEGENDES, libelle: 'La Terre, le Soleil, le champ magnétique, deux ovales d\'aurores et une observatrice au sol avec sa lampe frontale',
  });
  const { scene, mesh, mat, legender } = M;
  M.controls.minDistance = 5;
  const adapter = () => { const asp = M.stage.clientWidth / Math.max(1, M.stage.clientHeight); M.camera.fov = vueSol ? (asp < 0.9 ? 84 : 72) : (asp < 0.9 ? 64 : 50); M.camera.updateProjectionMatrix(); };
  adapter(); new ResizeObserver(adapter).observe(M.stage); M.adapter = adapter;
  const charg = new THREE.TextureLoader(); const B = '../assets/3d/planets/';
  const texture = (nom, srgb, fait) => charg.load(B + nom, (t) => { if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (fait) fait(t); }, undefined, () => {});
  monde = new THREE.Group(); scene.add(monde); // tout ce qui bascule pour la vue depuis le sol

  /* ---- Le ciel : Voie lactée discrète, étoiles de deux tailles ---- */
  const ciel = new THREE.Mesh(new THREE.SphereGeometry(190, 48, 32), new THREE.MeshBasicMaterial({ color: 0x8b93a8, side: THREE.BackSide, fog: false })); ciel.raycast = () => {}; ciel.rotation.y = 2.1; ciel.rotation.z = 0.5; scene.add(ciel);
  texture('2k_stars_milky_way.jpg', true, (t) => { ciel.material.map = t; ciel.material.needsUpdate = true; });
  const etoilesDe = (n, taille, couleur) => { const pts = []; for (let i = 0; i < n; i += 1) { const v = new THREE.Vector3().randomDirection().multiplyScalar(170 + Math.random() * 15); pts.push(v.x, v.y, v.z); } const gs = new THREE.BufferGeometry(); gs.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)); const e = new THREE.Points(gs, new THREE.PointsMaterial({ color: couleur, size: taille, sizeAttenuation: true, transparent: true, opacity: 0.95 })); e.raycast = () => {}; scene.add(e); return e; };
  etoilesDe(1600, 0.4, 0xcfd8ff); const etoilesVives = etoilesDe(140, 0.9, 0xfff3dc);

  /* ---- La Terre : texture, lumières de nuit masquées côté jour, nuages, limbe et halo d'atmosphère ---- */
  const matTerre = new THREE.MeshStandardMaterial({ color: 0x3f6fb5, roughness: 0.8, metalness: 0, emissive: 0xffffff, emissiveIntensity: 0 });
  matTerre.onBeforeCompile = (sh) => {
    sh.uniforms.dirSoleilVue = U.dirSoleilVue;
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform vec3 dirSoleilVue;')
      .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\n float nuit = smoothstep(0.12, -0.18, dot(normalize(vNormal), dirSoleilVue)); totalEmissiveRadiance *= nuit;')
      .replace('#include <opaque_fragment>', ' float limbe = pow(1.0 - max(dot(normalize(vNormal), normalize(vViewPosition)), 0.0), 3.5); float jour = clamp(dot(normalize(vNormal), dirSoleilVue) * 0.6 + 0.5, 0.0, 1.0); outgoingLight += vec3(0.30, 0.55, 1.0) * limbe * (0.25 + 0.75 * jour) * 0.6;\n#include <opaque_fragment>');
  };
  terre = mesh(new THREE.SphereGeometry(R, 96, 64), matTerre, [0, 0, 0], monde); terre.castShadow = false; terre.receiveShadow = false; terre.rotation.y = -Math.PI / 2;
  texture(mobile ? '2k_earth_daymap.jpg' : 'hires_terre.jpg', true, (t) => { matTerre.map = t; matTerre.color.set(0xffffff); matTerre.needsUpdate = true; });
  texture('2k_earth_nightmap.jpg', true, (t) => { matTerre.emissiveMap = t; matTerre.emissiveIntensity = 1.0; matTerre.needsUpdate = true; });
  legender(terre, 'Terre', LEGENDES[3].phrase);
  const nuages = new THREE.Mesh(new THREE.SphereGeometry(R * 1.012, 72, 48), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false, roughness: 1 })); nuages.raycast = () => {}; monde.add(nuages);
  texture('2k_earth_clouds.jpg', false, (t) => { nuages.material.alphaMap = t; nuages.material.opacity = 0.7; nuages.material.needsUpdate = true; });
  const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.08, 64, 48), new THREE.ShaderMaterial({
    uniforms: { couleur: { value: new THREE.Color(0x4f9cff) }, dirSoleilVue: U.dirSoleilVue },
    vertexShader: 'varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix * normal); vec4 mv = modelViewMatrix * vec4(position, 1.0); vP = mv.xyz; gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'varying vec3 vN; varying vec3 vP; uniform vec3 couleur; uniform vec3 dirSoleilVue; void main(){ vec3 v = normalize(-vP); float d = dot(vN, v); float i = pow(clamp(0.72 - d, 0.0, 1.0), 3.2) * 1.4; float jour = clamp(dot(vN, dirSoleilVue) * 0.6 + 0.55, 0.0, 1.0); gl_FragColor = vec4(couleur * i * (0.2 + 0.8 * jour), i); }',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.FrontSide,
  })); atmo.raycast = () => {}; atmo.renderOrder = 2; monde.add(atmo);

  /* ---- Le Soleil : sphère texturée, halo, et la lumière qui vient de lui ---- */
  soleil = mesh(new THREE.SphereGeometry(4, 40, 30), new THREE.MeshBasicMaterial({ color: 0xffd36a }), [-46, 6, 10], monde);
  texture('2k_sun.jpg', true, (t) => { soleil.material.map = t; soleil.material.color.set(0xffe9a8); soleil.material.needsUpdate = true; });
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: textureHalo(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })); halo.position.copy(soleil.position); halo.scale.set(19, 19, 1); halo.raycast = () => {}; monde.add(halo);
  legender(soleil, 'Soleil', LEGENDES[0].phrase);
  M.soleil.parent.remove(M.soleil); monde.add(M.soleil); M.soleil.position.set(-40, 8, 10); M.soleil.target.position.set(0, 0, 0); monde.add(M.soleil.target);

  /* ---- Le champ magnétique : lignes d'un dipôle dans six plans méridiens ---- */
  champ = new THREE.Group(); monde.add(champ);
  const matLigne = new THREE.LineBasicMaterial({ color: 0x5fd4ff, transparent: true, opacity: 0.5 });
  const courbes = [];
  for (let k = 0; k < 6; k += 1) {
    const phi = k * Math.PI / 6;
    for (const L of [1.5, 2.1, 2.9, 4.0]) {
      for (const signe of [1, -1]) {
        const p = [];
        for (let lam = -80; lam <= 80; lam += 4) {
          const l = lam * Math.PI / 180; const r = L * R * Math.cos(l) * Math.cos(l); if (r < R * 1.01) continue;
          const x = r * Math.cos(l) * signe; const y = r * Math.sin(l);
          p.push(new THREE.Vector3(x * Math.cos(phi), y, x * Math.sin(phi)));
        }
        if (p.length < 3) continue;
        const g = new THREE.BufferGeometry().setFromPoints(p); const ligne = new THREE.Line(g, matLigne); champ.add(ligne);
        courbes.push(new THREE.CatmullRomCurve3(p));
      }
    }
  }
  const touche = new THREE.Mesh(new THREE.TorusGeometry(R * 2.2, 0.35, 8, 48), new THREE.MeshBasicMaterial({ visible: false })); touche.rotation.x = Math.PI / 2; champ.add(touche);
  champ.traverse((o) => { o.userData.legende = { nom: 'Champ magnétique', phrase: LEGENDES[2].phrase }; });

  /* ---- Les aurores : trois rideaux par pôle, ondulés, rayés, colorés par l'altitude ---- */
  for (const signe of [1, -1]) {
    [[1.0, 1.0, 1.6, 0.0], [0.955, 0.6, 1.45, 2.4], [1.055, 0.45, 1.75, 4.1]].forEach(([k, force, haut, graine], n) => {
      const lat = 68 * Math.PI / 180; const rayon = R * Math.cos(lat) * 1.02 * k; const y0 = R * Math.sin(lat) * signe;
      const geo = new THREE.CylinderGeometry(rayon * 0.9, rayon, haut, 128, 24, true);
      const m = new THREE.Mesh(geo, matAurore(graine + (signe < 0 ? 7 : 0), force)); m.position.y = y0 + haut / 2 * signe; if (signe < 0) m.rotation.x = Math.PI;
      m.renderOrder = 5 + n; m.userData.legende = { nom: 'Aurore', phrase: LEGENDES[4].phrase }; if (n > 0) m.raycast = () => {}; monde.add(m); aurores.push(m);
    });
  }
  lumAurore = new THREE.PointLight(0x4dff8a, 0, 3.5, 1.6); monde.add(lumAurore);
  // depuis le sol : trois rideaux en arc dans le ciel du nord, à bonne distance, les mêmes couleurs
  cielSol = new THREE.Group(); cielSol.position.set(0, R, 0); cielSol.visible = false; scene.add(cielSol);
  [[7.0, 1.0, 2.6, 1.3, 0], [6.3, 0.55, 2.2, 3.9, 0.25], [7.8, 0.45, 3.0, 5.2, -0.1]].forEach(([rayon, force, haut, graine, decal], n) => {
    const geo = new THREE.CylinderGeometry(rayon * 0.92, rayon, haut, 128, 24, true, -Math.PI * 0.45, Math.PI * 0.9);
    const m = new THREE.Mesh(geo, matAurore(graine + 11, force)); m.position.set(0, 1.1 + haut / 2, -9); m.renderOrder = 5 + n; m.raycast = () => {}; m.userData.sol = true; m.userData.haut = haut; m.userData.decal = decal; cielSol.add(m); auroresSol.push(m);
  });
  const toucheSol = new THREE.Mesh(new THREE.CylinderGeometry(7.4, 7.4, 3.2, 32, 1, true, -Math.PI * 0.45, Math.PI * 0.9), new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide })); toucheSol.position.set(0, 2.6, -9); toucheSol.userData.legende = { nom: 'Aurore', phrase: LEGENDES[4].phrase }; cielSol.add(toucheSol);

  /* ---- Le vent solaire : particules, en ligne droite puis le long d'une ligne de champ ---- */
  const N = 420; const pos = new Float32Array(N * 3); const part = [];
  for (let i = 0; i < N; i += 1) part.push(nouvelleParticule(courbes, true));
  const gp = new THREE.BufferGeometry(); gp.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  particules = new THREE.Points(gp, new THREE.PointsMaterial({ color: 0xfff0a0, size: 0.16, transparent: true, opacity: 0.9 }));
  particules.userData.legende = { nom: 'Vent solaire', phrase: LEGENDES[1].phrase }; monde.add(particules);
  const zoneVent = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 30, 12, 1, true), new THREE.MeshBasicMaterial({ visible: false })); zoneVent.rotation.z = Math.PI / 2; zoneVent.position.set(-24, 3, 5); zoneVent.userData.legende = particules.userData.legende; monde.add(zoneVent);

  /* ---- Nolwenn, l'observatrice : parka, bonnet, lampe frontale (vraie lumière) et son champ de neige ---- */
