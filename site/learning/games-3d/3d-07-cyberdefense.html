<style>
  .cy-panel { position:absolute; z-index:20; background:color-mix(in srgb,var(--surface) 88%,transparent); border:1px solid var(--border); border-radius:14px; box-shadow:var(--shadow-md); backdrop-filter:blur(12px); }
  /* Télémétrie SOC (haut-gauche) */
  .cy-tel { top:14px; left:14px; width:214px; padding:13px; display:flex; flex-direction:column; gap:11px; }
  .cy-tel h3 { font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-muted); margin:0; display:flex; align-items:center; gap:6px; }
  .cy-tel h3 .dot { width:7px; height:7px; border-radius:999px; background:#35E08A; box-shadow:0 0 8px #35E08A; }
  .cy-post { display:flex; flex-direction:column; gap:5px; }
  .cy-post .top { display:flex; justify-content:space-between; align-items:baseline; }
  .cy-post .lbl { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-muted); }
  .cy-post .num { font-family:var(--font-data); font-weight:800; font-size:26px; line-height:1; }
  .cy-postbar { height:9px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
  .cy-postbar i { display:block; height:100%; width:0; border-radius:6px; transition:width .35s, background .35s; background:linear-gradient(90deg,#E63329,#F5A623,#35E08A); }
  .cy-metric { display:flex; flex-direction:column; gap:4px; }
  .cy-mrow { display:flex; justify-content:space-between; align-items:baseline; }
  .cy-mrow .k { color:var(--fg-muted); font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.03em; }
  .cy-mrow .v { font-family:var(--font-data); font-weight:800; font-size:15px; }
  .cy-status { font-size:11px; color:var(--fg-muted); line-height:1.4; font-family:var(--font-mono); border-top:1px solid var(--border); padding-top:9px; }
  /* Barre d'actions (haut-centre) */
  .cy-actions { top:14px; left:50%; transform:translateX(-50%); padding:9px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; max-width:min(66vw,760px); }
  .cy-ab { font-family:var(--font-body); font-weight:700; font-size:12px; min-height:38px; padding:0 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg); cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px; }
  .cy-ab:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .cy-ab:focus-visible { outline:none; box-shadow:var(--ring); }
  .cy-ab[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .cy-ab.danger { background:linear-gradient(135deg,#E63329,#a01810); border-color:transparent; color:#fff; }
  .cy-ab.danger:hover { box-shadow:0 8px 22px rgba(230,51,41,.4); }
  .cy-ab.go { background:linear-gradient(135deg,#1E8C7A,#0f5a4d); border-color:transparent; color:#fff; }
  /* Dock des remparts (bas-centre) */
  .cy-dock { bottom:16px; left:50%; transform:translateX(-50%); padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; align-items:center; max-width:96vw; }
  .cy-dock .cap { font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--fg-muted); }
  .cy-chips { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .cy-chip { font-family:var(--font-body); font-weight:700; font-size:12px; min-height:44px; padding:4px 12px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg); cursor:pointer; transition:.15s; display:inline-flex; flex-direction:column; align-items:center; gap:1px; line-height:1.15; position:relative; }
  .cy-chip .ic { font-size:16px; }
  .cy-chip .nm { font-size:10.5px; }
  .cy-chip:hover { transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .cy-chip:focus-visible { outline:none; box-shadow:var(--ring); }
  .cy-chip[aria-pressed="true"] { color:#fff; border-color:transparent; box-shadow:0 6px 18px rgba(0,0,0,.28); }
  .cy-chip .led { position:absolute; top:5px; right:6px; width:7px; height:7px; border-radius:999px; background:var(--fg-muted); opacity:.4; }
  .cy-chip[aria-pressed="true"] .led { background:#fff; opacity:1; box-shadow:0 0 7px #fff; }
  /* Fiche (droite) */
  .cy-info { right:14px; top:14px; width:322px; padding:0; overflow:hidden; transform:translateX(130%); transition:transform .45s cubic-bezier(.22,1,.36,1); max-height:calc(100% - 28px); display:flex; flex-direction:column; z-index:30; }
  .cy-info.show { transform:none; }
  .cy-hd { padding:16px 18px; color:#fff; position:relative; flex:none; display:flex; gap:12px; align-items:center; }
  .cy-hd .ico { width:46px; height:46px; border-radius:12px; background:rgba(255,255,255,.2); display:grid; place-items:center; font-size:24px; flex:none; }
  .cy-hd h2 { font-family:var(--font-title); font-weight:800; font-size:20px; margin:0; line-height:1.1; }
  .cy-hd .sub { font-family:var(--font-mono); font-size:10.5px; opacity:.92; text-transform:uppercase; letter-spacing:.04em; }
  .cy-x { position:absolute; top:12px; right:12px; width:28px; height:28px; border:none; border-radius:8px; background:rgba(255,255,255,.25); color:#fff; cursor:pointer; font-size:16px; }
  .cy-body { padding:14px 18px 18px; overflow:auto; }
  .cy-body p { font-size:13.5px; line-height:1.6; margin:0 0 9px; color:var(--fg); }
  .cy-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin:0 0 12px; }
  .cy-st .k { font-family:var(--font-mono); font-size:9.5px; letter-spacing:.03em; text-transform:uppercase; color:var(--fg-muted); }
  .cy-st .v { font-family:var(--font-data); font-weight:700; font-size:13.5px; }
  .cy-sec { font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-text); margin:2px 0 8px; }
  .cy-block { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
  .cy-tag { font-family:var(--font-mono); font-size:10.5px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg); border-radius:999px; padding:3px 9px; display:inline-flex; gap:5px; align-items:center; }
  .cy-tag .d { width:8px; height:8px; border-radius:999px; }
  .cy-fun { background:var(--accent-weak); border-radius:10px; padding:11px 13px; font-size:13px; line-height:1.5; color:var(--accent-text); }
  .cy-act-btn { width:100%; margin-top:12px; font-family:var(--font-body); font-weight:800; font-size:14px; min-height:44px; border-radius:11px; border:none; color:#fff; cursor:pointer; }
  /* Étiquettes flottantes */
  .cy-label { position:absolute; transform:translate(-50%,-50%); font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:var(--fg); background:color-mix(in srgb,var(--surface) 78%,transparent); padding:3px 8px; border-radius:7px; pointer-events:none; z-index:15; border:1px solid var(--border); white-space:nowrap; display:flex; align-items:center; gap:5px; transition:opacity .2s; }
  .cy-label .d { width:8px; height:8px; border-radius:999px; flex:none; }
  .cy-label.off { opacity:.5; }
  .cy-label.off .d { opacity:.35; }
  /* Hint */
  .cy-hint { position:absolute; bottom:96px; left:50%; transform:translateX(-50%); z-index:18; font-size:12px; color:var(--fg-muted); background:color-mix(in srgb,var(--surface) 85%,transparent); border:1px solid var(--border); padding:7px 14px; border-radius:999px; pointer-events:none; max-width:88vw; text-align:center; }
  /* Quiz (mode Cours) */
  .cy-quiz { top:16px; left:50%; transform:translateX(-50%); z-index:22; background:var(--accent); color:#fff; padding:12px 18px; border-radius:14px; box-shadow:var(--shadow-lg); display:flex; flex-direction:column; gap:7px; align-items:center; max-width:min(92vw,520px); text-align:center; }
  .cy-quiz .qn { font-family:var(--font-data); background:rgba(255,255,255,.22); border-radius:999px; padding:3px 11px; font-size:12px; }
  .cy-quiz b { font-size:15px; }
  .cy-quiz .ask { font-size:13px; opacity:.96; line-height:1.35; }
  .cy-qrow { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:2px; }
  .cy-qo { font-family:var(--font-body); font-weight:700; font-size:13px; min-height:42px; padding:0 14px; border-radius:10px; border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.18); color:#fff; cursor:pointer; }
  .cy-qo:hover { background:rgba(255,255,255,.32); }
  @media (max-width:760px){
    .cy-tel { width:158px; padding:10px; gap:8px; }
    .cy-post .num { font-size:21px; }
    .cy-info { width:min(322px,90vw); }
    .cy-actions { max-width:94vw; }
    .cy-chip { min-height:46px; }
  }
  @media (prefers-reduced-motion: reduce){ .cy-info { transition:none; } }
</style>
</head>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

const REDUCED = window.Konstrio.REDUCED;

/* ====== REMPARTS (défense en profondeur, du plus externe au cœur) ====== */
const DEF = [
  { id:'awareness', r:14.0, ang:0.55, icon:'🎓', color:'#F5A623', name:'Sensibilisation', sub:'Le facteur humain',
    stats:[['Cible','les utilisateurs'],['Contre','hameçonnage, arnaques'],['Outil','formation, tests'],['Effet','réflexe de méfiance'],['Coût','faible'],['Rôle','1ʳᵉ ligne humaine']],
    desc:["La grande majorité des cyberattaques commencent par un humain piégé : un faux e-mail, un lien trompeur. La sensibilisation apprend à repérer ces pièges.","On entraîne les équipes à vérifier l'expéditeur, à ne jamais donner son mot de passe et à signaler un message douteux. Un utilisateur averti est un rempart."],
    fun:"On estime que plus de 8 attaques sur 10 exploitent d'abord une erreur humaine, pas une faille technique.",
    blocks:['phishing'] },
  { id:'firewall', r:12.0, ang:1.35, icon:'🧱', color:'#FF8A3D', name:'Pare-feu', sub:'Filtrage du trafic',
    stats:[['Rôle','filtrer les connexions'],['Bloque','trafic non autorisé'],['Laisse passer','trafic légitime'],['Règles','listes de contrôle'],['Position','à l\'entrée du réseau'],['Contre','DDoS, scans']],
    desc:["Le pare-feu est le mur d'enceinte du réseau : il inspecte chaque connexion entrante et sortante et n'autorise que ce qui est prévu par ses règles.","Face à un déluge de requêtes (DDoS), il filtre et absorbe le trafic illégitime pour garder le service accessible aux vrais utilisateurs."],
    fun:"Un pare-feu d'entreprise peut examiner des millions de connexions par seconde, en silence, jour et nuit.",
    blocks:['ddos','scan'] },
  { id:'ids', r:10.5, ang:2.2, icon:'📡', color:'#8b5be0', name:'IDS / IPS', sub:'Détection d\'intrusion',
    stats:[['Rôle','repérer l\'anormal'],['IDS','détecte et alerte'],['IPS','détecte et bloque'],['Analyse','comportements suspects'],['Contre','intrusions, scans'],['Complément','du pare-feu']],
    desc:["L'IDS/IPS surveille le trafic à la recherche de comportements anormaux : un scan de ports, une connexion inhabituelle, une signature d'attaque connue.","L'IDS lève l'alerte ; l'IPS va plus loin et coupe automatiquement la connexion malveillante. C'est la vigie du réseau, derrière le pare-feu."],
    fun:"Un IDS peut détecter un attaquant qui « tâte » discrètement le réseau bien avant qu'il ne passe à l'action.",
    blocks:['scan','malware','exploit'] },
  { id:'crypto', r:9.0, ang:3.05, icon:'🔒', color:'#29B6E0', name:'Chiffrement / VPN', sub:'Confidentialité',
    stats:[['Rôle','rendre illisible'],['Protège','données en transit'],['Outil','VPN, HTTPS, TLS'],['Contre','interception'],['Clé','secrète'],['Effet','confidentialité']],
    desc:["Le chiffrement transforme les données en un texte illisible sans la clé. Même interceptées, elles ne révèlent rien à un espion.","Un VPN chiffre tout le tunnel entre l'utilisateur et l'entreprise : le trafic traverse Internet sans pouvoir être lu ou modifié en chemin."],
    fun:"Le petit cadenas de ton navigateur (HTTPS) chiffre déjà chaque page que tu consultes.",
    blocks:['sniff'] },
  { id:'patch', r:7.5, ang:3.9, icon:'⬆️', color:'#35E08A', name:'Correctifs', sub:'Mises à jour',
    stats:[['Rôle','corriger les failles'],['Quoi','logiciels & systèmes'],['Rythme','régulier, rapide'],['Contre','exploitation de faille'],['Risque évité','vulnérabilité connue'],['Bonne pratique','tout à jour']],
    desc:["Un logiciel obsolète peut cacher une faille connue des attaquants. La mise à jour (correctif, « patch ») la referme avant qu'elle ne soit exploitée.","Beaucoup d'attaques majeures n'ont réussi que parce qu'un correctif disponible n'avait pas été appliqué. Mettre à jour, c'est se protéger."],
    fun:"Certaines attaques mondiales ont frappé des mois APRÈS la publication du correctif qui les aurait bloquées.",
    blocks:['exploit'] },
  { id:'av', r:6.0, ang:4.75, icon:'🦠', color:'#2ea6ff', name:'Antivirus / EDR', sub:'Anti-malware',
    stats:[['Rôle','détecter les logiciels malveillants'],['EDR','surveille le poste en continu'],['Action','quarantaine / blocage'],['Contre','virus, rançongiciel'],['Mise à jour','signatures + IA'],['Position','sur chaque machine']],
    desc:["L'antivirus et l'EDR surveillent chaque machine : ils reconnaissent les logiciels malveillants et les mettent en quarantaine avant qu'ils n'agissent.","L'EDR moderne observe aussi les comportements suspects (un fichier qui chiffre tout à toute vitesse) pour stopper une attaque inédite en temps réel."],
    fun:"Un EDR peut isoler automatiquement une machine du réseau dès qu'il détecte un comportement de rançongiciel.",
    blocks:['malware','ransom'] },
  { id:'mfa', r:4.5, ang:5.6, icon:'🔑', color:'#F25C9A', name:'MFA / 2FA', sub:'Double authentification',
    stats:[['Rôle','vérifier l\'identité'],['Facteur 1','mot de passe'],['Facteur 2','code / appli / clé'],['Contre','vol d\'identifiants'],['Effet','mot de passe volé = inutile'],['Coût','très faible']],
    desc:["Un mot de passe seul peut être volé ou deviné. La double authentification (2FA/MFA) exige un second facteur : un code temporaire, une appli, une clé physique.","Même avec ton mot de passe, un pirate est bloqué sans ce second facteur qu'il n'a pas. C'est l'un des remparts les plus efficaces pour un coût minime."],
    fun:"Activer la 2FA bloque la quasi-totalité des tentatives de connexion à partir d'un mot de passe volé.",
    blocks:['creds'] },
  { id:'backup', r:3.2, ang:6.45, icon:'💾', color:'#1E8C7A', name:'Sauvegarde', sub:'Restauration',
    stats:[['Rôle','copie de secours'],['Règle','3-2-1'],['Hors ligne','à l\'abri du réseau'],['Contre','rançongiciel'],['Effet','tout restaurer'],['Test','restaurations régulières']],
    desc:["La sauvegarde est le dernier rempart : une copie des données conservée à l'écart. Si un rançongiciel chiffre tout, on restaure sans payer la rançon.","La règle « 3-2-1 » : 3 copies, sur 2 supports, dont 1 hors site. Une sauvegarde déconnectée du réseau ne peut pas être chiffrée par l'attaque."],
    fun:"Une bonne sauvegarde transforme un rançongiciel en simple mauvaise soirée : on efface et on restaure.",
    blocks:['ransom'] },
];
const DEFBYID = {}; DEF.forEach(d=>DEFBYID[d.id]=d);

/* ====== MENACES (framing 100% défensif : ce dont on se protège) ====== */
const THREATS = {
  phishing:{ name:'Hameçonnage (phishing)', color:0xff8a3d, def:'awareness', blockedBy:['awareness'], info:"Un faux e-mail pousse à livrer son mot de passe. Rempart : la vigilance et la formation des utilisateurs." },
  ddos:{ name:'Attaque DDoS', color:0xff3b30, def:'firewall', blockedBy:['firewall'], info:"Un déluge de requêtes veut saturer le service. Rempart : le pare-feu filtre le trafic illégitime." },
  scan:{ name:'Scan / reconnaissance', color:0xff6a45, def:'ids', blockedBy:['firewall','ids'], info:"Un intrus sonde le réseau à la recherche d'une porte. Rempart : le pare-feu et l'IDS/IPS le repèrent." },
  sniff:{ name:'Interception (espionnage)', color:0xff4d6d, def:'crypto', blockedBy:['crypto'], info:"On tente de lire les données qui circulent. Rempart : le chiffrement les rend illisibles." },
  exploit:{ name:'Exploitation de faille', color:0xff3355, def:'patch', blockedBy:['ids','patch'], info:"Un logiciel non à jour a une faille connue. Rempart : le correctif la referme." },
  malware:{ name:'Logiciel malveillant', color:0xff7a45, def:'av', blockedBy:['ids','av'], info:"Un virus veut infecter une machine. Rempart : l'antivirus/EDR le met en quarantaine." },
  creds:{ name:'Vol d\'identifiants', color:0xff477e, def:'mfa', blockedBy:['mfa'], info:"Un mot de passe a été volé. Rempart : la double authentification (2FA) bloque la connexion." },
  ransom:{ name:'Rançongiciel', color:0xe11d48, def:'backup', blockedBy:['av','backup'], info:"Les fichiers sont chiffrés contre rançon. Remparts : l'EDR l'arrête, et la sauvegarde permet de restaurer." },
};
const THREAT_IDS = Object.keys(THREATS);

const NOTIONS = [
  ['Défense en profondeur',"On ne compte jamais sur un seul rempart. On empile des couches (humain, pare-feu, détection, chiffrement, correctifs, antivirus, 2FA, sauvegarde) : si l'une cède, la suivante protège."],
  ['Surface d\'attaque',"C'est l'ensemble des points par lesquels on pourrait être attaqué : postes, comptes, logiciels, services exposés. On la réduit au minimum nécessaire."],
  ['Le facteur humain',"La plupart des attaques commencent par un humain piégé (phishing). La formation et la méfiance sont un rempart aussi important que la technique."],
  ['Pare-feu & filtrage',"Le pare-feu n'autorise que le trafic prévu et bloque le reste. C'est le mur d'enceinte du réseau."],
  ['Détection (IDS/IPS)',"On surveille en continu les comportements anormaux pour repérer : et bloquer : un intrus avant qu'il n'agisse."],
  ['Chiffrement',"Rendre les données illisibles sans la clé : même interceptées, elles ne révèlent rien. HTTPS, VPN, disques chiffrés."],
  ['Mises à jour',"Un logiciel à jour n'a pas la faille connue que l'attaquant cherchait. Corriger vite est une protection majeure."],
  ['Antivirus / EDR',"Sur chaque machine, il détecte et isole les logiciels malveillants, y compris par leur comportement."],
  ['Authentification forte (MFA)',"Un second facteur (code, appli, clé) rend un mot de passe volé inutilisable. Simple et très efficace."],
  ['Sauvegarde',"Une copie hors ligne des données : le dernier rempart contre le rançongiciel. On restaure sans payer."],
  ['Moindre privilège',"Chaque personne et chaque service n'a que les droits strictement nécessaires : un compte compromis fait moins de dégâts."],
  ['Réponse à incident',"Détecter, isoler, éradiquer, restaurer, apprendre : un plan préparé permet de réagir vite et calmement à une attaque."],
];

/* ====== ÉTAT ====== */
let scene, camera, renderer, composer, controls, clock, raycaster, pointer;
let clickMeshes = [], labels = {}, hovered = null;
let coreGroup, coreCore, coreRing, coreAura, emitters = [];
let threats = [], threatPool = [], burstPool = [], spawnAcc = 0, ambientEvery = 2.0;
let posture = 0, postureTarget = 0, blocked = 0, breaches = 0, threatsSeen = 0;
let coreFlash = 0, wave = null, demo = null;
let ac = null, humGain = null;
let mode = 'detente', labelsOn = true;
let challenge = null, quizTier = 'debutant';

/* E14 : légendes des objets pour le socle commun des mondes. */
const AUTRES_OPALINE={internet:{name:'Internet',sub:'Le réseau extérieur, d\'où viennent les menaces'},core:{name:'Cœur du réseau',sub:'Les serveurs à protéger'}};
function LEGENDE_OPALINE(ob){ const k=ob.userData&&ob.userData.equip; const p=k&&(DEFBYID[k]||AUTRES_OPALINE[k]); return p?{nom:p.name,phrase:p.sub}:null; }
function LEGENDES_OPALINE(){ return DEF.map(p=>({nom:p.name,phrase:p.sub})); }
const shell = window.Konstrio.createGame({
  id:'3d-07-cyberdefense', code:'3D·07', title:'Cyber-défense 3D', type:'3D',
  domain:{ label:'Cybersécurité', color:'#E63329' },
  intro:{
    greet:"Bienvenue au centre de sécurité (SOC) ! Autour du cœur de l'entreprise, huit remparts en couches. Des menaces arrivent d'Internet : active les bons remparts et regarde-les neutraliser chaque attaque en direct.",
    rule:"C'est la <b>défense en profondeur</b> : des couches concentriques protègent le cœur de l'entreprise. Chaque <b>menace</b> (rouge, venue d'Internet) a son <b>rempart</b> : phishing→sensibilisation, DDoS→pare-feu, malware→antivirus, vol de mot de passe→2FA, rançongiciel→sauvegarde… <b>Active</b> les remparts et vois la <b>posture de sécurité</b> monter.",
    how:[
      "Glisse pour tourner · molette pour zoomer · clique un rempart pour l'activer et lire sa fiche.",

/* ====== INIT ====== */
function init(){
  const stage = shell.stage; clock = new THREE.Clock();
  scene = new THREE.Scene(); window.Konstrio.declarer3d({ scene: scene }); scene.fog = new THREE.Fog(0x070912, 26, 66);
  camera = new THREE.PerspectiveCamera(52, stage.clientWidth/stage.clientHeight, 0.1, 240);
  camera.position.set(0, 17, 24);
  renderer = new THREE.WebGLRenderer({ antialias:true }); window.Konstrio.declarer3d({ renderer: renderer });
  window.Konstrio.adapterRendu(renderer); renderer.setSize(stage.clientWidth, stage.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.18;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  // Chaîne cinématique : RenderPass → (GTAO si GPU réel) → Bloom calé → SMAA → OutputPass (ACES + sRGB)
  // GARDE-FOU : rendu logiciel (SwiftShader/llvmpipe) ou mode réduit → PAS d'AO écran (produirait du noir)
  let software = false;
  try{ const gl = renderer.getContext(); const dbg = gl.getExtension('WEBGL_debug_renderer_info'); const rn = dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : ''; software = /swiftshader|llvmpipe|software|basic render/i.test(rn); }catch(e){ software = true; }
  const W = stage.clientWidth, H = stage.clientHeight;
  composer = new EffectComposer(renderer); composer.addPass(new RenderPass(scene, camera));
  if(!software && !REDUCED){
    const gtao = new GTAOPass(scene, camera, W, H); gtao.blendIntensity = 0.9;
    try{ gtao.updateGtaoMaterial({ radius:0.6, distanceExponent:1, thickness:1, scale:1, samples:16, distanceFallOff:1 }); }catch(e){}
    composer.addPass(gtao); composer.gtao = gtao;
  }
  const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.75, 0.55, 0.82);
  composer.addPass(bloom); composer.bloom = bloom;
  composer.addPass(new SMAAPass(W, H));
  composer.addPass(new OutputPass());

  controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = .07;
  window.Konstrio.monde3d({ THREE, scene, camera, renderer, controls, bloom: () => bloom, composer: () => composer, legende: LEGENDE_OPALINE, legendes: LEGENDES_OPALINE });
  controls.minDistance = 8; controls.maxDistance = 52; controls.maxPolarAngle = Math.PI * 0.49;
  controls.target.set(0, 2, 0); controls.autoRotate = REDUCED; controls.autoRotateSpeed = .3;

  scene.add(new THREE.HemisphereLight(0xa9c2ff, 0x141a2c, 0.6));
  const key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(9, 20, 10); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = 1; key.shadow.camera.far = 70;
  key.shadow.camera.left = -24; key.shadow.camera.right = 24; key.shadow.camera.top = 24; key.shadow.camera.bottom = -24;
  key.shadow.bias = -0.0004; scene.add(key);
  const fill = new THREE.DirectionalLight(0x6f8bff, 0.28); fill.position.set(-10, 7, -9); scene.add(fill);

  const pmrem = new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
  new RGBELoader().load('../assets/3d/env/studio_1k.hdr', hdr=>{
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = pmrem.fromEquirectangular(hdr).texture; hdr.dispose();
  }, undefined, ()=>{});

  buildFloor();
  buildCore();
  buildShields();
  buildInternet();
  buildPools();

  raycaster = new THREE.Raycaster(); raycaster.params.Line.threshold = 0.3;
  pointer = new THREE.Vector2(-2, -2);
  buildUI(); applyTheme();

  // Détente : quelques remparts déjà en place pour la mise en scène
  if(mode==='detente'){ setDefense('firewall', true, true); setDefense('av', true, true); }
  syncChips(); refreshTelemetry();

  renderer.domElement.addEventListener('pointermove', onMove);
  renderer.domElement.addEventListener('pointerdown', onDown);
  window.addEventListener('resize', onResize); new ResizeObserver(onResize).observe(stage);
  animate();
}

/* ====== MATÉRIAUX & TEXTURES ====== */
const mat = (c, metal, rough, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color:c, metalness:metal, roughness:rough, envMapIntensity:1.0 }, o));
function emiss(c){ return new THREE.MeshBasicMaterial({ color:c }); }
function glowTex(hex){ const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d'); const col=new THREE.Color(hex); const g=x.createRadialGradient(64,64,0,64,64,64); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,`rgba(${col.r*255|0},${col.g*255|0},${col.b*255|0},.75)`); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); }
function floorTex(){
  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#0d1424'; x.fillRect(0,0,512,512);
  const tile = 64;
  for(let gx=0; gx<512; gx+=tile) for(let gy=0; gy<512; gy+=tile){
    x.strokeStyle = 'rgba(90,120,180,.22)'; x.lineWidth = 1.5; x.strokeRect(gx+1, gy+1, tile-2, tile-2);
    x.fillStyle = 'rgba(80,110,180,.10)'; x.fillRect(gx+4, gy+4, 4, 4);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8; return t;
}

function buildFloor(){
  const ftex = floorTex(); ftex.repeat.set(10, 10);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 72), new THREE.MeshStandardMaterial({ map:ftex, color:0x8fa0c4, roughness:0.62, metalness:0.42, envMapIntensity:0.7 }));
  floor.rotation.x = -Math.PI/2; floor.position.y = 0; floor.receiveShadow = true; scene.add(floor);
  // Anneaux concentriques peints au sol = couches de défense
  DEF.forEach(d=>{
    const ring = new THREE.Mesh(new THREE.RingGeometry(d.r-0.05, d.r+0.05, 96), new THREE.MeshBasicMaterial({ color:d.color, transparent:true, opacity:0.14, side:THREE.DoubleSide }));
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.02; scene.add(ring); d._floorRing = ring;
  });
  // Dôme de ciel sombre
  const sky = new THREE.Mesh(new THREE.SphereGeometry(90, 24, 16), new THREE.MeshBasicMaterial({ color:0x060810, side:THREE.BackSide }));
  scene.add(sky);
}

/* ====== CŒUR PROTÉGÉ (actifs de l'entreprise) ====== */
function buildCore(){

  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.5, 0.5, 40), mat(0x1a2338, 0.6, 0.4)); base.position.y = 0.25; base.receiveShadow = true; coreGroup.add(base);
  // baie de données centrale
  const vault = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.4, 1.7), mat(0x162033, 0.7, 0.35, { envMapIntensity:1.2 })); vault.position.y = 1.7; vault.castShadow = true; coreGroup.add(vault);
  for(let i=0;i<6;i++){ const led = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.08,0.05), emiss(0x35E08A)); led.position.set(0, 0.9+i*0.28, 0.86); coreGroup.add(led); led.userData.coreLed = true; }
  // noyau de données lumineux
  coreCore = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 1), new THREE.MeshStandardMaterial({ color:0x35E08A, emissive:0x1E8C7A, emissiveIntensity:0.9, roughness:0.3 }));
  coreCore.position.y = 3.5; coreGroup.add(coreCore);

  coreRing = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.05, 8, 48), new THREE.MeshBasicMaterial({ color:0x35E08A, transparent:true, opacity:0.7 })); coreRing.position.y = 3.5; coreRing.rotation.x = Math.PI/2; coreGroup.add(coreRing);
  coreAura = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(0x35E08A), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.5 })); coreAura.scale.setScalar(7); coreAura.position.y = 3.4; coreGroup.add(coreAura);
  // postes de travail autour
  for(let i=0;i<6;i++){ const a = i/6*Math.PI*2; const px=Math.cos(a)*2.6, pz=Math.sin(a)*2.6;
    const desk = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.4,0.5), mat(0x232c40, 0.5, 0.6)); desk.position.set(px,0.55,pz); desk.castShadow=true; coreGroup.add(desk);

  }

  const hit = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 4.6, 20), new THREE.MeshBasicMaterial({ visible:false })); hit.position.y = 2.3; hit.userData.equip = 'core'; coreGroup.add(hit); clickMeshes.push(hit);
  addAnchor('core', 0, 5.0, 0);

/* ====== REMPARTS : dômes + anneaux + tours ====== */
function buildShields(){
  DEF.forEach(d=>{
    const col = new THREE.Color(d.color);
    // dôme énergie (grille)
    const domeMat = new THREE.MeshBasicMaterial({ color:col, wireframe:true, transparent:true, opacity:0.03, blending:THREE.AdditiveBlending, depthWrite:false });
    const dome = new THREE.Mesh(new THREE.SphereGeometry(d.r, 30, 15, 0, Math.PI*2, 0, Math.PI*0.5), domeMat);
    scene.add(dome);
    // anneau lumineux au sol
    const ringMat = new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.22, blending:THREE.AdditiveBlending, depthWrite:false });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(d.r, 0.08, 8, 100), ringMat); ring.rotation.x = Math.PI/2; ring.position.y = 0.05; scene.add(ring);
    // tour / console du rempart
    const px = Math.cos(d.ang)*d.r, pz = Math.sin(d.ang)*d.r;
    const tower = new THREE.Group(); tower.position.set(px, 0, pz);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.7,0.3,20), mat(0x1c2438,0.6,0.45)); foot.position.y=0.15; foot.castShadow=true; tower.add(foot);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7,1.7,0.7), mat(0x222c42,0.65,0.4,{envMapIntensity:1.1})); body.position.y=1.05; body.castShadow=true; tower.add(body);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.52,0.4), emiss(col.getHex())); screen.position.set(0,1.25,0.36); screen.lookAt(0,1.25,4); tower.add(screen); screen.userData.towerScreen = true;
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.22,18,18), new THREE.MeshStandardMaterial({ color:col, emissive:col, emissiveIntensity:0.7, roughness:0.3 })); beacon.position.y=2.1; tower.add(beacon);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(col.getHex()), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.0 })); halo.scale.setScalar(2.4); halo.position.y=2.1; tower.add(halo);
    tower.traverse(o=>{ if(o.isMesh){ o.userData.equip = d.id; clickMeshes.push(o); } });
    scene.add(tower);
    d.active = false; d.flash = 0; d._dome = dome; d._domeMat = domeMat; d._ring = ring; d._ringMat = ringMat; d._tower = tower; d._screen = screen; d._beacon = beacon; d._halo = halo;
    addAnchor(d.id, px, 2.7, pz);
  });
}

/* ====== INTERNET / ZONE HOSTILE (émetteurs de menaces) ====== */
function buildInternet(){
  const angs = [0.95, 2.75, 4.7];
  angs.forEach((a,i)=>{
    const g = new THREE.Group(); const R = 16.5; g.position.set(Math.cos(a)*R, 4.5+i*1.2, Math.sin(a)*R);
    const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.9, 1), new THREE.MeshStandardMaterial({ color:0x8b5be0, emissive:0x8b5be0, emissiveIntensity:0.5, roughness:0.4 })); g.add(core);
    const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(1.25, 1), new THREE.MeshBasicMaterial({ color:0xc9a6ff, wireframe:true, transparent:true, opacity:0.4 })); g.add(wire); g.userData.wire = wire;
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(0xb18bff), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0.7 })); halo.scale.setScalar(5); g.add(halo);
    g.traverse(o=>{ if(o.isMesh){ o.userData.equip = 'internet'; clickMeshes.push(o); } });
    scene.add(g); emitters.push(g);
    if(i===0) addAnchor('internet', g.position.x, g.position.y+1.6, g.position.z);
  });
}

/* ====== POOLS : menaces + particules d'éclatement ====== */
function buildPools(){
  const nT = REDUCED ? 12 : 28;

  for(let i=0;i<nT;i++){ const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:0xff3b30, emissive:0xff3b30, emissiveIntensity:0.9, roughness:0.35 })); m.visible=false; scene.add(m);
    const trail = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(0xff5a45), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0 })); trail.scale.setScalar(1.4); m.add(trail);
    threatPool.push({ mesh:m, trail, active:false }); }
  const nB = REDUCED ? 16 : 46;
  for(let i=0;i<nB;i++){ const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex(0xffffff), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, opacity:0 })); s.scale.setScalar(0.8); s.visible=false; scene.add(s); burstPool.push({ s, active:false, life:0, vel:new THREE.Vector3() }); }

/* ====== REMPARTS : activation ====== */
function setDefense(id, on, silent){
  const d = DEFBYID[id]; if(!d) return; if(d.active === on) return;
  d.active = on;
  if(!silent) shell.sound(on ? 'good' : 'click');
  updatePostureTarget();
}
function toggleDefense(id){
  const d = DEFBYID[id]; if(!d) return;
  const now = !d.active; setDefense(id, now);
  syncChips(); openFiche(id);
  if(now){ shell.toast(d.icon+' '+d.name+' activé'); shell.say(activationLine(d), 'joyeux'); }
  else { shell.say(d.name+" désactivé. Sans lui, les menaces correspondantes passeront.", 'rassurant'); }
  if(mode==='cours') evalChallenge(id);
}
function activationLine(d){
  const names = d.blocks.map(t=>THREATS[t].name.replace(/ \(.*\)/,'')).join(', ');
  return `${d.name} en ligne : rempart contre ${names}. ${d.fun}`;
}
function updatePostureTarget(){
  const n = DEF.filter(d=>d.active).length;
  postureTarget = Math.round(n/DEF.length*100);
}

  el.innerHTML = `
    <div class="cy-hd" style="background:linear-gradient(135deg,${hex},#0a1424)">
      <div class="ico">${d.icon}</div>
      <div><div class="sub">${d.sub}</div><h2>${d.name}</h2></div>

    <div class="cy-body">

/* ====== MENACES : apparition, mouvement, blocage ====== */
function outermostBlock(id){
  const th = THREATS[id]; let best = null;
  th.blockedBy.forEach(dfid=>{ const d = DEFBYID[dfid]; if(d && d.active){ if(!best || d.r > best.r) best = d; } });
  return best;
}
function spawnThreat(forceId){
  const slot = threatPool.find(p=>!p.active); if(!slot) return null;
  const id = forceId || THREAT_IDS[Math.floor(Math.random()*THREAT_IDS.length)];
  const th = THREATS[id];
  const em = emitters[Math.floor(Math.random()*emitters.length)];
  const from = em.position.clone().add(new THREE.Vector3((Math.random()-.5)*2,(Math.random()-.5)*2,(Math.random()-.5)*2));
  const to = new THREE.Vector3((Math.random()-.5)*1.2, 2.0 + (Math.random()-.5)*1.5, (Math.random()-.5)*1.2);
  slot.active = true; slot.id = id; slot.from = from; slot.to = to; slot.t = 0;
  slot.speed = 0.16 + Math.random()*0.05;
  slot.mesh.visible = true; slot.mesh.position.copy(from);
  slot.mesh.material.color.setHex(th.color); slot.mesh.material.emissive.setHex(th.color);
  slot.trail.material.color.setHex(th.color); slot.trail.material.opacity = 0.8;
  slot.done = false;
  threats.push(slot); threatsSeen++;
  return slot;
}
function blockThreat(slot, d){
  blocked++;
  d.flash = 1.0;
  spawnBurst(slot.mesh.position, d.color, 6);
  shell.sound('good');
  recycleThreat(slot);
}
function coreHit(slot){
  breaches++; coreFlash = 1.0;
  spawnBurst(slot.mesh.position, 0xff3b30, 8);
  shell.sound('bad');
  postureTarget = Math.max(0, postureTarget - 2);
  recycleThreat(slot);
}
function recycleThreat(slot){ slot.active = false; slot.done = true; slot.mesh.visible = false; slot.trail.material.opacity = 0; }
function updateThreats(dt){
  threats.forEach(slot=>{
    if(!slot.active) return;
    slot.t += dt * slot.speed;
    if(slot.t >= 1){ slot.mesh.position.copy(slot.to); }
    else slot.mesh.position.lerpVectors(slot.from, slot.to, slot.t);
    slot.mesh.rotation.x += dt*3; slot.mesh.rotation.y += dt*4;
    const dist = slot.mesh.position.length();
    const blk = outermostBlock(slot.id);
    if(blk && dist <= blk.r){ blockThreat(slot, blk); return; }
    if(dist <= 2.2 || slot.t >= 1.02){ coreHit(slot); return; }
  });
  threats = threats.filter(s=>s.active);
}

/* ====== PARTICULES D'ÉCLATEMENT ====== */
function spawnBurst(pos, hex, n){
  let k = 0;
  for(let i=0;i<burstPool.length && k<n;i++){ const b = burstPool[i]; if(b.active) continue;
    b.active = true; b.life = 1.0; b.s.visible = true; b.s.material.color.setHex(hex); b.s.material.opacity = 0.9;
    b.s.position.copy(pos); b.s.scale.setScalar(0.6);
    b.vel.set((Math.random()-.5), (Math.random()-.5), (Math.random()-.5)).multiplyScalar(6);
    k++;
  }
}
function updateBursts(dt){
  burstPool.forEach(b=>{ if(!b.active) return;
    b.life -= dt*2.2; if(b.life<=0){ b.active=false; b.s.visible=false; return; }
    b.s.position.addScaledVector(b.vel, dt); b.vel.multiplyScalar(0.9);
    b.s.material.opacity = Math.max(0, b.life*0.9); b.s.scale.setScalar(0.6 + (1-b.life)*1.4);
  });
}

/* ====== ANIMATION ====== */
let telAcc = 0;
function animate(){
  requestAnimationFrame(animate); const dt = Math.min(0.05, clock.getDelta()); const t = clock.elapsedTime;

  // Posture lissée
  posture += (postureTarget - posture) * 0.08;

  // Remparts : rendu selon activation + flash de blocage
  DEF.forEach(d=>{
    if(d.flash > 0) d.flash = Math.max(0, d.flash - dt*1.8);
    const base = d.active ? 0.16 : 0.03;
    const puls = d.active && !REDUCED ? 0.05*Math.abs(Math.sin(t*1.5 + d.ang)) : 0;
    d._domeMat.opacity = base + puls + d.flash*0.6;
    d._ringMat.opacity = (d.active ? 0.7 : 0.2) + d.flash*0.5;
    d._floorRing.material.opacity = d.active ? 0.28 : 0.1;
    const emi = d.active ? (0.7 + (REDUCED?0:0.3*Math.abs(Math.sin(t*3+d.ang)))) : 0.12;
    d._beacon.material.emissiveIntensity = emi + d.flash*1.5;
    d._halo.material.opacity = (d.active ? 0.55 : 0.0) + d.flash*0.6;
    if(d.active) d._screen.material.color.set(d.color); else d._screen.material.color.setHex(0x1a2030);
    // hover
    const lit = hovered===d._tower; d._tower.scale.lerp(new THREE.Vector3(lit?1.06:1, lit?1.06:1, lit?1.06:1), 0.15);
  });

  // Cœur : rotation + aura selon posture + flash d'intrusion
  if(coreCore){ coreCore.rotation.y += dt*0.6; coreCore.rotation.x += dt*0.2; if(coreGroup.userData.wire) coreGroup.userData.wire.rotation.y -= dt*0.4; }
  if(coreRing) coreRing.rotation.z += dt*0.5;
  if(coreFlash>0) coreFlash = Math.max(0, coreFlash - dt*1.6);
  if(coreAura){ const green = new THREE.Color(0x35E08A), red = new THREE.Color(0xff3b30); const c = green.clone().lerp(red, coreFlash); coreAura.material.color.copy(c); coreAura.material.opacity = 0.35 + posture/100*0.35 + coreFlash*0.4; const sc = 6 + posture/100*2 + coreFlash*2; coreAura.scale.setScalar(sc); }
  if(coreCore){ coreCore.material.emissiveIntensity = 0.7 + posture/100*0.5 + coreFlash*0.8; if(coreFlash>0.3) coreCore.material.emissive.setHex(0xff3b30); else coreCore.material.emissive.setHex(0x1E8C7A); }

  // Émetteurs Internet
  emitters.forEach((g,i)=>{ g.rotation.y += dt*0.4; if(g.userData.wire) g.userData.wire.rotation.x += dt*0.3; });

  // Apparition ambiante des menaces (Détente)
  if(mode==='detente' && !document.querySelector('.ksh-fin:not([hidden])')){
    spawnAcc += dt;
    const every = wave&&wave.on ? wave.every : ambientEvery;
    if(spawnAcc > every){ spawnAcc = 0;
      if(wave&&wave.on){ spawnThreat(); wave.left--; if(wave.left<=0) endWave(); }
      else if(!demo) spawnThreat();
    }
  }
  updateThreats(dt);
  updateBursts(dt);
  // traînée des menaces
  threats.forEach(s=>{ if(s.active && !REDUCED) s.trail.material.opacity = 0.55+0.25*Math.abs(Math.sin(t*8)); });

  // Télémétrie
  telAcc += dt; if(telAcc > 0.15){ telAcc = 0; refreshTelemetry(); }

  controls.update(); updateLabels(); composer.render();
}
</script>
</body>
</html>
