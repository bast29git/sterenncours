   planches, 71 818 articles, 2 885 planches. Émilie du Châtelet 1706-1749, traduction des Principia parue
   en 1759. Diderot chez Catherine II à Saint-Pétersbourg en 1773-1774 ; Voltaire à Ferney à partir de 1759.

/* Un portrait en silhouette (mode du XVIIIᵉ siècle) : profil noir sur un ovale clair, dans un fond peint sombre. */
function texturePortrait(p) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 640; const x = c.getContext('2d');
  const fond = x.createRadialGradient(256, 300, 60, 256, 320, 420); fond.addColorStop(0, '#4a3a2a'); fond.addColorStop(1, '#120d08'); x.fillStyle = fond; x.fillRect(0, 0, 512, 640);
  x.save(); x.beginPath(); x.ellipse(256, 300, 190, 240, 0, 0, Math.PI * 2); x.closePath();
  const ovale = x.createLinearGradient(0, 60, 0, 540); ovale.addColorStop(0, '#efe3c8'); ovale.addColorStop(1, '#d8c7a4'); x.fillStyle = ovale; x.fill();
  x.fillStyle = p.couleur; x.globalAlpha = 0.12; x.fill(); x.globalAlpha = 1;
  const q = p.profil; const nz = q.nez; const mt = q.menton;
  // le profil, tourné vers la gauche : nuque, crâne, front, nez, lèvres, menton, cou, épaules
  x.fillStyle = '#17120d'; x.beginPath();
  x.moveTo(300, 560);
  x.quadraticCurveTo(296, 470, 318, 420); // nuque
  x.quadraticCurveTo(372, 380, 368, 280); // arrière du crâne
  x.quadraticCurveTo(360, 150, 262, 142); // sommet
  x.quadraticCurveTo(205, 150, 196, 215); // front
  x.quadraticCurveTo(190, 250, 200, 268); // arcade
  x.quadraticCurveTo(186, 300, 170 - 14 * (nz - 1) * 4, 318 + 10 * (nz - 1)); // dos du nez
  x.quadraticCurveTo(160 - 14 * (nz - 1) * 4, 334, 190, 342); // dessous du nez
  x.quadraticCurveTo(200, 352, 192, 362); // lèvre supérieure
  x.quadraticCurveTo(206, 374, 194, 386); // lèvre inférieure
  x.quadraticCurveTo(190 - 8 * (mt - 1) * 5, 410, 218, 418 + 6 * (mt - 1) * 5); // menton
  x.quadraticCurveTo(250, 420, 262, 455); // dessous du menton
  x.quadraticCurveTo(262, 480, 250, 500); // gorge
  x.quadraticCurveTo(150, 520, 120, 600); // épaule avant
  x.lineTo(410, 600); x.quadraticCurveTo(392, 530, 300, 560); x.closePath(); x.fill();

  if (q.coiffure === 'rouleaux') { [[318, 300], [326, 338], [330, 374]].forEach((r) => { x.beginPath(); x.arc(r[0], r[1], 24, 0, Math.PI * 2); x.fill(); }); x.beginPath(); x.ellipse(372, 440, 22, 40, 0.3, 0, Math.PI * 2); x.fill(); }
  if (q.coiffure === 'queue') { x.beginPath(); x.ellipse(376, 430, 22, 48, -0.2, 0, Math.PI * 2); x.fill(); x.beginPath(); x.ellipse(320, 330, 28, 20, 0, 0, Math.PI * 2); x.fill(); }
  if (q.coiffure === 'chignon') { x.beginPath(); x.ellipse(330, 150, 70, 46, -0.3, 0, Math.PI * 2); x.fill(); x.beginPath(); x.ellipse(372, 268, 26, 50, 0.2, 0, Math.PI * 2); x.fill(); }
  if (q.robe) { x.fillStyle = '#efe3c8'; x.beginPath(); x.moveTo(236, 500); x.quadraticCurveTo(290, 540, 330, 600); x.lineTo(236, 600); x.closePath(); x.fill(); x.fillStyle = '#17120d'; x.beginPath(); x.moveTo(250, 500); x.quadraticCurveTo(292, 548, 318, 600); x.lineTo(300, 600); x.quadraticCurveTo(286, 560, 246, 522); x.closePath(); x.fill(); }
  else { x.fillStyle = '#efe3c8'; x.beginPath(); x.moveTo(252, 500); x.quadraticCurveTo(262, 560, 236, 600); x.lineTo(286, 600); x.quadraticCurveTo(280, 540, 266, 500); x.closePath(); x.fill(); }
  x.restore();
  x.strokeStyle = 'rgba(201,164,74,0.9)'; x.lineWidth = 6; x.beginPath(); x.ellipse(256, 300, 190, 240, 0, 0, Math.PI * 2); x.stroke();

}
function textureCarte() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 720; const x = c.getContext('2d');

  x.fillStyle = '#2a2018'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '800 44px Georgia, serif'; x.fillText('Les idées circulent : lettres, livres, journaux', 512, 56);

  x.strokeStyle = 'rgba(185,84,29,0.85)'; x.lineWidth = 5; x.setLineDash([14, 10]);
  Object.keys(villes).forEach((v) => { if (v === 'Paris') return; const a = villes.Paris; const b = villes[v]; x.beginPath(); x.moveTo(a[0], a[1]); x.quadraticCurveTo((a[0] + b[0]) / 2, Math.min(a[1], b[1]) - 60, b[0], b[1]); x.stroke(); });

  x.font = '600 26px Georgia, serif'; x.fillStyle = '#4a3a2a';
  x.fillText('Voltaire écrit depuis Ferney, près de Genève. Diderot voyage jusqu\'à Saint-Pétersbourg (1773).', 512, 640);
  x.fillText('Les livres interdits en France s\'impriment à Amsterdam, Genève ou Londres.', 512, 682);

}

  shell.say(p.nom + ' : ' + p.idee, 'concentre');
}
function visiter(sens) {
  etape = (etape + sens + ETAPES.length) % ETAPES.length; const id = ETAPES[etape];
  if (PENSEURS.some((p) => p.id === id)) { voir(id); return; }
  const a = ARRETS[id]; panneau.querySelector('#mu-texte').innerHTML = '<b>' + a.titre + '</b>. ' + a.texte;
  panneau.querySelectorAll('[data-p]').forEach((b) => b.setAttribute('aria-pressed', 'false'));

}
function classer() {

  ordre.forEach((p, i) => { const b = liste.querySelector(`[data-p="${p.id}"]`); liste.appendChild(b); b.querySelector('i').textContent = String(i + 1); b.querySelector('span').textContent = chrono ? p.annee + ' · ' + p.nom : p.nom; });
  if (chrono) shell.say('Dans l\'ordre : 1748 De l\'esprit des lois, 1751 le premier volume de l\'Encyclopédie, 1759 la traduction de Newton, 1762 Du contrat social, 1763 le Traité sur la tolérance.', 'concentre');
}
/* La presse : la barre tire, la platine descend, puis le coffre sort avec la feuille imprimée. */
const PHASES = [0.55, 0.35, 0.6, 0.5];
function imprimer() { if (impression) return; impression = { phase: 0, t: 0 }; L.presse.feuille.material.map = L.presse.texBlanche; L.presse.feuille.material.needsUpdate = true; shell.say('La barre tire la vis, la platine presse la feuille sur les caractères encrés, puis le coffre ressort.', 'concentre'); }
function animerPresse(dt) {
  const P = L.presse; const I = impression; I.t += dt; const f = Math.min(1, I.t / PHASES[I.phase]); const e = ease(f);
  if (I.phase === 0) { P.pivot.rotation.y = -1.3 * e; P.vis.position.y = -0.16 * e; }
  else if (I.phase === 1) { P.pivot.rotation.y = -1.3 * (1 - e); P.vis.position.y = -0.16 * (1 - e); }
  else if (I.phase === 2) { P.coffre.position.z = 1.0 * e; if (f > 0.2 && P.feuille.material.map !== P.texImprimee) { P.feuille.material.map = P.texImprimee; P.feuille.material.needsUpdate = true; } }
  else { P.coffre.position.z = 1.0 * (1 - e); }

    if (I.phase >= PHASES.length) {

      P.feuille.material.map = P.texBlanche; P.feuille.material.needsUpdate = true; shell.sound('pop');
      panneau.querySelector('#mu-presse').textContent = feuilles + ' feuille' + (feuilles > 1 ? 's' : '') + ' imprimée' + (feuilles > 1 ? 's' : '') + '. À ce rythme, une presse à bras tire environ 200 feuilles à l\'heure : une brochure se répand en quelques jours.';
    }
  }
}
