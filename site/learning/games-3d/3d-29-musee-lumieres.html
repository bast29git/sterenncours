function lancerMission() {
  if (mission && !mission.estFinie()) { shell.say('La chasse est déjà lancée : il reste ' + mission.objectifs.filter((o) => !o.fait).length + ' objet(s) à trouver.', 'concentre'); mission.montrer(); return; }
  if (!mission) {
    mission = M.mission({
      titre: 'Chasse aux indices', cachee: true, chrono: true, chronoCible: 180, gagner: modeJeu !== 'cours',
      intro: 'Chasse aux indices : cinq objets liés aux œuvres sont posés dans la salle. Touche-les tous, montre en main. Le guide te dira ce que c\'est.',
      objectifs: INDICES.map((d) => ({ id: d.id, texte: d.nom })),
      bravo: 'Les cinq indices trouvés : tu sais maintenant relier chaque penseur à son livre.',
      surFin: (reussie, secondes, score) => {
        const t = Math.round(secondes); const txt = reussie ? 'Chasse terminée en ' + Math.floor(t / 60) + ' min ' + (t % 60) + ' s. Les cinq objets sont retrouvés.' : 'La chasse s\'arrête là.';
        if (guide) guide.dire(reussie ? 'Bravo. Cinq œuvres, cinq objets : la salle n\'a plus de secret pour toi.' : 'On pourra reprendre la chasse plus tard.', 6);
        if (modeJeu === 'cours' && apiJeu) { apiJeu.say(txt + ' ' + score + ' points de plus.', 'fier'); apiJeu.celebrate(); setTimeout(() => mission.cacher(), 9000); }
      },
    });
  }
  trouves = 0; mission.montrer(); mission.commencer();
  if (guide) guide.dire('Cherche bien : une lettre, une brochure, deux livres et une planche gravée.', 5);
}
function demarrer(mode, api) {
  modeJeu = mode; apiJeu = api; etape = -1;
  if (guide) { guide.regarder([0, 0, 6]); setTimeout(() => guide.dire('Bienvenue au musée des Lumières. Je suis ton guide : appuie sur « Suivant ».', 5), 900); }
  if (mode !== 'cours') {
    api.say('Approche-toi des portraits. Touche le salon, la presse, l\'Encyclopédie : c\'est ainsi que les idées circulent. La chasse aux indices démarre dans quelques secondes.', 'joyeux');
    setTimeout(() => { if (!mission || mission.estFinie()) lancerMission(); }, 6000);
    return;
  }
  api.defis([
    { type: 'toucher', texte: 'Touche le portrait de <b>Montesquieu</b>.', cible: 'Montesquieu', explication: 'De l\'esprit des lois, 1748 : Montesquieu observe l\'Angleterre et théorise la séparation des pouvoirs.' },
    { type: 'qcm', texte: 'Montesquieu défend…', choix: ['la séparation des pouvoirs législatif, exécutif et judiciaire', 'le pouvoir absolu du roi', 'la suppression des lois', 'le retour à la nature'], reponse: 0, explication: 'Si une seule personne fait la loi, l\'applique et juge, c\'est la tyrannie. Les pouvoirs doivent se limiter les uns les autres.' },
    { type: 'qcm', texte: 'L\'Encyclopédie (1751 à 1772) est dirigée par…', choix: ['Diderot et d\'Alembert', 'Voltaire et Rousseau', 'Montesquieu et Newton', 'Louis XV et ses ministres'], reponse: 0, explication: '28 volumes pour rassembler tous les savoirs : sciences, techniques, arts. Un travail collectif, un temps interdit par le roi.' },
    { type: 'qcm', texte: 'Voltaire écrit le Traité sur la tolérance après…', choix: ['l\'affaire Calas (1762), un protestant exécuté à tort', 'la Révolution française', 'la mort de Louis XIV', 'un voyage en Amérique'], reponse: 0, explication: 'Jean Calas, protestant de Toulouse, est condamné et exécuté injustement. Voltaire obtient sa réhabilitation en 1765.' },
    { type: 'toucher', texte: 'Touche la <b>presse d\'imprimerie</b>, l\'outil qui multiplie les textes.', cible: 'Presse d\'imprimerie', explication: 'Sans la presse, pas de diffusion : livres, journaux et brochures sortent par centaines de feuilles à l\'heure, souvent imprimés hors du royaume pour échapper à la censure.' },
    { type: 'qcm', texte: 'Pour Rousseau, la souveraineté appartient…', choix: ['au peuple', 'au roi', 'à l\'Église', 'aux nobles'], reponse: 0, explication: 'Du contrat social, 1762 : les citoyens s\'associent librement, et la loi exprime la volonté générale.' },
    { type: 'toucher', texte: 'Touche le portrait d\'<b>Émilie du Châtelet</b>.', cible: 'Émilie du Châtelet', explication: 'Physicienne et mathématicienne, elle traduit et commente Newton : les Lumières sont aussi scientifiques, et pas seulement masculines.' },
    { type: 'qcm', texte: 'Lequel de ces livres paraît en premier ?', choix: ['De l\'esprit des lois (Montesquieu)', 'Du contrat social (Rousseau)', 'Le Traité sur la tolérance (Voltaire)', 'Le premier volume de l\'Encyclopédie'], reponse: 0, explication: 'De l\'esprit des lois paraît en 1748, puis le premier volume de l\'Encyclopédie en 1751, Du contrat social en 1762 et le Traité sur la tolérance en 1763. Le bouton « Classer par date » le montre.' },
    { type: 'qcm', texte: 'Comment les idées des Lumières circulent-elles ?', choix: ['Par les salons, les cafés, les livres, les journaux et l\'Encyclopédie', 'Par la télévision', 'Par les sermons à l\'église uniquement', 'Elles ne circulent pas : elles sont interdites'], reponse: 0, explication: 'Malgré la censure, les livres s\'impriment à l\'étranger, les salons et les cafés discutent, les correspondances relient toute l\'Europe : regarde la carte sur le mur de gauche.' },
  ], { rejouer: () => demarrer('cours', api) });
}
