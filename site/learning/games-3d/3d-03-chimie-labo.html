const texLoader=new THREE.TextureLoader();
const PBR_BASE='../assets/3d/pbr2k/';
let maxAniso=8;
function loadTex(url,srgb,rep){ const t=texLoader.load(url,undefined,undefined,()=>{}); t.wrapS=t.wrapT=THREE.RepeatWrapping; if(rep) t.repeat.set(rep[0]!==undefined?rep[0]:rep, rep[1]!==undefined?rep[1]:rep); t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace; t.anisotropy=maxAniso; return t; }
// applique diffuse/normal/roughness(+metal,+ao bakée) réels sur un matériau existant
function applyPBR(material,slug,res,opt={}){ const rep=opt.repeat||1, b=PBR_BASE+slug+'/'+slug+'_';
  material.map=loadTex(b+'diff_'+res+'.jpg',true,rep);
  material.normalMap=loadTex(b+'nor_gl_'+res+'.jpg',false,rep); material.normalScale=new THREE.Vector2(opt.normal||1,opt.normal||1);
  material.roughnessMap=loadTex(b+'rough_'+res+'.jpg',false,rep);
  if(opt.metal){ material.metalnessMap=loadTex(b+'metal_'+res+'.jpg',false,rep); }
  if(opt.ao){ material.aoMap=loadTex(b+'ao_'+res+'.jpg',false,rep); material.aoMapIntensity=opt.aoInt||1; }
  if(opt.color!==undefined) material.color.setHex(opt.color);
  material.needsUpdate=true; return material; }
// duplique le canal UV pour permettre l'aoMap (utilise uv1)
function enableAO(geo){ if(geo.attributes.uv && !geo.attributes.uv1) geo.setAttribute('uv1', geo.attributes.uv); }
// tache d'ombre de contact douce (occlusion lisible même en rendu logiciel)
function makeContactShadow(){ const s=256,c=document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d'); const g=x.createRadialGradient(s/2,s/2,10,s/2,s/2,s/2); g.addColorStop(0,'rgba(0,0,0,0.5)'); g.addColorStop(0.55,'rgba(0,0,0,0.24)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,s,s); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.NoColorSpace; return t; }

function startAmbient(){ if(ac||shell.muted)return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); ambientGain=ac.createGain(); ambientGain.gain.value=0.0; ambientGain.connect(ac.destination); ambientGain.gain.setTargetAtTime(0.4,ac.currentTime,1.2);
  const buf=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate); const dt=buf.getChannelData(0); for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*0.04; const src=ac.createBufferSource(); src.buffer=buf; src.loop=true; const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; const g=ac.createGain(); g.gain.value=0.5; src.connect(lp); lp.connect(g); g.connect(ambientGain); src.start();
  const o=ac.createOscillator(); o.type='sine'; o.frequency.value=54; const og=ac.createGain(); og.gain.value=0.05; o.connect(og); og.connect(ambientGain); o.start();
}catch(e){} }

/* ---------- réactions & effets ---------- */
function setLiquid(hex){ lab.targetLiq.set(hex); if(lab.liqLevel<0.05){ lab.liquid.material.color.set(hex); } lab.liquid.visible=true; }
function fillTo(level){ lab.liqTarget=level; lab.liquid.visible=true; }
function addReagent(id){ if(lab.reacted){ shell.say("Rince d'abord le bécher pour une nouvelle expérience.",'curieux'); flashRinse(); return; }
  const r=REAG[id]; if(!r||r.target!=='becher')return; startAmbient();
  if(lab.contents.includes(id)){ shell.say("Tu as déjà versé "+r.name.toLowerCase()+".",'curieux'); return; }
  verifierSecurite();
  lab.contents.push(id); shell.sound('pop'); syncReag(); bruitVersement();
  if(lab.contents.length===1){ setLiquid(r.color); fillTo(0.7); shell.say("Tu verses "+r.name+" ("+r.formula+") dans le bécher.",'concentre'); }
  else if(lab.contents.length===2){ fillTo(1.0);
    const key=rkey(lab.contents[0],lab.contents[1]); const reac=REACTIONS[key];
    if(reac){ playReaction(reac); }
    else { setLiquid(mixColor(lab.contents)); shell.say("Ces deux produits ne réagissent pas de façon visible. « Rince » et essaie une autre paire !",'rassurant'); }
  }
}
function mixColor(ids){ const c=new THREE.Color(0,0,0); ids.forEach(i=>c.add(new THREE.Color(REAG[i].color))); c.multiplyScalar(1/ids.length); return '#'+c.getHexString(); }
function playReaction(reac){ lab.reacted=true; setLiquid(reac.color); shell.sound('good'); missionReaction(reac);
  if(reac.kind==='fizz'){ lab.fizz=2.6; fizzSound(); }
  else if(reac.kind==='precip'){ startPrecip(reac.precip||reac.color); }
  shell.say(reac.say,'celebration');
  showEq(reac.eq);
  openFiche({ sym:reac.id==='fizz'?'CO₂':reac.id==='precip'?'↓':'pH', color:'#1E8C7A', name:reac.name, sub:reac.sub, eq:reac.eq, stats:[['Type',reac.sub],['Observe',reac.name]], desc:reac.desc, fun:reac.fun });
  if(quiz) checkChallenge({goal:'react', key:rkey(lab.contents[0],lab.contents[1])});
}
function startPrecip(hex){ const col=new THREE.Color(hex); lab.precip.forEach(p=>{ p.active=true; p.m.visible=true; p.m.material.color.copy(col); const a=Math.random()*Math.PI*2, rr=Math.random()*0.68; p.m.position.set(Math.cos(a)*rr,0.2+Math.random()*0.9,Math.sin(a)*rr); p.vy=-(0.1+Math.random()*0.15); p.ry=0.09+Math.random()*0.08; }); }
function flameTest(id){ const r=REAG[id]; if(!r||r.target!=='flamme')return; startAmbient(); shell.sound('good'); verifierSecurite();
  lab.flameTimer=5; const col=new THREE.Color(r.flame); lab.flameCore.material.color.copy(col); lab.flameCore.material.opacity=0.95; lab.flameCore.scale.set(1.35,1.5,1.35); lab.flameLight.color.copy(col); lab.flameLight.intensity=2.6;
  const el=EL.find(x=>x.sym===r.el); const fam=el?FAM[el.fam].n:'';
  shell.say("Test de flamme : "+r.name+" colore la flamme. "+r.desc,'celebration');
  openFiche({ sym:r.el, color:'#E63329', name:'Test de flamme · '+(el?el.nom:r.name), sub:'Spectre du '+(el?el.nom.toLowerCase():''), stats:[['Élément',r.el],['Couleur de flamme',flameName(r.flame)],['Famille',fam],['Principe','électrons excités']], desc:[r.desc,"En chauffant, les électrons du métal absorbent de l'énergie puis la relâchent sous forme de lumière colorée, propre à chaque élément."], fun:"Les feux d'artifice utilisent ce principe : sodium=jaune, cuivre=vert, strontium=rouge, potassium=violet." });
  if(quiz) checkChallenge({goal:'flame', el:r.el});
}
function resetFlame(){ lab.flameTimer=0; if(lab.flameCore){ lab.flameCore.material.color.set(0xffb055); lab.flameCore.material.opacity=0.72; lab.flameCore.scale.set(1,1,1); } if(lab.flameLight){ lab.flameLight.color.copy(lab.flameBase); lab.flameLight.intensity=1.2; } }

function tileTex(sym,z,col){ const c=document.createElement('canvas'); c.width=c.height=128; const ctx=c.getContext('2d'); ctx.fillStyle=col; ctx.fillRect(0,0,128,128); ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(0,0,128,40); ctx.fillStyle='#fff'; ctx.font='bold '+(sym.length>2?44:58)+'px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(sym,64,74); ctx.font='bold 20px Arial'; ctx.textAlign='left'; ctx.fillText(z,9,24); const tx=new THREE.CanvasTexture(c); tx.colorSpace=THREE.SRGBColorSpace; return tx; }
function buildTable(){ tableGroup=new THREE.Object3D(); tableGroup.visible=false; scene.add(tableGroup); const sx=1.42, sy=1.55;
  EL.forEach(el=>{ const col=FAM[el.fam].c; const tile=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.25,0.22), new THREE.MeshStandardMaterial({ map:tileTex(el.sym,el.z,col), roughness:.5, metalness:.1, emissive:new THREE.Color(col), emissiveIntensity:.12 }));

function buildMolGroup(){ molGroup=new THREE.Object3D(); molGroup.visible=false; molGroup.position.set(0,1.9,0); scene.add(molGroup); }
function buildMol(key){ molGroup.clear(); molAtoms=[]; const m=MOL[key]; const atoms=[];
  m.atoms.forEach(a=>{ const [el,x,y,z]=a; const r= el==='H'?0.34:0.58; const sph=new THREE.Mesh(new THREE.SphereGeometry(r,32,32), new THREE.MeshPhysicalMaterial({ color:CPK[el]||CPK.default, roughness:.16, metalness:.0, clearcoat:0.9, clearcoatRoughness:0.12, envMapIntensity:1.3, emissive:new THREE.Color(CPK[el]||CPK.default), emissiveIntensity:.05 })); sph.position.set(x*2.4,y*2.4,z*2.4); sph.userData.el=el; molGroup.add(sph); atoms.push(sph.position); molAtoms.push(sph); });
  m.bonds.forEach(([a,b])=>{ const p1=atoms[a],p2=atoms[b]; const cyl=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,p1.distanceTo(p2),14), new THREE.MeshStandardMaterial({ color:0xd6dbe4, roughness:.3, metalness:.5, envMapIntensity:1.0 })); cyl.position.copy(p1.clone().add(p2).multiplyScalar(.5)); cyl.lookAt(p2); cyl.rotateX(Math.PI/2); molGroup.add(cyl); });
}

   ============================================================ */
const MISSION_R=[
  { id:'fizz', texte:'Effervescence (bicarbonate + vinaigre)', q:{ texte:'Quelle équation est équilibrée ?', choix:['NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂','NaHCO₃ + CH₃COOH → CH₃COONa + H₂O','2 NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂'], bonne:0, explique:["C'est la bonne : chaque atome est compté une fois de chaque côté, et le CO₂ est bien le gaz des bulles.","Il manque le CO₂ : c'est pourtant lui qui fait les bulles. Sans lui, le carbone n'est plus équilibré.","Deux bicarbonates pour un seul acide : il y a 2 Na à gauche et 1 seul à droite. Ce n'est pas équilibré."] } },
  { id:'precip', texte:'Précipité bleu (sulfate de cuivre + soude)', q:{ texte:'Quelle équation est équilibrée ?', choix:['CuSO₄ + 2 NaOH → Cu(OH)₂ + Na₂SO₄','CuSO₄ + NaOH → Cu(OH)₂ + Na₂SO₄','CuSO₄ + 2 NaOH → CuOH + Na₂SO₄'], bonne:0, explique:["C'est la bonne : 2 Na et 2 OH de chaque côté, le cuivre porte ses deux OH.","Avec un seul NaOH, il y a 1 Na à gauche et 2 à droite : il faut 2 NaOH.","Le précipité bleu est Cu(OH)₂ : le cuivre, chargé deux fois, retient deux OH, pas un seul."] } },
  { id:'base', texte:'Indicateur vert (indicateur + soude)', q:{ texte:"Le jus de chou rouge vire au vert. Que peux-tu conclure ?", choix:['Le mélange est basique : pH supérieur à 7','Le mélange est acide : pH inférieur à 7','Le mélange est neutre : pH égal à 7'], bonne:0, explique:["Exact : le vert est la couleur de l'indicateur en milieu basique. La soude est une base.","Non : en milieu acide, le chou rouge devient rouge. Le vert signale une base.","Non : à pH 7, l'indicateur reste violet. Le vert signale une base."] } },
];
function assurerMission(){ if(missionLab||!M)return missionLab;
  missionLab=M.mission({ titre:'Trois réactions', cachee:true, chrono:true, chronoCible:300, gagner:false, annonce:false,
    objectifs:[{ id:'lunettes', texte:'Mettre les lunettes' },{ id:'hotte', texte:'Allumer la hotte' }].concat(MISSION_R.map(r=>({ id:r.id, texte:r.texte }))),
    surFin:(reussie,secondes,score)=>finMission(reussie,secondes,score) });
  missionLab.zone.classList.add('ch-zone'); missionLab.zone.setAttribute('aria-label','Mission : trois réactions');
  return missionLab; }
function lancerMission(){ if(!assurerMission())return; if(tab!=='bench'){ setTab('bench'); document.querySelectorAll('.ch-tab').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t==='bench')); }
  if(missionLancee&&!missionLab.estFinie()){ shell.say('La mission est déjà lancée : regarde la liste des objectifs à gauche.','concentre'); missionLab.montrer(); return; }
  MISSION_R.forEach(r=>{ r.erreurs=0; }); fautesSecu=0; missionLancee=true; questionLab=null; fermerQuestion();
  if(lunettesMises){ lunettesMises=false; if(lunettesObj) lunettesObj.visible=true; const b=document.getElementById('chLun'); if(b){ b.setAttribute('aria-pressed','false'); b.textContent='🥽 Lunettes'; } }
  if(hotteOn) basculerHotte();
  if(lab.reacted||lab.contents.length) rinseBeaker();
  const b=document.getElementById('chMission'); if(b) b.setAttribute('aria-pressed','true');
  missionLab.montrer(); missionLab.commencer(); M.son('clic',{ volume:0.2 });
  shell.say("Mission : trois réactions à réussir. D'abord la sécurité : lunettes, puis hotte. Ensuite verse les bons réactifs, observe, et choisis l'équation équilibrée. Chaque erreur explique. Le chrono tourne.",'enthousiaste');
  if(prof) setTimeout(()=>prof.dire('Première chose à faire : les lunettes. Elles sont posées devant toi, ou dans le panneau.',5),2200);
}
function missionReaction(reac){ if(!missionLancee||!missionLab||missionLab.estFinie())return; const r=MISSION_R.find(x=>x.id===reac.id);
  if(!r){ if(prof) prof.dire('Belle observation, mais ce n\'est pas une des trois réactions de la mission. Rince et continue.',5); return; }
  if(missionLab.objectifs.find(o=>o.id===r.id&&o.fait)){ if(prof) prof.dire('Celle-ci est déjà validée. Rince, il en reste d\'autres.',4); return; }
  if(prof) prof.dire('Observe bien, puis choisis la bonne équation.',4);
  setTimeout(()=>poserQuestion(r),900); }
function poserQuestion(r){ if(!missionLancee||missionLab.estFinie())return; questionLab=r; let el=document.getElementById('chMq'); if(!el){ el=document.createElement('div'); el.className='ch-mq'; el.id='chMq'; el.setAttribute('role','group'); el.setAttribute('aria-label','Question de la mission'); shell.stage.appendChild(el); }
  el.classList.toggle('bas', !!document.getElementById('chQuiz'));
  el.innerHTML=`<div class="t"><b>${r.texte.split(' (')[0]}</b> · ${r.q.texte}</div><div class="r">${r.q.choix.map((c,i)=>`<button type="button" data-i="${i}">${c}</button>`).join('')}</div><div class="s">Compte chaque sorte d'atome à gauche et à droite de la flèche.</div>`;
  el.querySelectorAll('button').forEach(btn=>{ btn.onclick=()=>repondre(+btn.dataset.i); }); el.classList.add('on'); }
function fermerQuestion(){ const el=document.getElementById('chMq'); if(el){ el.classList.remove('on'); el.innerHTML=''; } questionLab=null; }
function repondre(i){ if(!questionLab||!missionLab||missionLab.estFinie())return; const r=questionLab;
  if(i===r.q.bonne){ M.son('clic',{ volume:0.3 }); const pts=Math.max(60,150-40*(r.erreurs||0)); fermerQuestion(); shell.say('Exact. '+r.q.explique[i],'celebration'); missionLab.valider(r.id,pts);
    const reste=MISSION_R.filter(x=>!missionLab.objectifs.find(o=>o.id===x.id&&o.fait)); if(reste.length&&prof) setTimeout(()=>{ if(missionLancee&&!missionLab.estFinie()) prof.dire('Rince le bécher. Il reste : '+reste.map(x=>x.texte.split(' (')[0].toLowerCase()).join(', ')+'.',5); },2500); }
  else { r.erreurs=(r.erreurs||0)+1; M.son('coup',{ volume:0.15 }); const el=document.getElementById('chMq'); const btn=el&&el.querySelector(`button[data-i="${i}"]`); if(btn)btn.disabled=true; shell.say('Pas celle-ci. '+r.q.explique[i]+' Choisis une autre réponse.','rassurant'); if(prof) prof.dire(r.q.explique[i],6); }
}
function finMission(reussie,secondes,score){ fermerQuestion(); const t=Math.round(secondes); const duree=Math.floor(t/60)+' min '+(t%60)+' s';
  const b=document.getElementById('chMission'); if(b) b.setAttribute('aria-pressed','false');
  if(!reussie){ setTimeout(()=>{ if(missionLab) missionLab.cacher(); },4000); return; }
  M.son('cloche',{ volume:0.2 }); const secu=fautesSecu===0?'Sécurité sans faute.':fautesSecu===1?'Un oubli de sécurité, à ne pas refaire.':fautesSecu+' oublis de sécurité, à ne pas refaire.';
  if(prof) prof.dire('Trois réactions réussies en '+duree+'. '+secu,7);
  const stars=fautesSecu?2:(t>300?2:3);
  if(shell.mode!=='cours'){ shell.win({ score, stars, title:'Trois réactions réussies en '+duree, learned:shell.cfg.learned, buddy:secu+' Deux équations équilibrées et une base reconnue : du vrai travail de chimiste.' }); }
  else { shell.say('Mission réussie en '+duree+' : '+score+' points de plus. '+secu+' Les défis continuent.','fier'); if(shell.celebrate) shell.celebrate(); setTimeout(()=>{ if(missionLab) missionLab.cacher(); },9000); }
}
window.__monde={ lancerMission, verser:addReagent, rincer:rinseBeaker, lunettes:mettreLunettes, hotte:basculerHotte, repondre, mission:()=>missionLab, question:()=>questionLab, prof:()=>prof, marche:()=>marche, defi:()=>quiz, flamme:flameTest, mol:selectMol, onglet:setTab, fautes:()=>fautesSecu, etatLab:()=>({ contents:lab.contents.slice(), reacted:lab.reacted }) };

/* ============================================================
   ENTRÉES / RENDU
   ============================================================ */
function applyTheme(){ const dark=document.documentElement.getAttribute('data-theme')==='dark'; renderer.setClearColor(dark?0x05100d:0x081712,1); }
function onResize(){ const s=shell.stage; if(!s.clientWidth)return; camera.aspect=s.clientWidth/s.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(s.clientWidth,s.clientHeight); composer.setSize(s.clientWidth,s.clientHeight); }
function setP(e){ const r=renderer.domElement.getBoundingClientRect(); pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }
function pickList(){ if(tab==='table')return tiles; if(tab==='mol')return molAtoms; if(tab==='bench')return benchClickable; return []; }
function pick(){ raycaster.setFromCamera(pointer,camera); const h=raycaster.intersectObjects(pickList(),false); return h.length?h[0].object:null; }
function onMove(e){ setP(e); const o=pick(); renderer.domElement.style.cursor=o?'pointer':'grab'; hovered=(tab==='table')?o:null; }
function onDown(e){ if(marche&&marche.estActif())return; setP(e); const o=pick(); if(!o)return; if(M) M.son('clic',{ volume:0.15 });
  if(tab==='table'&&o.userData.el) clickTile(o.userData.el);
  else if(tab==='mol'&&o.userData.el) clickElement(o.userData.el);
  else if(tab==='bench'&&o.userData.glass) clickGlass(o.userData.glass);
}

function animate(){ requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),0.05); const t=clock.elapsedTime;
  for(const f of boucles){ try{ f(dt,t); }catch(e){ /* une boucle ne casse pas le rendu */ } }
  if(profBulle&&profBulle.parent&&prof){ const p=prof.position(); profBulle.position.set(p.x-(PETIT?6.5:4.2), PETIT?3.4:4.3, p.z+(PETIT?8:5.5)); }
  if(hotteObj&&hotteObj.userData.lum){ const l=hotteObj.userData.lum; l.intensity+=((hotteOn?1.4:0)-l.intensity)*Math.min(1,dt*3); }
  if(missionLab&&PETIT){ const info=document.getElementById('chInfo'); missionLab.zone.hidden=!missionLancee||missionLab.estFinie()||(info&&info.classList.contains('show'))||!!questionLab; }
  // molécule tourne
  if(molGroup.visible && !REDUCED) molGroup.rotation.y+=dt*0.35;
  // tuiles hover
  if(tableGroup.visible) tiles.forEach(tl=>{ tl.scale.lerp(new THREE.Vector3(tl===hovered?1.22:1,tl===hovered?1.22:1,1),0.2); tl.material.emissiveIntensity=tl===hovered?0.5:0.12; });
  // paillasse : flamme, liquide, bulles, précipité
  if(benchGroup.visible){
    // flicker flamme
    const fl=REDUCED?1:(1+Math.sin(t*13)*0.06+Math.sin(t*29)*0.03);
    if(lab.flame){ lab.flame.scale.set(1,fl,1); lab.flame.rotation.y=Math.sin(t*2)*0.05; }
    if(lab.flameTimer>0){ lab.flameTimer-=dt; if(lab.flameTimer<=0){ lab.flameCore.material.color.set(0xffb055); lab.flameCore.material.opacity=0.72; lab.flameCore.scale.set(1,1,1); lab.flameLight.color.copy(lab.flameBase); lab.flameLight.intensity=1.2; } }
    if(lab.flameLight) lab.flameLight.intensity*= (0.98+ (REDUCED?0.02:Math.random()*0.06));
    // niveau + couleur du liquide
    lab.liqLevel+=(lab.liqTarget-lab.liqLevel)*Math.min(1,dt*4);
    if(lab.liquid){ lab.liquid.scale.y=Math.max(0.001,lab.liqLevel); lab.liquid.position.y=0.08+ (lab.liqLevel*1.0)*0.5; lab.liquid.visible=lab.liqLevel>0.01; lab.liquid.material.color.lerp(lab.targetLiq,Math.min(1,dt*3)); }
    // bulles (effervescence)
    if(lab.fizz>0){ lab.fizz-=dt; for(let k=0;k<(REDUCED?1:2);k++){ const b=lab.bubbles.find(x=>!x.active); if(b){ b.active=true; b.m.visible=true; const a=Math.random()*Math.PI*2, rr=Math.random()*0.6; b.m.position.set(Math.cos(a)*rr,0.1,Math.sin(a)*rr); const s=0.4+Math.random()*0.8; b.m.scale.setScalar(s); b.vy=0.6+Math.random()*0.7; } } }
    lab.bubbles.forEach(b=>{ if(!b.active)return; b.m.position.y+=b.vy*dt; if(b.m.position.y> (lab.liqLevel*1.4)+0.15){ b.active=false; b.m.visible=false; } });
    lab.precip.forEach(p=>{ if(!p.active)return; if(p.m.position.y>0.12){ p.m.position.y+=p.vy*dt; } p.m.rotation.y+=p.ry*dt; });
  }
  controls.update(); composer.render();
}
</script>
