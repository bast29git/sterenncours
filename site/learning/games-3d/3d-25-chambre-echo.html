  .ch-details[open] summary { border-bottom: 1px solid var(--border); margin-bottom: 8px; }

<script type="module">
import { creerMonde, THREE, textureTexte } from '../monde-base.js';

/* Les trois milieux : vitesse du son, couleur de l'onde, couleur du brouillard, aspect du volume. */
const MILIEUX = {
  air: { nom: 'air', v: 340, couleur: 0x4fa3ff, fond: 0x9aa1a8, volume: null },
  eau: { nom: 'eau', v: 1500, couleur: 0x2fc4b2, fond: 0x3f7f98, volume: { color: 0x2f86b8, opacity: 0.34, roughness: 0.08, metalness: 0 } },
  acier: { nom: 'acier', v: 5000, couleur: 0xf5a623, fond: 0x6f757c, volume: { color: 0x9aa2ab, opacity: 0.62, roughness: 0.3, metalness: 0.9 } },
};
const ECH = 0.25; // 1 m = 0,25 unité de scène
const X0 = -3.0; const X1 = 53.2; const W = 3.6; const H = 2.4; const LARG = X1 - X0; // la galerie d'essai
const XFACE = 0.28; // la face du haut-parleur : le zéro de la règle
let milieu = 'air'; let D = 34; let ralenti = 40; let vue = 'libre';
let M, panneau, mur, emetteur, membrane, led, micro, onde, traine = [], anneaux = {}, particules, volume, chrono, oscillo, prop = null, dernierResultat = null;
const F = (x, n) => x.toFixed(n).replace('.', ',');
const nb = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const temps = (m) => 2 * D / MILIEUX[m || milieu].v;
const xMur = () => XFACE + D * ECH; // la face du réflecteur
const LEGENDES = [
  { nom: 'Émetteur', phrase: 'Le haut-parleur : une membrane qui vibre et fait vibrer l\'air devant elle.' },
  { nom: 'Mur', phrase: 'Le réflecteur mobile : le son s\'y réfléchit et revient. C\'est l\'écho.' },
  { nom: 'Micro', phrase: 'Il capte le retour du son et arrête le chronomètre.' },
  { nom: 'Onde sonore', phrase: 'Une vibration qui se propage dans la matière, jamais dans le vide.' },
  { nom: 'Chronomètre', phrase: 'Il démarre quand le son part et s\'arrête quand l\'écho revient au micro.' },
  { nom: 'Oscilloscope', phrase: 'Il dessine le son émis puis l\'écho reçu : l\'écart entre les deux pics est le temps mesuré.' },
  { nom: 'Particules du milieu', phrase: 'Chaque particule vibre sur place et pousse la suivante : le son avance, la matière reste.' },
  { nom: 'Règle graduée', phrase: 'Un repère tous les mètres, un nombre tous les dix mètres : elle donne la distance D du mur.' },
  { nom: 'Rail', phrase: 'Le réflecteur roule dessus : on règle la distance D sans déplacer le haut-parleur.' },
  { nom: 'Table de mesure', phrase: 'L\'amplificateur alimente le haut-parleur ; l\'oscilloscope et le chronomètre lisent le micro.' },
];
const leg = (nom) => LEGENDES.find((l) => l.nom === nom).phrase;

const shell = window.Konstrio.createGame({
  id: '3d-25-chambre-echo', code: '3D·25', title: 'La chambre d\'écho', type: '3D', duree: '10 min',
  domain: { label: 'Physique · Sons', color: '#8A4FD3' },
  intro: {
    greet: 'Une longue galerie d\'essai, un haut-parleur, un réflecteur sur rails, un micro. Émets un son, chronomètre l\'aller-retour, calcule la vitesse.',
    rule: 'Le son part du haut-parleur, touche le réflecteur et revient au micro. Le temps mesuré vaut 2 × D ÷ v. Change le milieu : air, eau, acier.',
    how: ['Glisse pour tourner, molette pour zoomer. Le panneau propose trois vues.', 'Règle la distance D, choisis le milieu, puis « Émettre un son » : l\'onde avance au ralenti et le chronomètre affiche le vrai temps.', '« Comparer les trois milieux » lance trois ondes en même temps.', 'Touche le haut-parleur, le micro, le réflecteur, l\'oscilloscope : chaque objet a sa légende.'],
    keys: 'Flèches : tourner · + et - : zoom · F : la fiche · Échap : pause.',
    objectif: 'Utiliser v = d ÷ t avec un écho, et comparer la vitesse du son dans l\'air, l\'eau et l\'acier.',
    hint: 'Aller-retour : le son parcourt 2 × D. Donc t = 2 × D ÷ v.',
    why: 'Le sonar des bateaux et l\'échographie mesurent une distance avec le temps d\'un écho.',
  },
  learned: ['Le son est une vibration qui se propage dans la matière : environ 340 m/s dans l\'air, 1 500 m/s dans l\'eau, 5 000 m/s dans l\'acier.', 'Avec un écho, le son parcourt deux fois la distance : t = 2 D ÷ v.', 'Le son ne se propage pas dans le vide.'],
  onReady: init, onStart: demarrer,
});

/* Les textures se répètent sans s'étirer : on met les UV à l'échelle de la face. */
function uv(geo, su, sv) { const a = geo.attributes.uv; for (let i = 0; i < a.count; i += 1) a.setXY(i, a.getX(i) * su, a.getY(i) * sv); a.needsUpdate = true; return geo; }
/* Un cylindre d'un point à un autre (pieds, bras, tubes). */
function barre(a, b, rayon, materiau, parent) {
  const p1 = new THREE.Vector3(...a); const p2 = new THREE.Vector3(...b); const L = p1.distanceTo(p2);
  const m = M.mesh(new THREE.CylinderGeometry(rayon, rayon, L, 10), materiau, [0, 0, 0], parent);
  m.position.copy(p1).add(p2).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize()); return m;
}
/* Un câble posé au sol, qui suit une suite de points. */
function cable(points, rayon, parent) {
  const courbe = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(...p)));
  const m = M.mesh(new THREE.TubeGeometry(courbe, 48, rayon || 0.012, 7, false), M.mat(0x1b1d20, { rugosite: 0.55 }), null, parent); m.raycast = () => {}; return m;
}
function canevas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return { c, x: c.getContext('2d'), t }; }

function init() {
  M = creerMonde(shell, {
    fond: 0x14171b, hdri: '../assets/3d/env/workshop_1k.hdr', environnement: 0.55, sol: false, ambiance: 0.5,
    soleil: { position: [9, 14, 4], intensite: 1.5, couleur: 0xfff1dc, etendue: 20 },
    brouillard: { couleur: MILIEUX.air.fond, densite: 0.012 },
    camera: { position: [-2.3, 1.25, -1.6], cible: [2.8, 0.75, 0.1], min: 0.8, max: 70, fov: 52 },
    rendu: { bloom: { force: 0.32, rayon: 0.5, seuil: 0.85 } },
    legendes: LEGENDES, libelle: 'Une longue galerie d\'essai acoustique avec un haut-parleur, un micro et un réflecteur mobile sur rails',
  });
  M.soleil.target.position.set(9, 0, 0); M.scene.add(M.soleil.target);
  construireGalerie(); construireMateriel(); construireOnde(); construirePanneau();
  placer(); appliquerMilieu();
  M.boucle(animer);
}

/* ---------- La galerie : sol, murs, plafond, piliers, lampes, rails, règle, décor ---------- */
function construireGalerie() {
  const { scene, mesh, mat, meshPBR, pbr, legender, preparerAo } = M;
  const cx = (X0 + X1) / 2;
  const sol = meshPBR(uv(new THREE.PlaneGeometry(LARG, W), LARG / 1.2, W / 1.2), 'concrete_tiles', { repetition: 1, couleur: 0xd6d2ca, rugosite: 1 }, [cx, 0, 0]); sol.rotation.x = -Math.PI / 2; sol.castShadow = false; sol.name = 'sol';
  const murG = meshPBR(uv(new THREE.PlaneGeometry(LARG, H), LARG / 1.6, H / 1.6), 'concrete_floor_02', { repetition: 1, couleur: 0xd9d3c9 }, [cx, H / 2, -W / 2]); murG.castShadow = false;
  const murD = meshPBR(uv(new THREE.PlaneGeometry(LARG, H), LARG / 1.6, H / 1.6), 'concrete_floor_02', { repetition: 1, couleur: 0xd9d3c9 }, [cx, H / 2, W / 2]); murD.rotation.y = Math.PI; murD.castShadow = false;
  // lambris de bois acoustique sur le bas des murs, plinthe sombre
  [[-1, 0], [1, Math.PI]].forEach(([s, ry]) => {
    const l = meshPBR(uv(new THREE.PlaneGeometry(LARG, 0.75), LARG / 1.5, 0.5), 'brown_planks_09', { repetition: 1, couleur: 0xb48d5e, rugosite: 0.8 }, [cx, 0.395, s * (W / 2 - 0.012)]); l.rotation.y = ry; l.castShadow = false;
    mesh(new THREE.BoxGeometry(LARG, 0.06, 0.03), mat(0x2a2d32, { rugosite: 0.6 }), [cx, 0.03, s * (W / 2 - 0.015)]).castShadow = false;
  });
  const plafond = meshPBR(uv(new THREE.PlaneGeometry(LARG, W), LARG, W), 'corrugated_iron', { repetition: 1, couleur: 0xb4b8be, rugosite: 0.7, metal: 0.3 }, [cx, H, 0]); plafond.rotation.x = Math.PI / 2; plafond.castShadow = false;
  const fond = meshPBR(uv(new THREE.PlaneGeometry(W, H), W / 1.6, H / 1.6), 'concrete_floor_02', { repetition: 1, couleur: 0xcfc9bf }, [X1, H / 2, 0]); fond.rotation.y = -Math.PI / 2; fond.castShadow = false;
  const entree = meshPBR(uv(new THREE.PlaneGeometry(W, H), W / 1.6, H / 1.6), 'concrete_floor_02', { repetition: 1, couleur: 0xcfc9bf }, [X0, H / 2, 0]); entree.rotation.y = Math.PI / 2; entree.castShadow = false;
  // piliers tous les 10 m, poutres, lampes et verrières : des maillages instanciés
  const nP = Math.floor((X1 - 0.6) / 2.5);
  const geoP = preparerAo(uv(new THREE.BoxGeometry(0.22, H, 0.16), 1, H / 0.22));
  const piliers = new THREE.InstancedMesh(geoP, pbr('concrete_floor_02', { repetition: 1, couleur: 0xb9b3a9 }), nP * 2);
  const poutres = new THREE.InstancedMesh(new THREE.BoxGeometry(0.22, 0.28, W), mat(0x3a3f47, { rugosite: 0.5, metal: 0.7 }), nP);
  const lampes = new THREE.InstancedMesh(new THREE.BoxGeometry(1.3, 0.05, 0.14), new THREE.MeshStandardMaterial({ color: 0xfff7e8, emissive: 0xfff1d6, emissiveIntensity: 1.6, roughness: 0.4 }), nP);
  const nV = Math.floor(nP / 2);
  const verrieres = new THREE.InstancedMesh(new THREE.PlaneGeometry(1.4, 0.9), new THREE.MeshStandardMaterial({ color: 0xdfe9f5, emissive: 0xcfe0f5, emissiveIntensity: 1.2, roughness: 0.2 }), nV);
  const m4 = new THREE.Matrix4(); const rotV = new THREE.Matrix4().makeRotationX(Math.PI / 2);
  for (let i = 0; i < nP; i += 1) {
    const x = 0.6 + i * 2.5;
    m4.makeTranslation(x, H / 2, -W / 2 + 0.08); piliers.setMatrixAt(i * 2, m4); m4.makeTranslation(x, H / 2, W / 2 - 0.08); piliers.setMatrixAt(i * 2 + 1, m4);
    m4.makeTranslation(x, H - 0.14, 0); poutres.setMatrixAt(i, m4);
    m4.makeTranslation(x + 1.25, H - 0.04, 0); lampes.setMatrixAt(i, m4);
    if (i % 2 === 0 && i / 2 < nV) { m4.makeTranslation(x + 1.25, H - 0.005, 0.95).multiply(rotV); verrieres.setMatrixAt(i / 2, m4); }
  }
  piliers.castShadow = true; piliers.receiveShadow = true; poutres.castShadow = true; lampes.castShadow = false; verrieres.castShadow = false;
  scene.add(piliers, poutres, lampes, verrieres);
  // tuyaux et gaine de ventilation le long du plafond
  [-1, 1].forEach((s) => { const t = meshPBR(uv(new THREE.CylinderGeometry(0.07, 0.07, LARG - 0.3, 16), 1, (LARG - 0.3) / 0.44), 'metal_plate', { repetition: 1, couleur: 0x8f959c, rugosite: 0.5, metal: 0.8 }, [cx, H - 0.42, s * (W / 2 - 0.24)]); t.rotation.z = Math.PI / 2; });
  meshPBR(uv(new THREE.BoxGeometry(LARG - 0.6, 0.36, 0.45), (LARG - 0.6) / 0.45, 1), 'metal_plate_02', { repetition: 1, couleur: 0xb9bec5, rugosite: 0.45, metal: 0.7 }, [cx, H - 0.5, -0.75]);
  // les rails du réflecteur
  [-1.15, 1.15].forEach((z) => { const r = meshPBR(uv(new THREE.BoxGeometry(52, 0.05, 0.08), 52 / 0.3, 1), 'metal_plate', { repetition: 1, couleur: 0x7d8288, rugosite: 0.4, metal: 0.85 }, [27, 0.025, z]); legender(r, 'Rail', leg('Rail')); });
  // la règle graduée : une seule texture de 4096 px pour 210 m, sur chaque mur
  const reg = canevas(4096, 128); const x = reg.x; const ppm = 4096 / 210; const sx = (4096 / 52.5) / (128 / 0.2);
  x.fillStyle = '#f1ece2'; x.fillRect(0, 0, 4096, 128); x.fillStyle = '#b3261e'; x.fillRect(0, 120, 4096, 8); x.fillStyle = '#1d2228';
  for (let m = 0; m <= 210; m += 1) { const px = m * ppm; const h = m % 10 === 0 ? 72 : m % 5 === 0 ? 48 : 28; x.fillRect(px - (m % 10 === 0 ? 1.5 : 1), 120 - h, m % 10 === 0 ? 3 : 2, h); }
  x.save(); x.scale(1 / sx, 1); x.font = '700 60px Nunito, Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let m = 10; m <= 200; m += 10) x.fillText(String(m), m * ppm * sx, 36); x.restore(); reg.t.needsUpdate = true;
  const matRegle = new THREE.MeshStandardMaterial({ map: reg.t, roughness: 0.85 });
  [[-1, 0], [1, Math.PI]].forEach(([s, ry]) => { const r = mesh(new THREE.PlaneGeometry(52.5, 0.2), matRegle, [XFACE + 26.25, 0.95, s * (W / 2 - 0.006)]); r.rotation.y = ry; r.castShadow = false; legender(r, 'Règle graduée', leg('Règle graduée')); });
  // décor de l'entrée : porte, issue de secours, extincteur, caisses, panneau
  const porte = new THREE.Group(); scene.add(porte); porte.position.set(X0, 0, 0.9);
  mesh(new THREE.BoxGeometry(0.03, 0.58, 0.28), mat(0x2b2f34, { rugosite: 0.5, metal: 0.6 }), [0.015, 0.29, 0], porte);
  mesh(new THREE.BoxGeometry(0.03, 0.53, 0.23), mat(0x2f5a3f, { rugosite: 0.45, metal: 0.3 }), [0.035, 0.265, 0], porte);
  mesh(new THREE.SphereGeometry(0.014, 10, 8), mat(0xc9ccd1, { rugosite: 0.3, metal: 0.9 }), [0.055, 0.27, 0.08], porte);
  const issue = mesh(new THREE.PlaneGeometry(0.22, 0.07), new THREE.MeshStandardMaterial({ color: 0x3ddc84, emissive: 0x1fb86a, emissiveIntensity: 1.2 }), [0.06, 0.66, 0], porte); issue.rotation.y = Math.PI / 2; issue.castShadow = false;
  const ext = new THREE.Group(); scene.add(ext); ext.position.set(X0 + 0.07, 0.3, 0.3);
  mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.15, 14), mat(0xc1272d, { rugosite: 0.35, metal: 0.2 }), [0, 0, 0], ext);
  mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.04, 10), mat(0x202326, { metal: 0.8, rugosite: 0.3 }), [0, 0.095, 0], ext);
  mesh(new THREE.BoxGeometry(0.06, 0.04, 0.02), mat(0x2b2f34, { metal: 0.6 }), [-0.04, 0.02, 0], ext);
  [[-1.3, 0.15], [-0.95, 0.15], [-1.3, 0.45]].forEach(([z, y]) => meshPBR(new THREE.BoxGeometry(0.3, 0.3, 0.3), 'worn_planks', { repetition: 1, rugosite: 0.9 }, [X0 + 0.45, y, z]));
  const affiche = mesh(new THREE.PlaneGeometry(1.1, 0.26), new THREE.MeshBasicMaterial({ map: textureTexte('ESSAIS ACOUSTIQUES · SILENCE PENDANT LA MESURE', { taille: 30, fond: '#1d2228', couleur: '#f6efe2' }) }), [-0.6, 1.3, W / 2 - 0.01]); affiche.rotation.y = Math.PI; affiche.castShadow = false;
}

/* ---------- Le matériel : haut-parleur, micro, réflecteur mobile, table, chronomètre ---------- */
function construireMateriel() {
  const { scene, mesh, mat, meshPBR, legender } = M;
  const acier = mat(0x8a8f96, { rugosite: 0.35, metal: 0.9 }); const noirMat = mat(0x202327, { rugosite: 0.6, metal: 0.3 });
  // le haut-parleur : socle, caisse habillée, baffle, haut-parleur de graves et tweeter
  emetteur = new THREE.Group(); scene.add(emetteur);
  mesh(new THREE.BoxGeometry(0.56, 0.05, 0.56), mat(0x1b1d21, { rugosite: 0.5, metal: 0.6 }), [0, 0.025, 0], emetteur);
  meshPBR(uv(new THREE.BoxGeometry(0.46, 0.56, 0.46), 2, 2.4), 'rubber_tiles', { repetition: 1, couleur: 0x2a2c31, rugosite: 0.9 }, [0, 0.33, 0], emetteur);
  [-1, 1].forEach((sx) => [-1, 1].forEach((sy) => [-1, 1].forEach((sz) => mesh(new THREE.BoxGeometry(0.06, 0.06, 0.06), acier, [sx * 0.22, 0.33 + sy * 0.27, sz * 0.22], emetteur))));
  mesh(new THREE.BoxGeometry(0.02, 0.52, 0.42), mat(0x15171a, { rugosite: 0.7 }), [0.24, 0.33, 0], emetteur);
  const tore = mesh(new THREE.TorusGeometry(0.15, 0.022, 14, 40), mat(0x3b3d42, { rugosite: 0.8 }), [0.255, 0.23, 0], emetteur); tore.rotation.y = Math.PI / 2;
  membrane = new THREE.Group(); membrane.position.set(0.25, 0.23, 0); emetteur.add(membrane);
  const cone = mesh(new THREE.CylinderGeometry(0.145, 0.045, 0.09, 40, 1, true), new THREE.MeshStandardMaterial({ color: 0x24262a, roughness: 0.95, side: THREE.DoubleSide }), [-0.045, 0, 0], membrane); cone.rotation.z = -Math.PI / 2;
  mesh(new THREE.SphereGeometry(0.048, 20, 14), mat(0x3a3c40, { rugosite: 0.6, metal: 0.3 }), [-0.07, 0, 0], membrane);
  const horn = mesh(new THREE.CylinderGeometry(0.075, 0.025, 0.06, 28, 1, true), new THREE.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 0.3, metalness: 0.8, side: THREE.DoubleSide }), [0.22, 0.49, 0], emetteur); horn.rotation.z = -Math.PI / 2;
  mesh(new THREE.SphereGeometry(0.02, 14, 10), mat(0xd8dbe0, { rugosite: 0.2, metal: 0.9 }), [0.2, 0.49, 0], emetteur);
  led = mesh(new THREE.SphereGeometry(0.01, 10, 8), mat(0x6cff8a, { emissif: 0x3ddc84, intensite: 1.2 }), [0.252, 0.085, 0.17], emetteur); led.castShadow = false;
  const logo = mesh(new THREE.PlaneGeometry(0.2, 0.035), new THREE.MeshBasicMaterial({ map: textureTexte('OPALINE AUDIO', { taille: 28, fond: 'none', couleur: '#cfd4da' }), transparent: true }), [0.252, 0.565, 0], emetteur); logo.rotation.y = Math.PI / 2; logo.castShadow = false;
  [-1, 1].forEach((s) => mesh(new THREE.BoxGeometry(0.12, 0.03, 0.04), acier, [0, 0.42, s * 0.245], emetteur));
  legender(emetteur, 'Émetteur', leg('Émetteur'));
  // le micro sur trépied, orienté vers le réflecteur
  micro = new THREE.Group(); micro.position.set(1.0, 0, 0.62); scene.add(micro);
  for (let k = 0; k < 3; k += 1) { const a = k * 2 * Math.PI / 3 + 0.4; barre([0, 0.11, 0], [Math.cos(a) * 0.19, 0.005, Math.sin(a) * 0.19], 0.008, noirMat, micro); }
  barre([0, 0.09, 0], [0, 0.42, 0], 0.012, noirMat, micro);
  barre([0, 0.42, 0], [0.15, 0.3, 0], 0.009, noirMat, micro);
  mesh(new THREE.SphereGeometry(0.02, 12, 10), noirMat, [0, 0.42, 0], micro);
  const corps = mesh(new THREE.CapsuleGeometry(0.018, 0.1, 6, 14), mat(0x30343a, { rugosite: 0.3, metal: 0.8 }), [0.2, 0.3, 0], micro); corps.rotation.z = Math.PI / 2;
  mesh(new THREE.SphereGeometry(0.03, 18, 14), mat(0xb8bec6, { rugosite: 0.55, metal: 0.85 }), [0.275, 0.3, 0], micro);
  mesh(new THREE.SphereGeometry(0.006, 8, 6), mat(0xff5a36, { emissif: 0xff3b1f, intensite: 1.5 }), [0.17, 0.32, 0], micro).castShadow = false;
  cable([[0.15, 0.29, 0.005], [0.02, 0.4, 0.01], [-0.01, 0.2, 0.012], [-0.03, 0.012, 0.03], [-0.6, 0.012, -0.4], [-1.3, 0.012, -1.2], [-1.5, 0.05, -1.55]], 0.008, micro);
  legender(micro, 'Micro', leg('Micro'));
  // le réflecteur mobile sur rails : châssis à bandes jaunes, roues, panneau d'acier, cadre, pancarte
  mur = new THREE.Group(); scene.add(mur);
  const ray = canevas(256, 64); ray.x.fillStyle = '#e8b800'; ray.x.fillRect(0, 0, 256, 64); ray.x.fillStyle = '#1a1a1a';
  for (let i = -64; i < 256; i += 64) { ray.x.beginPath(); ray.x.moveTo(i, 64); ray.x.lineTo(i + 32, 64); ray.x.lineTo(i + 96, 0); ray.x.lineTo(i + 64, 0); ray.x.closePath(); ray.x.fill(); }
  ray.t.needsUpdate = true; ray.t.wrapS = ray.t.wrapT = THREE.RepeatWrapping; ray.t.repeat.set(6, 1);
  mesh(new THREE.BoxGeometry(0.5, 0.14, 3.0), new THREE.MeshStandardMaterial({ map: ray.t, roughness: 0.6 }), [0, 0.13, 0], mur);

  api.defis([
