<script type="module">

const boucles=[]; let accelTest=1; let M=null, modeJeu='detente', marche=null, monitrice=null, missionTrajets=null, missionLancee=false, trajet=null, ambVent=null, ambMoteur=null, panneauStop=null, keyLight=null, dernierPas=0, suiviCam=0, sonMoteurT=0, contactShadow=null;

const PAINTS=[

/* ============ FICHES PÉDAGOGIQUES ============ */
const PARTS={
  carros:{ icon:'🚗', name:'Carrosserie', sub:'Structure & aérodynamisme', color:'#2f6fe0',
    role:"La carrosserie protège les passagers et fend l'air. Sa forme fuselée réduit la traînée (coefficient Cx) pour gagner en vitesse et en sobriété. Elle intègre des zones de déformation qui absorbent l'énergie d'un choc.",
    facts:[['Rôle','Protéger & profiler'],['Grandeur','Coefficient Cx'],['Sécurité','Zones de déformation'],['Matériaux','Acier, alu, composites']],
    fun:"Une bonne aéro peut faire gagner 1 à 2 L/100 km sur autoroute : à 130 km/h, 80 % de l'énergie sert à repousser l'air !" },
  moteur:{ icon:'⚙️', name:'Moteur thermique', sub:'4 cylindres · cycle 4 temps', color:'#F5A623',
    role:"Le moteur brûle un mélange air + carburant dans ses cylindres. Chaque explosion pousse un piston, qui fait tourner le vilebrequin. Ce mouvement de rotation est la puissance envoyée aux roues. Mais 60 à 70 % de l'énergie part en chaleur !",

  transmission:{ icon:'🔗', name:'Transmission', sub:'Arbre & différentiel', color:'#29B6E0',
    role:"La transmission achemine la puissance de la boîte jusqu'aux roues via l'arbre puis le différentiel. Le différentiel laisse les roues tourner à des vitesses différentes en virage : la roue extérieure parcourt plus de chemin que l'intérieure.",

    fun:"Sans différentiel, tes roues « chasseraient » en virage : la voiture sauterait comme un caddie bloqué !" },

const texLoader=new THREE.TextureLoader();
const PBR_BASE='../assets/3d/pbr2k/';
let maxAniso=8, flakeNormal=null;
function loadTex(url,srgb,rep){ const t=texLoader.load(url,undefined,undefined,()=>{}); t.wrapS=t.wrapT=THREE.RepeatWrapping; if(rep) t.repeat.set(rep,rep); t.colorSpace=srgb?THREE.SRGBColorSpace:THREE.NoColorSpace; t.anisotropy=maxAniso; return t; }
// applique diffuse/normal/roughness(+metal,+ao bakée) réels sur un matériau existant
function applyPBR(material,slug,res,opt={}){ const rep=opt.repeat||1, b=PBR_BASE+slug+'/'+slug+'_';
  material.map=loadTex(b+'diff_'+res+'.jpg',true,rep);
  material.normalMap=loadTex(b+'nor_gl_'+res+'.jpg',false,rep); material.normalScale=new THREE.Vector2(opt.normal||1,opt.normal||1);
  material.roughnessMap=loadTex(b+'rough_'+res+'.jpg',false,rep);
  if(opt.metal){ material.metalnessMap=loadTex(b+'metal_'+res+'.jpg',false,rep); }
  if(opt.ao){ material.aoMap=loadTex(b+'ao_'+res+'.jpg',false,rep); material.aoMapIntensity=opt.aoInt||1; }
  if(opt.color!==undefined) material.color.setHex(opt.color);
  material.needsUpdate=true; return material; }

function enableAO(geo){ if(geo.attributes.uv && !geo.attributes.uv1) geo.setAttribute('uv1', geo.attributes.uv); }
// petit bruit normal pour les flocons métallisés du vernis (procédural, local)
function makeFlakeNormal(){ const s=256,c=document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d'); const img=x.createImageData(s,s);
  for(let i=0;i<s*s;i++){ const dx=(Math.random()-0.5)*40, dy=(Math.random()-0.5)*40; img.data[i*4]=128+dx; img.data[i*4+1]=128+dy; img.data[i*4+2]=255; img.data[i*4+3]=255; }
  x.putImageData(img,0,0); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(28,28); t.colorSpace=THREE.NoColorSpace; return t; }
// tache d'ombre de contact douce (occlusion visible même en rendu logiciel)
function makeContactShadow(){ const s=256,c=document.createElement('canvas'); c.width=c.height=s; const x=c.getContext('2d'); const g=x.createRadialGradient(s/2,s/2,10,s/2,s/2,s/2); g.addColorStop(0,'rgba(0,0,0,0.55)'); g.addColorStop(0.55,'rgba(0,0,0,0.28)'); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(0,0,s,s); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.NoColorSpace; return t; }

  buildTerrain();
  const pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
  // HDRI de ciel (Poly Haven CC0) pour les reflets du vernis ; le fond reste le dôme de fin de journée

/* --- roues (pneu + jante + disque + suspension) --- */
function buildWheels(){
  // matériaux partagés (textures CC0 réelles) : caoutchouc de pneu + métal brossé des jantes
  const tireMat=rubberMat(); applyPBR(tireMat,'rubber_tiles','2k',{repeat:3,normal:1.2}); tireMat.color.setHex(0x2a2c31); tireMat.roughness=1.0; tireMat.metalness=0.0;
  const rimMat=new THREE.MeshStandardMaterial({color:0xd6dae2,metalness:1.0,roughness:0.35,envMapIntensity:1.5}); applyPBR(rimMat,'metal_plate_02','1k',{repeat:1,metal:true,normal:0.7});
  const positions=[[FRONT_X,TRACK,true],[FRONT_X,-TRACK,true],[REAR_X,TRACK,false],[REAR_X,-TRACK,false]];
  positions.forEach(([x,z,isFront])=>{
    const pivot=new THREE.Group(); pivot.position.set(x,WR,z); car.add(pivot);
    const spin=new THREE.Group(); pivot.add(spin);
    // pneu
    const tire=new THREE.Mesh(new THREE.CylinderGeometry(WR,WR,0.34,48,1,false), tireMat);
    tire.rotation.x=Math.PI/2; tire.castShadow=true; tire.userData.part='roue'; spin.add(tire);
    // flanc/tread
    const tread=new THREE.Mesh(new THREE.TorusGeometry(WR-0.01,0.09,12,40), rubberMat()); tread.rotation.y=Math.PI/2; spin.add(tread);
    // jante
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.31,0.31,0.30,40), chromeMat()); rim.rotation.x=Math.PI/2; rim.position.z=(z>0?0.03:-0.03); spin.add(rim);
    for(let i=0;i<5;i++){ const spoke=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.5,0.09), rimMat); spoke.rotation.z=i*Math.PI*2/5; spoke.position.z=(z>0?0.06:-0.06); spin.add(spoke); }
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.36,16), mat(0x6b7280,0.9,0.3)); hub.rotation.x=Math.PI/2; spin.add(hub);
    // disque de frein (dans spin) + étrier (dans pivot, fixe)
    const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.05,28), mat(0x9aa0ad,0.85,0.35)); disc.rotation.x=Math.PI/2; disc.position.z=(z>0?-0.06:0.06); spin.add(disc);
    disc.userData.brake=true;
    const caliper=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.34,0.14), mat(0xE63329,0.4,0.5)); caliper.position.set(0,0.28,(z>0?-0.06:0.06)); pivot.add(caliper); caliper.userData.part='freins'; suspMeshes.push(caliper);
    // suspension : ressort hélicoïdal + amortisseur (dans pivot)
    const spring=buildSpring(0.15,0.55,7); spring.position.set(0,0.55,(z>0?-0.02:0.02)); pivot.add(spring); spring.userData.part='suspension'; suspMeshes.push(spring);
    const damper=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.6,10), mat(0xc9cdd6,0.9,0.25)); damper.position.set(0,0.55,(z>0?-0.02:0.02)); pivot.add(damper); suspMeshes.push(damper);
    wheelPivots.push(pivot); wheelSpin.push(spin);
    if(isFront) steerWheels.push(pivot);
  });
  // ailes / passages de roue (cachent la suspension en vue extérieure)
  [[FRONT_X,TRACK],[FRONT_X,-TRACK],[REAR_X,TRACK],[REAR_X,-TRACK]].forEach(([x,z])=>{
    const arch=new THREE.Mesh(new THREE.TorusGeometry(WR+0.12,0.13,12,24,Math.PI), paintMat());
    arch.position.set(x,WR,z*1.05); arch.castShadow=true; car.add(arch); bodyPanels.push(arch);
  });
  const noop={ traverse:()=>{} };
  parts.roue={ obj:noop, anchor:new THREE.Vector3(FRONT_X,WR+0.6,-TRACK), name:PARTS.roue.name };
  parts.freins={ obj:noop, anchor:new THREE.Vector3(REAR_X,WR+0.4,-TRACK), name:PARTS.freins.name };
  parts.suspension={ obj:noop, anchor:new THREE.Vector3(FRONT_X,WR+0.5,TRACK), name:PARTS.suspension.name };
}
function buildSpring(r,h,turns){
  const pts=[]; const N=turns*14;
  for(let i=0;i<=N;i++){ const t=i/N, a=t*turns*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r, t*h-h/2, Math.sin(a)*r)); }
  const geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),N,0.03,7,false);
  return new THREE.Mesh(geo, mat(0x1E8C7A,0.7,0.35));
}

  // moteur électrique (essieu arrière)

  const emSpin=new THREE.Group(); em.add(emSpin); elecMotor=emSpin;

  for(let i=0;i<10;i++){ const fin=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.05,0.06), mat(0x1f8fb0,0.7,0.4)); fin.position.set(0,0.34,0); fin.rotation.x=i*Math.PI/5; emSpin.add(fin); }
  [1,-1].forEach(sgn=>{ const ax=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,TRACK-0.3,10), chromeMat()); ax.rotation.x=Math.PI/2; ax.position.set(0,0,sgn*(TRACK/2+0.05)); em.add(ax); });

  em.userData.home=em.position.clone(); em.userData.exp=new THREE.Vector3(0,0.45,0);
  // onduleur
  const inv=new THREE.Group(); inv.position.set(1.4,0.75,0); elecGroup.add(inv);
  const invBox=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.4,0.9), mat(0x8A7BFF,0.5,0.4)); invBox.castShadow=true; inv.add(invBox);

function shade(hex,p){ const n=parseInt(hex.replace('#',''),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255; const f=v=>Math.max(0,Math.min(255,Math.round(v+v*p/100))); return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); }

/* ============ INTERACTION 3D ============ */
function setP(e){ const r=renderer.domElement.getBoundingClientRect(); pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }
function pick(){ raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(car.children,true); for(const h of hits){ let o=h.object; if(o.material&&o.material.transparent&&o.material.opacity<0.06)continue; while(o&&!o.userData.part)o=o.parent; if(o&&o.userData.part)return o.userData.part; } return null; }
function onMove(e){ setP(e); const p=pick(); renderer.domElement.style.cursor=p?'pointer':'grab'; hovered=p; }
function onDown(e){ setP(e); const key=pick(); if(!key)return;
  if(shell.api.mode==='cours' && course && course.step && course.step.type==='find'){ checkFind(key); return; }
  openFiche(key); focusOn(key); shell.sound('pop');
  const d=PARTS[key]; if(d) shell.api.say(d.role.split('.')[0]+'.','concentre');
}
function focusOn(key){ const p=parts[key]; if(!p)return; focusPoint=p.anchor.clone().add(car.position); flying=true; }

function startCourse(){ setView('exp'); const dv=document.getElementById('caDrive'); if(dv)dv.style.display='none'; const h=document.getElementById('caHint'); if(h)h.style.display='none';

function showStep(){ if(!course)return; if(course.idx>=course.total){ winCourse(); return; } const st=COURSE[course.idx]; course.step=st;
  if(st.mode && mode!==st.mode) setMode(st.mode,true);

  let q=document.getElementById('caQuiz'); if(!q){ q=document.createElement('div'); q.className='ca-quiz'; q.id='caQuiz'; shell.api.stage.appendChild(q); }
  if(st.type==='find'){
    q.innerHTML=`<span class="qn">${course.idx+1}/${course.total}</span><div class="qt">🎯 Trouve la pièce</div><div class="qs">${st.ask}</div>`;
    shell.api.say(st.say,'curieux');
  } else {
    q.innerHTML=`<span class="qn">${course.idx+1}/${course.total}</span><div class="qt">${st.ask}</div><div class="ca-qrow">${st.options.map((o,i)=>`<button class="ca-qo" data-i="${i}">${o}</button>`).join('')}</div>`;
    q.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>checkQcm(+b.dataset.i));
    shell.api.say(st.say,'curieux');

function checkFind(key){ const st=course.step; if(key===st.key){ correctStep(st.ok); } else { shell.sound('bad'); openFiche(key); shell.api.say("Pas celle-ci : c'est "+(PARTS[key]?PARTS[key].name.toLowerCase():'une autre pièce')+". Relis la consigne et réessaie.",'rassurant'); } }
function checkQcm(i){ const st=course.step; if(i===st.correct){ correctStep(st.ok); } else { shell.sound('bad'); shell.api.say("Presque ! Réfléchis encore et retente.",'rassurant'); } }
function correctStep(msg){ course.score++; shell.sound('good'); shell.api.addScore(150); shell.api.say(msg,'celebration'); shell.api.toast('✅ Bonne réponse !');
  course.idx++; shell.api.setProgress(course.idx/course.total); setTimeout(showStep,1300); }
function winCourse(){ const q=document.getElementById('caQuiz'); if(q)q.remove(); const sc=course.score; const st=sc>=course.total?3:sc>=course.total-2?2:1;
  shell.api.win({ score:sc*150, stars:st, title:`${sc}/${course.total} : mécanique maîtrisée !`, learned:shell.cfg.learned,
    buddy: st===3?"Sans faute ! Tu connais la voiture de la carrosserie au moindre piston.":"Bien joué : relis les fiches et retente pour le sans-faute !",
    onNext:()=>{ shell.api.setScore(0); startCourse(); }, nextLabel:'Rejouer' });
  course=null;
}

/* ============================================================
   F228 : MISSION « TROIS TRAJETS À CHRONOMÉTRER » (vitesse, distance, temps, freinage)
   ============================================================ */
const fmt1=(x)=>(Math.round(x*10)/10).toLocaleString('fr-FR',{ minimumFractionDigits:0, maximumFractionDigits:1 });
const DECEL=6; // freinage en m/s²
const TRAJETS=[
  { id:'trajet1', nom:'Trajet 1 : mesurer une vitesse', type:'distance', d:50, vMin:27, vMax:45, pas:9, vDefaut:36,
    consigne:"Règle la vitesse (27, 36 ou 45 km/h), puis appuie sur Partir. La voiture roule sur 50 m. Lis le temps sur le chrono.",
    question:(tr)=>`La voiture a parcouru 50 m en ${fmt1(tr.temps)} s. Quelle est sa vitesse en m/s ? Calcule v = d ÷ t.`, unite:'m/s', attendu:(tr)=>50/tr.temps,
    aide:(tr)=>`v = d ÷ t = 50 ÷ ${fmt1(tr.temps)}. Fais la division, puis écris le résultat en m/s.`,
    bravo:(tr)=>`Oui : 50 ÷ ${fmt1(tr.temps)} = ${fmt1(50/tr.temps)} m/s, c'est-à-dire ${fmt1(50/tr.temps*3.6)} km/h. Même vitesse, deux unités.` },
  { id:'trajet2', nom:'Trajet 2 : calculer une distance', type:'temps', t:6, vFixe:54,
    consigne:"La vitesse est fixée à 54 km/h, c'est-à-dire 15 m/s. Appuie sur Partir : la voiture roule pendant 6 s. Ensuite, calcule la distance parcourue : d = v × t.",
    question:()=>"À 15 m/s pendant 6 s, quelle distance la voiture a-t-elle parcourue, en mètres ? Calcule d = v × t.", unite:'m', attendu:()=>90,
    aide:()=>"d = v × t = 15 × 6. Fais la multiplication, puis écris le résultat en mètres.",
    bravo:()=>"Oui : 15 × 6 = 90 m. Regarde la borne : le pare-chocs est bien à la borne 90 m." },
  { id:'trajet3', nom:'Trajet 3 : freiner à temps', type:'freinage', vMin:54, vMax:90, pas:18, vDefaut:72,
    consigne:"Règle la vitesse (54, 72 ou 90 km/h) et appuie sur Partir. Quand le panneau STOP s'allume, appuie sur Freiner. La voiture continue pendant 1 s (ton temps de réaction), puis elle freine.",
    question:(tr)=>`À ${fmt1(tr.vMs)} m/s, quelle distance la voiture parcourt-elle pendant 1 s de réaction ? Calcule d = v × t.`, unite:'m', attendu:(tr)=>tr.vMs,
    aide:(tr)=>`d = v × t = ${fmt1(tr.vMs)} × 1. Pendant 1 s, la voiture parcourt autant de mètres que sa vitesse en m/s.`,
    bravo:(tr)=>`Oui : ${fmt1(tr.vMs)} × 1 = ${fmt1(tr.vMs)} m avant même de freiner. Puis ${fmt1(tr.dFrein)} m de freinage : ${fmt1(tr.vMs+tr.dFrein)} m au total pour s'arrêter.` },
];
function assurerMission(){ if(missionTrajets||!M) return missionTrajets;
  missionTrajets=M.mission({ titre:'Trois trajets', cachee:true, chrono:true, chronoCible:300, gagner:false, annonce:false, surFin:finMission, objectifs:[
    { id:'depart', texte:'1. Régler la vitesse, partir', points:60 },
    { id:'trajet1', texte:'2. Trajet 1 : v = d ÷ t', points:120 },
    { id:'trajet2', texte:'3. Trajet 2 : d = v × t', points:120 },
    { id:'trajet3', texte:'4. Trajet 3 : freiner, d = v × t', points:140 } ] });
  missionTrajets.zone.classList.add('ca-mz'); missionTrajets.zone.setAttribute('aria-label','Mission : trois trajets à chronométrer');
  return missionTrajets;
}
function lancerMission(){ if(!assurerMission()) return;
  const b=document.getElementById('caMission'); if(b) b.setAttribute('aria-pressed','true');
  if(missionLancee&&!missionTrajets.estFinie()){ missionTrajets.montrer(); majTrajet(); return; }
  missionLancee=true; missionTrajets.montrer(); missionTrajets.commencer(); shell.api.stage.classList.add('ca-en-mission');
  // vue extérieure, moteur en route, voiture au départ
  view='ext'; explodeTarget=0; cutTarget=0; document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.view==='ext'));
  if(mode!=='thermique') setMode('thermique',true);
  replacerVoiture(); focusPoint=null; flying=false;
  if(!(marche&&marche.estActif())){ camera.position.set(car.position.x+7.5,3.4,8.5); controls.target.set(car.position.x+0.85,0.8,0); }
  ['caDrive','caHint','caQuiz'].forEach(id=>{ const el=document.getElementById(id); if(el) el.style.display='none'; });
  const f=document.getElementById('caFiche'); if(f) f.classList.remove('show');
  commencerTrajet(0);
  M.son('coup',{ volume:0.2 });
  shell.api.say("Mission : trois trajets à chronométrer. Gwenn mesure la distance et le temps ; toi, tu calcules la vitesse ou la distance avec v = d ÷ t et d = v × t. Le chrono tourne.",'enthousiaste');
  if(monitrice){ monitrice.regarder(car.position); setTimeout(()=>{ if(trajet) monitrice.dire('Règle ta vitesse, puis pars. Je chronomètre.',5); },2500); }
}
function replacerVoiture(){ car.position.x=0; suiviCam=0; if(contactShadow) contactShadow.position.x=0; if(panneauStop) panneauStop.visible=false; }
function commencerTrajet(idx){ const T=TRAJETS[idx]; if(!T){ return; }
  replacerVoiture();
  trajet={ idx, T, phase:'reglage', vKmh:T.vFixe||T.vDefaut, vMs:0, vCur:0, temps:0, dist:0, stopT:0, stopAllume:false, dReaction:0, dFrein:0, essais:0 };
  if(!(marche&&marche.estActif())){ camera.position.set(7.5,3.4,8.5); controls.target.set(0.85,0.8,0); }
  if(T.type==='freinage'&&panneauStop){ panneauStop.visible=true; panneauStop.userData.mat.emissiveIntensity=0.1; panneauStop.userData.lum.intensity=0; }
  majTrajet();
}
function partir(){ if(!trajet||trajet.phase!=='reglage') return; const tr=trajet; const T=tr.T;
  tr.vMs=tr.vKmh/3.6; tr.vCur=tr.vMs; tr.temps=0; tr.dist=0; tr.phase='roule';
  if(T.type==='freinage'&&panneauStop){ panneauStop.position.x=POST_OFF+tr.vMs*2.5+16; panneauStop.visible=true; }
  started=true; startEngineSound(); const sb=document.getElementById('caStart'); if(sb){ sb.classList.add('on'); sb.textContent='⏹ Couper'; }
  if(missionTrajets) missionTrajets.valider('depart',60);
  M.son('clic',{ volume:0.2, frequence:700 }); majTrajet();
}
function freiner(){ if(!trajet||trajet.phase!=='roule'||trajet.T.type!=='freinage') return;
  if(!trajet.stopAllume){ M.son('clic',{ volume:0.18, frequence:300 }); shell.api.say("Pas encore : attends que le panneau STOP s'allume.",'rassurant'); return; }
  trajet.phase='reaction'; trajet.reactT=0; trajet.dReaction=0; majTrajet(); }
function tickTrajet(dt){ const tr=trajet; const T=tr.T;
  if(tr.phase==='roule'){ tr.temps+=dt; const pas=tr.vMs*dt; tr.dist+=pas; car.position.x+=pas;
    if(T.type==='distance'&&tr.dist>=T.d){ car.position.x-= (tr.dist-T.d); tr.dist=T.d; tr.temps=Math.round(T.d/tr.vMs*10)/10; finirRoulage(); }
    else if(T.type==='temps'&&tr.temps>=T.t){ car.position.x-=(tr.dist-tr.vMs*T.t); tr.dist=tr.vMs*T.t; tr.temps=T.t; finirRoulage(); }
    else if(T.type==='freinage'){ if(!tr.stopAllume&&tr.temps>=2.5){ tr.stopAllume=true; tr.stopT=0; if(panneauStop){ panneauStop.userData.mat.emissiveIntensity=1.6; panneauStop.userData.lum.intensity=6; } M.son('tic',{ volume:0.3, frequence:1200 }); shell.api.say('STOP ! Freine.','surpris'); }
      if(tr.stopAllume){ tr.stopT+=dt; if(tr.stopT>6){ shell.api.say("Tu n'as pas freiné : Gwenn freine pour toi. Recommençons le même trajet.",'rassurant'); tr.phase='reglage'; replacerVoiture(); started=false; updateEngineSound(); speed=0; rpm=0; if(panneauStop) panneauStop.userData.mat.emissiveIntensity=0.1; majTrajet(); return; } } }
    speed=tr.vCur*3.6; rpm=800+speed*45; }
  else if(tr.phase==='reaction'){ tr.reactT+=dt; const pas=tr.vMs*dt; tr.dReaction+=pas; car.position.x+=pas; tr.temps+=dt; speed=tr.vMs*3.6; rpm=800+speed*45;
    if(tr.reactT>=1){ car.position.x-=(tr.dReaction-tr.vMs); tr.dReaction=tr.vMs; tr.phase='freine'; tr.dFrein=0; M.son('coup',{ volume:0.4 }); } }
  else if(tr.phase==='freine'){ tr.vCur=Math.max(0,tr.vCur-DECEL*dt); const pas=tr.vCur*dt; tr.dFrein+=pas; car.position.x+=pas; tr.temps+=dt; speed=tr.vCur*3.6; rpm=800+speed*45;
    if(tr.vCur<=0){ tr.dFrein=Math.round(tr.vMs*tr.vMs/(2*DECEL)*10)/10; if(panneauStop){ panneauStop.userData.mat.emissiveIntensity=0.1; panneauStop.userData.lum.intensity=0; } finirRoulage(); } }
  if(tr.phase==='roule'||tr.phase==='reaction'||tr.phase==='freine'){ if(Math.floor(tr.temps*4)!==Math.floor((tr.temps-dt)*4)) majTrajet(true); }
}
function finirRoulage(){ const tr=trajet; tr.phase='question'; tr.vCur=0; speed=0; rpm=800; started=false; updateEngineSound(); const sb=document.getElementById('caStart'); if(sb){ sb.classList.remove('on'); sb.textContent='🔑 Démarrer'; }
  M.son('tic',{ volume:0.25, frequence:900 }); majTrajet();
  const T=tr.T; shell.api.say(T.question(tr),'concentre');
  if(monitrice) monitrice.dire(T.type==='freinage'?'Arrêtée. À toi de calculer.':'Chrono arrêté. À toi de calculer.',4);
}
function repondre(valeur){ if(!trajet||trajet.phase!=='question') return; const tr=trajet; const T=tr.T;
  const v=Number(String(valeur).replace(',','.')); if(!isFinite(v)){ shell.api.say('Écris un nombre, par exemple 12,5.','rassurant'); return; }
  const att=T.attendu(tr); const ok=Math.abs(v-att)<=0.05*att+1e-9; tr.essais++;
  if(!ok){ M.son('clic',{ volume:0.18, frequence:300 }); shell.api.say((tr.essais>=2?T.aide(tr):'Ce n\'est pas ça. Relis la question : quelle formule, quels nombres ?')+' Réessaie.','rassurant'); return; }
  tr.phase='fini'; M.son('cloche',{ volume:0.28 }); shell.api.say(T.bravo(tr),'celebration');
  if(missionTrajets) missionTrajets.valider(T.id, missionTrajets.objectifs.find(o=>o.id===T.id).points);
  majTrajet();
  if(monitrice) monitrice.dire(tr.idx<TRAJETS.length-1?'Juste. Trajet suivant.':'Trois trajets justes. Bien joué.',4);
  setTimeout(()=>{ if(trajet&&trajet.phase==='fini'&&trajet.idx<TRAJETS.length-1) commencerTrajet(trajet.idx+1); },1800);
}
function majTrajet(leger){ let el=document.getElementById('caTrajet');
  if(!trajet||!missionTrajets||missionTrajets.estFinie()){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.className='ca-panel ca-trajet'; el.id='caTrajet'; el.setAttribute('role','group'); el.setAttribute('aria-label','Trajet en cours'); shell.api.stage.appendChild(el); }
  const tr=trajet, T=tr.T;
  const mes=`<div class="mes"><span>Temps <b data-tps>${fmt1(tr.temps)} s</b></span><span>Distance <b data-dist>${T.type==='temps'&&tr.phase!=='fini'?'?':fmt1(tr.phase==='freine'||tr.phase==='reaction'||(tr.phase!=='roule'&&T.type==='freinage'&&tr.dReaction)?tr.dist+tr.dReaction+tr.dFrein:tr.dist)+' m'}</b></span><span>Vitesse <b data-vit>${Math.round(tr.vCur*3.6)} km/h</b></span></div>`;
  if(leger&&el.dataset.phase===tr.phase){ const t=el.querySelector('[data-tps]'); if(t) t.textContent=fmt1(tr.temps)+' s'; const d=el.querySelector('[data-dist]'); if(d&&T.type!=='temps') d.textContent=fmt1(tr.dist+tr.dReaction+tr.dFrein)+' m'; const vv=el.querySelector('[data-vit]'); if(vv) vv.textContent=Math.round(tr.vCur*3.6)+' km/h'; return; }
  el.dataset.phase=tr.phase;
  const tete=`<div class="t"><span>${T.nom} · ${tr.idx+1}/${TRAJETS.length}</span><span>${{reglage:'Réglage',roule:'En route',reaction:'Réaction (1 s)',freine:'Freinage',question:'Calcul',fini:'Validé'}[tr.phase]}</span></div>`;
  if(tr.phase==='reglage'){
    const reglage=T.vFixe?`<div class="c">Vitesse fixée : <b>${T.vFixe} km/h</b> = ${fmt1(T.vFixe/3.6)} m/s.</div>`:`<div class="row"><label>Vitesse : <b id="caTrV">${tr.vKmh} km/h = ${fmt1(tr.vKmh/3.6)} m/s</b><input id="caTrSl" type="range" min="${T.vMin}" max="${T.vMax}" step="${T.pas}" value="${tr.vKmh}" aria-label="Vitesse en kilomètres par heure"></label></div>`;
    el.innerHTML=`${tete}<div class="c">${T.consigne}</div>${reglage}<div class="row actions"><button class="ca-b primary" id="caTrGo">🏁 Partir</button></div>`;
    const sl=el.querySelector('#caTrSl'); if(sl) sl.oninput=e=>{ tr.vKmh=+e.target.value; el.querySelector('#caTrV').textContent=tr.vKmh+' km/h = '+fmt1(tr.vKmh/3.6)+' m/s'; M.son('clic',{ volume:0.1, frequence:500+tr.vKmh*4 }); };
    el.querySelector('#caTrGo').onclick=()=>{ shell.sound('click'); partir(); };
  } else if(tr.phase==='roule'||tr.phase==='reaction'||tr.phase==='freine'){
    const frein=T.type==='freinage'&&tr.phase==='roule'?`<div class="row"><button class="ca-b primary" id="caTrFrein">🛑 Freiner</button><span class="c">${tr.stopAllume?'Le panneau STOP est allumé : freine !':'Attends le panneau STOP.'}</span></div>`:'';
    el.innerHTML=`${tete}${mes}${frein}`;
    const bf=el.querySelector('#caTrFrein'); if(bf) bf.onclick=freiner;
  } else if(tr.phase==='question'){
    const bilan=T.type==='freinage'?`<div class="c">Pendant la réaction : <b>${fmt1(tr.dReaction)} m</b> · Freinage : <b>${fmt1(tr.dFrein)} m</b> · Arrêt total : <b>${fmt1(tr.dReaction+tr.dFrein)} m</b>. La distance de freinage grandit beaucoup plus vite que la vitesse : à 25 m/s il faut presque 3 fois plus de mètres qu'à 15 m/s.</div>`:'';
    el.innerHTML=`${tete}${mes}${bilan}<div class="c"><b>${T.question(tr)}</b></div><div class="row actions"><input id="caTrRep" type="number" step="0.1" inputmode="decimal" aria-label="Ta réponse" placeholder="?"><span class="c">${T.unite}</span><button class="ca-b primary" id="caTrOk">Valider</button></div>`;
    const inp=el.querySelector('#caTrRep'); el.querySelector('#caTrOk').onclick=()=>repondre(inp.value); inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); repondre(inp.value); } }; setTimeout(()=>{ try{ inp.focus(); }catch(e){} },50);
  } else { el.innerHTML=`${tete}${mes}<div class="c ok">✓ Réponse juste : ${fmt1(T.attendu(tr))} ${T.unite}.</div>`; }
}
function finMission(reussie, secondes, score){ const t=Math.round(secondes); const duree=Math.floor(t/60)+' min '+(t%60)+' s';
  const b=document.getElementById('caMission'); if(b) b.setAttribute('aria-pressed','false');
  trajet=null; majTrajet(); if(panneauStop) panneauStop.visible=false; shell.api.stage.classList.remove('ca-en-mission');
  const dv=document.getElementById('caDrive'); if(dv&&modeJeu!=='cours') dv.style.display=''; const h=document.getElementById('caHint'); if(h&&modeJeu!=='cours') h.style.display=''; const q=document.getElementById('caQuiz'); if(q) q.style.display='';
  if(!reussie){ shell.api.say("La mission s'arrête là. On pourra la reprendre.",'rassurant'); setTimeout(()=>{ if(missionTrajets) missionTrajets.cacher(); },4000); missionLancee=false; return; }
  M.son('cloche',{ volume:0.25 }); if(monitrice) monitrice.dire('Trois trajets en '+duree+'. Tu sais lire une vitesse.',6);
  if(modeJeu!=='cours'){ shell.api.win({ score, stars:t>300?2:3, title:'Trois trajets chronométrés en '+duree, learned:shell.cfg.learned.concat(["La vitesse se calcule avec v = d ÷ t ; la distance avec d = v × t. 1 m/s = 3,6 km/h.","Avant de freiner, la voiture roule pendant le temps de réaction ; la distance de freinage grandit bien plus vite que la vitesse."]), buddy:"Une vitesse mesurée, une distance calculée, un freinage compris. C'est exactement la physique du mouvement." }); }
  else { shell.api.say('Mission réussie en '+duree+' : '+score+' points de plus. Le quiz continue.','fier'); if(shell.api.celebrate) shell.api.celebrate(); setTimeout(()=>{ if(missionTrajets) missionTrajets.cacher(); },9000); }
}
/* ---------- marche autour de la voiture (F223) ---------- */
function assurerMarche(){ if(marche||!M) return marche;
  marche=M.marcher({ depart:[4,0,5.5], hauteur:1.65, vitesse:3, sol:0, limites:{ xmin:-16, xmax:230, zmin:-14, zmax:14 },
    collision:(x,z)=> (Math.abs(x-car.position.x)<2.95&&Math.abs(z)<1.5) || (monitrice&&Math.hypot(x-monitrice.position().x,z-monitrice.position().z)<0.6),
    aide:'Flèches ou ZQSD pour marcher autour de la voiture, glisse pour regarder. Échap : vue libre.',
    surPas:()=>{ const n=performance.now(); if(n-dernierPas>420){ dernierPas=n; M.son('pas',{ volume:0.16 }); } },
    surChangement:(on)=>{ const b=document.getElementById('caMarche'); if(b) b.setAttribute('aria-pressed', String(on)); if(on){ flying=false; focusPoint=null; shell.api.say("Tu marches sur la piste. Fais le tour de la voiture, approche-toi de Gwenn ; Échap pour revenir à la vue libre.",'concentre'); } } });
  return marche;
}
/* ---------- ambiance : vent du soir et souffle moteur qui suit la vitesse (F225) ---------- */
function demarrerAmbiance(){ if(!M||ambVent) return; try{ ambVent=M.ambiance({ fichier:'../assets/3d/audio/vent-parc.mp3', type:'vent', volume:0.07 }); ambMoteur=M.ambiance({ type:'machine', volume:0 }); }catch(e){ ambVent=null; ambMoteur=null; } }
window.__monde={ lancerMission, partir, freiner, repondre, vitesse:(kmh)=>{ if(trajet) trajet.vKmh=kmh; majTrajet(); }, etat:()=>trajet, mission:()=>missionTrajets, accelerer:(k)=>{ accelTest=k||1; } };

/* ============ SON MOTEUR ============ */
function startEngineSound(){ if(ac||shell.api.muted)return; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); engGain=ac.createGain(); engGain.gain.value=0; engGain.connect(ac.destination); engOsc=ac.createOscillator(); engOsc.type=mode==='electrique'?'sine':'sawtooth'; engOsc.frequency.value=60; engLp=ac.createBiquadFilter(); engLp.type='lowpass'; engLp.frequency.value=700; engOsc.connect(engLp); engLp.connect(engGain); engOsc.start(); }catch(e){} }
function updateEngineSound(){ if(!ac||!engOsc)return; engGain.gain.setTargetAtTime(started&&!shell.api.muted?(mode==='electrique'?0.05:0.13):0,ac.currentTime,.1); engOsc.type=mode==='electrique'?'sine':'sawtooth'; engOsc.frequency.setTargetAtTime(mode==='electrique'?180+speed*5:Math.max(45,rpm/38),ac.currentTime,.08); }

/* ============ THÈME / RESIZE / CLAVIER ============ */
function applyTheme(){ const dark=document.documentElement.getAttribute('data-theme')==='dark'; if(renderer) renderer.setClearColor(dark?0x0a0e16:0x141a26,1); if(composer&&composer.bloom) composer.bloom.strength=dark?0.58:0.46; }
function onResize(){ const s=shell.api.stage; if(!s.clientWidth)return; camera.aspect=s.clientWidth/s.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(s.clientWidth,s.clientHeight); composer.setSize(s.clientWidth,s.clientHeight); }
function onKey(e){ if(e.target&&e.target.tagName==='INPUT')return; if(e.key===' '||e.key==='Enter'){ const sb=document.getElementById('caStart'); if(sb){ sb.click(); e.preventDefault(); } } }

/* ============ ÉTIQUETTES 3D ============ */
const LABEL_KEYS={ moteur:'⚙️ Moteur', boite:'🔩 Boîte', transmission:'🔗 Transmission', freins:'🛑 Freins', suspension:'🌀 Suspension', reservoir:'⛽ Réservoir', batterie:'🔋 Batterie', moteurElec:'⚡ Moteur élec.', onduleur:'🔌 Onduleur', roue:'🛞 Roue' };
const labelEls={};
function updateLabels(){ const stage=shell.api.stage; const show=labelsOn && (view!=='ext');
  Object.keys(LABEL_KEYS).forEach(key=>{ const p=parts[key]; if(!p){ return; }
    const elec=mode==='electrique'; const isElecPart=(key==='batterie'||key==='moteurElec'||key==='onduleur'); const isThermPart=(key==='moteur'||key==='boite'||key==='transmission'||key==='reservoir');
    const visible=show && !(isElecPart&&!elec) && !(isThermPart&&elec);
    let el=labelEls[key];
    if(!visible){ if(el)el.style.display='none'; return; }
    if(!el){ el=document.createElement('div'); el.className='ca-label'; el.textContent=LABEL_KEYS[key]; stage.appendChild(el); labelEls[key]=el; }
    const v=p.anchor.clone().add(car.position).project(camera); if(v.z>1){ el.style.display='none'; return; }
    el.style.display='block'; el.style.left=((v.x*.5+.5)*stage.clientWidth)+'px'; el.style.top=((-v.y*.5+.5)*stage.clientHeight)+'px';
  });
}

/* ============ ANIMATION ============ */
function animate(){ requestAnimationFrame(animate); const raw=clock.getDelta(); const dt=Math.min(0.05,raw);
  const approach=(cur,tgt,rate)=>{ const d=tgt-cur; return cur+Math.max(-Math.abs(d),Math.min(Math.abs(d),d>0?raw*rate:-raw*rate)); };

  // caméra focus
  if(flying && focusPoint){ controls.target.lerp(focusPoint,0.09); const dir=camera.position.clone().sub(controls.target); const want=focusPoint.clone().add(dir.normalize().multiplyScalar(6.5)); camera.position.lerp(want,0.06); if(camera.position.distanceTo(want)<0.35) flying=false; }

  // régime / vitesse
  const targetRpm=started?(mode==='electrique'?600+throttle*8000:800+throttle*5500):0; rpm+=(targetRpm-rpm)*Math.min(1,dt*3);
  const ts=started?(mode==='electrique'?throttle*140:Math.max(0,(rpm-800))/5500*(22+gear*13)):0; speed+=(ts-speed)*Math.min(1,dt*1.4); if(!started&&speed<0.15)speed=Math.max(0,speed-dt*12);
  if(trajet) tickTrajet(dt*accelTest);
  // F228 : la voiture avance sur la piste ; la caméra, la lumière et l'ombre de contact la suivent
  if(!(marche&&marche.estActif())){ const dx=car.position.x-suiviCam; if(Math.abs(dx)>1e-5){ camera.position.x+=dx; controls.target.x+=dx; } } suiviCam=car.position.x;
  if(keyLight){ keyLight.position.set(car.position.x-14,7,9); keyLight.target.position.set(car.position.x,0,0); }
  if(contactShadow) contactShadow.position.x=car.position.x;
  if(ambMoteur){ sonMoteurT+=dt; if(sonMoteurT>0.3){ sonMoteurT=0; ambMoteur.volume(started?0.015+Math.min(1,speed/120)*0.12:0); } }
  boucles.forEach(f=>{ try{ f(dt,clock.elapsedTime); }catch(e){ /* rien */ } });
  const rpmEl=document.getElementById('caRpm'); if(rpmEl){ rpmEl.textContent=Math.round(rpm); document.getElementById('caSpeed').textContent=Math.round(speed); }

  // vue éclatée / coupe (transition en temps réel, robuste à tout framerate)
  explodeT=approach(explodeT,explodeTarget,2.5); cutT=approach(cutT,cutTarget,2.5);
  applyExplode();
  const bodyOpacity=1-cutT*0.86; bodyPanels.forEach(m=>{ if(m.material){ m.material.transparent=cutT>0.01; m.material.opacity=cutT>0.01?bodyOpacity:1; } });
  glassPanels.forEach(m=>{ if(m.material){ m.material.opacity=0.42*(1-cutT*0.8); } });
  const showInner=cutT>0.05||explodeT>0.05; suspMeshes.forEach(m=>{ m.visible=showInner; });
  // en vue extérieure capot fermé : on masque les organes internes pour une carrosserie nette
  const showInternals=showInner||hoodOpen; const activeGrp=mode==='electrique'?elecGroup:thermGroup; if(activeGrp) activeGrp.visible=showInternals;

  // ouverture capot / portes
  if(hoodPivot){ hoodPivot.rotation.z=approach(hoodPivot.rotation.z, hoodOpen?-0.62:0, 2.5); }
  doorPivots.forEach(p=>{ p.rotation.y=approach(p.rotation.y, doorsOpen?p.userData.sgn*0.8:0, 3); });

  // direction (léger balayage auto en marche)
  const steer=started&&!REDUCED&&!trajet?Math.sin(clock.elapsedTime*0.6)*0.18*Math.min(1,speed/40):0; steerWheels.forEach(p=>p.rotation.y+=((steer)-p.rotation.y)*0.1);

  // rotation des roues
  const wspin=(speed/3.6)/WR*dt; wheelSpin.forEach(s=>s.rotation.z-=wspin);

  // moteur 4 temps
  if(thermGroup&&thermGroup.visible&&crank){ const w=rpm/60*Math.PI*2*(REDUCED?0.2:1); crankAngle+=w*dt; crank.rotation.z=crankAngle;
    pistons.forEach(p=>{ p.mesh.position.y=0.2+Math.sin(crankAngle+p.phase)*0.14; if(p.rod)p.rod.position.y=0.02+Math.sin(crankAngle+p.phase)*0.14; });
    // phase du cylindre 1 (2 tours = 4 temps)
    const cyc=((crankAngle%(4*Math.PI))+4*Math.PI)%(4*Math.PI); cyclePhase=Math.floor(cyc/Math.PI)%4;
    // soupapes
    valveL.forEach((v,i)=>{ v.position.y=0.52-(cyclePhase===0?0.05:0); });
    valveR.forEach((v,i)=>{ v.position.y=0.52-(cyclePhase===3?0.05:0); });
    const pEl=document.getElementById('caPhase'); if(pEl){ pEl.classList.toggle('on', started&&rpm>50); const pv=document.getElementById('caPhaseV'); if(pv){ pv.textContent=CYCLE[cyclePhase]; pv.style.color=CYCLE_COL[cyclePhase]; } }
    // explosion : flash à l'entrée du temps 2
    if(cyclePhase===2 && lastPhase!==2 && started){ if(sparkFlash){ sparkFlash.material.opacity=0.9; } sparkLight.intensity=2.2; }
    lastPhase=cyclePhase;
  } else { const pEl=document.getElementById('caPhase'); if(pEl)pEl.classList.remove('on'); }
  if(sparkFlash){ sparkFlash.material.opacity*=0.86; } if(sparkLight){ sparkLight.intensity*=0.85; }

  // moteur électrique tourne
  if(elecGroup&&elecGroup.visible&&elecMotor){ elecMotor.rotation.x+=(rpm/60)*dt*(REDUCED?0.2:1)*0.5; }

  // particules d'énergie
  const path=energyPath(); const active=started&&throttle>0.02; energyParts.forEach(p=>{ p.visible=active; if(!active)return; p.userData.t=(p.userData.t+dt*(0.25+throttle*0.6))%1; const seg=p.userData.t*(path.length-1); const i=Math.floor(seg), f=seg-i; const a=path[Math.min(i,path.length-1)], b=path[Math.min(i+1,path.length-1)]; p.position.lerpVectors(a,b,f).add(car.position); p.material.color.setHex(mode==='electrique'?0x46e3ff:0xffd24a); });

  // survol : léger surlignage
  Object.keys(parts).forEach(k=>{ const o=parts[k].obj; if(o&&o.traverse) o.traverse(m=>{ if(m.isMesh&&m.material&&m.material.emissive&&!m.userData.brake){ const target=(k===hovered)?0.25:0; m.material.emissiveIntensity=(m.material.emissiveIntensity||0)*0.85+target*0.15; if(k===hovered)m.material.emissive.setHex(0x222018); } }); });

  updateEngineSound();
  controls.update(); updateLabels(); composer.render();
}

/* déplacement des organes en vue éclatée */
function applyExplode(){
  const grp=mode==='electrique'?elecGroup:thermGroup; if(!grp)return;
  grp.traverse(o=>{ if(o.userData&&o.userData.home&&o.userData.exp){ o.position.copy(o.userData.home).addScaledVector(o.userData.exp,explodeT); } });
}
