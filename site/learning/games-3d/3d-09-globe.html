function earthShaderMat(u){ return new THREE.ShaderMaterial({ uniforms:u,
  vertexShader:`varying vec2 vUv; varying vec3 vN; varying vec3 vWp;
    void main(){ vUv=uv; vN=normalize(mat3(modelMatrix)*normal); vec4 wp=modelMatrix*vec4(position,1.); vWp=wp.xyz; gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`uniform sampler2D dayMap; uniform sampler2D nightMap; uniform vec3 sunDir; uniform float nightBoost;
    varying vec2 vUv; varying vec3 vN; varying vec3 vWp;
    void main(){
      vec3 N=normalize(vN); vec3 S=normalize(sunDir); vec3 V=normalize(cameraPosition-vWp);
      vec3 day=texture2D(dayMap,vUv).rgb; vec3 night=texture2D(nightMap,vUv).rgb;

      float dayAmt=smoothstep(-0.12,0.25,d);
      float water=smoothstep(0.02,0.12,day.b-max(day.r,day.g)*0.92);           /* masque océan depuis la carte */
      vec3 H=normalize(S+V);
      float spec=pow(max(dot(N,H),0.0),48.0)*water*dayAmt;                     /* reflet du Soleil sur l'eau */
      float tw=smoothstep(-0.22,0.02,d)*(1.0-smoothstep(0.02,0.30,d));         /* bande crépusculaire */

      gl_FragColor=vec4(col,1.0);

const LAND_RAD={ russia:150, canada:125, 'united-states':105, china:105, brazil:105, australia:100, greenland:62, india:70, argentina:68, mexico:52, indonesia:46, 'saudi-arabia':56, algeria:56, sudan:48, mali:46, niger:44, chad:42, mongolia:52, iran:48, egypt:40, ethiopia:40, mauritania:38, angola:38, 'south-africa':44, tanzania:34, nigeria:36, colombia:40, peru:42, bolivia:40, venezuela:36, chile:34, france:30, spain:30, sweden:36, norway:34, finland:32, germany:27, turkey:36, ukraine:34, poland:27, afghanistan:32, pakistan:34, iraq:26, kazakhstan:60, japan:24, philippines:20, 'new-zealand':22, madagascar:26, morocco:28, somalia:28, kenya:28, mozambique:30, zambia:28, botswana:26, namibia:28, myanmar:30, thailand:26, vietnam:24, 'papua-new-guinea':26, iceland:18, ireland:14, 'united-kingdom':22, italy:22, greece:16, romania:20, belarus:22, uzbekistan:28, turkmenistan:26, yemen:24, oman:22, libya:48 };
function landColor(lat,lon,rnd){ const a=Math.abs(lat+ (rnd()-.5)*6);
  const desert=(lat>10&&lat<34&&((lon>-17&&lon<60)||(lon>60&&lon<75)))||(lat<-18&&lat>-32&&lon>112&&lon<145)||(lat<-16&&lat>-28&&lon>12&&lon<26);
  if(a>68)return '#e9eef4'; if(a>58)return '#5c6f52'; if(desert)return rnd()<.5?'#c8a862':'#bd9a55';
  if(a>44)return rnd()<.5?'#44693c':'#3d6136'; if(a>26)return rnd()<.5?'#57793e':'#4e7040'; if(a>9)return rnd()<.5?'#7a8f4a':'#8a9a52'; return rnd()<.5?'#2e6e35':'#2a6531'; }
function buildProceduralEarth(){ const W=2048,H=1024; const rnd=mulberry(90210);
  const px=lon=>(lon+180)/360*W, py=lat=>(90-lat)/180*H;
  // --- océan ---
  const day=document.createElement('canvas'); day.width=W; day.height=H; const d=day.getContext('2d');
  const og=d.createLinearGradient(0,0,0,H); og.addColorStop(0,'#0b3260'); og.addColorStop(.28,'#0d3f79'); og.addColorStop(.5,'#0e4784'); og.addColorStop(.72,'#0d3f79'); og.addColorStop(1,'#0b3260'); d.fillStyle=og; d.fillRect(0,0,W,H);
  for(let i=0;i<420;i++){ d.globalAlpha=.05; d.fillStyle=rnd()<.5?'#0a2c56':'#155091'; d.beginPath(); d.ellipse(rnd()*W,rnd()*H,30+rnd()*130,8+rnd()*26,rnd()*3,0,7); d.fill(); } d.globalAlpha=1;
  // --- continents : masses de terre esquissées depuis les centroïdes des pays ---
  const land=document.createElement('canvas'); land.width=W; land.height=H; const l=land.getContext('2d');
  COUNTRIES.forEach(c=>{ const r=(LAND_RAD[c.id]||11)*(W/2048); const cx=px(c.lon), cy=py(c.lat); const n=10+Math.floor(r/6);
    for(let i=0;i<n;i++){ const ang=rnd()*6.28, dist=rnd()*r*.62; const bx=cx+Math.cos(ang)*dist*1.35, by=cy+Math.sin(ang)*dist*.8; const br=r*(.3+rnd()*.42);
      l.fillStyle=landColor(c.lat-(by-cy)/H*180,c.lon,rnd); l.globalAlpha=.9; l.beginPath(); l.ellipse(bx,by,br*1.25,br*.85,rnd()*3,0,7); l.fill(); } });
  l.globalAlpha=1;
  // relief : grain clair/sombre confiné aux terres
  l.globalCompositeOperation='source-atop';
  for(let i=0;i<5200;i++){ l.globalAlpha=.05+rnd()*.08; l.fillStyle=rnd()<.5?'#1c2e18':'#cfd8b8'; l.beginPath(); l.arc(rnd()*W,rnd()*H,1+rnd()*5,0,7); l.fill(); }
  // chaînes de montagnes principales (Andes, Rocheuses, Himalaya, Alpes, Atlas)
  const ranges=[[[-72,-8],[-70,-45]],[[-118,52],[-105,34]],[[70,36],[95,28]],[[6,46],[14,47]],[[-8,31],[8,34]]];
  ranges.forEach(([[lo1,la1],[lo2,la2]])=>{ const steps=42; for(let i=0;i<steps;i++){ const t=i/steps; const x=px(lo1+(lo2-lo1)*t)+(rnd()-.5)*14, y=py(la1+(la2-la1)*t)+(rnd()-.5)*14; l.globalAlpha=.5; l.fillStyle='#8a7f6a'; l.beginPath(); l.arc(x,y,2.5+rnd()*4,0,7); l.fill(); l.globalAlpha=.35; l.fillStyle='#e8e4d8'; l.beginPath(); l.arc(x+1,y-1,1.2+rnd()*2,0,7); l.fill(); } });
  l.globalAlpha=1; l.globalCompositeOperation='source-over';
  d.drawImage(land,0,0);
  // --- calottes polaires (Antarctique + Arctique) à bord irrégulier ---
  d.fillStyle='#f2f6fa'; d.beginPath(); d.moveTo(0,H); for(let x=0;x<=W;x+=16)d.lineTo(x,H*.925+Math.sin(x*.013)*8+rnd()*10); d.lineTo(W,H); d.closePath(); d.fill();
  d.globalAlpha=.85; d.fillStyle='#eef3f8'; d.beginPath(); d.moveTo(0,0); for(let x=0;x<=W;x+=16)d.lineTo(x,H*.045+Math.sin(x*.02)*5+rnd()*8); d.lineTo(W,0); d.closePath(); d.fill(); d.globalAlpha=1;
  // --- nuit : lumières des villes ---
  const night=document.createElement('canvas'); night.width=W; night.height=H; const n2=night.getContext('2d'); n2.fillStyle='#010204'; n2.fillRect(0,0,W,H);
  COUNTRIES.forEach(c=>{ const cx=px(c.lon), cy=py(c.lat); const big=!!c.star; const spread=(LAND_RAD[c.id]||11)*.5*(W/2048);
    const gl=n2.createRadialGradient(cx,cy,0,cx,cy,big?15:7); gl.addColorStop(0,'rgba(255,214,150,.95)'); gl.addColorStop(1,'rgba(255,180,90,0)'); n2.fillStyle=gl; n2.beginPath(); n2.arc(cx,cy,big?15:7,0,7); n2.fill();
    const specks=big?36:7; for(let i=0;i<specks;i++){ const ang=rnd()*6.28, ds=rnd()*spread; n2.globalAlpha=.25+rnd()*.5; n2.fillStyle='#ffd9a0'; n2.beginPath(); n2.arc(cx+Math.cos(ang)*ds*1.3,cy+Math.sin(ang)*ds*.8,.6+rnd()*1.2,0,7); n2.fill(); } n2.globalAlpha=1; });
  // --- nuages ---
  const cl=document.createElement('canvas'); cl.width=W/2; cl.height=H/2; const c2=cl.getContext('2d'); c2.fillStyle='#000'; c2.fillRect(0,0,W/2,H/2);
  for(let k=0;k<110;k++){ const cx=rnd()*W/2, cy=(rnd()*.9+.05)*H/2, len=30+rnd()*120, n3=14+Math.floor(rnd()*22);
    for(let i=0;i<n3;i++){ c2.globalAlpha=.05+rnd()*.1; c2.fillStyle='#fff'; c2.beginPath(); c2.ellipse(cx+(rnd()-.5)*len*2,cy+(rnd()-.5)*len*.5,8+rnd()*26,4+rnd()*12,rnd()*3,0,7); c2.fill(); } }
  for(let x=0;x<W/2;x+=8){ c2.globalAlpha=.1+rnd()*.12; c2.fillStyle='#fff'; c2.beginPath(); c2.ellipse(x,H/4+Math.sin(x*.05)*10,14+rnd()*16,6+rnd()*8,0,0,7); c2.fill(); } // bande intertropicale
  c2.globalAlpha=1;
  const tex=cv=>{ const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; };
  return { day:tex(day), night:tex(night), clouds:tex(cl) };
}
function loadTextures(){ const L=new THREE.TextureLoader(); const B='../assets/3d/planets/'; const srgb=t=>{ t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t; };
  // textures NASA auto-hébergées (CC) : remplacent la carte procédurale dès qu'elles arrivent
  L.load(B+'2k_earth_daymap.jpg', t=>{ earthU.dayMap.value=srgb(t);
    L.load(B+'hires_terre.jpg', h=>{ earthU.dayMap.value=srgb(h); }, undefined, ()=>{}); }, undefined, ()=>{});
  L.load(B+'2k_earth_nightmap.jpg', t=>{ earthU.nightMap.value=srgb(t); }, undefined, ()=>{});
  L.load(B+'2k_earth_clouds.jpg', t=>{ srgb(t); clouds.material.map=t; clouds.material.alphaMap=t; clouds.material.opacity=.92; clouds.material.needsUpdate=true; }, undefined, ()=>{});
}
function buildUI(){ const stage=shell.stage;

  const inp=search.querySelector('#glSearch'), sugg=search.querySelector('#glSugg'); let active=-1;
  function rs(q){ active=-1; const list=q?COUNTRIES.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||c.cap.toLowerCase().includes(q.toLowerCase())).slice(0,8):COUNTRIES.slice(0,8); if(!list.length){ sugg.classList.remove('show'); return; } sugg.innerHTML=list.map(c=>`<button data-id="${c.id}">${c.name}<span class="k">${c.cont}</span></button>`).join(''); sugg.classList.add('show'); sugg.querySelectorAll('button').forEach(b=> b.onclick=()=>{ const c=COUNTRIES.find(x=>x.id===b.dataset.id); focusCountry(c); inp.value=''; sugg.classList.remove('show'); }); }

  inp.addEventListener('keydown',e=>{ const bs=[...sugg.querySelectorAll('button')]; if(e.key==='ArrowDown')active=Math.min(bs.length-1,active+1); else if(e.key==='ArrowUp')active=Math.max(0,active-1); else if(e.key==='Enter'){ if(bs[active])bs[active].click(); else if(bs[0])bs[0].click(); return;} else return; bs.forEach((b,i)=>b.classList.toggle('active',i===active)); e.preventDefault(); });
  const m=document.createElement('div'); m.className='gl-panel gl-modes'; m.innerHTML=`<h3>Calques</h3>
    <button class="gl-tg" data-k="night" aria-pressed="false">🌙 Face nuit (villes)</button>
    <button class="gl-tg" data-k="sun" aria-pressed="false">🕐 Soleil réel</button>

    if(k==='sun'){ realSun=on; if(on&&night){ night=false; m.querySelector('[data-k="night"]').setAttribute('aria-pressed',false); } shell.say(on?"Soleil réel : le globe montre le vrai jour et la vraie nuit de maintenant, comme les satellites les voient.":"Soleil libre.",'curieux'); }

    if(k==='grat'){ showGrat=on; globeGroup.userData.grat.visible=on; shell.say(on?"Grille géographique : l'équateur (en jaune) sépare hémisphères Nord et Sud ; les méridiens donnent la longitude.":'Grille masquée.','curieux'); }

}
function applyTheme(){ const dark=document.documentElement.getAttribute('data-theme')==='dark'; renderer.setClearColor(dark?0x03040a:0x05060f,1); }
function onResize(){ const s=shell.stage; if(!s.clientWidth)return; camera.aspect=s.clientWidth/s.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(s.clientWidth,s.clientHeight); composer.setSize(s.clientWidth,s.clientHeight); }
function setP(e){ const r=renderer.domElement.getBoundingClientRect(); pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }
function pick(){ raycaster.setFromCamera(pointer,camera); const hits=raycaster.intersectObjects(markers.map(m=>m.pin),false); return hits.length?markers.find(m=>m.pin===hits[0].object):null; }
function onMove(e){ setP(e); const m=pick(); hoveredMarker=m; renderer.domElement.style.cursor=m?'pointer':'grab'; }
/* ---- picking sur la sphère : lat/lon depuis le point d'impact ---- */
function pickEarth(){ raycaster.setFromCamera(pointer,camera); const hit=raycaster.intersectObject(earth,false)[0]; if(!hit)return null;
  const p=globeGroup.worldToLocal(hit.point.clone()); const r=p.length();
  const lat=90-Math.acos(Math.max(-1,Math.min(1,p.y/r)))*180/Math.PI;
  let lon=Math.atan2(p.z,-p.x)*180/Math.PI-180; while(lon<-180)lon+=360; while(lon>180)lon-=360;
  return {lat,lon}; }
const PARIS={lat:48.85,lon:2.35};
function distKm(a,b){ const R=6371,rad=x=>x*Math.PI/180; const h=Math.sin(rad(b.lat-a.lat)/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(rad(b.lon-a.lon)/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function nearestCountry(lat,lon){ let best=null,bd=1e9; COUNTRIES.forEach(c=>{ const d=distKm({lat,lon},c); if(d<bd){ bd=d; best=c; } }); return {c:best,km:bd}; }
function continentAt(lat,lon){ if(lat<-60)return 'Antarctique'; const n=nearestCountry(lat,lon); return n.km<2300?n.c.cont:null; }
function localTime(lon){ const off=Math.round(lon/15); const d=new Date(); const h=(d.getUTCHours()+off+24)%24; return h+' h '+String(d.getUTCMinutes()).padStart(2,'0')+' (UTC'+(off>=0?'+':'')+off+')'; }
function fmtKm(k){ return k<100?Math.round(k)+' km':(k<9500?(Math.round(k/50)*50).toLocaleString('fr-FR'):(Math.round(k/100)*100).toLocaleString('fr-FR'))+' km'; }
function onDown(e){ setP(e); const m=pick();
  if(mission&&mission.active){ missionClick(m?{lat:m.c.lat,lon:m.c.lon,c:m.c}:pickEarth()); return; }
  if(m){ focusCountry(m.c); return; }

  if(g.lat<-62){ openContinent('Antarctique'); return; }

  if(n.km<2300){ openContinent(n.c.cont); return; }

}

  document.getElementById('gmQuit').onclick=()=>{ missionEnd(); shell.say("Retour à l'exploration libre. Reviens finir ton tour du monde quand tu veux !",'joyeux'); }; }
function setGPhase(i){ if(!mission)return; mission.pi=i; mission.idx=0; mission.tries=0; const ph=GPHASES[i]; if(!ph){ showEndScreen(); return; }
  document.getElementById('gmPhase').textContent=ph.phase; document.getElementById('gmTitle').textContent=ph.title; document.getElementById('gmCap').textContent=ph.cap||'';
  document.getElementById('gmSteps').innerHTML=ph.n?Array.from({length:ph.n},()=>'<i></i>').join(''):'';
  const act=document.getElementById('gmAct'); act.innerHTML=''; shell.setLevel(Math.max(1,i)+'/3');
  if(ph.gate){ const b=document.createElement('button'); b.className='gl-m-btn'; b.textContent=ph.gate; b.onclick=()=>{ shell.sound('pop'); setGPhase(i+1); }; act.appendChild(b); setTimeout(()=>b.focus(),50); return; }
  if(ph.id==='continents')mission.order=shuffle(Object.keys(CONTINENTS));
  if(ph.id==='pays'){ mission.order=shuffle(FEATURED_IDS).slice(0,6); mission.usedPays=mission.order.slice(); }
  if(ph.id==='capitales')mission.order=shuffle(FEATURED_IDS.filter(id=>!mission.usedPays.includes(id))).slice(0,5);
  askStep(); }
function curTarget(){ const ph=GPHASES[mission.pi]; if(ph.id==='continents')return { cont:mission.order[mission.idx] }; return COUNTRIES.find(c=>c.id===mission.order[mission.idx]); }
function askStep(){ if(!mission||!mission.active)return; const ph=GPHASES[mission.pi]; mission.tries=0; clearHelp();
  if(mission.idx>=ph.n){ shell.say(ph.id==='continents'?"Escale 1 réussie ! Direction les grands pays.":ph.id==='pays'?"Escale 2 dans la poche ! Dernière ligne droite : les capitales.":"Dernière escale bouclée !",'celebration'); setGPhase(mission.pi+1); return; }
  [...document.getElementById('gmSteps').children].forEach((d,k)=>d.className=k<mission.idx?'done':k===mission.idx?'now':'');
  const ask=document.getElementById('gmAsk'); ask.style.display=''; const t=curTarget();
  if(ph.id==='continents'){ ask.innerHTML=`<span class="qn">${mission.idx+1}/7</span><span>Clique le continent : <b>${t.cont} ${CONTINENTS[t.cont].emoji}</b></span>`; shell.say('Trouve '+t.cont+' et clique dessus. Fais tourner le globe si besoin !','curieux'); }
  else if(ph.id==='pays'){ ask.innerHTML=`<span class="qn">${mission.idx+1}/6</span><span>Trouve le pays : <b>${t.name} ${t.flag||''}</b></span>`; shell.say('Cherche '+t.name+' : indice : c\'est en '+t.cont+'.','curieux'); }
  else { ask.innerHTML=`<span class="qn">${mission.idx+1}/5</span><span>Quel pays a pour capitale <b>${t.cap}</b> ?</span>`; shell.say(t.cap+'… à toi de retrouver le pays !','curieux'); } }
function tolKm(t){ return Math.max(650,(LAND_RAD[t.id]||11)/2048*360*111*0.62); }
function missionClick(g){ if(!g||!mission||!mission.active)return; const ph=GPHASES[mission.pi]; if(!ph||!ph.n)return; const t=curTarget();
  if(ph.id==='continents'){ const cont=continentAt(g.lat,g.lon);
    if(!cont){ shell.sound('pop'); shell.toast("🌊 Ici c'est l'océan : vise une terre !",2000); return; }
    if(cont===t.cont)good(t.cont+' ✔ : '+CONTINENTS[t.cont].record+'.');
    else bad(g,CONTINENTS[t.cont],'Ça, c\'est '+cont+'.');
    return; }
  const hit=(g.c&&g.c.id===t.id)||distKm(g,t)<=tolKm(t);
  if(hit){ good(ph.id==='pays'?(t.name+' '+(t.flag||'')+' : capitale : '+t.cap+'.'):(t.cap+' est bien la capitale de '+t.name+' '+(t.flag||'')+'.')); }
  else { const n=g.c?{c:g.c,km:0}:nearestCountry(g.lat,g.lon); bad(g,t,n.km<650?('Ça, c\'est '+n.c.name+' '+(n.c.flag||'')+'.'):''); } }
function good(msg){ const pts=mission.tries===0?120:mission.tries===1?80:50; if(mission.tries===0)mission.firstOk++;
  mission.score+=pts; shell.addScore(pts); shell.sound('good'); clearHelp();
  const ph=GPHASES[mission.pi]; mission.done[ph.id]++; const t=curTarget();
  if(t.id)focusCountry(t,true); else aimAt(CONTINENTS[t.cont].lat,CONTINENTS[t.cont].lon,5.0);
  mission.step++; shell.setProgress(mission.step/TOTAL_STEPS);
  shell.say('Bravo ! '+msg+' +'+pts+' points.','celebration');
  mission.idx++; setTimeout(()=>{ if(mission&&mission.active)askStep(); },1500); }
function bad(g,t,extra){ mission.tries++; shell.sound('pop');
  if(mission.tries>=3){ showHelp(); shell.say((extra?extra+' ':'')+'Regarde, je te montre la zone : elle clignote en vert. Clique dessus !','rassurant'); return; }
  shell.say((extra?extra+' ':'')+'Pas grave : cherche '+dirHint(g,t)+'.','rassurant'); }
function dirHint(g,t){ let dLon=t.lon-g.lon; while(dLon>180)dLon-=360; while(dLon<-180)dLon+=360; const dLat=t.lat-g.lat;
  const ns=Math.abs(dLat)>6?(dLat>0?'nord':'sud'):''; const ew=Math.abs(dLon)>6?(dLon>0?'est':'ouest'):'';
  return ns&&ew?'plus au '+ns+'-'+ew:ns?'plus au '+ns:ew?'plus à l\''+ew:'tout près, regarde bien autour'; }
function showHelp(){ clearHelp(); const t=curTarget(); const p=t.id?t:CONTINENTS[t.cont]; aimAt(p.lat,p.lon,t.id?4.2:5.2);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({ map:haloTex(), color:0x7ef5b0, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }));
  s.position.copy(latlon(p.lat,p.lon,2.07)); s.scale.setScalar(0.5); globeGroup.add(s); mission.helpPin=s; }
function clearHelp(){ if(mission&&mission.helpPin){ globeGroup.remove(mission.helpPin); mission.helpPin=null; } }
function missionEnd(){ if(mission)clearHelp(); const h=document.getElementById('glMission'); if(h)h.remove(); const e=document.getElementById('glEnd'); if(e)e.remove();
  mission=null; setPanels(true); const hint=document.getElementById('glHint'); if(hint&&shell.mode!=='cours')hint.style.display=''; }
function badgeSVG(w){ return `<svg width="${w}" height="${w}" viewBox="0 0 58 58" aria-hidden="true"><defs><linearGradient id="gb${w}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD87A"/><stop offset="1" stop-color="#E68A1E"/></linearGradient></defs><circle cx="29" cy="26" r="20" fill="url(#gb${w})" stroke="#fff3d6" stroke-width="2"/><circle cx="29" cy="26" r="13" fill="#1B5FAE"/><path d="M22 20c3 2 5-1 8 1s5 0 6 2-1 5-4 5-4 3-7 2-5-4-4-6 0-3 1-4z" fill="#2f9e4f"/><path d="M20 44l-3 11 12-5 12 5-3-11" fill="#c8102e"/></svg>`; }
/* ====== ÉCRAN DE FIN : débrief du tour du monde ====== */
function showEndScreen(){ if(!mission)return; mission.active=false; clearHelp();
  const h=document.getElementById('glMission'); if(h)h.remove();
  const prec=Math.round(mission.firstOk/TOTAL_STEPS*100); const stars=prec>=80?3:prec>=55?2:1;
  shell.setStars(stars); shell.setProgress(1);
  const score=mission.score, gained=Math.round(score/10)+stars*50+30; let lvl=null;
  try{ if(window.KonstrioAch){ window.KonstrioAch.recordWin(shell.cfg.id,{stars,score,mode:shell.mode}); lvl=window.KonstrioAch.get().level; } }catch(e){}
  try{ if(window.Konstrio&&window.Konstrio.unlock)window.Konstrio.unlock('play3d'); }catch(e){}
  try{ fetch('/api/learning/game-score',{ method:'POST', headers:{'content-type':'application/json'}, credentials:'same-origin', body:JSON.stringify({ gameId:shell.cfg.id, title:shell.cfg.title, score:Math.round(score), stars:stars, won:true }) }).catch(()=>{}); }catch(e){}
  shell.sound('win'); if(!REDUCED&&shell.buddy&&shell.buddy.celebrate)try{shell.buddy.celebrate();}catch(e){}
  const el=document.createElement('div'); el.className='gl-end'; el.id='glEnd'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Débrief du tour du monde');
  el.innerHTML=`<div class="gl-end-card">
    <div class="gl-hero"><div class="stars"></div><div class="gl-hero-globe"></div><div class="gl-end-badge">${badgeSVG(58)}<span style="font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;color:#ffd87a">GLOBE-TROTTEUR</span></div></div>
    <div class="gl-end-body">
      <span class="gl-end-flag">Tour du monde · 3 escales · ${TOTAL_STEPS} étapes</span>
      <h2 class="gl-end-h">${stars===3?'Géographe hors pair !':stars===2?'Beau voyage, globe-trotteur !':'Tour du monde bouclé !'}</h2>
      <p class="gl-end-sub">Continents, grands pays, capitales : tu viens de faire le tour de la planète. ${prec>=80?'Quelle précision !':'Chaque nouveau voyage te rendra encore plus précise.'}</p>
      <div class="gl-meds">
        <div class="gl-med"><div class="n">${mission.done.continents}/7</div><div class="l">Continents</div></div>
        <div class="gl-med"><div class="n">${mission.done.pays}/6</div><div class="l">Pays</div></div>
        <div class="gl-med"><div class="n">${mission.done.capitales}/5</div><div class="l">Capitales</div></div>
        <div class="gl-med"><div class="n">${prec}%</div><div class="l">Du 1ᵉʳ coup</div></div>
        <div class="gl-med"><div class="n">${score}</div><div class="l">Points</div></div>
        <div class="gl-med"><div class="n">${'★'.repeat(stars)||'★'}</div><div class="l">Étoiles</div></div>
      </div>
      <div class="gl-quote"><div class="o">« Le voyage est un retour vers l'essentiel. »</div><span class="by">Proverbe tibétain</span></div>
      <div class="gl-reward">${badgeSVG(40)}<div><div class="xp" id="glXp">+0 XP</div><div class="lbl">Badge « Globe-trotteur » débloqué${lvl?` · niveau ${lvl}`:''} · ${stars} ★</div></div></div>
      <div class="gl-end-row">
        <button class="gl-b primary" id="glAgain">↺ Refaire le tour</button>
        <button class="gl-b next" id="glWorlds">Autres mondes ▸</button>
        <button class="gl-b" id="glFree">🌍 Explorer librement</button>
      </div>
    </div></div>`;
  shell.stage.appendChild(el);
  const xpEl=el.querySelector('#glXp');
  if(REDUCED){ xpEl.textContent='+'+gained+' XP'; } else { let cur=0; const st=Math.max(1,Math.round(gained/28)); const iv=setInterval(()=>{ cur=Math.min(gained,cur+st); xpEl.textContent='+'+cur+' XP'; if(cur>=gained)clearInterval(iv); },28); }
  el.querySelector('#glAgain').onclick=()=>missionStart();
  el.querySelector('#glWorlds').onclick=()=>{ window.location.href='/learning/hub'; };
  el.querySelector('#glFree').onclick=()=>{ missionEnd(); shell.say('Explore ! Clique un continent, un océan ou une épingle 📍.','joyeux'); };
  el.addEventListener('keydown',e=>{ if(e.key==='Escape')missionEnd(); });
  setTimeout(()=>{ const b=el.querySelector('#glAgain'); if(b)b.focus(); },40); }
function subsolarDir(){ const now=new Date(); const start=Date.UTC(now.getUTCFullYear(),0,0); const doy=(Date.now()-start)/864e5;
  const dec=23.44*Math.sin((doy-81)/365.25*2*Math.PI); const subLon=(12-(now.getUTCHours()+now.getUTCMinutes()/60))*15;
  return latlon(dec,subLon,1).applyEuler(globeGroup.rotation).normalize(); }
function animate(){ requestAnimationFrame(animate); const dt=clock.getDelta();
  if(clouds.visible) clouds.rotation.y+=dt*(REDUCED?0.008:0.02);
  // Soleil : libre / « face nuit » (le Soleil passe derrière la Terre) / « Soleil réel » (terminateur du moment)
  const sd=earthU.sunDir.value; const want=night?camera.position.clone().normalize().negate():(realSun?subsolarDir():baseSunDir);
  sd.lerp(want,REDUCED?0.14:0.05).normalize(); sunLight.position.copy(sd).multiplyScalar(8);
  if(targetRotY!=null){ let d=targetRotY-globeGroup.rotation.y; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; globeGroup.rotation.y+=d*(REDUCED?0.22:0.06); if(Math.abs(d)<0.01)targetRotY=null; }
  if(targetCamDist!=null||targetPhi!=null){ const off=camera.position.clone().sub(controls.target); const s=new THREE.Spherical().setFromVector3(off);
    if(targetCamDist!=null){ s.radius+=(targetCamDist-s.radius)*(REDUCED?0.22:0.06); if(Math.abs(s.radius-targetCamDist)<0.02)targetCamDist=null; }
    if(targetPhi!=null){ s.phi+=(targetPhi-s.phi)*(REDUCED?0.22:0.06); if(Math.abs(s.phi-targetPhi)<0.01)targetPhi=null; }
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s)); }
  const tt=clock.elapsedTime;
  markers.forEach(m=>{ if(!m.halo)return; const s=REDUCED?0.24:0.2+Math.sin(tt*3+m.c.lat)*0.05; m.halo.scale.setScalar(showMarkers?s:0); });
  if(mission&&mission.helpPin)mission.helpPin.scale.setScalar(REDUCED?0.55:0.45+Math.sin(tt*4)*0.15);
  controls.update(); updateLabels(); composer.render();
}
function updateLabels(){ const stage=shell.stage; markers.forEach(m=>{ let el=labelEls[m.c.id]; const want = showMarkers && (m===hoveredMarker || m.c.id===selectedId); if(!want){ if(el)el.style.display='none'; return; } const wp=new THREE.Vector3(); m.pin.getWorldPosition(wp); const cam=camera.position.clone().normalize(); const facing=wp.clone().normalize().dot(cam); const v=wp.clone().project(camera); if(facing<0.1||v.z>1){ if(el)el.style.display='none'; return; } if(!el){ el=document.createElement('div'); el.className='gl-mk'; el.style.cssText='position:absolute;bottom:auto;font-family:var(--font-mono);font-size:11px;font-weight:700;white-space:nowrap;color:var(--fg);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:2px 8px;border-radius:6px;border:1px solid var(--border);pointer-events:none;z-index:14;transform:translate(-50%,-150%)'; el.textContent=(m.c.flag?m.c.flag+' ':'')+m.c.cap; stage.appendChild(el); labelEls[m.c.id]=el; } el.style.display='block'; el.style.left=((v.x*.5+.5)*stage.clientWidth)+'px'; el.style.top=((-v.y*.5+.5)*stage.clientHeight)+'px'; }); }
/* hook e2e (audit auto) : n'expose que de la lecture + actions de jeu */
window.__g09={ get mission(){ return mission; }, missionClick, focusCountry, openContinent, aimAt, COUNTRIES, CONTINENTS, get shell(){ return shell; } };
