    desc:["Le Soleil est l'étoile autour de laquelle gravite tout notre système. À lui seul, il concentre 99,86 % de la masse totale : sa gravité gouverne la danse des planètes.","Au cœur, la fusion nucléaire transforme chaque seconde 600 millions de tonnes d'hydrogène en hélium, libérant l'énergie qui met 8 minutes à nous parvenir sous forme de lumière.","Sa surface bouillonnante, la photosphère, est parcourue de taches sombres et d'éruptions qui projettent des particules : c'est l'origine des aurores polaires."],
    fun:"Si le Soleil était une porte de 2 m, la Terre serait un grain de sable de 1,8 cm posé à 215 m de là." },

    desc:["Mercure file autour du Soleil en seulement 88 jours : c'est la planète la plus rapide. Mais elle tourne très lentement sur elle-même.","Sans atmosphère pour retenir la chaleur, elle subit les plus grands écarts de température du système solaire : brûlante le jour, glaciale la nuit.","Sa surface criblée de cratères ressemble à celle de la Lune, gardant la mémoire de 4 milliards d'années de collisions."],
    fun:"Sur Mercure, une journée (du lever au lever du Soleil) dure deux années mercuriennes !" },
  venus: { name:'Vénus', sub:'Planète tellurique · « l\'étoile du berger »', color:'#d9a86a', stats:[['Distance au Soleil','108,2 M km (0,72 UA)'],['Diamètre','12 104 km'],['Année','225 jours'],['Jour','243 jours (rétrograde)'],['Température','464 °C'],['Lunes','0'],['Pression','92 × la Terre'],['Atmosphère','96 % CO₂']],
    desc:["Vénus est la jumelle de la Terre par la taille, mais un enfer : son atmosphère épaisse de CO₂ piège la chaleur dans un effet de serre emballé, la rendant plus chaude que Mercure.","Une pression écrasante, équivalente à 900 m sous l'océan, et des pluies d'acide sulfurique règnent à sa surface.","Fait étrange : elle tourne à l'envers, si bien que le Soleil s'y lève à l'ouest."],
    fun:"Vénus est l'objet le plus brillant du ciel après le Soleil et la Lune : d'où son surnom d'étoile du berger." },
  terre: { name:'Terre', sub:'Notre planète · zone habitable', color:'#2e7fd6', stats:[['Distance au Soleil','149,6 M km (1 UA)'],['Diamètre','12 742 km'],['Année','365,25 jours'],['Jour','23 h 56 min'],['Température moy.','15 °C'],['Lunes','1 (la Lune)'],['Eau','71 % de la surface'],['Âge','4,54 milliards d\'années']],
    desc:["La Terre est, à ce jour, le seul monde connu abritant la vie. Sa distance au Soleil place l'eau liquide à sa surface : ni trop chaud, ni trop froid.","Son champ magnétique, généré par un noyau de fer en fusion, nous protège du vent solaire, tandis que son atmosphère filtre les rayons dangereux.","La Lune stabilise l'inclinaison de son axe, garantissant des saisons régulières depuis des milliards d'années."],
    fun:"Vue de l'espace, la Terre est une bille bleue : c'est le « point bleu pâle » photographié par la sonde Voyager à 6 milliards de km." },
  mars: { name:'Mars', sub:'Planète tellurique · la planète rouge', color:'#c1440e', stats:[['Distance au Soleil','227,9 M km (1,52 UA)'],['Diamètre','6 779 km'],['Année','687 jours'],['Jour','24 h 37 min'],['Température','-63 °C'],['Lunes','2 (Phobos, Déimos)'],['Gravité','0,38 g'],['Atmosphère','95 % CO₂ (ténue)']],
    desc:["Mars doit sa couleur rouille à l'oxyde de fer qui recouvre sa surface. C'est la planète la plus explorée après la Terre.","Elle abrite Olympus Mons, un volcan de 22 km de haut (trois fois l'Everest), et Valles Marineris, un canyon long comme les États-Unis.","Des traces de rivières asséchées prouvent que de l'eau liquide y a coulé : Mars est la cible n°1 dans la recherche d'une vie passée."],
    fun:"Une journée martienne, le « sol », dure 24 h 37 min : presque comme la nôtre. Les rovers vivent à l'heure de Mars !" },
  jupiter: { name:'Jupiter', sub:'Géante gazeuse · la plus grande', color:'#d8a86b', stats:[['Distance au Soleil','778 M km (5,2 UA)'],['Diamètre','139 820 km'],['Année','11,9 ans'],['Jour','9 h 56 min'],['Température','-110 °C'],['Lunes','95+ (Io, Europe…)'],['Composition','H et He'],['Masse','2,5 × toutes les autres planètes']],
    desc:["Jupiter est si massive qu'elle pèse plus que toutes les autres planètes réunies. C'est une boule de gaz sans surface solide.","Sa Grande Tache rouge est une tempête anticyclonique vieille de plus de 350 ans, assez grande pour engloutir la Terre.","Ses quatre grandes lunes, découvertes par Galilée en 1610, furent la première preuve que tout ne tourne pas autour de la Terre."],
    fun:"Jupiter tourne si vite (moins de 10 h) qu'elle est visiblement aplatie aux pôles : c'est le jour le plus court du système solaire." },
  saturne: { name:'Saturne', sub:'Géante gazeuse · le seigneur des anneaux', color:'#e3c98a', stats:[['Distance au Soleil','1,43 Md km (9,6 UA)'],['Diamètre','116 460 km'],['Année','29,5 ans'],['Jour','10 h 42 min'],['Température','-140 °C'],['Lunes','146+ (Titan…)'],['Densité','0,69 (flotterait sur l\'eau)'],['Anneaux','> 280 000 km de large']],
    desc:["Saturne est célèbre pour ses anneaux spectaculaires, composés de milliards de morceaux de glace et de roche, de la taille d'un grain de poussière à celle d'une maison.","Bien que 9 fois plus large que la Terre, elle est si peu dense qu'elle flotterait dans une (gigantesque) baignoire.","Sa lune Titan possède une atmosphère épaisse et des lacs de méthane liquide : un monde fascinant pour la science."],
    fun:"Les anneaux de Saturne sont immenses mais ultra-fins : à peine 10 m d'épaisseur par endroits, pour 280 000 km de large." },
  uranus: { name:'Uranus', sub:'Géante de glace · couchée sur le côté', color:'#9fdbe0', stats:[['Distance au Soleil','2,87 Md km (19,2 UA)'],['Diamètre','50 724 km'],['Année','84 ans'],['Jour','17 h 14 min'],['Température','-195 °C'],['Lunes','28'],['Inclinaison axe','98°'],['Composition','glaces, méthane']],
    desc:["Uranus roule littéralement sur le côté : son axe est incliné à 98°, sans doute après une collision géante. Résultat : ses pôles font face au Soleil à tour de rôle.","Le méthane de son atmosphère absorbe le rouge et lui donne sa teinte bleu-vert.","Une saison y dure plus de 20 ans : chaque pôle connaît 42 ans de jour continu puis 42 ans de nuit."],
    fun:"Uranus fut la première planète découverte au télescope, en 1781, par William Herschel." },
  neptune: { name:'Neptune', sub:'Géante de glace · la plus lointaine', color:'#3b5bdb', stats:[['Distance au Soleil','4,5 Md km (30 UA)'],['Diamètre','49 244 km'],['Année','165 ans'],['Jour','16 h'],['Température','-200 °C'],['Lunes','16 (Triton)'],['Vents','jusqu\'à 2 100 km/h'],['Découverte','1846 (par le calcul)']],
    desc:["Neptune est la planète la plus éloignée du Soleil, invisible à l'œil nu. Elle fut découverte non par observation, mais par calcul mathématique.","C'est le monde le plus venteux : des bourrasques y dépassent 2 000 km/h, plus rapides que le son sur Terre.","Sa grande lune Triton orbite à l'envers : ce serait un objet capturé venu des confins glacés du système solaire."],
    fun:"Depuis sa découverte en 1846, Neptune n'a accompli qu'une seule orbite complète, achevée en 2011." },
  pluton: { name:'Pluton', sub:'Planète naine · ceinture de Kuiper', color:'#caa890', stats:[['Distance au Soleil','5,9 Md km (39 UA)'],['Diamètre','2 377 km'],['Année','248 ans'],['Jour','6,4 jours'],['Température','-229 °C'],['Lunes','5 (Charon…)'],['Statut','planète naine (2006)'],['Découverte','1930']],
    desc:["Longtemps 9ᵉ planète, Pluton a été reclassée « planète naine » en 2006 car elle partage son orbite avec d'autres objets de la ceinture de Kuiper.","En 2015, la sonde New Horizons a révélé un monde surprenant : une immense plaine de glace en forme de cœur, des montagnes de glace d'eau.","Pluton et sa lune Charon, presque aussi grande, forment une « planète double » qui tourne autour d'un point situé entre les deux."],
    fun:"Sur Pluton, le Soleil n'est qu'un point très brillant : il y fait à peine plus clair qu'un soir de pleine Lune sur Terre." },
};
const MOON = (name, parent, txt) => ({ name, sub:'Lune de '+parent, color:'#bbbbcc', moon:true, stats:[['Astre parent',parent]], desc:[txt], fun:'' });
Object.assign(DATA, {
  lune: { name:'Lune', sub:'Satellite naturel de la Terre', color:'#cfcfcf', stats:[['Distance Terre','384 400 km'],['Diamètre','3 474 km'],['Période','27,3 jours'],['Gravité','0,17 g'],['Température','-173 à 127 °C']],

    fun:"Les empreintes des astronautes d'Apollo resteront visibles des millions d'années : sans vent ni pluie, rien ne les efface." },

  titan: MOON('Titan','Saturne',"La seule lune à atmosphère dense. Il y pleut du méthane qui forme rivières, lacs et mers : le seul autre monde avec des liquides stables en surface."),

  tethys: MOON('Téthys','Saturne',"Une lune de glace presque pure, marquée par un canyon géant, Ithaca Chasma, qui en fait presque le tour."),
  dione: MOON('Dioné','Saturne',"Ses falaises de glace brillantes furent prises pour de la glace fraîche par la sonde Cassini."),
  rhea: MOON('Rhéa','Saturne',"La deuxième plus grande lune de Saturne, un monde glacé qui pourrait posséder de fins anneaux à elle."),
  japet: MOON('Japet','Saturne',"Mystère : une face sombre comme du charbon, l'autre blanche comme neige, et une étrange crête équatoriale de 13 km de haut."),
  triton: MOON('Triton','Neptune',"Elle orbite à l'envers et crache des geysers d'azote glacé : ce serait un objet capturé de la ceinture de Kuiper."),
  phobos: MOON('Phobos','Mars',"La plus grande lune de Mars, en forme de patate, se rapproche en spirale : elle finira par se briser en un anneau dans 50 millions d'années."),
  deimos: MOON('Déimos','Mars',"La plus petite et lointaine lune de Mars, si petite que depuis le sol elle ressemblerait à une étoile un peu floue."),
  vesta: { name:'Vesta', sub:'Astéroïde · ceinture principale', color:'#b0a090', stats:[['Diamètre','525 km'],['Distance','2,36 UA'],['Type','astéroïde']], desc:["Vesta est l'un des plus gros astéroïdes de la ceinture entre Mars et Jupiter, assez brillant pour être parfois vu à l'œil nu.","Des fragments arrachés par d'anciens impacts tombent encore sur Terre sous forme de météorites."], fun:"" },
});

/* objets non-physiques : étoiles, constellations, ciel profond, concepts (fiches encyclopédiques) */
const SKY = [
  { id:'sirius', grp:'Étoiles', name:'Sirius', sub:'Étoile · la plus brillante du ciel', color:'#bcd0ff', stats:[['Distance','8,6 années-lumière'],['Type','étoile A1 + naine blanche'],['Constellation','Grand Chien'],['Magnitude','-1,46']], desc:["Sirius est l'étoile la plus brillante de notre ciel nocturne. C'est en réalité un système double : une étoile bleutée et sa compagne naine blanche.","Les Égyptiens réglaient leur calendrier sur son lever, qui annonçait la crue du Nil."], fun:"Son nom vient du grec « brûlant ». On l'appelle aussi l'Étoile du Chien." },
  { id:'betelgeuse', grp:'Étoiles', name:'Bételgeuse', sub:'Supergéante rouge · Orion', color:'#ff8a5a', stats:[['Distance','~640 a.l.'],['Type','supergéante rouge'],['Diamètre','~1 000 × le Soleil'],['Avenir','supernova (un jour)']], desc:["Bételgeuse marque l'épaule d'Orion. Si on la plaçait à la place du Soleil, elle engloutirait Mars.","En fin de vie, elle explosera en supernova : un spectacle visible en plein jour, qui pourrait survenir demain… ou dans 100 000 ans."], fun:"En 2019-2020, elle a mystérieusement faibli, faisant croire à une explosion imminente : c'était un nuage de poussière." },
  { id:'polaris', grp:'Étoiles', name:'Polaris (Étoile polaire)', sub:'Étoile · Petite Ourse', color:'#fff5d0', stats:[['Distance','~430 a.l.'],['Type','supergéante jaune'],['Rôle','indique le nord']], desc:["L'Étoile polaire est presque pile dans l'axe de rotation de la Terre : elle semble immobile tandis que tout le ciel tourne autour d'elle.","Elle a guidé les navigateurs pendant des siècles pour trouver le nord."], fun:"Dans 12 000 ans, à cause de la précession de la Terre, ce sera Véga la nouvelle étoile polaire." },
  { id:'vega', grp:'Étoiles', name:'Véga', sub:'Étoile · Lyre', color:'#cfe0ff', stats:[['Distance','25 a.l.'],['Type','étoile blanche A0'],['Triangle d\'été','avec Deneb et Altaïr']], desc:["Véga est l'une des étoiles les plus étudiées et a servi de référence « magnitude zéro ».","Elle forme, avec Deneb et Altaïr, le grand Triangle de l'été, facile à repérer."], fun:"Véga fut la première étoile (autre que le Soleil) photographiée, en 1850." },
  { id:'orion', grp:'Constellations', name:'Orion (le Chasseur)', sub:'Constellation d\'hiver', color:'#7fb0ff', stats:[['Étoiles phares','Bételgeuse, Rigel'],['Repère','les 3 étoiles de la Ceinture'],['Visible','automne-hiver']], desc:["Orion est l'une des constellations les plus reconnaissables, avec ses trois étoiles alignées formant la « Ceinture du chasseur ».","Juste en dessous se niche la Nébuleuse d'Orion, une pouponnière d'étoiles visible aux jumelles."], fun:"Les trois étoiles de la Ceinture étaient appelées « les Trois Rois » dans de nombreuses cultures." },
  { id:'grande-ourse', grp:'Constellations', name:'Grande Ourse', sub:'Constellation circumpolaire', color:'#9fc0ff', stats:[['Astérisme','la Grande Casserole'],['Usage','trouver l\'étoile polaire'],['Visible','toute l\'année (nord)']], desc:["La Grande Ourse contient la célèbre « Grande Casserole ». En prolongeant 5 fois le bord de la casserole, on tombe sur l'Étoile polaire.","C'est souvent la première figure que l'on apprend à reconnaître dans le ciel."], fun:"Chez les Romains, ces étoiles étaient les « sept bœufs » (septem triones) : d'où vient le mot « septentrion », le nord." },
  { id:'cassiopee', grp:'Constellations', name:'Cassiopée', sub:'Constellation en W', color:'#a6c8ff', stats:[['Forme','un grand W (ou M)'],['Face','à la Grande Ourse'],['Visible','toute l\'année (nord)']], desc:["Cassiopée dessine un W bien net, de l'autre côté de l'étoile polaire par rapport à la Grande Ourse.","Quand l'une est basse, l'autre est haute : ensemble, elles encadrent le pôle nord céleste."], fun:"Dans la mythologie grecque, Cassiopée était une reine vaniteuse punie en étant attachée à son trône dans le ciel." },
  { id:'cygne', grp:'Constellations', name:'Cygne (Croix du Nord)', sub:'Constellation d\'été', color:'#a6c8ff', stats:[['Étoile phare','Deneb (très lumineuse)'],['Astérisme','la Croix du Nord'],['Visible','été (nord)']], desc:["Le Cygne s'étend le long de la Voie lactée, ailes déployées. Ses étoiles principales dessinent une grande croix.","Sa tête, Albireo, est une superbe étoile double aux couleurs contrastées (or et bleu) dans un petit télescope.","Deneb, à son extrémité, forme avec Véga et Altaïr le Triangle de l'été."], fun:"Deneb est si lumineuse que, malgré une distance de ~1 500 années-lumière, elle brille comme une étoile proche." },
  { id:'lion', grp:'Constellations', name:'Lion', sub:'Constellation du zodiaque (printemps)', color:'#9fc0ff', stats:[['Étoile phare','Régulus (« le petit roi »)'],['Astérisme','la Faucille (point d\'interrogation)'],['Visible','printemps']], desc:["Le Lion est l'une des rares constellations qui évoque vraiment sa figure : un lion couché. Sa tête forme une « faucille » en point d'interrogation inversé.","Régulus, à la base de la faucille, est l'une des étoiles les plus brillantes du ciel et se trouve quasiment sur l'écliptique.","Chaque année en novembre, l'essaim d'étoiles filantes des Léonides semble en jaillir."], fun:"Régulus signifie « petit roi » : les astronomes de l'Antiquité y voyaient le cœur royal du Lion." },
  { id:'voie-lactee', grp:'Ciel profond', name:'Voie lactée', sub:'Notre galaxie', color:'#d0c0ff', stats:[['Type','galaxie spirale barrée'],['Étoiles','100 à 400 milliards'],['Diamètre','~100 000 a.l.'],['Soleil','à ~26 000 a.l. du centre']], desc:["La Voie lactée est la galaxie qui contient le Soleil et tout ce qu'on voit. Vue de l'intérieur, elle dessine une bande laiteuse en travers du ciel.","En son centre se cache un trou noir supermassif, Sagittarius A*, de 4 millions de fois la masse du Soleil."], fun:"La lumière met 100 000 ans à traverser la Voie lactée de part en part." },
  { id:'andromede', grp:'Ciel profond', name:'Galaxie d\'Andromède (M31)', sub:'Galaxie voisine', color:'#c0d0ff', stats:[['Distance','2,5 millions a.l.'],['Type','galaxie spirale'],['Étoiles','~1 000 milliards'],['Avenir','fusion avec la Voie lactée']], desc:["Andromède est la grande galaxie la plus proche de la nôtre et l'objet le plus lointain visible à l'œil nu.","Elle fonce vers nous : dans 4,5 milliards d'années, elle fusionnera avec la Voie lactée pour former une galaxie géante."], fun:"La lumière d'Andromède que tu vois ce soir est partie il y a 2,5 millions d'années, bien avant l'apparition de l'humanité." },
  { id:'orion-neb', grp:'Ciel profond', name:'Nébuleuse d\'Orion (M42)', sub:'Pouponnière d\'étoiles', color:'#ff9ad0', stats:[['Distance','1 344 a.l.'],['Type','nébuleuse en émission'],['Rôle','naissance d\'étoiles']], desc:["La Nébuleuse d'Orion est un immense nuage de gaz où naissent de nouvelles étoiles en ce moment même.","Visible aux jumelles sous l'épée d'Orion, c'est l'une des plus belles cibles pour les astronomes amateurs."], fun:"" },
  { id:'pleiades', grp:'Ciel profond', name:'Les Pléiades', sub:'Amas d\'étoiles', color:'#bcd0ff', stats:[['Distance','444 a.l.'],['Étoiles','~1 000 jeunes étoiles'],['Surnom','les Sept Sœurs']], desc:["Les Pléiades forment un petit amas d'étoiles bleues très jeunes, facilement visible à l'œil nu comme une mini-casserole brumeuse.","De nombreuses cultures (grecque, japonaise, maorie) les ont intégrées à leurs mythes et calendriers."], fun:"Le logo de Subaru représente les Pléiades : « Subaru » signifie « réunir » en japonais." },
  { id:'trou-noir', grp:'Concepts', name:'Trou noir', sub:'Objet à gravité extrême', color:'#222', stats:[['Champ','gravité si forte que rien ne s\'échappe'],['Vitesse de libération','> vitesse de la lumière'],['Détection','par leurs effets']], desc:["Un trou noir est une région où la gravité est si intense que même la lumière ne peut s'en échapper : d'où sa noirceur.","Ils naissent de l'effondrement d'étoiles très massives. En 2019, on a obtenu la première « photo » de l'ombre d'un trou noir."], fun:"Le temps ralentit près d'un trou noir : un instant pour toi pourrait durer des années vu de loin." },
  { id:'comete', grp:'Concepts', name:'Comète', sub:'« Boule de neige sale »', color:'#9fe0ff', stats:[['Composition','glace, poussière, roche'],['Origine','ceinture de Kuiper / nuage d\'Oort'],['Queue','toujours opposée au Soleil']], desc:["Une comète est un petit corps glacé qui, en s'approchant du Soleil, se réchauffe et libère gaz et poussières formant une longue queue lumineuse.","La célèbre comète de Halley repasse près de la Terre tous les 76 ans : prochain rendez-vous en 2061."], fun:"La queue d'une comète pointe toujours à l'opposé du Soleil, poussée par le vent solaire : pas vers l'arrière de sa trajectoire." },
  { id:"voyager1", grp:"Sondes & robots", name:"Voyager 1", sub:"Sonde · objet humain le plus lointain", color:"#bcd0ff", stats:[["Lancement","5 sept. 1977"],["Distance","> 24 milliards de km"],["Statut","espace interstellaire (2012)"],["Vitesse","61 000 km/h"]], desc:["Voyager 1 est l'objet fabriqué par l'homme le plus éloigné de la Terre. Lancée en 1977, elle a survolé Jupiter et Saturne avant de filer vers les étoiles.","En 2012, elle est devenue le premier vaisseau à quitter l'héliosphère pour l'espace interstellaire. Elle communique encore avec la Terre, à plus de 22 heures-lumière.","Elle emporte le « Disque d'or », un message sonore et visuel de l'humanité destiné à d'éventuels extraterrestres."], fun:"Le signal de Voyager 1 met plus de 22 heures à nous parvenir." },
  { id:"voyager2", grp:"Sondes & robots", name:"Voyager 2", sub:"Sonde · seule à avoir vu les 4 géantes", color:"#aac4ff", stats:[["Lancement","20 août 1977"],["Exploit","Jupiter, Saturne, Uranus, Neptune"],["Statut","espace interstellaire (2018)"]], desc:["Voyager 2 est la seule sonde à avoir survolé les quatre planètes géantes : Jupiter, Saturne, Uranus et Neptune.","Nos seules images rapprochées d'Uranus et de Neptune proviennent encore d'elle, lors de survols en 1986 et 1989.","Comme sa jumelle, elle file désormais dans l'espace interstellaire avec son propre Disque d'or."], fun:"Voyager 2 a été lancée AVANT Voyager 1, mais sur une trajectoire plus lente : d'où son numéro." },
  { id:"newhorizons", grp:"Sondes & robots", name:"New Horizons", sub:"Sonde · survol de Pluton", color:"#caa890", stats:[["Lancement","2006"],["Survol Pluton","14 juillet 2015"],["Vitesse","~58 000 km/h"]], desc:["New Horizons a révélé Pluton pour la première fois en 2015, dévoilant une grande plaine de glace en forme de cœur et des montagnes de glace d'eau.","Après Pluton, elle a survolé Arrokoth, l'objet le plus lointain jamais visité de près, dans la ceinture de Kuiper.","Le voyage jusqu'à Pluton a duré plus de neuf ans."], fun:"À bord se trouvent une partie des cendres de Clyde Tombaugh, le découvreur de Pluton en 1930." },
  { id:"parker", grp:"Sondes & robots", name:"Parker Solar Probe", sub:"Sonde · « touche » le Soleil", color:"#ffcf8a", stats:[["Lancement","2018"],["Record","objet le plus rapide (~690 000 km/h)"],["Exploit","traversée de la couronne (2021)"]], desc:["Parker Solar Probe plonge dans la couronne du Soleil pour comprendre le vent solaire et pourquoi la couronne est plus chaude que la surface.","Protégée par un bouclier thermique, elle est devenue l'objet le plus rapide jamais construit, accéléré par la gravité du Soleil.","C'est la première sonde à avoir « touché » le Soleil en traversant son atmosphère."], fun:"Son bouclier supporte près de 1 400 °C en face avant pendant que l'électronique reste à température ambiante juste derrière." },
  { id:"cassini", grp:"Sondes & robots", name:"Cassini-Huygens", sub:"Sonde · l'exploration de Saturne", color:"#e3c98a", stats:[["Mission","1997-2017"],["Étude","Saturne, anneaux, lunes"],["Atterrisseur","Huygens sur Titan (2005)"]], desc:["Cassini a étudié Saturne pendant 13 ans, révélant ses anneaux et ses lunes avec un détail inédit.","Son module Huygens s'est posé sur Titan en 2005 : la première fois qu'un engin atterrissait sur une lune du système solaire externe.","En 2017, pour ne pas contaminer une lune habitable, Cassini a plongé volontairement dans Saturne (le « Grand Final »)."], fun:"Cassini a découvert des geysers d'eau sur la petite lune Encelade : un océan caché propice à la vie." },
  { id:"perseverance", grp:"Sondes & robots", name:"Perseverance", sub:"Rover · à la recherche de vie sur Mars", color:"#c1440e", stats:[["Arrivée Mars","18 février 2021"],["Lieu","cratère Jezero (ancien delta)"],["Compagnon","hélicoptère Ingenuity"]], desc:["Perseverance explore un ancien lac martien à la recherche de traces de vie passée, et met de côté des échantillons qu'une future mission rapportera sur Terre.","Il a emporté Ingenuity, le premier engin à voler dans l'atmosphère d'une autre planète.","Il fabrique même un peu d'oxygène à partir du CO₂ martien, une étape vers l'exploration humaine."], fun:"Un microphone à bord a enregistré pour la première fois les sons de Mars : le vent, et le bourdonnement de l'hélicoptère." },
  { id:"hubble", grp:"Télescopes & stations", name:"Télescope Hubble", sub:"Observatoire spatial · depuis 1990", color:"#cfe0ff", stats:[["Lancement","1990"],["Orbite","~540 km d'altitude"],["Apport","images mythiques de l'Univers"]], desc:["Hubble, en orbite au-dessus de l'atmosphère, a fourni certaines des images les plus célèbres de l'astronomie : nébuleuses, galaxies lointaines, champs profonds.","En observant des milliers de galaxies dans une minuscule portion de ciel (le « Champ profond »), il a montré l'immensité de l'Univers.","Réparé et amélioré par des astronautes lors de plusieurs missions de la navette."], fun:"Au début, un défaut de son miroir rendait les images floues : des astronautes ont dû lui poser des « lunettes » en 1993." },
  { id:"jwst", grp:"Télescopes & stations", name:"Télescope James Webb (JWST)", sub:"Observatoire infrarouge · depuis 2021", color:"#ffd9a0", stats:[["Lancement","25 déc. 2021"],["Position","point de Lagrange L2 (1,5 M km)"],["Vision","infrarouge · premières galaxies"]], desc:["Successeur de Hubble, le télescope James Webb observe dans l'infrarouge pour voir à travers la poussière et remonter aux toutes premières galaxies.","Son miroir doré de 6,5 m se déploie comme une fleur ; un immense bouclier le garde au froid (-235 °C).","Il étudie aussi l'atmosphère d'exoplanètes, à la recherche de mondes habitables."], fun:"Webb voit si loin qu'il observe la lumière partie il y a plus de 13 milliards d'années : l'enfance de l'Univers." },
  { id:"iss", grp:"Télescopes & stations", name:"Station spatiale internationale (ISS)", sub:"Laboratoire habité · depuis 1998", color:"#dfe8ff", stats:[["Altitude","~400 km"],["Vitesse","28 000 km/h"],["Tour de Terre","~90 minutes"],["Équipage","permanent depuis 2000"]], desc:["L'ISS est un immense laboratoire en orbite, fruit de la coopération de nombreux pays. Des astronautes y vivent et y mènent des expériences en apesanteur.","Elle fait le tour de la Terre en 90 minutes : son équipage voit 16 levers et couchers de Soleil par jour.","Visible à l'œil nu depuis le sol comme un point très brillant traversant rapidement le ciel."], fun:"En micro-gravité, les astronautes grandissent de quelques centimètres… et leur cœur change de forme." },
  { id:"spoutnik", grp:"Exploration spatiale", name:"Spoutnik 1", sub:"Histoire · le 1er satellite (1957)", color:"#9fc0ff", stats:[["Lancement","4 octobre 1957"],["Pays","URSS"],["Conséquence","début de l'ère spatiale"]], desc:["Spoutnik 1, une sphère métallique grande comme un ballon de plage, fut le premier objet placé en orbite par l'être humain.","Son simple « bip-bip » radio, capté dans le monde entier, a déclenché la course à l'espace entre l'URSS et les États-Unis.","Il a ouvert l'ère spatiale et bouleversé la science et la politique du XXe siècle."], fun:"La panique provoquée aux États-Unis a directement mené à la création de la NASA, l'année suivante." },
  { id:"gagarine", grp:"Exploration spatiale", name:"Youri Gagarine", sub:"Histoire · 1er humain dans l'espace (1961)", color:"#bcd0ff", stats:[["Date","12 avril 1961"],["Vaisseau","Vostok 1"],["Durée","1 orbite, 108 minutes"]], desc:["Le 12 avril 1961, le cosmonaute soviétique Youri Gagarine devient le premier être humain à voyager dans l'espace et à faire le tour de la Terre.","Son vol a prouvé qu'un humain pouvait survivre au lancement, à l'apesanteur et au retour.","Sa phrase « La Terre est bleue ! » est restée célèbre."], fun:"Le 12 avril est aujourd'hui célébré dans le monde comme la « Nuit de Youri », fête de l'espace." },
  { id:"apollo11", grp:"Exploration spatiale", name:"Apollo 11", sub:"Histoire · 1ers pas sur la Lune (1969)", color:"#fff5d0", stats:[["Date","20 juillet 1969"],["Équipage","Armstrong, Aldrin, Collins"],["Phrase","« Un petit pas pour l'homme… »"]], desc:["Le 20 juillet 1969, Neil Armstrong et Buzz Aldrin deviennent les premiers humains à marcher sur la Lune, suivis par des centaines de millions de téléspectateurs.","Six missions Apollo se sont posées entre 1969 et 1972, rapportant des roches lunaires précieuses pour la science.","Aucun humain n'est retourné sur la Lune depuis 1972 : le programme Artemis prépare le retour."], fun:"Les empreintes des astronautes resteront visibles des millions d'années, faute de vent et de pluie sur la Lune." },
  { id:"course-espace", grp:"Exploration spatiale", name:"La course à l'espace", sub:"Histoire · USA contre URSS", color:"#a6c8ff", stats:[["Période","1957-1975"],["Acteurs","États-Unis / URSS"],["Enjeu","prestige de la Guerre froide"]], desc:["Pendant la Guerre froide, États-Unis et URSS rivalisent d'exploits spatiaux : premier satellite, premier homme, premiers pas sur la Lune.","Cette compétition a accéléré d'incroyables avancées techniques en à peine quinze ans.","Elle s'est apaisée avec la mission commune Apollo-Soyouz (1975), symbole de coopération."], fun:"Beaucoup de technologies du quotidien (matériaux, capteurs, miniaturisation) découlent de cette course effrénée." },
  { id:"mars-rovers", grp:"Exploration spatiale", name:"Les rovers martiens", sub:"Histoire · robots explorateurs de Mars", color:"#c1440e", stats:[["Premiers","Sojourner (1997)"],["Longévité","Opportunity : ~15 ans"],["Récents","Curiosity, Perseverance"]], desc:["Depuis Sojourner en 1997, une série de robots roulent sur Mars pour étudier ses roches, son climat passé et la possibilité d'une vie ancienne.","Opportunity, prévu pour 90 jours, a fonctionné près de 15 ans et parcouru 45 km.","Ces rovers sont nos « yeux et mains » sur Mars, en attendant les premiers humains."], fun:"Quand le contact avec Opportunity fut perdu, son dernier message fut résumé ainsi : « Ma batterie est faible et il fait sombre. »" },
  { id:"artemis", grp:"Exploration spatiale", name:"Programme Artemis", sub:"Histoire · le retour vers la Lune", color:"#ffe0b0", stats:[["Objectif","ramener des humains sur la Lune"],["Ambition","base lunaire, puis Mars"],["Acteurs","NASA + partenaires"]], desc:["Artemis vise à ramener des astronautes sur la Lune, dont la première femme, et à y établir une présence durable.","La Lune servirait de tremplin et de terrain d'entraînement pour le grand objectif suivant : envoyer des humains vers Mars.","C'est le plus ambitieux programme d'exploration habitée depuis Apollo."], fun:"Le nom Artemis est celui de la déesse grecque de la Lune, sœur jumelle d'Apollon : clin d'œil au programme Apollo." },
  { id:"nasa", grp:"Agences & entreprises", name:"NASA", sub:"Agence spatiale des États-Unis (1958)", color:"#3b5bdb", stats:[["Création","1958"],["Réussites","Apollo, Hubble, JWST, rovers"],["Devise","pour le bien de tous"]], desc:["La NASA est l'agence spatiale civile des États-Unis. Elle a mené les humains sur la Lune et explore le système solaire avec des sondes.","Elle développe télescopes, rovers martiens, et prépare le retour vers la Lune (Artemis) puis Mars.","Une grande partie de ses images et données sont dans le domaine public."], fun:"« NASA » signifie National Aeronautics and Space Administration." },
  { id:"esa", grp:"Agences & entreprises", name:"ESA", sub:"Agence spatiale européenne (1975)", color:"#1B82E0", stats:[["Création","1975"],["Membres","22 pays européens"],["Lanceur","fusées Ariane"]], desc:["L'ESA coordonne l'effort spatial européen : satellites, sondes (Rosetta, Mars Express), et participation à l'ISS.","Elle lance ses fusées Ariane depuis Kourou, en Guyane française, proche de l'équateur (avantage pour le lancement).","Le Français Thomas Pesquet est l'un de ses astronautes."], fun:"Kourou est idéalement placée près de l'équateur : la rotation de la Terre y donne un « coup de pouce » gratuit aux fusées." },
  { id:"spacex", grp:"Agences & entreprises", name:"SpaceX", sub:"Entreprise spatiale privée (2002)", color:"#222", stats:[["Fondée","2002"],["Révolution","fusées réutilisables"],["Vaisseaux","Falcon 9, Dragon, Starship"]], desc:["SpaceX a bouleversé le spatial en rendant ses fusées Falcon 9 réutilisables : le 1er étage revient se poser pour resservir.","Elle transporte fret et astronautes vers l'ISS, et développe Starship, un géant destiné à la Lune et à Mars.","Son réseau Starlink déploie des milliers de satellites pour l'Internet."], fun:"Voir un étage de fusée revenir se poser tout seul à la verticale était de la science-fiction il y a peu : c'est devenu routinier." },
  { id:"roscosmos", grp:"Agences & entreprises", name:"Roscosmos", sub:"Agence spatiale russe", color:"#c1440e", stats:[["Héritage","programme spatial soviétique"],["Vaisseau","Soyouz (très fiable)"],["Premier","satellite et homme dans l'espace"]], desc:["Héritière du programme soviétique, l'agence russe détient des premières historiques : Spoutnik, Gagarine, première femme dans l'espace.","Son vaisseau Soyouz, d'une fiabilité légendaire, a longtemps été le seul moyen d'atteindre l'ISS.","La coopération sur l'ISS reste un symbole fort malgré les tensions."], fun:"Le vaisseau Soyouz vole depuis les années 1960 : un des engins spatiaux les plus durables de l'histoire." },
  { id:"saturn-v", grp:"Fusées & lanceurs", name:"Saturn V", sub:"La fusée de la Lune (Apollo)", color:"#e3c98a", stats:[["Hauteur","111 m"],["Poussée","34 millions de newtons"],["Mission","emmener Apollo vers la Lune"]], desc:["Saturn V est la fusée qui a propulsé les missions Apollo vers la Lune. Haute comme un immeuble de 36 étages, elle reste l'une des plus puissantes jamais construites.","Ses trois étages se larguaient successivement pour gagner en vitesse.","Aucune n'a jamais échoué lors d'un vol habité."], fun:"Au décollage, Saturn V brûlait environ 13 tonnes de carburant par seconde." },
  { id:"falcon9", grp:"Fusées & lanceurs", name:"Falcon 9", sub:"Fusée réutilisable de SpaceX", color:"#888", stats:[["Particularité","1er étage réutilisable"],["Usage","satellites, ISS, astronautes"],["Atterrissage","retour vertical"]], desc:["Falcon 9 a démocratisé l'accès à l'espace en réutilisant son premier étage, qui revient se poser sur une barge ou au sol.","Cette réutilisation a fait chuter le coût de mise en orbite.","Elle lance satellites, cargos et équipages."], fun:"Certains boosters Falcon 9 ont volé puis atterri plus de quinze fois." },
  { id:"starship", grp:"Fusées & lanceurs", name:"Starship", sub:"Le géant pour la Lune et Mars", color:"#9aa", stats:[["Objectif","Lune, Mars, gros fret"],["Particularité","entièrement réutilisable"],["Taille","la plus grande fusée jamais construite"]], desc:["Starship est conçu pour être entièrement réutilisable et transporter des charges et des humains vers la Lune et Mars.","C'est la fusée la plus grande et la plus puissante jamais développée.","La NASA l'a choisie pour l'alunissage du programme Artemis."], fun:"Starship est si grand qu'il pourrait emporter en une fois bien plus que la Station spatiale entière." },
  { id:"ariane", grp:"Fusées & lanceurs", name:"Ariane", sub:"Les lanceurs européens", color:"#1B82E0", stats:[["Opérateur","Europe (ESA)"],["Site","Kourou, Guyane"],["Spécialité","satellites en orbite haute"]], desc:["Les fusées Ariane assurent depuis des décennies l'accès européen indépendant à l'espace, surtout pour les satellites de télécommunication.","Ariane 5 a notamment lancé le télescope James Webb.","Ariane 6 prend aujourd'hui la relève."], fun:"C'est une Ariane 5 qui a lancé le télescope James Webb, avec une précision telle qu'elle lui a fait gagner des années de carburant." },
  { id:"armstrong", grp:"Astronautes", name:"Neil Armstrong", sub:"1er homme sur la Lune (1969)", color:"#fff5d0", stats:[["Mission","Apollo 11"],["Date","20 juillet 1969"],["Métier","pilote d'essai, astronaute"]], desc:["Neil Armstrong fut le premier être humain à poser le pied sur la Lune, prononçant la phrase « un petit pas pour l'homme, un bond de géant pour l'humanité ».","Pilote d'essai exceptionnel, il garda toujours une grande modestie.","Son exploit reste l'un des moments les plus regardés de l'histoire."], fun:"Il a dû piloter manuellement le module lunaire dans les dernières secondes pour éviter un champ de rochers." },
  { id:"pesquet", grp:"Astronautes", name:"Thomas Pesquet", sub:"Astronaute français de l'ESA", color:"#1B82E0", stats:[["Agence","ESA"],["Missions","2 séjours sur l'ISS"],["Rôle","commandant de l'ISS (2021)"]], desc:["Thomas Pesquet est l'astronaute français le plus connu de sa génération, ayant effectué deux longs séjours sur la Station spatiale.","Il a réalisé des sorties dans l'espace et de nombreuses expériences scientifiques.","Il a largement partagé son quotidien orbital et de superbes photos de la Terre."], fun:"Depuis l'ISS, il a photographié la Terre des milliers de fois : chaque jour, l'équipage voit 16 levers de Soleil." },
  { id:"terechkova", grp:"Astronautes", name:"Valentina Terechkova", sub:"1re femme dans l'espace (1963)", color:"#c1440e", stats:[["Date","16 juin 1963"],["Vaisseau","Vostok 6"],["Pays","URSS"]], desc:["Valentina Terechkova fut la première femme à voler dans l'espace, seule à bord, deux ans seulement après Gagarine.","Ancienne ouvrière du textile et parachutiste, elle est devenue un symbole mondial.","Il faudra ensuite attendre près de 20 ans pour qu'une autre femme vole."], fun:"Elle a passé près de trois jours en orbite : plus de temps cumulé que tous les astronautes américains réunis à l'époque." },
  { id:"vitesse-liberation", grp:"Histoire & concepts", name:"Vitesse de libération", sub:"Concept · s'arracher à la gravité", color:"#9fc0ff", stats:[["Sur Terre","~11,2 km/s (40 000 km/h)"],["Dépend de","la masse de l'astre"]], desc:["La vitesse de libération est la vitesse minimale pour échapper à l'attraction d'un astre sans retomber.","Sur Terre, il faut atteindre environ 11,2 km/s : c'est tout le défi des fusées.","Sur la Lune, bien plus faible, il suffit de 2,4 km/s : d'où des décollages lunaires plus faciles."], fun:"Sur un trou noir, la vitesse de libération dépasse celle de la lumière : rien ne peut s'en échapper." },
  { id:"apesanteur", grp:"Histoire & concepts", name:"L'apesanteur", sub:"Concept · flotter en orbite", color:"#dfe8ff", stats:[["Cause","chute libre permanente"],["Lieu","ISS, vaisseaux en orbite"]], desc:["En orbite, les astronautes flottent non parce qu'il n'y a plus de gravité (elle est presque aussi forte qu'au sol), mais parce qu'ils sont en chute libre permanente avec leur vaisseau.","Cette « micro-gravité » modifie le corps : muscles, os, circulation.","Elle permet des expériences impossibles sur Terre."], fun:"Pour ne pas perdre trop de muscle, les astronautes font environ deux heures de sport par jour." },
  { id:"gravite-assistee", grp:"Histoire & concepts", name:"Gravité assistée", sub:"Concept · la « fronde » spatiale", color:"#a6c8ff", stats:[["Principe","emprunter de la vitesse à une planète"],["Usage","Voyager, Cassini, New Horizons"]], desc:["La gravité assistée consiste à frôler une planète pour qu'elle « catapulte » la sonde, lui donnant vitesse et nouvelle direction sans carburant.","Voyager a ainsi enchaîné les planètes géantes.","C'est une astuce essentielle pour atteindre les confins du système solaire."], fun:"Sans gravité assistée, atteindre les planètes lointaines demanderait des quantités de carburant irréalistes." },
  { id:"exoplanete", grp:"Histoire & concepts", name:"Exoplanète", sub:"Concept · des mondes autres soleils", color:"#9fe0ff", stats:[["Définition","planète autour d'une autre étoile"],["Découvertes","des milliers connues"],["Quête","des mondes habitables"]], desc:["Une exoplanète est une planète qui orbite une étoile autre que le Soleil. On en a découvert des milliers depuis 1995.","Certaines se trouvent dans la « zone habitable », où l'eau liquide serait possible.","Le télescope James Webb analyse leur atmosphère à la recherche de signes de vie."], fun:"Il existe probablement plus de planètes que d'étoiles dans la galaxie : soit des centaines de milliards." },
  { id:"zone-habitable", grp:"Histoire & concepts", name:"Zone habitable", sub:"Concept · « Boucle d'or »", color:"#7fb0ff", stats:[["Idée","ni trop chaud, ni trop froid"],["Critère","eau liquide possible"]], desc:["La zone habitable est la région autour d'une étoile où la température permettrait à l'eau de rester liquide à la surface d'une planète.","La Terre s'y trouve : ni trop près (comme Vénus, brûlante), ni trop loin (comme Mars, gelée).","C'est la première chose qu'on cherche pour une planète potentiellement vivable."], fun:"On l'appelle aussi « zone Boucle d'or » : comme dans le conte, il faut que ce soit « juste comme il faut »." },
  { id:"fusee-principe", grp:"Histoire & concepts", name:"Comment vole une fusée", sub:"Concept · action-réaction", color:"#ffcf8a", stats:[["Principe","éjecter de la masse vers le bas"],["Loi","action = réaction (Newton)"],["Étages","largués pour s'alléger"]], desc:["Une fusée avance en éjectant violemment des gaz vers le bas : la réaction la pousse vers le haut (3e loi de Newton).","Elle fonctionne même dans le vide, contrairement à un avion qui a besoin d'air.","Ses étages se larguent au fur et à mesure pour ne pas traîner de poids inutile."], fun:"Une fusée n'a pas besoin d'air pour avancer : c'est pour ça qu'elle peut voler dans l'espace, là où un avion s'arrêterait." },
];

function onResize(){ const s=shell.stage; if(!s.clientWidth)return; camera.aspect=s.clientWidth/s.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(s.clientWidth,s.clientHeight); composer.setSize(s.clientWidth,s.clientHeight); if(constLines&&constLines.userData&&constLines.userData.lineMat) constLines.userData.lineMat.resolution.set(s.clientWidth,s.clientHeight); }
function setPointer(e){ const r=renderer.domElement.getBoundingClientRect(); pointer.x=((e.clientX-r.left)/r.width)*2-1; pointer.y=-((e.clientY-r.top)/r.height)*2+1; }
function pick(){ raycaster.setFromCamera(pointer,camera); const objs=bodies.filter(b=>b.obj.visible!==false).map(b=>b.obj); const hits=raycaster.intersectObjects(objs,true); if(!hits.length)return null; let o=hits[0].object; while(o){ const b=bodies.find(x=>x.obj===o); if(b)return b; o=o.parent; } return null; }
function onMove(e){ setPointer(e); renderer.domElement.style.cursor=pick()?'pointer':'grab'; hovered=(pick()||{}).obj||null; }
function onDown(e){ if(planetarium)return; setPointer(e); const b=pick(); if(b){ if(b.kind==='probe') selectProbe(b); else selectBody(b); } }
function rotateCam(dT,dP){ const off=camera.position.clone().sub(controls.target); const sph=new THREE.Spherical().setFromVector3(off); sph.theta+=dT; sph.phi=Math.max(0.05,Math.min(Math.PI-0.05,sph.phi+dP)); off.setFromSpherical(sph); camera.position.copy(controls.target).add(off); }
function zoomCam(f){ const off=camera.position.clone().sub(controls.target); off.multiplyScalar(f); const d=off.length(); if(d>controls.minDistance&&d<controls.maxDistance) camera.position.copy(controls.target).add(off); }
let bodyIdx=0;
function onKey(e){ if(e.target&&e.target.tagName==='INPUT')return; const k=e.key;
  if(mission&&mission.active){
    if(k===' '||k==='Spacebar'||k==='ArrowUp'){ missionThrust=true; e.preventDefault(); }
    else if(k==='ArrowLeft'){ mission.thrustL=-1; e.preventDefault(); }
    else if(k==='ArrowRight'){ mission.thrustL=1; e.preventDefault(); }
    else if(k==='a'||k==='A'){ toggleAssist(); e.preventDefault(); }
    return;
  }
  if(k==='ArrowLeft'){ rotateCam(-0.12,0); e.preventDefault(); } else if(k==='ArrowRight'){ rotateCam(0.12,0); e.preventDefault(); }
  else if(k==='ArrowUp'){ rotateCam(0,-0.1); e.preventDefault(); } else if(k==='ArrowDown'){ rotateCam(0,0.1); e.preventDefault(); }
  else if(k==='+'||k==='='){ zoomCam(0.88); } else if(k==='-'){ zoomCam(1.14); }
  else if(k==='Tab'){ e.preventDefault(); const sel=bodies.filter(b=>b.obj.visible!==false); bodyIdx=(bodyIdx+1)%sel.length; selectBody(sel[bodyIdx]); }
  else if(k==='p'||k==='P'){ playing=!playing; const pb=document.getElementById('ssPlay'); if(pb)pb.textContent=playing?'⏸ Pause des orbites':'▶ Animer les orbites'; }

function startMode(mode){ const h=document.getElementById('ssHint'); if(h)h.style.display=mode==='cours'?'none':''; if(mode==='cours'){ shell.setScore(0); chooseDifficulty(); } else { clearQuiz(); shell.setScore(0); } }

function startQuiz(tier){ const T=QUIZ_TIERS[tier]||QUIZ_TIERS.debutant; const order=T.items.slice().sort(()=>Math.random()-.5).slice(0,6); quiz={tier,pts:T.pts,targets:order,idx:0,score:0,total:order.length}; shell.setScore(0); shell.setProgress(0); askQuiz(); }

function winQuiz(){ const bar=document.getElementById('ssQuiz'); if(bar)bar.remove(); const stars=quiz.score>=quiz.total?3:quiz.score>=quiz.total-1?2:1; const lbl=(QUIZ_TIERS[quiz.tier]||{}).label||''; shell.win({ score:parseInt(document.querySelector('.ksh-score').textContent||'0',10), stars, title:'Astres identifiés : '+lbl+' !', learned:shell.cfg.learned, buddy:"Bravo, navigateur des étoiles !" }); quiz=null; }

function rocketTex(kind){

  const flag=(fx,fy,fw)=>{ const fh=fw*0.66; for(let r=0;r<13;r++){ x.fillStyle=r%2?'#f3f4f7':'#c8102e'; x.fillRect(fx,fy+r*fh/13,fw,fh/13); } x.fillStyle='#0b2b6b'; x.fillRect(fx,fy,fw*0.42,fh*0.54); x.fillStyle='#fff'; x.font='bold 10px Arial'; x.textAlign='left'; for(let s=0;s<12;s++) x.fillText('★',fx+4+(s%4)*10, fy+11+Math.floor(s/4)*13); };
  const nasa=(cx,cy)=>{ x.beginPath(); x.arc(cx,cy,48,0,7); x.fillStyle='#0b3d91'; x.fill(); x.strokeStyle='#fff'; x.lineWidth=3; x.beginPath(); x.ellipse(cx,cy,42,15,-0.5,0,7); x.stroke(); x.fillStyle='#fff'; x.font='900 25px Arial'; x.textAlign='center'; x.fillText('NASA',cx,cy+9); x.strokeStyle='#fc3d21'; x.lineWidth=6; x.beginPath(); x.arc(cx,cy,37,3.7,5.4); x.stroke(); };
  if(kind==='s2'){ // étages supérieurs : blanc cassé, bandes noires, USA
    x.fillStyle='#e7eaf0'; x.fillRect(0,0,1024,1024);
    x.fillStyle='#15171c'; x.fillRect(0,0,1024,66); x.fillRect(0,958,1024,66);
    for(const cx of [256,768]){ x.fillStyle='#c8102e'; x.font='900 150px Arial'; x.textAlign='center'; x.fillText('USA',cx,560); nasa(cx,760); }
    return csrgb(new THREE.CanvasTexture(c));
  }
  // premier étage S-IC
  x.fillStyle='#eff1f5'; x.fillRect(0,0,1024,1024);
  for(let i=0;i<16;i++){ x.fillStyle=(i%2)?'#15171c':'#eff1f5'; x.fillRect(i*64,0,64,120); } // damier de roulis (haut)
  x.fillStyle='#15171c'; x.fillRect(0,150,1024,24); x.fillRect(0,470,1024,42); x.fillRect(0,912,1024,58); // bandes de séparation
  for(const cx of [256,768]){

    x.fillStyle='#15171c'; x.font='800 40px Arial'; x.fillText('UNITED STATES', cx, 700);

  return csrgb(new THREE.CanvasTexture(c));
}

function buildDust(){ const n=REDUCED?60:170; const pos=new Float32Array(n*3); const vel=[];
  for(let i=0;i<n;i++){ const a=Math.random()*6.28, r=Math.random()*0.4; pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.random()*0.1; pos[i*3+2]=Math.sin(a)*r; vel.push({a, r, sp:0.7+Math.random()*1.8, up:0.05+Math.random()*0.25}); }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({color:0xc4b79c, size:0.85, sizeAttenuation:true, transparent:true, opacity:0, depthWrite:false});
  const p=new THREE.Points(geo,m); p.userData.vel=vel; return p; }
function updateDust(dt,intensity){ if(!dust)return; const p=dust.geometry.attributes.position, vel=dust.userData.vel;
  dust.material.opacity += (intensity-dust.material.opacity)*Math.min(1,dt*6);
  if(dust.material.opacity<0.01 && intensity<=0){ return; }
  for(let i=0;i<vel.length;i++){ const v=vel[i]; v.r+=v.sp*dt*(0.8+intensity); if(v.r>4.2){ v.r=0.1+Math.random()*0.2; } p.array[i*3]=Math.cos(v.a)*v.r; p.array[i*3+1]=v.up*Math.min(v.r,1.4)*0.5; p.array[i*3+2]=Math.sin(v.a)*v.r; }
  p.needsUpdate=true; }

function setMissionPhase(i){ if(!mission)return; mission.i=i; mission.t=0; const ph=MPHASES[i]; if(!ph)return;
  document.getElementById('mPhase').textContent=(i+1)+' / '+MPHASES.length;
  document.getElementById('mTitle').textContent=ph.title; document.getElementById('mCap').textContent=ph.cap;
  const steps=document.getElementById('mSteps'); if(steps)[...steps.children].forEach((d,k)=>{ d.className=k<i?'done':k===i?'now':''; });
  if(missionFlame)missionFlame.visible=!!ph.flame; shell.sound(ph.id==='ignition'||ph.id==='liftoff'?'win':'click');
  if(ph.id==='ignition')setFlameStage(1);
  if(missionAudio){ if(ph.id==='liftoff')playA('launch',0.30,true); else if(ph.id==='orbit'||ph.id==='maxq')fadeA('launch'); if(ph.id==='tli')playA('launch',0.24,true); if(ph.id==='transit')fadeA('launch'); if(ph.id==='landed'){ fadeA('launch'); playA('landed',0.8,false); } }

  if(ph.id==='transit'&&!mission.swapped){ mission.swapped=true; if(earthGround)earthGround.visible=false; rocket.visible=false; if(missionGroup.userData.tower)missionGroup.userData.tower.visible=false;

    moonGlobe=buildMoonGlobe(1.6); moonGlobe.position.set(3,-6,60); missionGroup.add(moonGlobe); }
  if(ph.id==='descent'){ if(moonGlobe)moonGlobe.visible=false; if(earthGlobe)earthGlobe.visible=false;

    const A=mission.assist;
    mission.alt=A?70:90; mission.vel=A?-1.6:-2.5; mission.fuel=1.0; mission.px=0; mission.pvx=0; mission.thrustL=0; mission.landed=false; mission.crash=false; setContactLight(false);
    if(lander){ lander.position.set(0,mission.alt,0); lander.rotation.set(0,0,0); if(lander.userData.flame)lander.userData.flame.visible=true; } }

  // bouton d'action

/* contrôles d'alunissage : gros boutons tactiles + bascule assisté/manuel + légende clavier */
function buildLanderControls(act){

  wrap.innerHTML=`
    <div class="ss-lc-modes">
      <button class="ss-lc-mode" id="mAssist">🟢 Assisté</button>

    </div>
    <div class="ss-lc-pad">
      <button class="ss-lc-dir" id="mLeft" aria-label="Orienter à gauche">◀</button>
      <button class="ss-lc-thrust" id="mThrust">🔥<span>POUSSÉE</span></button>
      <button class="ss-lc-dir" id="mRight" aria-label="Orienter à droite">▶</button>
    </div>
    <div class="ss-lc-legend">Clavier : <b>↑</b>/<b>Espace</b> poussée · <b>←</b> <b>→</b> orientation · <b>A</b> mode : maintiens pour freiner la chute.</div>`;
  act.appendChild(wrap);
  const th=wrap.querySelector('#mThrust');
  const thDn=e=>{ if(e)e.preventDefault(); missionThrust=true; th.classList.add('held'); };
  const thUp=e=>{ if(e)e.preventDefault(); missionThrust=false; th.classList.remove('held'); };
  th.addEventListener('pointerdown',thDn); th.addEventListener('pointerleave',thUp); window.addEventListener('pointerup',thUp);
  const L=wrap.querySelector('#mLeft'), R=wrap.querySelector('#mRight');
  const setL=(v,btn)=>e=>{ if(e)e.preventDefault(); mission.thrustL=v; if(btn)btn.classList.toggle('held',v!==0); };
  L.addEventListener('pointerdown',setL(-1,L)); L.addEventListener('pointerup',setL(0,L)); L.addEventListener('pointerleave',setL(0,L));
  R.addEventListener('pointerdown',setL(1,R)); R.addEventListener('pointerup',setL(0,R)); R.addEventListener('pointerleave',setL(0,R));
  window.addEventListener('pointerup',()=>{ if(L.classList.contains('held')||R.classList.contains('held')){ L.classList.remove('held'); R.classList.remove('held'); if(mission)mission.thrustL=0; } });
  wrap.querySelector('#mAssist').onclick=toggleAssist;
  wrap.querySelector('#mStab').onclick=()=>{ if(!mission||!mission.assist)return; mission.stabilize=!mission.stabilize; setAssistUI(); shell.sound('click'); };
  wrap.querySelector('#mAuto').onclick=()=>{ if(!mission||!mission.assist)return; mission.autopose=!mission.autopose; setAssistUI(); shell.sound('click'); shell.say(mission.autopose?'Auto-pose activée : la descente se stabilise seule, regarde le module se poser en douceur.':'Auto-pose coupée : c\'est toi qui gères la poussée.','concentre'); };
}
function setAssistUI(){ if(!mission)return; const b=document.getElementById('mAssist'); if(b){ b.textContent=mission.assist?'🟢 Assisté':'🔴 Manuel'; b.classList.toggle('manual',!mission.assist); }
  const st=document.getElementById('mStab'); if(st){ st.setAttribute('aria-pressed', !!(mission.assist&&mission.stabilize)); st.disabled=!mission.assist; }
  const au=document.getElementById('mAuto'); if(au){ au.setAttribute('aria-pressed', !!(mission.assist&&mission.autopose)); au.disabled=!mission.assist; }
}
function toggleAssist(){ if(!mission)return; mission.assist=!mission.assist; if(!mission.assist)mission.autopose=false; setAssistUI(); shell.sound('click');
  shell.say(mission.assist?'Mode assisté : chute limitée, maintien vertical et stabilisation t\'aident à te poser sans stress : impossible d\'échouer vraiment.':'Mode manuel : pilotage réaliste. Pose-toi sous 2,5 m/s, bien centré sur la cible. Qui peut le plus peut le moins !','concentre'); }

function updateMission(dt){ if(!mission)return; dt=Math.min(dt,0.05);
  // débris d'étages largués (toujours animés)
  if(mission.debris&&mission.debris.length){ for(const d of mission.debris){ d.t+=dt; d.o.position.y+=d.vy*dt; d.o.position.x+=d.vx*dt; d.o.position.z+=d.vz*dt; d.vy-=2.4*dt; d.o.rotation.x+=d.rx*dt; d.o.rotation.z+=d.rz*dt; } mission.debris=mission.debris.filter(d=>{ if(d.t>6){ missionGroup.remove(d.o); return false; } return true; }); }
  // cinématique de fin (LM posé) pendant l'écran de fin
  if(mission.ended){ mission.t+=dt; const a=0.6+mission.t*0.12; const ly=lander?lander.position.y:0; camera.position.lerp(new THREE.Vector3(Math.cos(a)*11,ly+5.2,Math.sin(a)*11),0.03); camera.lookAt(0,ly+2,0); updateDust(dt,0); return; }
  const ph=MPHASES[mission.i]; if(!ph)return; mission.t+=dt;
  let alt=mission.alt, vel=mission.vel, fuel=mission.fuel!=null?mission.fuel:1;
  if(missionFlame&&missionFlame.visible){ const fl=0.85+Math.random()*0.3; missionFlame.userData.core.scale.set(fl,1+Math.random()*0.25,fl); missionFlame.userData.out.scale.set(fl,1+Math.random()*0.3,fl); }
  if(lander&&lander.userData.flame){ const on=(ph.id==='descent')&&missionThrust&&fuel>0; lander.userData.flame.visible=on; if(on)lander.userData.flame.scale.setScalar(0.4*(0.8+Math.random()*0.35)); }
  if(ph.id==='countdown'){ rocket.position.y=0; const left=Math.max(0,ph.dur-mission.t); const cc=document.getElementById('mCap'); if(cc)cc.textContent='Tous les voyants au vert… T− '+left.toFixed(1)+' s'; if(mission.t>=ph.dur)setMissionPhase(mission.i+1); }
  else if(ph.id==='ignition'){ rocket.position.y=0; rocket.position.x=Math.sin(mission.t*40)*0.03; }
  else if(ph.id==='liftoff'){ const p=Math.min(1,mission.t/ph.dur); mission.visualY=p*p*70; rocket.position.y=mission.visualY; rocket.position.x=Math.sin(mission.t*30)*0.05*(1-p); alt=Math.round(p*p*12*10)/10; vel=Math.round(p*900); rocket.rotation.z=p*0.05; if(p>=1)setMissionPhase(mission.i+1); }
  else if(ph.id==='maxq'){ const p=Math.min(1,mission.t/ph.dur); mission.visualY=70+p*70; rocket.position.y=mission.visualY; alt=Math.round((12+p*22)*10)/10; vel=Math.round(900+p*700); rocket.rotation.z=0.05+p*0.14; rocket.position.x=Math.sin(mission.t*22)*0.14*(1-p); if(p>=1)setMissionPhase(mission.i+1); }
  else if(ph.id==='sep1'){ mission.visualY+=6*dt; rocket.position.y=mission.visualY; alt=Math.round(34+ (mission.visualY-140)*0.1); vel=1650; rocket.rotation.z=0.19; }
  else if(ph.id==='les'){ mission.visualY+=6*dt; rocket.position.y=mission.visualY; alt=52; vel=2100; rocket.rotation.z=0.2; }
  else if(ph.id==='ascent2'){ const p=Math.min(1,mission.t/ph.dur); mission.visualY=(mission.visualY||150)+ (40*dt); rocket.position.y=mission.visualY; alt=Math.round(60+p*120); vel=Math.round(2100+p*4000); rocket.rotation.z=0.2+p*0.5; if(p>=1)setMissionPhase(mission.i+1); }
  else if(ph.id==='sep2'){ mission.visualY+=5*dt; rocket.position.y=mission.visualY; alt=185; vel=6400; rocket.rotation.z=0.7; }
  else if(ph.id==='orbit'){ const p=Math.min(1,mission.t/ph.dur); alt=200; vel=7800; rocket.rotation.z=0.75; rocket.position.x=Math.sin(p*3.14)*8; if(p>=1)setMissionPhase(mission.i+1); }
  else if(ph.id==='tli'){ alt=320; vel=10800; rocket.rotation.z=0.75; }
  else if(ph.id==='transit'){ const p=Math.min(1,mission.t/ph.dur); alt=Math.round(38+p*346)+'k'; vel=10800;
    if(lander){ lander.rotation.y+=dt*0.25; lander.position.y=Math.sin(p*3.14)*0.6; }
    if(moonGlobe){ moonGlobe.position.z=60-p*47; moonGlobe.position.y=-6+p*4; moonGlobe.rotation.y+=dt*0.05; }
    if(earthGlobe){ const s=1-p*0.55; earthGlobe.scale.setScalar(s); earthGlobe.position.z=-42-p*46; earthGlobe.rotation.y+=dt*0.06; }
    if(p>=1)setMissionPhase(mission.i+1); }
  else if(ph.id==='descent'){ const A=mission.assist;
    const g = A?1.05:1.45, thr = A?4.3:3.7, drain = A?0.032:0.055;
    let up = missionThrust, lx = mission.thrustL||0;
    // AUTO-POSE (assisté) : gère seul la poussée + recentrage pour un poser tout en douceur
    if(A && mission.autopose && fuel>0){ const desired = -Math.min(3.0, 0.45+alt*0.15); up = vel < desired;
      lx = Math.abs(mission.px)>0.06 ? -Math.max(-1,Math.min(1,mission.px*0.7)) : (Math.abs(mission.pvx)>0.03?-Math.sign(mission.pvx):0); }
    // MAINTIEN VERTICAL (fly-by-wire) : si tu ne pousses pas, l'assistance freine une chute trop rapide
    let assistUp=0; const capV = A ? (alt<2.5?-1.7:-2.6) : -999;
    if(A && !up && fuel>0 && vel < capV) assistUp=0.7;
    const thrustAmt = (up?thr:0) + assistUp*thr;
    vel += (-g + (fuel>0?thrustAmt:0))*dt*5;
    if(fuel>0 && (up||assistUp>0)) fuel=Math.max(0, fuel - dt*drain*((up?1:0)+assistUp));
    alt += vel*dt*2.4;
    // ORIENTATION latérale (←/→) : la cible au sol donne un but ; la stabilisation aide à rester centré
    const latThr = A?2.6:3.4; if(fuel>0 && lx) mission.pvx += lx*latThr*dt;
    const damp = A?(mission.stabilize?2.6:1.1):0.5; mission.pvx -= mission.pvx*Math.min(1,damp*dt);
    mission.px = Math.max(-7,Math.min(7, mission.px + mission.pvx*dt*1.4));
    if(lander){ lander.position.x=mission.px; lander.rotation.z=Math.max(-0.35,Math.min(0.35,-mission.pvx*0.14)); }
    const ttl=document.getElementById('mTitle'); if(ttl){ ttl.textContent = alt>30?'Approche : « High Gate »' : alt>8?(A?'Descente assistée : reste sur la cible':'Pilotage manuel : « Low Gate »') : 'Prise de contact : poussière soulevée !'; }
    updateDust(dt, alt<9?Math.max(0,(1-alt/9))*((up||assistUp>0)?1:0.3):0);
    setContactLight(alt<=1.7 && alt>0);
    if(alt<=0){ alt=0; const vok=Math.abs(vel) < (A?3.6:2.5), pok=Math.abs(mission.px) < (A?4.2:2.4);
      if(vok&&pok){ mission.landed=true; if(lander){ lander.rotation.z=0; if(lander.userData.flame)lander.userData.flame.visible=false; } mission.landVel=Math.abs(vel); setMissionPhase(mission.i+1); }
      else { mission.crash=true; flashScreen('#ff5a3c'); const why = !pok?('trop loin de la cible ('+Math.abs(mission.px).toFixed(1)+' m)') : ('trop rapide ('+Math.abs(vel).toFixed(1)+' m/s)');
        shell.say('Presque ! '+why+' : on remonte pour retenter l\'approche. Aucun stress, tu peux recommencer autant que tu veux.','rassurant');
        mission.alt = A?55:85; mission.vel = A?-1.4:-2.2; mission.fuel=Math.min(1,fuel+0.4); mission.pvx=0; mission.px*=0.35; if(lander){ lander.position.set(mission.px,mission.alt,0); lander.rotation.z=0; } updateTel(mission.alt,mission.vel,mission.fuel); return; } }
    mission.alt=alt; mission.vel=vel; mission.fuel=fuel; if(lander)lander.position.y=alt;
    const dr=document.getElementById('mDrift'); if(dr){ dr.textContent=mission.px.toFixed(1)+' m'; const pk=Math.abs(mission.px)<(A?4.2:2.4); dr.style.color=pk?'#7ef5b0':'#ff8d7a'; } }
  else if(ph.id==='landed'){ alt=0; vel=0; if(lander)lander.position.y=0; updateDust(dt,0); }
  if(typeof alt==='number'){ mission.alt=alt; mission.vel=vel; if(ph.id==='descent')updateTel(alt,vel,fuel); else updateTel(alt,vel,fuel,true); }
  else updateTel(alt,vel,fuel,true);
  // caméra cinématographique
  let camPos, look; const rx=rocket?rocket.position.x:0, ry=rocket?rocket.position.y:0; const cy=ry+(mission.engY||0);
  if(ph.id==='pad'||ph.id==='countdown'){ camPos=new THREE.Vector3(20,13,42); look=new THREE.Vector3(0,11,0); }
  else if(ph.id==='ignition'){ camPos=new THREE.Vector3(15,7,30); look=new THREE.Vector3(0,7,0); }
  else if(['liftoff','maxq'].includes(ph.id)){ camPos=new THREE.Vector3(14,cy+9,32); look=new THREE.Vector3(rx,cy+7,0); }
  else if(['sep1','les','sep2'].includes(ph.id)){ camPos=new THREE.Vector3(19,cy+7,40); look=new THREE.Vector3(rx,cy+5,0); }
  else if(ph.id==='ascent2'){ camPos=new THREE.Vector3(15,cy+8,32); look=new THREE.Vector3(rx,cy+6,0); }
  else if(['orbit','tli'].includes(ph.id)){ camPos=new THREE.Vector3(22,cy+5,34); look=new THREE.Vector3(rx,cy+3,0); }
  else if(ph.id==='transit'){ const ly=lander?lander.position.y:0; camPos=new THREE.Vector3(7,ly+3.5,15); look=lander?new THREE.Vector3(0,ly+1.5,0):new THREE.Vector3(0,0,0); }
  else if(['descent','landed'].includes(ph.id)){ const ly=lander?lander.position.y:0; const px=mission.px||0; camPos=new THREE.Vector3(9+px*0.5,ly+5,15); look=new THREE.Vector3(px*0.6,ly+2,0); }
  if(camPos){ camera.position.lerp(camPos,0.06); camera.lookAt(look); }
}
function updateTel(alt,vel,fuel,space){ const a=document.getElementById('mAlt'),v=document.getElementById('mVel'),vr=document.getElementById('mVelRow'),f=document.getElementById('mFuel'),fb=document.getElementById('mFuelBar'); if(!a)return;
  a.textContent=(typeof alt==='number'?(alt>=1000?(alt/1000).toFixed(0)+' k':alt.toFixed(alt<100?1:0)):alt)+(typeof alt==='string'?' km':(space?' km':' m'));
  v.textContent=(typeof vel==='number'?(Math.abs(vel)>=100?Math.round(vel):vel.toFixed(1)):vel)+' m/s';
  const isDesc=MPHASES[mission.i]&&MPHASES[mission.i].id==='descent'; const safeThr=mission&&mission.assist?3.5:2.5;
  const safe=typeof vel==='number'&&Math.abs(vel)<safeThr; vr.className='row '+(isDesc?(safe?'vok':'vbad'):'');
  if(fuel!=null){ f.textContent=Math.round(fuel*100)+'%'; fb.style.width=(fuel*100)+'%'; }
  const dr=document.getElementById('mDrift'); if(dr&&!isDesc)dr.textContent='…';
}
function flashScreen(col){ const fl=document.getElementById('mFlash'); if(!fl)return; fl.style.background='radial-gradient(circle at 50% 55%,'+col+',transparent 60%)'; fl.style.opacity='0.85'; setTimeout(()=>fl.style.opacity='0',260); }

/* ====== ÉCRAN DE FIN : Apollo 11 (visuel, citations, audio contrôlable, récompense) ====== */
const APOLLO_CLIPS={
  step:{ label:'« Un petit pas… »', src:'step', cues:[
    {f:0.00, o:'That’s one small step for man…', fr:'« C’est un petit pas pour l’Homme… »'},
    {f:0.52, o:'…one giant leap for mankind.', fr:'« …un bond de géant pour l’humanité. »'} ] },
  landed:{ label:'« The Eagle has landed »', src:'landed', cues:[
    {f:0.00, o:'Houston, Tranquility Base here.', fr:'« Houston, ici la base de la Tranquillité. »'},
    {f:0.55, o:'The Eagle has landed.', fr:'« L’Aigle s’est posé. »'} ] },
};
function badgeSVG(){ return `<svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD87A"/><stop offset="1" stop-color="#E68A1E"/></linearGradient></defs><circle cx="29" cy="26" r="20" fill="url(#bg1)" stroke="#fff3d6" stroke-width="2"/><path d="M29 12l3.6 7.3 8 1.2-5.8 5.6 1.4 8L29 37.3 21.8 41l1.4-8-5.8-5.6 8-1.2z" fill="#7a3d00" opacity=".85"/><path d="M20 44l-3 11 12-5 12 5-3-11" fill="#c8102e"/></svg>`; }
function showEndScreen(){ if(!mission)return; mission.ended=true; missionThrust=false;
  const hud=document.getElementById('ssMission'); if(hud)hud.remove();
  // récompense enregistrée une seule fois
  const soft=mission.landVel!=null?mission.landVel:1.5; const score=800+Math.round(Math.max(0,(2.5-soft)/2.5)*400);
  const gained=Math.round(score/10)+3*50+30; let lvl=null;
  try{ if(window.KonstrioAch){ window.KonstrioAch.recordWin(shell.cfg.id,{stars:3,score:score,mode:shell.mode}); lvl=window.KonstrioAch.get().level; } }catch(e){}
  try{ if(window.Konstrio&&window.Konstrio.unlock)window.Konstrio.unlock('play3d'); }catch(e){}
  shell.sound('win');
  const el=document.createElement('div'); el.className='ss-end'; el.id='ssEnd'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Débrief de la mission Apollo 11');
  el.innerHTML=`
   <div class="ss-end-card">
    <div class="ss-hero"><div class="stars"></div><div class="ss-earth"></div><div class="ss-horizon"></div>
      <div class="ss-end-badge">${badgeSVG()}<span style="font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;color:#ffd87a">APOLLO 11</span></div>
    </div>
    <div class="ss-end-body">
      <span class="ss-end-flag">Mer de la Tranquillité · 20 juillet 1969</span>
      <h2 class="ss-end-h">Mission accomplie, commandant.</h2>
      <p class="ss-end-sub">Décollage, largage des étages, injection trans-lunaire et alunissage réussis. Tu viens de rejouer l’un des plus grands moments de l’histoire humaine.</p>
      <div class="ss-quote">
        <div class="o">“That’s one small step for man, one giant leap for mankind.”</div>
        <div class="fr">« C’est un petit pas pour l’Homme, un bond de géant pour l’humanité. »</div>
        <span class="by">Neil A. Armstrong : 1ᵉʳ pas sur la Lune</span>
      </div>
      <div class="ss-aud">
        <div class="ss-aud-tabs" role="tablist">
          <button role="tab" data-clip="step" aria-selected="true">${APOLLO_CLIPS.step.label}</button>
          <button role="tab" data-clip="landed" aria-selected="false">${APOLLO_CLIPS.landed.label}</button>
        </div>
        <div class="ss-aud-row">
          <button class="ss-aud-play" id="endPlay" aria-label="Lire l’enregistrement">▶</button>
          <div class="ss-aud-mid">
            <div class="ss-aud-bar" id="endBar"><i id="endFill"></i></div>
            <div class="ss-aud-time"><span id="endCur">0:00</span><span id="endDur">0:00</span></div>
          </div>
        </div>
        <div class="ss-sub" id="endSub"><div class="o">Appuie sur ▶ pour écouter l’enregistrement d’époque de la NASA.</div><div class="fr">Sous-titres synchronisés · lecture contrôlable</div></div>
      </div>
      <div class="ss-reward"><div>${badgeSVG().replace('width="58" height="58"','width="40" height="40"')}</div><div><div class="xp" id="endXp">+0 XP</div><div class="lbl">Badge « Alunissage Apollo 11 » débloqué${lvl?` · niveau ${lvl}`:''} · 3 ★</div></div></div>
      <div class="ss-end-row">
        <button class="ss-b primary" id="endReplay">↺ Rejouer la mission</button>
        <button class="ss-b next" id="endNext">Explorer d’autres mondes ▸</button>
        <button class="ss-b" id="endBack">✕ Retour au système solaire</button>
      </div>
    </div>
   </div>`;
  shell.stage.appendChild(el);
  // compteur d'XP animé (doux si reduced-motion)
  const xpEl=el.querySelector('#endXp');
  if(REDUCED){ xpEl.textContent='+'+gained+' XP'; } else { let cur=0; const step=Math.max(1,Math.round(gained/28)); const iv=setInterval(()=>{ cur=Math.min(gained,cur+step); xpEl.textContent='+'+cur+' XP'; if(cur>=gained)clearInterval(iv); },28); }
  // ---- lecteur audio contrôlable + sous-titres synchronisés ----
  let clip='step', audio=null; const fmt=s=>{ s=Math.max(0,s|0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  const playBtn=el.querySelector('#endPlay'), fill=el.querySelector('#endFill'), bar=el.querySelector('#endBar'), curEl=el.querySelector('#endCur'), durEl=el.querySelector('#endDur'), sub=el.querySelector('#endSub');
  function getAudio(){ return missionAudio?missionAudio[APOLLO_CLIPS[clip].src]:null; }
  function renderSub(){ if(!audio||!audio.duration){ return; } const p=audio.currentTime/audio.duration; const cues=APOLLO_CLIPS[clip].cues; let c=cues[0]; for(const q of cues){ if(p>=q.f)c=q; } sub.innerHTML=`<div class="o">${c.o}</div><div class="fr">${c.fr}</div>`; }
  function onTime(){ if(!audio||!audio.duration)return; fill.style.width=(audio.currentTime/audio.duration*100)+'%'; curEl.textContent=fmt(audio.currentTime); durEl.textContent=fmt(audio.duration); renderSub(); }
  function onEnd(){ playBtn.textContent='▶'; playBtn.setAttribute('aria-label','Lire l’enregistrement'); fill.style.width='0%'; }
  function bind(a){ if(!a)return; a.addEventListener('timeupdate',onTime); a.addEventListener('ended',onEnd); a.addEventListener('loadedmetadata',()=>{ durEl.textContent=fmt(a.duration||0); }); if(a.duration)durEl.textContent=fmt(a.duration); }
  function selectClip(k){ if(audio){ audio.pause(); audio.removeEventListener('timeupdate',onTime); audio.removeEventListener('ended',onEnd); } clip=k; audio=getAudio(); onEnd(); curEl.textContent='0:00'; bind(audio); el.querySelectorAll('.ss-aud-tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.clip===k?'true':'false')); sub.innerHTML=`<div class="o">${APOLLO_CLIPS[k].cues[0].o}</div><div class="fr">Appuie sur ▶ pour écouter.</div>`; }
  el.querySelectorAll('.ss-aud-tabs button').forEach(b=> b.onclick=()=>selectClip(b.dataset.clip));
  playBtn.onclick=()=>{ audio=getAudio(); if(!audio){ sub.innerHTML='<div class="o">Audio indisponible hors-ligne.</div>'; return; } if(audio.paused){ audio.volume=1; audio.play().then(()=>{ playBtn.textContent='⏸'; playBtn.setAttribute('aria-label','Mettre en pause'); }).catch(()=>{ sub.innerHTML='<div class="o">Lecture bloquée par le navigateur.</div>'; }); } else { audio.pause(); playBtn.textContent='▶'; playBtn.setAttribute('aria-label','Lire l’enregistrement'); } };
  bar.onclick=e=>{ if(!audio||!audio.duration)return; const r=bar.getBoundingClientRect(); audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration; onTime(); };
  selectClip('step');
  el.querySelector('#endReplay').onclick=()=>{ if(audio)audio.pause(); restartMission(); };
  el.querySelector('#endNext').onclick=()=>{ if(audio)audio.pause(); window.location.href='/learning/hub'; };
  el.querySelector('#endBack').onclick=()=>{ if(audio)audio.pause(); endMission(true); };
  el.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(audio)audio.pause(); endMission(true); } });
  setTimeout(()=>{ el.querySelector('#endReplay').focus(); },40);
  if(!REDUCED&&shell.buddy&&shell.buddy.celebrate)try{shell.buddy.celebrate();}catch(e){}
  shell.say('Mission Apollo 11 accomplie ! Écoute la citation mythique quand tu veux, puis rejoue ou explore d’autres mondes.','celebration');
}
function cleanupMission(){ if(mission)mission.active=false; missionThrust=false;
  const h=document.getElementById('ssMission'); if(h)h.remove(); const e=document.getElementById('ssEnd'); if(e)e.remove();
  if(missionGroup){ scene.remove(missionGroup); missionGroup.traverse(o=>{ if(o.geometry)o.geometry.dispose&&o.geometry.dispose(); if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.map&&m.map.dispose)m.map.dispose(); m.dispose&&m.dispose(); }); } }); }
  missionGroup=rocket=lander=missionFlame=earthGround=moonGround=moonGlobe=earthGlobe=dust=null; mission=null;
}
function restartMission(){ stopAllA(); cleanupMission(); startMission(); }
function endMission(won){ if(!mission&&!document.getElementById('ssEnd'))return; stopAllA(); cleanupMission();
  document.querySelectorAll('.ss-panel').forEach(p=>p.style.display=p.dataset._hidden||''); const hint2=document.getElementById('ssHint'); if(hint2)hint2.style.visibility='';
  setSolarVisible(true); controls.enabled=true;
  if(savedCam){ camera.position.copy(savedCam.pos); controls.target.copy(savedCam.tgt); savedCam=null; } camera.lookAt(controls.target);
  const mb=document.querySelector('[data-k="mission"]'); if(mb)mb.setAttribute('aria-pressed','false');
  if(won){ shell.sound('win'); shell.say('De retour parmi les planètes. Bravo pour cette mission Apollo 11 !','celebration'); }
  else shell.say('Mission interrompue. Tu peux la relancer quand tu veux depuis le panneau.','neutre');
}
/* ====== BOUCLE ====== */
let last=performance.now();
function animate(){ requestAnimationFrame(animate); const dt=clock.getDelta();
  if(mission&&mission.active){ updateMission(dt); composer.render(); return; }
  if(playing) timeOffset+=speed*dt; const simDays=baseDays+timeOffset;
  planetSprites.forEach((spr,i)=>{ const p=spr.userData.p; if(aligned){ spr.position.set(40+i*30,0,0); } else { const ang=THREE.MathUtils.degToRad(p.L0+p.rate*simDays); const r=p.orbit; spr.position.set(Math.cos(ang)*r,0,-Math.sin(ang)*r); } if(!REDUCED){ spr.rotation.y+=spr.userData.spin*dt; if(spr.userData.clouds) spr.userData.clouds.rotation.y+=spr.userData.spin*0.35*dt; }
    spr.userData.moons.forEach(ms=>{ const mo=ms.userData.mo; const ma=simDays/Math.max(.3,mo.per)*6.28+ms.userData.phase; const md=p.size*sizeMul(real)+mo.d*(real?0.7:1); ms.position.set(spr.position.x+Math.cos(ma)*md, Math.sin(ma)*md*0.18, spr.position.z-Math.sin(ma)*md); }); });
  sunGlow.position.copy(sun.position); positionProbes(simDays); if(!REDUCED){ sun.rotation.y+=0.025*dt; const pulse=1+Math.sin(performance.now()*0.0012)*0.045; sunGlow.scale.setScalar(40*pulse); }
  if(flying&&camTarget){ const tp=new THREE.Vector3(); camTarget.getWorldPosition(tp); controls.target.lerp(tp,0.08); const dir=camera.position.clone().sub(tp).normalize(); const want=tp.clone().add(dir.multiplyScalar(focusDist)); camera.position.lerp(want,0.06); if(camera.position.distanceTo(want)<2)flying=false; }
  else if(camTarget&&!planetarium){ const tp=new THREE.Vector3(); camTarget.getWorldPosition(tp); controls.target.lerp(tp,0.04); }
  controls.update(); updateLabels(); updateConstLabels(); updateProbeLabels(); updateDate(simDays); composer.render();
}
function updateDate(simDays){ const el=document.getElementById('ssDate'); if(!el)return; const d=new Date(J2000+simDays*86400000); el.textContent=d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }
function updateLabels(){ const stage=shell.stage; planetSprites.forEach(spr=>{ const p=spr.userData.p; let el=labelEls[p.id]; if(!showLabels||planetarium){ if(el)el.style.display='none'; return; } if(!el){ el=document.createElement('div'); el.className='ss-label'; el.textContent=DATA[p.id].name; stage.appendChild(el); labelEls[p.id]=el; } const v=spr.position.clone().project(camera); if(v.z>1){ el.style.display='none'; return; } el.style.display='block'; el.style.left=((v.x*.5+.5)*stage.clientWidth)+'px'; el.style.top=((-v.y*.5+.5)*stage.clientHeight - p.size*sizeMul(real)*4 -14)+'px'; }); }
function updateConstLabels(){ const stage=shell.stage; CONSTELLATIONS.forEach((c,i)=>{ let el=constLabelEls[i]; const show=planetarium||constLines.visible; if(!show){ if(el)el.style.display='none'; return; } if(!el){ el=document.createElement('div'); el.className='ss-label'; el.style.color='#a8c8ff'; el.style.fontSize='13px'; el.style.cursor='pointer'; el.style.pointerEvents='auto'; el.textContent='✦ '+c.n; el.title='Voir la fiche'; el.onclick=()=>pickSearch(c.id); stage.appendChild(el); constLabelEls[i]=el; } if(!c._center){ el.style.display='none'; return; } const v=c._center.clone().project(camera); if(v.z>1){ el.style.display='none'; return; } el.style.display='block'; el.style.left=((v.x*.5+.5)*stage.clientWidth)+'px'; el.style.top=((-v.y*.5+.5)*stage.clientHeight)+'px'; }); }
</script>
