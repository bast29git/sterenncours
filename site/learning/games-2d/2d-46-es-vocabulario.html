const W=[
 [1,'casa','maison'],[1,'agua','eau'],[1,'perro','chien'],[1,'libro','livre'],[1,'amigo','ami'],[1,'comida','nourriture'],[1,'mañana','matin / demain'],[1,'gracias','merci'],

 [3,'la parte interesada','la partie prenante'],[3,'los ingresos','le chiffre d\'affaires'],[3,'el cumplimiento','la conformité'],[3,'subcontratar','externaliser'],[3,'el plazo','l\'échéance'],[3,'la responsabilidad','la responsabilité'],[3,'aprovechar','tirer parti de'],[3,'la rentabilidad','la rentabilité']

const all=W.map(w=>w[2]);
function pick3(ans){ const o=[]; const pool=all.filter(x=>x!==ans); while(o.length<3&&pool.length){ const i=Math.random()*pool.length|0; o.push(pool.splice(i,1)[0]); } return o; }
const rounds=W.map(w=>({lvl:w[0], prompt:`<span class="big">${w[1]}</span> : en français ?`, audio:w[1], answer:w[2], options:[w[2],...pick3(w[2])], explain:`« ${w[1]} » = ${w[2]}.`}));
LangGame({ id:'2d-46-es-vocabulario', code:'2D·46', title:'Español : Vocabulario', lang:'es', mode:'mcq',

 intro:{ greet:"¡Hola! Escucha cada palabra y elige el significado correcto en francés.", rule:"Écoute le mot espagnol (🔊) et choisis la bonne traduction française. Trois niveaux, jusqu'à l'espagnol des affaires.", how:["Clique 🔊 pour entendre la prononciation espagnole.","Choisis la bonne traduction parmi 4.","Niveau Expert : vocabulaire professionnel (empresa, ingresos…)."], objectif:"Enrichir son vocabulaire espagnol, du quotidien au professionnel.", hint:"L'espagnol se prononce comme il s'écrit : écoute et lis en même temps.", why:"Associer son et sens ancre durablement le vocabulaire." },
