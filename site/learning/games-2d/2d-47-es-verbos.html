<link rel="stylesheet" href="../tokens.css"/><script src="../konstrio.js"></script><script src="../shell.js"></script><script src="../lang-engine.js"></script></head>
<body><script>
const V=[

 [1,'vivir','nosotros','vivimos','vivre (nous vivons)'],
 [2,'querer','yo','quiero','vouloir (je veux)'],

const rounds=V.map(v=>({lvl:v[0], prompt:`<b>${v[1]}</b> · <span class="big">${v[2]}</span> ___ ? <span style="font-size:13px;color:var(--fg-muted)">(${v[3]})</span>`, audio:v[2]+' '+v[4], answer:v[4], accept:[v[4]], explain:`${v[2]} ${v[4]} : ${v[3]}.`}));
LangGame({ id:'2d-47-es-verbos', code:'2D·47', title:'Español : Verbos & conjugación', lang:'es', mode:'type',
