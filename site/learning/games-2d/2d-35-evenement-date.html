<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Konstrio · Événement ↔ date</title>
<link rel="icon" href="../assets/favicon-512.png" />
<link rel="stylesheet" href="../tokens.css" />
<script src="../konstrio.js"></script>
<script src="../shell.js"></script>
<style>
  .ev-wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; }
  .ev-instr { font-size:14px; color:var(--fg-muted); text-align:center; }
  .ev-board { display:grid; grid-template-columns:1fr auto 1fr; gap:10px 18px; width:min(560px,100%); align-items:center; }
  .ev-item { padding:13px 15px; border-radius:12px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow-sm); cursor:pointer; font-weight:600; font-size:13.5px; transition:.14s; }
  .ev-item.date { font-family:var(--font-data); font-weight:700; text-align:center; }
  .ev-item:hover { border-color:var(--accent); }
  .ev-item.sel { border-color:var(--accent); background:var(--accent-weak); box-shadow:var(--ring); }
  .ev-item.done { background:var(--ok); border-color:var(--ok-fg); color:var(--ok-fg); cursor:default; pointer-events:none; }
  .ev-mid { font-size:18px; color:var(--fg-muted); text-align:center; }
</style>
</head>
<body>
<script>
const SETS=[
  [ {e:'Révolution française', d:'1789'}, {e:'Première Guerre mondiale', d:'1914'}, {e:'Découverte de l\'Amérique', d:'1492'}, {e:'Premier homme sur la Lune', d:'1969'}, {e:'Chute du mur de Berlin', d:'1989'} ],
  [ {e:'Sacre de Charlemagne', d:'800'}, {e:'Jeanne d\'Arc à Orléans', d:'1429'}, {e:'Prise de la Bastille', d:'1789'}, {e:'Abolition de l\'esclavage (France)', d:'1848'}, {e:'Mai 68', d:'1968'} ],
  [ {e:'Invention de l\'imprimerie', d:'1450'}, {e:'Machine à vapeur de Watt', d:'1769'}, {e:'Première ampoule (Edison)', d:'1879'}, {e:'Premier vol des frères Wright', d:'1903'}, {e:'Création du Web', d:'1989'} ],
];
let mode='detente', sIdx=0, selEvent=null, matched=0, total=0;
const shell=window.Konstrio.createGame({
  id:'2d-35-evenement-date', code:'2D·35', title:'Associe événement ↔ date', type:'2D',
  domain:{ label:'Histoire & Géo', color:'#E0892B' },
  intro:{
    greet:"Relie chaque grand événement à sa date ! Clique un événement, puis sa date.",
    rule:"À gauche, des événements historiques ; à droite, des dates mélangées. Clique un <b>événement</b> puis la <b>date</b> qui lui correspond pour former une paire.",
    how:["Clique un événement à gauche (il se surligne).","Clique ensuite la date qui lui correspond à droite.","Une bonne paire devient verte. Relie toutes les paires !"],
    keys:"Clique un événement, puis une date.",
    objectif:"Mémoriser les dates clés de l'Histoire et les associer aux bons événements.",
    hint:"Procède par élimination : commence par les dates dont tu es certain·e.",
    why:"Associer événement et date crée des repères solides pour situer et comparer les époques."
  },
  learned:["Les dates clés sont des repères pour structurer l'Histoire.","Associer événement et date aide à mémoriser durablement.","Procéder par élimination est une stratégie efficace."],
  onReady:(api)=>build(api),
  onStart:(m,api)=>{ mode=m; sIdx=0; reset(api); },
  onRestart:(api)=>{ sIdx=0; reset(api); },
});
let wrap;
function build(api){ shell.api=api; wrap=document.createElement('div'); wrap.className='ev-wrap';
  wrap.innerHTML=`<div class="ev-instr">Clique un événement, puis sa date</div><div class="ev-board" id="evBoard"></div>`;
  api.stage.appendChild(wrap); reset(api); }
function reset(api){ shell.api=api; const set=SETS[sIdx%SETS.length]; total=set.length; matched=0; selEvent=null;
  api.setLevel((sIdx%SETS.length+1)+'/'+SETS.length); api.setProgress(0);
  const board=wrap.querySelector('#evBoard'); board.innerHTML='';
  const events=set.map((p,i)=>({...p,i})); const dates=set.map((p,i)=>({d:p.d,i})).sort(()=>Math.random()-.5);
  const colE=document.createElement('div'); const colM=document.createElement('div'); const colD=document.createElement('div');
  // build as rows interleaved using grid: we place event, arrow, date per visual row but dates shuffled : use 3-col grid with separate stacks
  board.style.gridTemplateColumns='1fr'; board.innerHTML='';
  const grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;width:100%';
  const left=document.createElement('div'); left.style.cssText='display:flex;flex-direction:column;gap:10px';
  const rightc=document.createElement('div'); rightc.style.cssText='display:flex;flex-direction:column;gap:10px';
  events.forEach(ev=>{ const el=document.createElement('div'); el.className='ev-item'; el.textContent=ev.e; el.dataset.i=ev.i; el.onclick=()=>selectEvent(ev.i,el); left.appendChild(el); });
  dates.forEach(dt=>{ const el=document.createElement('div'); el.className='ev-item date'; el.textContent=dt.d; el.dataset.i=dt.i; el.onclick=()=>selectDate(dt.i,el); rightc.appendChild(el); });
  grid.appendChild(left); grid.appendChild(rightc); board.appendChild(grid);
  shell.api.say("Relie chaque événement à sa date. Commence par celui que tu connais !",'concentre'); }
function selectEvent(i,el){ if(el.classList.contains('done'))return; wrap.querySelectorAll('.ev-item:not(.date)').forEach(x=>x.classList.remove('sel')); selEvent={i,el}; el.classList.add('sel'); shell.sound('tick'); }
function selectDate(i,el){ if(el.classList.contains('done'))return; if(!selEvent){ shell.api.say("Choisis d'abord un événement à gauche.",'curieux'); return; }
  if(i===selEvent.i){ matched++; shell.api.addScore(100); shell.sound('good'); selEvent.el.classList.remove('sel'); selEvent.el.classList.add('done'); el.classList.add('done'); shell.api.setProgress(matched/total); selEvent=null;
    if(matched===total){ shell.api.say('Toutes les paires reliées ! Bravo.','celebration'); sIdx++; if(sIdx<SETS.length){ shell.api.toast('Série réussie !'); setTimeout(()=>reset(shell.api),1500); } else setTimeout(finish,1200); } else shell.api.say('Bonne association !','fier'); }
  else { shell.sound('bad'); shell.api.addScore(-10); el.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:300}); shell.api.say("Ce n'est pas la bonne date. Réessaie !",'rassurant'); }
}
function finish(){ const sc=parseInt(document.querySelector('.ksh-score').textContent,10); const stars=sc>=1200?3:sc>=800?2:1;
  shell.api.win({ score:sc, stars, title:'Toutes les séries reliées !',
    buddy:"Tu connais tes dates clés ! L'Histoire n'a plus de secret chronologique pour toi.",
    learned:shell.cfg.learned, onNext:()=>{ sIdx=0; shell.api.setScore(0); reset(shell.api); }, nextLabel:'Rejouer' }); }
</script>
</body>
</html>
