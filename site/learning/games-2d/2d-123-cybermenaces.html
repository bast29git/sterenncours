<body><script>
const rounds=[
 {lvl:1, prompt:'Un « virus » informatique est…', options:['un programme malveillant qui se propage','un microbe','une pub','un cookie'], answer:'un programme malveillant qui se propage', explain:'Il infecte des fichiers et se réplique.'},
