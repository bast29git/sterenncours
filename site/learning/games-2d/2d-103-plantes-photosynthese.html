const rounds=[
 {lvl:1, prompt:'Quelle partie de la plante absorbe l\'eau du sol ?', options:['les racines','les feuilles','les fleurs','les fruits'], answer:'les racines', explain:'Elles puisent eau et minéraux.'},
 {lvl:1, prompt:'Grâce à quoi les plantes fabriquent-elles leur nourriture ?', options:['la lumière (photosynthèse)','la viande','le sucre du sol','rien'], answer:'la lumière (photosynthèse)', explain:'Elles transforment lumière, eau et CO₂ en sucre.'},
