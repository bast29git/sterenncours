<!DOCTYPE html>
<html lang="fr" data-theme="light" data-palette="rose">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cours de 4ᵉ</title>
<meta name="description" content="Espace de cours de 4ᵉ : parcours, leçons, exercices et suivi.">
<meta name="theme-color" content="#14151f">
<link rel="stylesheet" href="moteurs/aurora.css">
<link rel="stylesheet" href="socle.css">
<link rel="stylesheet" href="lecture.css">
<link rel="stylesheet" href="portail.css">
<link rel="stylesheet" href="eleve.css">
<link rel="stylesheet" href="prof.css">
</head>
<body>

<!-- ======================= PORTAIL ======================= -->
<div id="portail" class="portail">
  <svg class="planche" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <pattern id="tramePoints" width="7" height="7" patternUnits="userSpaceOnUse">
        <circle cx="1.8" cy="1.8" r="1.5"/>
      </pattern>
      <pattern id="trameSerree" width="4" height="4" patternUnits="userSpaceOnUse">
        <circle cx="1.1" cy="1.1" r="1"/>
      </pattern>
      <pattern id="trameLignes" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="2.6" height="7"/>
      </pattern>
      <clipPath id="c1"><path d="M40 34 H628 L586 214 H40 Z"/></clipPath>
      <clipPath id="c2"><path d="M648 34 H1160 V214 H648 Z"/></clipPath>
      <clipPath id="c3"><path d="M40 234 H392 V498 H40 Z"/></clipPath>
      <clipPath id="c4"><path d="M412 234 H770 V414 H412 Z"/></clipPath>
      <clipPath id="c5"><path d="M790 234 H1160 V498 H790 Z"/></clipPath>
      <clipPath id="c6"><path d="M412 434 H770 V498 H412 Z"/></clipPath>
      <clipPath id="c7"><path d="M40 518 H660 L618 866 H40 Z"/></clipPath>
      <clipPath id="c8"><path d="M690 518 H1160 V676 H690 Z"/></clipPath>
      <clipPath id="c9"><path d="M648 696 H1160 V866 H648 Z"/></clipPath>
    </defs>

    <!-- Les cases : gouttières franches, deux coupes en biais comme sur une planche -->
    <g class="cases">
      <path d="M40 34 H628 L586 214 H40 Z"/>
      <path d="M648 34 H1160 V214 H648 Z"/>
      <path d="M40 234 H392 V498 H40 Z"/>
      <path d="M412 234 H770 V414 H412 Z"/>
      <path d="M790 234 H1160 V498 H790 Z"/>
      <path d="M412 434 H770 V498 H412 Z"/>
      <path d="M40 518 H660 L618 866 H40 Z"/>
      <path d="M690 518 H1160 V676 H690 Z"/>
      <path d="M648 696 H1160 V866 H648 Z"/>
    </g>

    <g class="art">
      <!-- 1. Lignes de fuite vers un point décentré -->
      <g clip-path="url(#c1)">
        <rect class="trame" x="40" y="34" width="588" height="180" fill="url(#trameSerree)"/>
        <g class="vitesse">
          <path d="M236 126 L28 22"/><path d="M236 126 L120 20"/><path d="M236 126 L228 18"/>
          <path d="M236 126 L348 20"/><path d="M236 126 L500 26"/><path d="M236 126 L640 40"/>
          <path d="M236 126 L648 104"/><path d="M236 126 L620 178"/><path d="M236 126 L470 222"/>
          <path d="M236 126 L300 228"/><path d="M236 126 L180 230"/><path d="M236 126 L60 226"/>
          <path d="M236 126 L24 166"/><path d="M236 126 L24 96"/>
        </g>
      </g>

      <!-- 2. Horizon, soleil bas, ciel tramé -->
      <g clip-path="url(#c2)">
        <rect class="trame" x="648" y="34" width="512" height="86" fill="url(#tramePoints)"/>
        <circle class="plein" cx="1004" cy="108" r="44"/>
        <path d="M648 160 H1160"/><path d="M672 178 H1136"/><path d="M710 196 H1098"/>
        <path d="M648 160 L760 104"/><path d="M1160 160 L1052 104"/>
      </g>

      <!-- 3. Arcs de mouvement -->
      <g clip-path="url(#c3)">
        <rect class="trame" x="40" y="234" width="352" height="104" fill="url(#trameLignes)"/>
        <path d="M58 456 Q216 254 374 456"/>
        <path d="M96 462 Q216 306 336 462"/>
        <path d="M134 468 Q216 358 298 468"/>
        <path d="M172 474 Q216 408 260 474"/>
        <path d="M40 486 H392" class="fin"/>
      </g>

      <!-- 4. Impact : éclat concentrique -->
      <g clip-path="url(#c4)">
        <path d="M591 324 m-104 0 a104 104 0 1 0 208 0 a104 104 0 1 0 -208 0"/>
        <path d="M591 324 m-70 0 a70 70 0 1 0 140 0 a70 70 0 1 0 -140 0"/>
        <path d="M591 324 m-36 0 a36 36 0 1 0 72 0 a36 36 0 1 0 -72 0"/>
        <path d="M591 244 L591 404"/><path d="M511 324 L671 324"/>
        <path d="M534 267 L648 381"/><path d="M648 267 L534 381"/>
        <path d="M470 250 L520 290"/><path d="M712 250 L662 290"/>
        <path d="M470 398 L520 358"/><path d="M712 398 L662 358"/>
      </g>

      <!-- 5. Pluie oblique, dégradé de trame -->
      <g clip-path="url(#c5)">
        <rect class="trame" x="790" y="234" width="370" height="264" fill="url(#trameSerree)"/>
        <g class="pluie">
          <path d="M800 234 L776 498"/><path d="M836 234 L812 498"/><path d="M872 234 L848 498"/>
          <path d="M908 234 L884 498"/><path d="M944 234 L920 498"/><path d="M980 234 L956 498"/>
          <path d="M1016 234 L992 498"/><path d="M1052 234 L1028 498"/><path d="M1088 234 L1064 498"/>
          <path d="M1124 234 L1100 498"/><path d="M1160 234 L1136 498"/>
        </g>
      </g>

      <!-- 6. Bande étroite : un regard, une respiration -->
      <g clip-path="url(#c6)">
        <rect class="trame" x="412" y="434" width="358" height="64" fill="url(#trameLignes)"/>
        <path d="M470 466 Q530 436 590 466 Q530 496 470 466 Z"/>
        <circle class="plein" cx="530" cy="466" r="11"/>
        <path class="fin" d="M620 466 H752"/>
      </g>

      <!-- 7. Grande case : onde, horizon bas, ciel tramé -->
      <g clip-path="url(#c7)">
        <rect class="trame" x="40" y="518" width="620" height="140" fill="url(#tramePoints)"/>
        <path d="M58 838 Q330 596 602 838"/>
        <path d="M120 844 Q330 668 540 844"/>
        <path d="M182 850 Q330 736 478 850"/>
        <path d="M244 856 Q330 800 416 856"/>
        <path d="M40 700 H640" class="fin"/>
        <path d="M40 724 H600" class="fin"/>
      </g>

      <!-- 8. Lignes de vitesse horizontales -->
      <g clip-path="url(#c8)">
        <g class="vitesse">
          <path d="M690 540 H1160"/><path d="M746 558 H1160"/><path d="M690 576 H1098"/>
          <path d="M786 594 H1160"/><path d="M690 612 H1026"/><path d="M836 630 H1160"/>
          <path d="M690 648 H1136"/><path d="M746 666 H1056"/>
        </g>
      </g>

      <!-- 9. Éclat de dialogue -->
      <g clip-path="url(#c9)">
        <rect class="trame" x="648" y="696" width="230" height="170" fill="url(#trameSerree)"/>
        <path d="M912 800 L944 742 L978 790 L1030 750 L1030 806 L1096 798 L1054 838 L1108 858
                 L1036 866 L960 862 L930 868 L886 856 L910 826 L862 816 Z"/>
        <path class="fin" d="M700 760 H840"/>
        <path class="fin" d="M700 786 H806"/>
      </g>
    </g>
  </svg>

  <form class="entree" id="form-portail" autocomplete="off">
    <p class="entree-sur">Classe de 4ᵉ</p>
    <h1 class="entree-titre">Cours de Sterenn</h1>
    <p class="entree-sous">Entre ton code pour ouvrir ton espace.</p>
    <label for="code">Code d'accès</label>
    <input id="code" name="code" type="text" inputmode="text" autocapitalize="none"
           spellcheck="false" autocomplete="off" aria-describedby="portail-erreur">
    <p class="portail-erreur" id="portail-erreur" role="alert">Ce code n'est pas reconnu.</p>
    <button class="entree-bouton" type="submit">Entrer</button>
  </form>
</div>

<!-- ======================= ESPACE DE STERENN ======================= -->
<div id="app-eleve" class="eleve" hidden>
  <a class="saut-contenu" href="#vue-eleve">Aller au contenu</a>

  <header class="e-tete">
    <a class="e-marque" href="#/hub">
      <span class="e-logo" aria-hidden="true">✦</span>
      <span>Mon espace</span>
    </a>

    <nav class="e-nav" id="e-nav" aria-label="Navigation principale"></nav>

    <div class="e-droite">
      <button class="e-jeton e-jeton-bouton" id="e-btn-palette" type="button" aria-label="Changer les couleurs">
        <span class="e-pastille-couleur" aria-hidden="true"></span>
      </button>
      <a class="e-jeton" href="#/progres" id="e-xp" title="Ton niveau et ton expérience">
        <b id="e-niveau">1</b><span>niveau</span>
      </a>
      <button class="e-avatar" id="e-btn-avatar" type="button" aria-label="Mon compagnon">
        <span class="e-avatar-toile" id="e-avatar-toile"></span>
      </button>
      <button class="e-sortir" id="e-sortir" type="button">Sortir</button>
    </div>
  </header>

  <div class="e-palette-panneau" id="e-palette-panneau" hidden>
    <p class="e-palette-titre">Choisis tes couleurs</p>
    <div class="e-palette-choix" id="e-palette-choix"></div>
  </div>

  <p class="e-bandeau" id="e-bandeau" role="status" hidden></p>
  <main class="e-vue" id="vue-eleve" tabindex="-1"></main>
</div>

<!-- ======================= ESPACE PROFESSEUR ======================= -->
<div id="app-prof" class="prof" hidden>
  <a class="saut-contenu" href="#vue-prof">Aller au contenu</a>

  <aside class="p-lateral" id="p-lateral">
    <div class="p-lateral-tete">
      <span class="p-marque"><span class="p-logo" aria-hidden="true">S</span>
        <span><b>Sterenn</b><em>Classe de 4ᵉ</em></span></span>
      <button class="p-icone p-fermer" id="p-fermer" type="button" aria-label="Fermer le menu">✕</button>
    </div>
    <nav class="p-nav" id="p-nav" aria-label="Navigation principale"></nav>
    <div class="p-lateral-pied" id="p-lateral-pied"></div>
  </aside>
  <div class="p-voile" id="p-voile" hidden></div>

  <div class="p-colonne">
    <header class="p-topbar">
      <button class="p-icone p-ouvrir" id="p-ouvrir" type="button" aria-label="Ouvrir le menu">☰</button>
      <nav class="p-fil" id="p-fil" aria-label="Fil d'Ariane"></nav>
      <form class="p-recherche" id="p-form-recherche" role="search">
        <label class="visuellement-cache" for="p-q">Rechercher une leçon</label>
        <input id="p-q" type="search" placeholder="Rechercher une leçon…" autocomplete="off">
      </form>
      <button class="p-icone" id="p-theme" type="button" aria-label="Changer le thème">◐</button>
      <button class="p-bouton p-bouton-fantome" id="p-sortir" type="button">Sortir</button>
    </header>
    <p class="p-bandeau" id="p-bandeau" role="status" hidden></p>
    <main class="p-vue" id="vue-prof" tabindex="-1"></main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
