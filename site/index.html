<!DOCTYPE html>
<html lang="fr" data-matiere="pilotage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cours de 4ᵉ</title>
<meta name="description" content="Espace de cours de 4ᵉ : séances, leçons, exercices et suivi.">
<meta name="theme-color" content="#12141a">
<link rel="stylesheet" href="theme/cours.css">
<link rel="stylesheet" href="portail.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="app">

<!-- ============================ PORTAIL ============================ -->
<div id="portail" class="portail">
  <svg class="planche" viewBox="0 0 1200 860" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <pattern id="trame" width="7" height="7" patternUnits="userSpaceOnUse">
        <circle cx="1.6" cy="1.6" r="1.1"/>
      </pattern>
    </defs>
    <g class="cases">
      <path d="M40 40 H560 V300 H40 Z"/>
      <path d="M590 40 H1160 V196 H590 Z"/>
      <path d="M590 226 H1160 V470 H590 Z"/>
      <path d="M40 330 H560 V560 H40 Z"/>
      <path d="M40 590 H420 V820 H40 Z"/>
      <path d="M450 590 H1160 V820 H450 Z"/>
      <path d="M590 500 H1160 V560 H590 Z"/>
    </g>
    <g class="art">
      <g class="vitesse">
        <path d="M300 170 L60 60"/><path d="M300 170 L120 52"/><path d="M300 170 L200 46"/>
        <path d="M300 170 L300 44"/><path d="M300 170 L400 46"/><path d="M300 170 L480 52"/>
        <path d="M300 170 L540 60"/><path d="M300 170 L556 140"/><path d="M300 170 L556 220"/>
        <path d="M300 170 L540 284"/><path d="M300 170 L420 292"/><path d="M300 170 L300 296"/>
        <path d="M300 170 L180 292"/><path d="M300 170 L60 284"/><path d="M300 170 L44 220"/>
        <path d="M300 170 L44 140"/>
      </g>
      <g class="horizon">
        <path d="M600 160 H1150"/>
        <circle cx="880" cy="118" r="42"/>
        <path d="M600 176 H1150"/><path d="M640 190 H1110"/><path d="M700 186 L760 160"/>
        <path d="M1000 186 L940 160"/>
      </g>
      <g class="arcs">
        <path d="M640 440 Q875 240 1110 440"/>
        <path d="M680 442 Q875 288 1070 442"/>
        <path d="M720 444 Q875 336 1030 444"/>
        <path d="M760 446 Q875 384 990 446"/>
        <path d="M604 300 L1148 300" class="fin"/>
      </g>
      <rect x="40" y="330" width="520" height="230" fill="url(#trame)" class="pointille"/>
      <g class="pluie">
        <path d="M70 600 L100 810"/><path d="M110 600 L140 810"/><path d="M150 600 L180 810"/>
        <path d="M190 600 L220 810"/><path d="M230 600 L260 810"/><path d="M270 600 L300 810"/>
        <path d="M310 600 L340 810"/><path d="M350 600 L380 810"/>
      </g>
      <g class="onde">
        <path d="M470 800 Q640 620 810 800"/>
        <path d="M530 802 Q700 660 870 802"/>
        <path d="M590 804 Q760 700 930 804"/>
        <path d="M650 806 Q820 740 990 806"/>
        <path d="M710 808 Q880 770 1050 808"/>
        <path d="M470 530 H1150" class="fin"/>
      </g>
    </g>
  </svg>

  <form class="entree" id="form-portail" autocomplete="off">
    <p class="entree-sur">Classe de 4ᵉ</p>
    <h1 class="entree-titre">Cours de Sterenn</h1>
    <p class="entree-sous">Entre ton code pour ouvrir ton espace.</p>

    <label for="code">Code d'accès</label>
    <input id="code" name="code" type="text" inputmode="text" autocapitalize="none"
           spellcheck="false" autocomplete="off" aria-describedby="portail-erreur">
    <p class="portail-erreur" id="portail-erreur" role="alert">Ce code n'est pas reconnu.</p>

    <button class="entree-bouton" type="submit">Entrer</button>
  </form>
</div>

<!-- ============================ APPLICATION ============================ -->
<div id="app" class="coque" hidden>
  <a class="saut-contenu" href="#vue">Aller au contenu</a>

  <aside class="lateral" id="lateral">
    <div class="lateral-tete">
      <a class="marque" href="#/accueil">
        <span class="marque-pastille" aria-hidden="true">4ᵉ</span>
        <span class="marque-texte"><b id="marque-nom">Cours de 4ᵉ</b><em id="marque-sous"></em></span>
      </a>
      <button class="icone-bouton fermer-lateral" id="btn-fermer-lateral" type="button" aria-label="Fermer le menu">✕</button>
    </div>
    <nav class="lateral-nav" id="nav-lateral" aria-label="Navigation principale"></nav>
  </aside>
  <div class="voile" id="voile" hidden></div>

  <div class="colonne">
    <header class="topbar">
      <button class="icone-bouton ouvrir-lateral" id="btn-ouvrir-lateral" type="button" aria-label="Ouvrir le menu">☰</button>
      <nav class="fil" id="fil" aria-label="Fil d'Ariane"></nav>
      <form class="recherche" id="form-recherche" role="search">
        <label class="visuellement-cache" for="q">Rechercher une leçon</label>
        <input id="q" type="search" placeholder="Rechercher" autocomplete="off">
      </form>
      <button class="icone-bouton" id="btn-theme" type="button" aria-label="Changer le thème">◐</button>
      <button class="bouton-secondaire" id="btn-sortir" type="button">Sortir</button>
    </header>
    <p class="bandeau" id="bandeau" role="status" hidden></p>
    <main class="vue" id="vue" tabindex="-1"></main>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
