  <p class="e-bandeau" id="e-bandeau" hidden></p>
  <p class="visuellement-cache" id="e-annonces" role="status" aria-live="polite" aria-atomic="true"></p>
  <main class="e-vue" id="vue-eleve" tabindex="-1"></main>
